<script>
document.addEventListener("DOMContentLoaded", () => {
  CivicLearnI18n.onReady(async () => {
    const bankPath = window.CIVICEDGE_CONFIG?.bank?.path;
    if (!bankPath) return;
    let fullBank = [];
    try { const res = await fetch(bankPath); const raw = await res.json(); fullBank = Array.isArray(raw) ? raw : (raw.questions || []); } catch { return; }

    /* ============================================
       TAB A: PERSONAL TRAPS
       ============================================ */
    let progress = {};
    try { progress = JSON.parse(localStorage.getItem("civicedge_progress") || "{}"); } catch {}

    const trickyKeys = Object.keys(progress).filter(id => (progress[id].wrongs || 0) >= 3 && (progress[id].rights || 0) < 2);
    const normalizedSet = new Set(trickyKeys);
    const personalTraps = fullBank.filter(q => {
      const qKey = `${q.microtopic?.en || q.topic?.en || ""}:${q.id}`;
      return normalizedSet.has(qKey);
    });

    /* ============================================
       TAB B: 100 HARDEST (from tricky-dk.json)
       ============================================ */
    let commonTraps = [];
    try {
      const res = await fetch("/indfodsret/banks/tricky-dk.json");
      if (res.ok) {
        const data = await res.json();
        const commonSet = new Set(data.questions || []);
        // Match on q.da since the new bank uses multilingual {da, en}
        commonTraps = fullBank.filter(q => {
          const qText = typeof q.q === "object" ? q.q.da : q.q;
          return commonSet.has(qText);
        });
      }
    } catch (e) {
      console.warn("[Traps] Could not load tricky-dk.json:", e.message);
    }

    /* UPDATE COUNTS */
    document.getElementById("mineCount").textContent = personalTraps.length;
    document.getElementById("commonCount").textContent = commonTraps.length;

    /* ============================================
       TAB SWITCHING + ENGINE START
       ============================================ */
    const quizArea = document.getElementById("quizArea");
    let activeTab = "mine";

    function startTab(tab) {
      activeTab = tab;
      document.querySelectorAll(".traps-tab").forEach(btn => {
        btn.classList.toggle("active", btn.dataset.tab === tab);
      });

      const bank = tab === "mine" ? personalTraps : commonTraps;

      if (bank.length === 0) {
        const emptyTitle = tab === "mine"
          ? (CivicLearnI18n.t("traps_none_title") || "Ingen f\u00e6lder endnu")
          : "Ingen hyppigt forkerte sp\u00f8rgsm\u00e5l endnu";
        const emptyBody = tab === "mine"
          ? (CivicLearnI18n.t("traps_none_body") || "Du har ikke nok fejl endnu. Bliv ved med at \u00f8ve!")
          : "Denne funktion aktiveres n\u00e5r vi har nok brugerdata. Bliv ved med at \u00f8ve!";

        quizArea.innerHTML = `
          <div class="ce-card">
            <h2>${emptyTitle}</h2>
            <p>${emptyBody}</p>
          </div>`;
        return;
      }

      quizArea.innerHTML = '<div id="quiz"></div>';
      CivicEdgeEngine.start("traps", { bank: bank, limit: 20, timed: false, simulation: false, recursive: false, showFeedback: true });
    }

    document.getElementById("trapsTabs").addEventListener("click", (e) => {
      const tab = e.target.closest(".traps-tab");
      if (!tab || tab.dataset.tab === activeTab) return;
      startTab(tab.dataset.tab);
    });

    startTab("mine");
  });
});
</script>
