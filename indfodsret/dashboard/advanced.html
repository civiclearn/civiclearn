<script>
document.addEventListener("DOMContentLoaded", async () => {
  // Load full bank and filter to deep only
  await CivicEdgeEngine.ensureBankLoaded();
  const fullBank = CivicEdgeEngine.getBank();
  const deepBank = fullBank.filter(q => {
    const depth = q._raw?.depth || q.depth;
    return depth === "deep";
  });

  if (deepBank.length === 0) {
    document.getElementById("quizArea").innerHTML =
      '<div style="padding:20px;color:var(--text-muted);font-size:14px;">Ingen avancerede spørgsmål tilgængelige.</div>';
    return;
  }

  CivicEdgeEngine.start("traps", {
    bank: deepBank.map(q => q._raw || q),
    limit: 20,
    timed: false,
    simulation: false,
    recursive: false,
    showFeedback: true
  });

  document.addEventListener("click", e => {
    if (["changeTheme","returnBtn","restartBtn","ce-return"].includes(e.target?.id)) {
      e.preventDefault();
      location.reload();
    }
  });
});
</script>
<script>
document.addEventListener("DOMContentLoaded", () => {
  const toggle = document.querySelector(".menu-toggle");
  const overlay = document.getElementById("menuOverlay");
  if (toggle) toggle.addEventListener("click", () => document.body.classList.toggle("menu-open"));
  if (overlay) overlay.addEventListener("click", () => document.body.classList.remove("menu-open"));
});
</script>
