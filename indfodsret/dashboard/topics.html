<script>
document.addEventListener("DOMContentLoaded", () => {
  const cfg = window.CIVICEDGE_CONFIG || {};
  const container = document.getElementById("topicContainer");
  const startBtn = document.getElementById("startBtn");
  const selected = new Set();
  const bankPath = cfg.bank && cfg.bank.path;

  // Topic keys from config (defines which topics to show + their labels)
  const topicLabels = (cfg.topics && cfg.topics.topicLabels) || {};

  function normalizeLabel(str) {
    return (str || "").normalize("NFD").replace(/\p{Diacritic}/gu, "")
      .toLowerCase().trim().replace(/\s+/g, " ");
  }

  function getProgressKey(q) {
    return `${q.topic || "topic"}:${q.q || ""}`;
  }

  async function loadBank() {
    if (!bankPath) return [];
    try {
      const res = await fetch(bankPath);
      const raw = await res.json();
      return Array.isArray(raw) ? raw : (raw.questions || []);
    } catch (e) { return []; }
  }

  async function initTopics() {
    const bank = await loadBank();
    const progress = JSON.parse(localStorage.getItem("civicedge_progress") || "{}");

    // Exclude deep questions
    const eligible = bank.filter(q => q.depth !== "deep");

    // Build topic stats using config keys
    const topicStats = {};
    Object.keys(topicLabels).forEach(key => {
      topicStats[key] = { label: topicLabels[key] || key, total: 0, mastered: 0 };
    });

    eligible.forEach(q => {
      const qTopic = q.topic || "";
      const normQ = normalizeLabel(qTopic);
      const matchedKey = Object.keys(topicLabels).find(k => normalizeLabel(topicLabels[k]) === normQ);
      if (!matchedKey || !topicStats[matchedKey]) return;

      topicStats[matchedKey].total++;

      const key = getProgressKey(q);
      const entry = progress[key];
      if (entry && (entry.correct === 1 || entry.rights > 0)) {
        topicStats[matchedKey].mastered++;
      }
    });

    container.innerHTML = "";

    Object.entries(topicStats).forEach(([key, topic]) => {
      if (topic.total === 0) return;
      const pct = Math.round((topic.mastered / topic.total) * 100);
      const isMastered = topic.mastered >= topic.total;

      const chip = document.createElement("button");
      chip.className = "topic-card";
      if (isMastered) chip.classList.add("mastered");

      chip.innerHTML = `
        <div class="topic-card-name">${topic.label}</div>
        <div class="topic-card-meta">
          <span class="topic-card-count">${topic.total} spørgsmål</span>
          <span class="topic-card-pct">${pct}%</span>
        </div>
        <div class="topic-card-bar"><div class="topic-card-bar-fill" style="width:${pct}%"></div></div>
      `;

      chip.addEventListener("click", () => {
        chip.classList.toggle("active");
        if (chip.classList.contains("active")) {
          selected.add(key);
        } else {
          selected.delete(key);
        }
        startBtn.style.display = selected.size > 0 ? "inline-block" : "none";
        if (selected.size > 0 && window.innerWidth < 768) {
          setTimeout(() => startBtn.scrollIntoView({ behavior: "smooth", block: "center" }), 150);
        }
      });

      container.appendChild(chip);
    });

    startBtn.addEventListener("click", () => {
      const topicKeys = Array.from(selected);
      const limit = (cfg.topics && cfg.topics.questionCount) || 10;
      document.getElementById("quizArea").style.display = "block";
      document.querySelector("section").style.display = "none";
      CivicEdgeEngine.start("topics", { topics: topicKeys, limit: limit, fromTopicsUI: true });
      window.scrollTo({ top: 0, behavior: "smooth" });
    });
  }

  initTopics();
});
</script>
