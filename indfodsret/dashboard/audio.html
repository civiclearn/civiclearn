<!doctype html>
<html lang="da">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lydkapitler</title>
  <meta name="apple-mobile-web-app-title" content="CivicLearn">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="stylesheet" href="/indfodsret/assets/css/civic-v2.css">
  <style>
    .audio-container { max-width: 700px; }
    .audio-intro { font-size: 14px; color: var(--text-mid); line-height: 1.6; margin-bottom: 24px; }
    .audio-item { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 14px 18px; margin-bottom: 8px; }
    .audio-title { font-size: 14.5px; font-weight: 600; margin-bottom: 6px; color: var(--text); }
    .audio-player { width: 100%; height: 40px; margin-top: 2px; }
  </style>
  <script>document.documentElement.classList.add("i18n-hidden");</script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="/indfodsret/assets/js/denmark-auth.js?v=3"></script>
</head>
<body>
<button class="menu-toggle" aria-label="Menu">☰</button>
<div class="wrap">
  <aside class="sidebar">
    <div class="brand">
      CivicLearn®
      <svg class="flag-icon" viewBox="0 0 640 400" aria-label="Danmark">
        <rect width="640" height="400" fill="#C8102E"/>
        <rect x="176" y="0" width="64" height="400" fill="#FFFFFF"/>
        <rect x="0" y="168" width="640" height="64" fill="#FFFFFF"/>
      </svg>
    </div>
    <div class="sidebar-gauge">
      <div class="sidebar-gauge-header">
        <span class="sidebar-gauge-label" data-i18n="dashboard_estimated_score">Est. score</span>
        <span class="sidebar-gauge-score" id="clGaugeScore">–</span>
      </div>
      <div class="sidebar-gauge-track">
        <div class="sidebar-gauge-fill" id="clGaugeFill"></div>
        <div class="sidebar-gauge-pass" id="clGaugePass"></div>
      </div>
      <div class="sidebar-gauge-badge" id="clGaugeBadge"></div>
    </div>
    <nav class="nav">
      <a href="index.html" data-i18n="nav_dashboard">Dashboard</a>
      <a href="simulation.html" data-i18n="nav_simulation">Prøvesimulation</a>
      <a href="quick.html" data-i18n="nav_quick">Hurtig test</a>
      <a href="topics.html" data-i18n="nav_topics">Test efter emne</a>
      <a href="traps.html" data-i18n="nav_traps">Typiske fælder</a>
      <a href="flashcards.html" data-i18n="nav_flashcards">Flashcards</a>
      <a href="manual.html">Læremateriale</a>
      <a href="audio.html" class="active">Lyd</a>
      <a href="advanced.html" id="advancedNavLink" style="display:none">Avancerede spørgsmål</a>
      <div class="nav-sep"></div>
      <a href="history.html" data-i18n="nav_history">Historik</a>
      <a href="my-list.html" data-i18n="nav_my_list">Min liste</a>
      <a href="help.html" data-i18n="nav_help">Hjælp & Kontakt</a>
      <a href="#" data-i18n="nav_logout" id="logoutLink">Log ud</a>
    </nav>
    <div class="spacer"></div>
  </aside>
  <div class="overlay" id="menuOverlay"></div>
  <main>
    <header class="ce-header"><h1>Lydkapitler</h1></header>
    <div class="audio-container">
      <p class="audio-intro">Lyt til lærematerialet som lydbog. Hvert kapitel er indlæst i fuld længde.</p>
      <div class="audio-list">
        <script>
        [
          { label: "Kapitel 1: Danmarks historie (del 1)", file: "kapitel-1-historie-del-1.mp3" },
          { label: "Kapitel 1: Danmarks historie (del 2)", file: "kapitel-1-historie-del-2.mp3" },
          { label: "Kapitel 2: Det danske demokrati", file: "kapitel-2-demokrati.mp3" },
          { label: "Kapitel 3: Den danske økonomi", file: "kapitel-3-oekonomi.mp3" },
          { label: "Kapitel 4: Danmark og omverdenen", file: "kapitel-4-omverdenen.mp3" },
          { label: "Kapitel 5: Dansk kulturliv", file: "kapitel-5-kulturliv.mp3" },
          { label: "Kapitel 6: Temaopslag (del 1)", file: "kapitel-6-temaopslag-del-1.mp3" },
          { label: "Kapitel 6: Temaopslag (del 2)", file: "kapitel-6-temaopslag-del-2.mp3" }
        ].forEach(ch => {
          document.write(`
            <div class="audio-item">
              <div class="audio-title">${ch.label}</div>
              <audio class="audio-player" controls preload="none">
                <source src="https://media.civiclearn.com/denmark/${ch.file}" type="audio/mpeg">
              </audio>
            </div>
          `);
        });
        </script>
      </div>
    </div>
  </main>
</div>
<script src="/indfodsret/assets/js/lang-bootstrap-dk.js"></script>
<script src="/indfodsret/assets/js/config-dk.js"></script>
<script src="/indfodsret/assets/js/i18n.js"></script>
<script>CivicLearnI18n.init();</script>
<script>
document.addEventListener("DOMContentLoaded", () => {
  const toggle = document.querySelector(".menu-toggle");
  const overlay = document.getElementById("menuOverlay");
  if (toggle) toggle.addEventListener("click", () => document.body.classList.toggle("menu-open"));
  if (overlay) overlay.addEventListener("click", () => document.body.classList.remove("menu-open"));
});
</script>
<script src="/indfodsret/assets/js/gauge-bar.js"></script>
<script src="/indfodsret/assets/js/study-timer.js"></script>
<script src="/indfodsret/assets/js/maintenance-bar.js"></script>
<script src="/indfodsret/assets/js/signout.js"></script>
</body>
</html>
