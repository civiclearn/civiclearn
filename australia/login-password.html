<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Set your password – CivicLearn</title>

  <!-- Font -->
  <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <script>
    window.SUPABASE_URL = "https://htgliokekeaovdiafrgs.supabase.co";
    window.SUPABASE_KEY = "sb_publishable_QWvR124i4h0hvQumyjBgDw_018SlMbp";
  </script>

  <style>
    :root {
      --brand: #7c3aed;
      --brand-dark: #5b21b6;
      --bg: #f7f2e8;
      --card: #ffffff;
      --text: #111;
      --muted: #666;
      --border: rgba(0,0,0,.08);
      --radius: 18px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Lexend", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      width: 100%;
      max-width: 420px;
      background: var(--card);
      border-radius: var(--radius);
      padding: 32px 28px 30px;
      box-shadow: 0 12px 32px rgba(0,0,0,.12);
      border: 1px solid var(--border);
      text-align: center;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 26px;
      font-weight: 600;
    }

    .subtitle {
      font-size: 15px;
      color: var(--muted);
      margin-bottom: 18px;
    }

    .note {
      font-size: 14px;
      color: var(--muted);
      background: rgba(124,58,237,.06);
      border: 1px solid rgba(124,58,237,.25);
      border-radius: 12px;
      padding: 12px 14px;
      margin-bottom: 18px;
      text-align: left;
    }

    label {
      display: block;
      font-size: 14px;
      font-weight: 500;
      text-align: left;
      margin: 14px 0 6px;
    }

    input {
      width: 100%;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid rgba(0,0,0,.15);
      font-size: 15px;
    }

    input:focus {
      outline: none;
      border-color: var(--brand);
      box-shadow: 0 0 0 2px rgba(124,58,237,.15);
    }

    .rules {
      margin-top: 8px;
      font-size: 13px;
      color: var(--muted);
      text-align: left;
    }

    .btn {
      margin-top: 20px;
      width: 100%;
      padding: 13px;
      border-radius: 14px;
      border: none;
      background: var(--brand);
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }

    .btn:hover {
      background: var(--brand-dark);
    }

    .msg {
      margin-top: 14px;
      font-size: 14px;
    }

    .msg.error { color: #b91c1c; }
    .msg.success { color: #15803d; }
	
	.loading-note {
  margin-top: 12px;
  font-size: 14px;
  color: #666;
}

.pwd-wrap {
  position: relative;
}

.pwd-wrap input {
  padding-right: 70px;
}

.pwd-toggle {
  position: absolute;
  right: 12px;
  top: 50%;
  transform: translateY(-50%);
  background: none;
  border: none;
  color: #7c3aed;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
}

  </style>
</head>

<body>

<!-- LOADING / GATE -->
<div class="card" id="loading">
  <strong>Preparing secure password setup…</strong>

  <div id="loadingNote" class="loading-note">
    <br>
    Please wait while we verify your access.
  </div>
</div>

<!-- PASSWORD FORM -->
<div class="card" id="form" style="display:none;">
  <h1>Set your password</h1>
  <div class="subtitle">Access your CivicLearn account</div>

  <div class="note">
    If you already had a password, you can safely set a new one here.
    This is normal and will not affect your access.
  </div>

  <!-- PASSWORD -->
  <label for="password">Password</label>
  <div class="pwd-wrap">
    <input
      type="password"
      id="password"
      placeholder="New password"
      autocomplete="new-password"
    >
    <button
      type="button"
      class="pwd-toggle"
      onclick="togglePwd('password', this)"
      aria-label="Show password"
    >
      Show
    </button>
  </div>

  <!-- CONFIRM -->
  <label for="confirm">Confirm password</label>
  <div class="pwd-wrap">
    <input
      type="password"
      id="confirm"
      placeholder="Repeat password"
      autocomplete="new-password"
    >
    <button
      type="button"
      class="pwd-toggle"
      onclick="togglePwd('confirm', this)"
      aria-label="Show password"
    >
      Show
    </button>
  </div>

  <div class="rules">
    • At least 6 characters<br>
    • Both fields must match
  </div>

  <button class="btn" onclick="updatePassword()">
    Save password
  </button>

  <div id="status" class="msg"></div>
</div>


<script>
/*
  Purpose of this page
  --------------------
  This page is ONLY meant to be opened via a secure email link
  sent by Supabase (password setup / reset).

  The password form must ONLY appear if Supabase confirms
  that the user is authenticated via that link.
*/

/* -----------------------------
   State
----------------------------- */

let sessionConfirmed = false;

/* -----------------------------
   Load Supabase
----------------------------- */

(function loadSupabase() {
  const s = document.createElement("script");
  s.src = "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.7.1/dist/umd/supabase.js";

  s.onload = () => {
    window.supabase = supabase.createClient(
      window.SUPABASE_URL,
      window.SUPABASE_KEY
    );

    watchForAuthSession();
  };

  document.head.appendChild(s);
})();

/* -----------------------------
   Watch for auth session
----------------------------- */

function watchForAuthSession() {
  supabase.auth.onAuthStateChange((_event, session) => {
    if (!session || !session.user) return;

    // We have a valid authenticated user
    sessionConfirmed = true;

    // Show the password form
    document.getElementById("loading").style.display = "none";
    document.getElementById("form").style.display = "block";
  });
}

/* -----------------------------
   Fallback explanation
   (if user opens page incorrectly)
----------------------------- */

setTimeout(() => {
  if (sessionConfirmed) return;

  const note = document.getElementById("loadingNote");
  if (!note) return;

  note.innerHTML = `
    <strong>This page is accessed via a secure email link.</strong><br><br>
    To set your password, please open the email we sent you and click the link inside.<br><br>
    If the link expired or you opened this page directly,
    return to the login page and request a new password setup email.
    <br><br>
    <a href="/australia/login.html"
       style="color:#7c3aed;font-weight:600;text-decoration:none;">
      Go back to login
    </a>
  `;
}, 4000);

/* -----------------------------
   Save password
----------------------------- */

async function updatePassword() {
  const pwd = document.getElementById("password").value;
  const conf = document.getElementById("confirm").value;
  const msg = document.getElementById("status");

  msg.textContent = "";
  msg.className = "msg";

  if (pwd.length < 6) {
    msg.textContent = "Password must be at least 6 characters.";
    msg.classList.add("error");
    return;
  }

  if (pwd !== conf) {
    msg.textContent = "Passwords do not match.";
    msg.classList.add("error");
    return;
  }

  msg.textContent = "Saving password…";

  const { error } = await supabase.auth.updateUser({
    password: pwd
  });

  if (error) {
    msg.textContent = "This password setup link has expired. Please return to the login page and request a new password setup email.";
    msg.classList.add("error");
    return;
  }

  msg.textContent = "Password saved. Redirecting…";
  msg.classList.add("success");
  localStorage.setItem("cl_auth","ok");

  // Redirect to dashboard (keeps country path)
  setTimeout(() => {
    const parts = location.pathname.split("/").filter(Boolean);
    const base = "/" + parts[0];
    location.replace(base + "/dashboard/");
  }, 900);
}
</script>


<script>
function togglePwd(inputId, btn) {
  const input = document.getElementById(inputId);

  if (input.type === "password") {
    input.type = "text";
    btn.textContent = "Hide";
  } else {
    input.type = "password";
    btn.textContent = "Show";
  }
}
</script>


</body>
</html>
