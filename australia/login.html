<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Australia Login – CivicLearn N</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.7.1/dist/umd/supabase.js"></script>
    <script>
        const supabase = window.supabase.createClient("https://htgliokekeaovdiafrgs.supabase.co", "sb_publishable_QWvR124i4h0hvQumyjBgDw_018SlMbp");
    </script>
    <style>
        body { font-family: sans-serif; background: #fdfaf5; display: flex; justify-content: center; padding-top: 60px; margin: 0; }
        .login-card { background: white; padding: 40px; border-radius: 24px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); width: 360px; text-align: center; border: 1px solid #eee; }
        input { width: 100%; padding: 14px; margin: 10px 0; border: 1px solid #ddd; border-radius: 10px; box-sizing: border-box; font-size: 16px; }
        button { width: 100%; padding: 15px; border-radius: 10px; border: none; cursor: pointer; font-weight: bold; color: white; font-size: 16px; margin-top: 5px; }
        .btn-pink { background: #d44270; }
        .btn-blue { background: #0288d1; }
        #pinDisplay { display: none; color: #d44270; font-size: 54px; margin: 20px 0; font-weight: 800; letter-spacing: 5px; }
    </style>
</head>
<body>

    <div class="login-card">
        <h2 style="margin-top:0; color:#333;">1. Get PIN</h2>
        <input type="email" id="emailBox" placeholder="Enter your email">
        <button onclick="getPIN()" class="btn-pink">Show Daily PIN</button>
        
        <div id="pinDisplay">00</div>

        <hr style="margin:30px 0; border:0; border-top:1px solid #eee;">

        <h2 style="color:#333;">2. Enter Dashboard</h2>
        <input type="text" id="pinInput" placeholder="Paste PIN here">
        <button onclick="login()" class="btn-blue">Enter Library</button>
    </div>

    <script>
        async function getPIN() {
            const email = document.getElementById('emailBox').value.trim().toLowerCase();
            if(!email) return alert("Please enter your email.");

            // Check Supabase (Assumes RLS is DISABLED or Policy is set)
            const { data, error } = await supabase.from('users').select('email').ilike('email', email).maybeSingle();
            
            if (data) {
                const pin = new Date().getDate() + 42;
                const display = document.getElementById('pinDisplay');
                display.innerText = pin;
                display.style.display = 'block';
                // Save email for later
                localStorage.setItem("user_email", email);
            } else {
                alert("Email not found. Please check your spelling or contact support.");
            }
        }

        function login() {
            const entered = document.getElementById('pinInput').value.trim();
            const today = new Date().getDate();
            const correct = today + 42;

            if (parseInt(entered) === correct) {
                // Set the VIP Pass before moving
                localStorage.setItem("cl_vip_pass", "true");
                localStorage.setItem("last_used_pin", entered);
                
                console.log("PIN correct. Moving to dashboard...");
                window.location.assign("/australia/dashboard/index.html");
            } else {
                alert("Incorrect PIN for today.");
            }
        }
    </script>
</body>
</html>
