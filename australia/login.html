<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Login – CivicLearn</title>

<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600&display=swap" rel="stylesheet">

<style>
body {
  margin: 0;
  background: #f5f6fb;
  font-family: Lexend, system-ui, sans-serif;
}

.wrap {
  max-width: 420px;
  margin: 80px auto;
  padding: 0 16px;
}

.card {
  background: white;
  border-radius: 16px;
  padding: 24px;
  box-shadow: 0 12px 30px rgba(0,0,0,.08);
  margin-bottom: 20px;
  transition: all .4s ease;
}

.card.primary {
  border-top: 6px solid #6c5ce7;
}

.card.secondary {
  opacity: 0;
  transform: translateY(20px);
  pointer-events: none;
}

.card.secondary.visible {
  opacity: 1;
  transform: none;
  pointer-events: auto;
}

h2 {
  margin: 0 0 8px;
  font-weight: 600;
}

p {
  margin: 0 0 16px;
  color: #555;
  font-size: 14px;
}

input {
  width: 100%;
  padding: 14px;
  margin-bottom: 12px;
  border-radius: 10px;
  border: 1px solid #ddd;
  font-size: 15px;
}

button {
  width: 100%;
  padding: 14px;
  border-radius: 10px;
  border: none;
  background: #6c5ce7;
  color: white;
  font-size: 15px;
  font-weight: 500;
  cursor: pointer;
}

.msg {
  margin-top: 10px;
  font-size: 13px;
  color: #d63031;
}
</style>
</head>

<body>

<div class="wrap">

  <!-- STEP 1 -->
  <div class="card primary">
    <h2>Secure access</h2>
    <p>Enter your email to continue. You’ll be asked for a short access PIN.</p>

    <input id="email" type="email" placeholder="Email address">
    <button onclick="requestPIN()">Continue</button>

    <div id="msg1" class="msg"></div>
  </div>

  <!-- STEP 2 -->
  <div id="pinCard" class="card secondary">
    <h2>Enter your PIN</h2>
    <p>
  Your access PIN is shown below.  
  <strong>Write it down.</strong> You will need to enter it manually.
</p>

<div id="shownPin" style="
  font-size: 28px;
  letter-spacing: 6px;
  font-weight: 600;
  margin: 12px 0 16px;
  text-align: center;
  color: #6c5ce7;
"></div>


    <input id="email2" type="email" disabled>
    <input id="pin" type="text" inputmode="numeric" maxlength="4" placeholder="4-digit PIN">

    <button onclick="login()">Enter</button>

    <div id="msg2" class="msg"></div>
  </div>

</div>

<script>
function getExpectedPIN(email) {
  const now = new Date();
  const start = new Date(Date.UTC(now.getUTCFullYear(), 0, 0));
  const day = Math.floor((now - start) / 86400000);
  const hour = now.getUTCHours();

  const base =
    (day * 37) +
    (hour * 91) +
    (email.length * 17);

  return String(base % 10000).padStart(4, "0");
}

function requestPIN() {
  const email = document.getElementById("email").value.trim().toLowerCase();
  const msg = document.getElementById("msg1");

  if (!email) {
    msg.textContent = "Please enter your email.";
    return;
  }

  localStorage.setItem("cl_email", email);

  const pin = getExpectedPIN(email);

  document.getElementById("email2").value = email;
  document.getElementById("shownPin").textContent = pin;

  document.getElementById("pinCard").classList.add("visible");
}


function login() {
  const email = localStorage.getItem("cl_email");
  const pin = document.getElementById("pin").value.trim();
  const msg = document.getElementById("msg2");

  if (!pin || pin.length !== 4) {
    msg.textContent = "Enter the 4-digit PIN.";
    return;
  }

  const expected = getExpectedPIN(email);

  if (pin !== expected) {
    msg.textContent = "Invalid PIN. Please try again.";
    return;
  }

  localStorage.setItem("cl_auth", "ok");
  window.location.replace("/australia/dashboard/");
}
</script>

</body>
</html>
