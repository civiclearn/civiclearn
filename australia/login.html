<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login – Indfodsretsprove.dk</title>

  <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/login.css">
  
  <script>
    window.SUPABASE_URL = "https://htgliokekeaovdiafrgs.supabase.co";
    window.SUPABASE_KEY = "sb_publishable_QWvR124i4h0hvQumyjBgDw_018SlMbp";
  </script>

  <script>
    (function () {
      const supabaseLoader = document.createElement("script");
      supabaseLoader.src = "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.7.1/dist/umd/supabase.js";
      supabaseLoader.onload = () => {
        window.supabase = supabase.createClient(window.SUPABASE_URL, window.SUPABASE_KEY);
      };
      document.head.appendChild(supabaseLoader);
    })();
  </script>

  <style>
    .auth-section { margin-bottom: 2rem; padding: 1.5rem; border-radius: 12px; border: 1px solid #e5dfd2; }
    .setup-box { background-color: #f3ebff; border-color: #7c3aed; } /* Purple for first time */
    .login-box { background-color: #fff; } /* Standard White */
    .otp-box { background-color: #fffcf0; border-color: #f1c40f; } /* Soft Yellow for Emergency */
    
    .input-group { margin-bottom: 1rem; }
    .input-group label { display: block; margin-bottom: 5px; font-weight: 500; }
    .input-field { width: 100%; box-sizing: border-box; padding: 12px; border: 2px solid #e5dfd2; border-radius: 8px; font-family: 'Lexend', sans-serif; }
    
    .btn-auth { width: 100%; padding: 12px; border-radius: 8px; font-weight: 600; cursor: pointer; border: none; font-family: 'Lexend', sans-serif; transition: opacity 0.2s; }
    .btn-purple { background-color: #7c3aed; color: white; }
    .btn-yellow { background-color: #f1c40f; color: #333; }
    .btn-black { background-color: #333; color: white; }
    
    .status-msg { margin-top: 10px; font-size: 14px; display: none; padding: 10px; border-radius: 6px; }
    .error { background: #fee2e2; color: #dc2626; display: block; }
    .success { background: #dcfce7; color: #166534; display: block; }
  </style>
</head>

<body>

<header class="site-header">
  <div class="header-inner">
    <div class="header-left">
      <div class="brand-main">
        <img src="/assets/images/icons/dk.svg" alt="DK">
        <div class="brand-title">Indfodsretsprove.dk</div>
      </div>
    </div>
    <a href="/denmark-pr/checkout.html" class="btn-small-purple">Opret en adgang</a>
  </div>
</header>

<div class="login-wrapper" style="max-width: 500px; margin: 40px auto; padding: 0 20px;">
  
  <div id="globalMessage" class="status-msg"></div>

  <div class="auth-section setup-box">
    <h2 style="font-size: 1.1rem; margin-top: 0; color: #7c3aed;">Første gang her?</h2>
    <p style="font-size: 0.9rem; margin-bottom: 1rem;">Har du lige købt adgang? Indtast din e-mail for at oprette din adgangskode.</p>
    <div class="input-group">
      <input id="setupEmail" type="email" class="input-field" placeholder="navn@eksempel.dk">
    </div>
    <button onclick="handleInitialSetup()" class="btn-auth btn-purple">Send link til oprettelse</button>
  </div>

  <div class="auth-section login-box">
    <h1 style="font-size: 1.5rem; margin-top: 0;">Log ind</h1>
    <div class="input-group">
      <label>E-mailadresse</label>
      <input id="loginEmail" type="email" class="input-field" placeholder="navn@eksempel.dk">
    </div>
    <div class="input-group">
      <label>Adgangskode</label>
      <input id="loginPassword" type="password" class="input-field" placeholder="••••••••">
    </div>
    <button onclick="handlePasswordLogin()" class="btn-auth btn-black">Log ind med kodeord</button>
  </div>

  <div class="auth-section otp-box">
    <h2 style="font-size: 1.1rem; margin-top: 0; color: #856404;">Problemer med kodeord?</h2>
    <p style="font-size: 0.9rem; margin-bottom: 1rem;">Modtag en engangskode (8 cifre) direkte i din indbakke.</p>
    
    <div id="otpInputGroup">
      <input id="otpEmail" type="email" class="input-field" placeholder="navn@eksempel.dk">
      <button onclick="handleSendOTP()" class="btn-auth btn-yellow" style="margin-top:10px;">Send engangskode</button>
    </div>

    <div id="otpVerifyGroup" style="display:none;">
      <input id="otpCode" type="text" class="input-field" placeholder="00000000" maxlength="8" style="text-align:center; letter-spacing: 4px; font-size: 20px;">
      <button onclick="handleVerifyOTP()" class="btn-auth btn-black" style="margin-top:10px;">Bekræft og log ind</button>
    </div>
  </div>

</div>

<script>
// --- UTILS ---
function showGlobalMsg(type, text) {
  const box = document.getElementById("globalMessage");
  box.textContent = text;
  box.className = "status-msg " + type;
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// --- 1. FIRST TIME SETUP (Password Invitation) ---
async function handleInitialSetup() {
  const email = document.getElementById("setupEmail").value.trim();
  if(!email) return showGlobalMsg("error", "Indtast venligst din e-mail.");

  const { error } = await window.supabase.auth.resetPasswordForEmail(email, {
    redirectTo: window.location.origin + "/denmark-pr/set-password.html"
  });

  if (error) {
    // Because "Allow Signups" is OFF, this will fail for non-users
    showGlobalMsg("error", "E-mailen blev ikke fundet i vores system.");
  } else {
    showGlobalMsg("success", "Vi har sendt et link til din e-mail for at oprette dit kodeord.");
  }
}

// --- 2. PASSWORD LOGIN ---
async function handlePasswordLogin() {
  const email = document.getElementById("loginEmail").value.trim();
  const password = document.getElementById("loginPassword").value.trim();

  const { data, error } = await window.supabase.auth.signInWithPassword({ email, password });

  if (error) {
    showGlobalMsg("error", "Fejl ved login: " + error.message);
  } else {
    window.location.href = "/denmark/dashboard/index.html";
  }
}

// --- 3. OTP FLOW ---
async function handleSendOTP() {
  const email = document.getElementById("otpEmail").value.trim();
  
  const { error } = await window.supabase.auth.signInWithOtp({
    email,
    options: { shouldCreateUser: false } // CRITICAL: Only users in the table get an email
  });

  if (error) {
    showGlobalMsg("error", "E-mailen blev ikke fundet eller der skete en fejl.");
  } else {
    document.getElementById("otpInputGroup").style.display = "none";
    document.getElementById("otpVerifyGroup").style.display = "block";
    showGlobalMsg("success", "Engangskoden er sendt!");
  }
}

async function handleVerifyOTP() {
  const email = document.getElementById("otpEmail").value.trim();
  const token = document.getElementById("otpCode").value.trim();

  const { data, error } = await window.supabase.auth.verifyOtp({
    email, token, type: 'magiclink'
  });

  if (error) {
    showGlobalMsg("error", "Koden er ugyldig eller udløbet.");
  } else {
    window.location.href = "/denmark/dashboard/index.html";
  }
}
</script>

</body>
</html>
