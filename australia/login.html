<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login – CivicLearn Australia</title>

  <!-- Font -->
  <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <!-- Supabase config -->
  <script>
    window.SUPABASE_URL = "https://htgliokekeaovdiafrgs.supabase.co";
    window.SUPABASE_KEY = "sb_publishable_QWvR124i4h0hvQumyjBgDw_018SlMbp";
  </script>

  <!-- Supabase loader -->
  <script>
    (function () {
      const s = document.createElement("script");
      s.src = "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.7.1/dist/umd/supabase.js";
      s.onload = () => {
        window.supabase = supabase.createClient(
          window.SUPABASE_URL,
          window.SUPABASE_KEY
        );
      };
      document.head.appendChild(s);
    })();
  </script>

  <style>
    :root {
      --brand: #7c3aed;
      --brand-dark: #5b21b6;
      --bg: #f7f2e8;
      --card: #ffffff;
      --text: #111;
      --muted: #666;
      --radius: 18px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Lexend", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* HEADER */
    header {
      border-bottom: 1px solid rgba(0,0,0,.06);
      background: rgba(247,242,232,.95);
    }

    .header-inner {
      max-width: 1100px;
      margin: 0 auto;
      padding: 14px 22px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand img { width: 24px; }

    .brand-title {
      font-weight: 600;
      font-size: 15px;
    }

    nav a {
      margin: 0 10px;
      text-decoration: none;
      color: #333;
      font-size: 14px;
    }

    .cta {
      background: var(--brand);
      color: #fff;
      padding: 6px 14px;
      border-radius: 999px;
      text-decoration: none;
      font-size: 13px;
      font-weight: 500;
    }

    /* PAGE */
    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 16px;
    }

    .card {
      width: 100%;
      max-width: 420px;
      background: var(--card);
      border-radius: var(--radius);
      padding: 36px 32px 32px;
      box-shadow: 0 10px 30px rgba(0,0,0,.12);
      border: 1px solid rgba(0,0,0,.06);
    }

    h1 {
      margin: 0 0 6px;
      text-align: center;
      font-size: 28px;
      font-weight: 600;
    }

    .subtitle {
      text-align: center;
      color: var(--muted);
      font-size: 15px;
      margin-bottom: 24px;
    }

    label {
      font-size: 14px;
      font-weight: 500;
      margin-bottom: 6px;
      display: block;
    }

    input {
      width: 100%;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid rgba(0,0,0,.15);
      font-size: 15px;
      margin-bottom: 14px;
    }

    input:focus {
      outline: none;
      border-color: var(--brand);
      box-shadow: 0 0 0 2px rgba(124,58,237,.15);
    }

    .btn {
      width: 100%;
      padding: 13px;
      border-radius: 14px;
      border: none;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-primary {
      background: var(--brand);
      color: #fff;
      margin-top: 6px;
    }

    .btn-primary:hover {
      background: var(--brand-dark);
    }

    .divider {
      text-align: center;
      margin: 18px 0;
      color: var(--muted);
      font-size: 13px;
    }

    .btn-google {
      background: #fff;
      border: 1px solid rgba(0,0,0,.2);
    }

    .links {
      margin-top: 18px;
      font-size: 13px;
      text-align: center;
      color: var(--muted);
    }

    .links a {
      color: var(--brand);
      font-weight: 600;
      text-decoration: none;
    }

    .error {
      margin-top: 14px;
      font-size: 14px;
      color: #b91c1c;
      text-align: center;
    }

    @media (max-width: 480px) {
      .card {
        padding: 30px 20px 26px;
      }
      h1 { font-size: 24px; }
    }
  </style>
</head>

<body>

<header>
  <div class="header-inner">
    <div class="brand">
      <img src="/assets/images/au.svg" alt="AU">
      <div class="brand-title">CivicLearn Australia</div>
    </div>

    <nav>
      <a href="/australia/">Home</a>
      <a href="/australia/#overview">Overview</a>
      <a href="/australia/#pricing">Pricing</a>
    </nav>

    <a href="/australia/checkout.html" class="cta">Get access</a>
  </div>
</header>

<main>
  <div class="card">

    <h1>Login</h1>
    <div class="subtitle">Access your CivicLearn training</div>

    <!-- PASSWORD LOGIN -->
    <label>Email</label>
    <input type="email" id="email" placeholder="you@example.com">

    <label>Password</label>
    <input type="password" id="password" placeholder="••••••••">

    <button class="btn btn-primary" onclick="loginWithPassword()">Log in</button>

    <div class="divider">or</div>

    <!-- GOOGLE -->
    <button class="btn btn-google" onclick="loginWithGoogle()">
      Continue with Google
    </button>

    <div class="links">
      No password yet?
      <a href="/australia/login-password.html">Set one via email</a><br>
      Problems logging in?
      <a href="/australia/login-otp.html">Use a one-time access code</a>
    </div>

    <div id="loginError" class="error"></div>

  </div>
</main>

<script>
async function loginWithPassword() {
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;
  const errorBox = document.getElementById("loginError");
  errorBox.textContent = "";

  const { error } = await supabase.auth.signInWithPassword({
    email, password
  });

  if (error) {
    errorBox.textContent = error.message;
    return;
  }

  window.location.href = "/australia/dashboard/";
}

async function loginWithGoogle() {
  await supabase.auth.signInWithOAuth({
    provider: "google",
    options: {
      redirectTo: window.location.origin + "/australia/dashboard/"
    }
  });
}
</script>

</body>
</html>
