<!DOCTYPE html>
<html lang="en-AU">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login – CivicLearn Australia</title>

  <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Lexend', system-ui, sans-serif;
      background: #f7f7f9;
      margin: 0;
      color: #333;
    }

    .login-wrapper {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .card {
      background: #fff;
      max-width: 420px;
      width: 100%;
      padding: 28px;
      border-radius: 14px;
      box-shadow: 0 10px 30px rgba(0,0,0,.08);
    }

    h1 {
      margin-top: 0;
      font-size: 26px;
    }

    .subtitle {
      color: #666;
      margin-bottom: 22px;
    }

    label {
      font-size: 14px;
      font-weight: 500;
    }

    input {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 2px solid #e5dfd2;
      margin: 8px 0 14px;
      font-size: 15px;
      box-sizing: border-box;
    }

    button {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: none;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-primary {
      background: #6b4eff;
      color: #fff;
    }

    .btn-google {
      background: #fff;
      border: 2px solid #ddd;
      margin-top: 12px;
    }

    .divider {
      text-align: center;
      margin: 22px 0;
      font-size: 13px;
      color: #999;
    }

    .alt-section {
      margin-top: 18px;
      font-size: 14px;
    }

    .alt-section a {
      color: #6b4eff;
      text-decoration: none;
      font-weight: 500;
      cursor: pointer;
    }

    .otp-section {
      display: none;
      margin-top: 16px;
    }

    .message {
      margin-top: 14px;
      font-size: 14px;
    }

    .message.error { color: #c0392b; }
    .message.success { color: #1e8449; }
  </style>

  <!-- Supabase config -->
  <script>
    window.SUPABASE_URL = "https://htgliokekeaovdiafrgs.supabase.co";
    window.SUPABASE_KEY = "sb_publishable_QWvR124i4h0hvQumyjBgDw_018SlMbp";
  </script>
</head>

<body>

<div class="login-wrapper">
  <div class="card">

    <h1>Login</h1>
    <p class="subtitle">Access your CivicLearn training</p>

    <!-- PASSWORD LOGIN -->
    <label>Email</label>
    <input id="email" type="email" placeholder="you@example.com">

    <label>Password</label>
    <input id="password" type="password" placeholder="Your password">

    <button class="btn-primary" id="passwordLogin">Login</button>

    <!-- GOOGLE LOGIN -->
    <button class="btn-google" id="googleLogin">Continue with Google</button>

    <div class="divider">More options</div>

    <!-- SET PASSWORD -->
    <div class="alt-section">
      <strong>No password yet?</strong><br>
      <a id="sendPasswordLink">Set a password via email</a>
    </div>

    <!-- OTP -->
    <div class="alt-section">
      <strong>Problems logging in?</strong><br>
      <a id="showOtp">Use a one-time access code instead</a>
    </div>

    <div class="otp-section" id="otpSection">
      <input id="otpCode" placeholder="8-digit code">
      <button id="verifyOtp">Verify code</button>
    </div>

    <div class="message" id="message"></div>

  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.7.1/dist/umd/supabase.js"></script>
<script>
  const supabase = supabaseJs.createClient(
    window.SUPABASE_URL,
    window.SUPABASE_KEY
  );

  const msg = document.getElementById("message");

  function show(type, text) {
    msg.className = "message " + type;
    msg.textContent = text;
  }

  // PASSWORD LOGIN
  document.getElementById("passwordLogin").onclick = async () => {
    const email = emailInput.value.trim();
    const password = passwordInput.value;

    const { error } = await supabase.auth.signInWithPassword({ email, password });
    if (error) return show("error", "Invalid email or password.");

    window.location.href = "/australia/dashboard/";
  };

  // GOOGLE LOGIN
  document.getElementById("googleLogin").onclick = async () => {
    await supabase.auth.signInWithOAuth({
      provider: "google",
      options: {
        redirectTo: window.location.origin + "/australia/dashboard/"
      }
    });
  };

  // SEND PASSWORD SETUP
  document.getElementById("sendPasswordLink").onclick = async () => {
    const email = emailInput.value.trim();
    if (!email) return show("error", "Enter your email first.");

    const { error } = await supabase.auth.resetPasswordForEmail(email, {
      redirectTo: window.location.origin + "/australia/login-password.html"
    });

    if (error) show("error", "Could not send email.");
    else show("success", "Password setup email sent. Check inbox and spam.");
  };

  // OTP FLOW
  document.getElementById("showOtp").onclick = async () => {
    const email = emailInput.value.trim();
    if (!email) return show("error", "Enter your email first.");

    await supabase.auth.signInWithOtp({
      email,
      options: { shouldCreateUser: false }
    });

    document.getElementById("otpSection").style.display = "block";
    show("success", "Access code sent by email.");
  };

  document.getElementById("verifyOtp").onclick = async () => {
    const email = emailInput.value.trim();
    const token = otpCode.value.trim();

    const { data, error } = await supabase.auth.verifyOtp({
      email,
      token,
      type: "magiclink"
    });

    if (error) show("error", "Invalid code.");
    else window.location.href = "/australia/dashboard/";
  };

  const emailInput = document.getElementById("email");
  const passwordInput = document.getElementById("password");
  const otpCode = document.getElementById("otpCode");
</script>

</body>
</html>
