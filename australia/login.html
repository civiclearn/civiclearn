<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login – CivicLearn Australia</title>77

  <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.7.1/dist/umd/supabase.js"></script>
  <script>
    // Your Supabase Config
    window.SUPABASE_URL = "https://htgliokekeaovdiafrgs.supabase.co";
    window.SUPABASE_KEY = "sb_publishable_QWvR124i4h0hvQumyjBgDw_018SlMbp";
    const supabase = window.supabase.createClient(window.SUPABASE_URL, window.SUPABASE_KEY);
  </script>

  <style>
    :root { --blue: #0288d1; --black: #333; --bg: #fdfaf5; --pink-border: #ff85c0; --pink-bg: rgba(255, 240, 246, 0.9); }
    body { font-family: 'Lexend', sans-serif; background-color: var(--bg); margin: 0; padding: 20px; color: var(--black); }
    
    .login-grid { display: flex; flex-direction: column; align-items: center; max-width: 800px; margin: 40px auto; }
    
    /* THE PINK BLOCK */
    #pink-access-block {
        background: var(--pink-bg);
        backdrop-filter: blur(10px);
        border: 2px dashed var(--pink-border);
        padding: 30px;
        border-radius: 24px;
        margin-bottom: 30px;
        width: 100%;
        box-sizing: border-box;
        text-align: center;
        box-shadow: 0 10px 30px rgba(212, 66, 112, 0.1);
    }

    #the-number {
        font-family: 'Courier New', Courier, monospace;
        font-size: 64px;
        font-weight: 700;
        color: #d44270;
        letter-spacing: 10px;
        margin: 15px 0;
        display: block;
    }

    /* CARDS */
    .auth-card { background: white; padding: 40px; border-radius: 24px; border: 2px solid var(--blue); width: 100%; max-width: 400px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); text-align: center; }
    
    input { width: 100%; padding: 15px; border: 2px solid #eee; border-radius: 12px; margin-bottom: 15px; box-sizing: border-box; font-size: 16px; font-family: inherit; }
    label { display: block; text-align: left; font-size: 11px; font-weight: 700; text-transform: uppercase; color: #999; margin-bottom: 5px; }
    
    .btn { width: 100%; padding: 16px; border-radius: 12px; border: none; font-weight: 700; font-size: 16px; cursor: pointer; transition: 0.2s; }
    .btn-pink { background: #d44270; color: white; }
    .btn-blue { background: var(--blue); color: white; }
    
    .status-msg { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); padding: 15px 30px; border-radius: 50px; display: none; z-index: 1000; font-weight: 600; }
    .error { background: #fee2e2; color: #dc2626; border: 1px solid #fecaca; }
  </style>
</head>
<body>

<div id="status" class="status-msg"></div>

<div class="login-grid">
  
  <div id="pink-access-block">
    <h2 style="color: #d44270; margin: 0 0 10px 0;">Instant Access PIN</h2>
    <p style="font-size: 14px; color: #666; margin-bottom: 20px;">Enter your email to reveal your unique daily security code.</p>
    
    <div style="display: flex; gap: 10px; max-width: 500px; margin: 0 auto;">
        <input type="email" id="lookup-email" placeholder="your@email.com" style="margin-bottom: 0;">
        <button onclick="getWoodenPIN()" class="btn btn-pink" style="width: auto;">Get PIN</button>
    </div>

    <div id="pin-display" style="display: none; margin-top: 25px; padding-top: 25px; border-top: 1px solid rgba(212, 66, 112, 0.1);">
        <span style="font-size: 12px; text-transform: uppercase; color: #999; letter-spacing: 1px;">Your PIN for today is:</span>
        <span id="the-number">0000</span>
        <p style="font-size: 11px; color: #d44270; margin: 0;">Code changes at midnight. Use it in the box below to log in.</p>
    </div>
  </div>

  <div class="auth-card">
    <h2 style="margin-top: 0;">Dashboard Login</h2>
    <p style="font-size: 13px; color: #666; margin-bottom: 30px;">Enter your details to enter the library.</p>
    
    <label>Email Address</label>
    <input type="email" id="bypassEmail" placeholder="you@example.com">
    
    <label>Daily PIN</label>
    <input type="text" id="bypassToken" placeholder="Enter PIN from pink box" maxlength="6">
    
    <button onclick="handleBypass()" class="btn btn-blue">Enter Now</button>
  </div>

</div>

<script>
  function notify(type, text) {
    const el = document.getElementById("status");
    el.textContent = text; el.className = "status-msg " + type; el.style.display = "block";
    setTimeout(() => { el.style.display = "none"; }, 4000);
  }

  async function getWoodenPIN() {
    const email = document.getElementById('lookup-email').value.trim().toLowerCase();
    const pinDisplay = document.getElementById('pin-display');
    const theNumber = document.getElementById('the-number');

    if (!email) return notify("error", "Please enter your email.");

    // 1. Search the "White List"
    // We use .eq() for an exact match or .ilike() for case-insensitive
    const { data, error } = await supabase
        .from('users')
        .select('email')
        .ilike('email', email)
        .maybeSingle();

    if (error) {
        console.error(error);
        return notify("error", "Database error. Check console.");
    }

    if (!data) {
        return notify("error", "Email not found. Are you a registered user?");
    }

    // 2. THE WOODEN MATH (Day + 42)
    const today = new Date().getDate(); 
    const woodenPIN = today + 42; 

    // 3. Show and Auto-fill
    theNumber.innerText = woodenPIN;
    pinDisplay.style.display = 'block';
    
    document.getElementById('bypassEmail').value = email;
    document.getElementById('bypassToken').value = woodenPIN;
  }

  function handleBypass() {
    const email = document.getElementById("bypassEmail").value.trim();
    const token = document.getElementById("bypassToken").value.trim();
    
    if(!email || !token) return notify("error", "Please enter your email and PIN.");

    // The Wooden Guard Check
    const today = new Date().getDate();
    const correctPIN = today + 42;

    if (parseInt(token) === correctPIN) {
        localStorage.setItem("cl_vip_pass", "true");
        localStorage.setItem("user_email", email.toLowerCase());
        window.location.href = "/australia/dashboard/index.html";
    } else {
        notify("error", "Invalid PIN for today. Please use the Get PIN button.");
    }
  }
</script>
</body>
</html>
