<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login – CivicLearn Australia</title>
  <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.7.1/dist/umd/supabase.js"></script>
  <script>
    window.SUPABASE_URL = "https://htgliokekeaovdiafrgs.supabase.co";
    window.SUPABASE_KEY = "sb_publishable_QWvR124i4h0hvQumyjBgDw_018SlMbp";
    const supabase = window.supabase.createClient(window.SUPABASE_URL, window.SUPABASE_KEY);
  </script>
  <style>
    :root { --blue: #0288d1; --bg: #fdfaf5; --pink: #d44270; }
    body { font-family: 'Lexend', sans-serif; background: var(--bg); display: flex; justify-content: center; padding: 40px 20px; }
    .container { width: 100%; max-width: 450px; text-align: center; }
    .pink-box { background: #fff0f6; border: 2px dashed #ff85c0; padding: 30px; border-radius: 20px; margin-bottom: 25px; }
    .auth-card { background: white; padding: 35px; border-radius: 24px; border: 2px solid var(--blue); box-shadow: 0 4px 20px rgba(0,0,0,0.05); }
    input { width: 100%; padding: 14px; border: 2px solid #eee; border-radius: 12px; margin-bottom: 15px; box-sizing: border-box; font-size: 16px; }
    .btn { width: 100%; padding: 15px; border-radius: 12px; border: none; font-weight: 700; cursor: pointer; color: white; font-size: 16px; transition: 0.2s; }
    #the-number { font-size: 54px; font-weight: 800; color: var(--pink); letter-spacing: 5px; margin: 10px 0; display: block; }
    #pinArea { display: none; margin-top: 20px; border-top: 1px solid #ffdaeb; padding-top: 15px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="pink-box">
      <h3 style="color:var(--pink);margin-top:0;">1. Get Your Access PIN</h3>
      <p style="font-size:13px; color:#666;">Enter your email to reveal today's code.</p>
      <input type="email" id="lookupEmail" placeholder="registered@email.com">
      <button onclick="getPIN()" class="btn" style="background:var(--pink)">Reveal Daily PIN</button>
      <div id="pinArea">
        <span style="font-size:11px;color:#999;text-transform:uppercase;">Today's PIN is:</span>
        <span id="the-number">00</span>
      </div>
    </div>

    <div class="auth-card">
      <h3 style="margin-top:0;">2. Enter Dashboard</h3>
      <input type="email" id="finalEmail" placeholder="Confirm Email">
      <input type="text" id="finalPIN" placeholder="Enter PIN from above">
      <button onclick="enter()" class="btn" style="background:var(--blue)">Enter Library</button>
    </div>
  </div>

  <script>
    async function getPIN() {
      const email = document.getElementById('lookupEmail').value.trim().toLowerCase();
      if(!email) return alert("Please enter an email");

      const { data, error } = await supabase.from('users').select('email').ilike('email', email).maybeSingle();
      
      if(error || !data) {
        return alert("Email not found. Make sure you typed it correctly.");
      }

      // WOODEN MATH: Date + 42
      const pin = new Date().getDate() + 42;
      document.getElementById('the-number').innerText = pin;
      document.getElementById('pinArea').style.display = 'block';
      
      // Auto-fill
      document.getElementById('finalEmail').value = email;
      document.getElementById('finalPIN').value = pin;
    }

    function enter() {
      const pin = document.getElementById('finalPIN').value;
      const email = document.getElementById('finalEmail').value;
      const expected = new Date().getDate() + 42;

      if(parseInt(pin) === expected) {
        localStorage.setItem("cl_vip_pass", "true");
        localStorage.setItem("last_used_pin", pin);
        localStorage.setItem("user_email", email);
        window.location.href = "/australia/dashboard/index.html";
      } else {
        alert("Invalid PIN. Please use the Pink Box code.");
      }
    }
  </script>
</body>
</html>
