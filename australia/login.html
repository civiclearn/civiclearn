<!DOCTYPE html>
<html>
<head>
    <title>CivicLearn Australia Login</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.7.1/dist/umd/supabase.js"></script>
    <script>
        const supabase = window.supabase.createClient("https://htgliokekeaovdiafrgs.supabase.co", "sb_publishable_QWvR124i4h0hvQumyjBgDw_018SlMbp");
    </script>
</head>
<body style="font-family:sans-serif; background:#fdfaf5; text-align:center; padding-top:50px;">
    <div style="max-width:350px; margin:auto; background:white; padding:30px; border-radius:20px; border:2px solid #0288d1; box-shadow: 0 10px 30px rgba(0,0,0,0.05);">
        <h2 style="color:#d44270;">Step 1: Get PIN</h2>
        <input type="email" id="emailBox" placeholder="Your Email" style="width:100%; padding:12px; margin-bottom:10px; border:1px solid #ddd; border-radius:8px; box-sizing:border-box;">
        <button onclick="getPIN()" style="width:100%; padding:12px; background:#d44270; color:white; border:none; border-radius:8px; font-weight:bold; cursor:pointer;">Show My PIN</button>
        
        <h1 id="pinDisplay" style="display:none; color:#333; font-size:50px; margin:20px 0;">00</h1>

        <hr style="margin:20px 0; border:0; border-top:1px solid #eee;">

        <h2>Step 2: Enter</h2>
        <input type="text" id="pinInput" placeholder="Enter PIN here" style="width:100%; padding:12px; margin-bottom:10px; border:1px solid #ddd; border-radius:8px; box-sizing:border-box;">
        <button onclick="login()" style="width:100%; padding:12px; background:#0288d1; color:white; border:none; border-radius:8px; font-weight:bold; cursor:pointer;">Go to Dashboard</button>
    </div>

    <script>
        async function getPIN() {
            const email = document.getElementById('emailBox').value.trim().toLowerCase();
            if(!email) return alert("Please enter your email.");

            const { data, error } = await supabase.from('users').select('email').ilike('email', email).maybeSingle();
            
            if (data) {
                const pin = new Date().getDate() + 42;
                document.getElementById('pinDisplay').innerText = pin;
                document.getElementById('pinDisplay').style.display = 'block';
            } else {
                alert("Email not recognized. If you just purchased, please wait a moment and try again.");
            }
        }

        function login() {
            const entered = document.getElementById('pinInput').value;
            const correct = new Date().getDate() + 42;

            if (parseInt(entered) === correct) {
                localStorage.setItem("cl_vip_pass", "true");
                localStorage.setItem("last_used_pin", entered);
                window.location.href = "/australia/dashboard/index.html";
            } else {
                alert("That PIN doesn't match today's code. Please try again.");
            }
        }
    </script>
</body>
</html>
