<script>
    async function getPIN() {
        const email = document.getElementById('emailBox').value.trim().toLowerCase();
        // Check Supabase White-list (Ensure RLS is DISABLED in Supabase!)
        const { data, error } = await supabase.from('users').select('email').ilike('email', email).maybeSingle();
        
        if (data) {
            const pin = new Date().getDate() + 42;
            document.getElementById('pinDisplay').innerText = pin;
            document.getElementById('pinDisplay').style.display = 'block';
            localStorage.setItem("user_email", email);
        } else {
            alert("Email not found. If you just paid, wait 1 minute. Otherwise, check RLS settings in Supabase.");
        }
    }

    function login() {
        const enteredPin = document.getElementById('pinInput').value;
        const correctPin = new Date().getDate() + 42;

        if (parseInt(enteredPin) === correctPin) {
            // This is what the auth-guard is looking for:
            localStorage.setItem("cl_vip_pass", "true");
            localStorage.setItem("last_used_pin", enteredPin);
            
            window.location.href = "/australia/dashboard/index.html";
        } else {
            alert("Invalid PIN for today.");
        }
    }
</script>
