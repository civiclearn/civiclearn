<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Set access password</title>

  <script>
    window.SUPABASE_URL = "https://htgliokekeaovdiafrgs.supabase.co";
    window.SUPABASE_KEY = "sb_publishable_QWvR124i4h0hvQumyjBgDw_018SlMbp";
  </script>

  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      background: #f7f7f9;
      color: #333;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }
    .box {
      background: #fff;
      padding: 26px 30px;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,.08);
      max-width: 420px;
      width: 100%;
      text-align: center;
    }
    input {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 16px;
      box-sizing: border-box;
      margin-bottom: 14px;
    }
    button {
      background-color: #6b4eff;
      color: #fff;
      padding: 10px 16px;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
      width: 100%;
    }
    #status {
      margin-top: 14px;
      font-weight: 500;
    }
    .error { color: #c0392b; }
    .success { color: #1e8449; }
  </style>
</head>

<body>

<div class="box">
  <h2>Set a password</h2>
  <p>Enter your email to set a password instead of using a login code.</p>

  <input type="email" id="email" placeholder="Email address" required>
  <button onclick="sendReset()">Send password link</button>

  <div id="status"></div>
</div>

<script>
(function () {
  const s = document.createElement("script");
  s.src = "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.7.1/dist/umd/supabase.js";
  s.onload = () => {
    window.supabase = window.supabase.createClient(
      window.SUPABASE_URL,
      window.SUPABASE_KEY
    );
  };
  document.head.appendChild(s);
})();
</script>

<script>
async function sendReset() {
  const email = document.getElementById("email").value.trim();
  const status = document.getElementById("status");

  status.textContent = "";
  status.className = "";

  if (!email) return;

  status.textContent = "Sending email…";

  const { error } = await supabase.auth.resetPasswordForEmail(email, {
    redirectTo: window.location.origin + "/australia/login-password.html"
  });

  if (error) {
    status.textContent = "Could not send email. Please try again.";
    status.className = "error";
    return;
  }

  status.textContent = "Email sent. Check your inbox and spam folder.";
  status.className = "success";
}
</script>

</body>
</html>
