<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Login – CivicLearn Australia</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: Lexend, sans-serif;
      background: #fdfaf5;
      padding: 40px 20px;
    }
    .box {
      max-width: 420px;
      margin: auto;
      background: white;
      padding: 30px;
      border-radius: 22px;
      border: 2px solid #0288d1;
      box-shadow: 0 6px 20px rgba(0,0,0,0.06);
      display: none; /* shown only if not logged in */
    }
    h2 {
      margin-top: 0;
      text-align: center;
    }
    input {
      width: 100%;
      padding: 14px;
      margin-top: 14px;
      border-radius: 12px;
      border: 2px solid #eee;
      font-size: 15px;
    }
    button {
      width: 100%;
      margin-top: 18px;
      padding: 15px;
      border-radius: 14px;
      border: none;
      background: #0288d1;
      color: white;
      font-weight: 700;
      cursor: pointer;
      font-size: 15px;
    }
    .msg {
      margin-top: 14px;
      text-align: center;
      color: #c62828;
      font-weight: 600;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <div class="box" id="loginBox">
    <h2>Login</h2>

    <input
      id="email"
      type="email"
      placeholder="Email address"
      autocomplete="email"
    />

    <input
      id="code"
      type="password"
      placeholder="Access code"
    />

    <button onclick="login()">Enter</button>

    <div id="msg" class="msg"></div>
  </div>

<script>
(async function () {
  // If already authenticated, go straight in
  const res = await fetch("/functions/v1/bypass-verify", {
    credentials: "include"
  });

  if (res.ok) {
    window.location.replace("/australia/dashboard/index.html");
  } else {
    document.getElementById("loginBox").style.display = "block";
  }
})();

async function login() {
  const email = document.getElementById("email").value.trim().toLowerCase();
  const code  = document.getElementById("code").value.trim();
  const msg   = document.getElementById("msg");

  msg.textContent = "";

  if (!email || !code) {
    msg.textContent = "Please enter email and access code.";
    return;
  }

  const res = await fetch("/functions/v1/bypass-login", {
    method: "POST",
    credentials: "include",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      email: email,
      bypass_code: code
    })
  });

  if (res.ok) {
    window.location.replace("/australia/dashboard/index.html");
  } else {
    msg.textContent = "Invalid email or access code.";
  }
}
</script>

</body>
</html>
