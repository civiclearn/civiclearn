<head>

  <style>
    :root {
      --accent: #0B4EA2;
      --accent-hover: #08407f;
      --accent-soft: #e8efff;
      --accent-soft-border: #b8cfee;
    }
    .mylist-wrapper { max-width: 780px; margin-left:0; margin-right:auto; }
    .mylist-card { padding:14px; border:1px solid var(--border); border-radius:var(--radius-sm); margin-bottom:10px; background:var(--surface); }
    .mylist-question-row { display:flex; align-items:flex-start; gap:10px; }
    .mylist-question { font-size:14px; font-weight:500; line-height:1.4; flex:1; }
    .mylist-badge { font-size:11px; padding:3px 8px; border-radius:20px; background:var(--accent-soft); color:var(--accent); white-space:nowrap; font-weight:600; }
    .mylist-remove { font-size:0; color:var(--text-muted); background:transparent; border:none; cursor:pointer; padding:4px; line-height:1; }
    .mylist-remove::before { content:'✕'; font-size:13px; }
    .mylist-remove:hover { color:var(--wrong); }
    .mylist-options { display:flex; flex-direction:column; gap:5px; margin-top:8px; }
    .mylist-option { font-size:13px; text-align:left; padding:6px 12px; border-radius:8px; border:1px solid var(--border); background:var(--surface); cursor:pointer; transition:all 0.15s; font-family:var(--font); }
    .mylist-option:hover:not(:disabled) { background:var(--accent-soft); }
    .mylist-option.correct { background:var(--correct-bg); border-color:var(--correct); }
    .mylist-option.wrong { background:var(--wrong-bg); border-color:var(--wrong); }
    .mylist-option:disabled { cursor:default; opacity:0.95; }
    .mylist-header { display:flex; align-items:flex-start; justify-content:space-between; }
    .mylist-count { font-size:13px; color:var(--text-muted); margin-top:6px; }
    .mylist-footer { display:flex; justify-content:space-between; align-items:center; margin-top:14px; gap:12px; }
    .mylist-status { font-size:12px; color:var(--text-muted); }
    .mylist-controls { display:flex; gap:6px; }
    .mylist-page-btn { font-family:var(--font); font-size:12px; padding:5px 12px; border-radius:8px; border:1px solid var(--border); background:var(--surface); cursor:pointer; }
    .mylist-page-btn:hover:not(:disabled) { background:var(--accent-soft); border-color:var(--accent); }
    .mylist-page-btn:disabled { opacity:0.4; cursor:default; }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="/slovensko/assets/js/sk-auth.js"></script>
</head>

<script>
document.addEventListener("DOMContentLoaded", () => {
  const toggle = document.querySelector(".menu-toggle");
  const overlay = document.getElementById("menuOverlay");

  if (overlay) overlay.addEventListener("click", () => document.body.classList.remove("menu-open"));
});
</script>
