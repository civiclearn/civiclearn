<!doctype html>
<html lang="sk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Článok a písomný súhrn — CivicLearn</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

  <style>
    /* ========== Slovak accent override ========== */
    :root {
      --accent: #0B4EA2;
      --accent-hover: #08407f;
      --accent-soft: #e8efff;
      --accent-soft-border: #b8cfee;
    }

    /* ========== Layout ========== */
    .art-wrap { max-width: 820px; margin: 0 auto; padding: 0 20px; }

    /* ========== Phase: intro ========== */
    .art-intro-card {
      background: var(--surface, #fff);
      border: 1px solid var(--border, #e5e7eb);
      border-radius: 14px;
      padding: 28px 32px;
      margin-top: 16px;
    }
    .art-intro-card h1 {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin: 0 0 6px 0;
    }
    .art-intro-card .sub {
      color: var(--text-muted, #6b7280);
      font-size: 0.92rem;
      margin: 0 0 22px 0;
    }
    .art-steps {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 14px 18px;
      margin: 0 0 24px 0;
    }
    .art-step-num {
      width: 28px; height: 28px;
      border-radius: 50%;
      background: var(--accent-soft);
      color: var(--accent);
      font-weight: 700;
      font-size: 0.9rem;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .art-step-body { padding-top: 3px; }
    .art-step-title {
      font-weight: 600;
      font-size: 0.96rem;
      margin-bottom: 2px;
    }
    .art-step-text {
      color: var(--text-muted, #6b7280);
      font-size: 0.85rem;
      line-height: 1.5;
    }
    .art-legal-note {
      background: var(--accent-soft);
      border-left: 3px solid var(--accent);
      border-radius: 0 6px 6px 0;
      padding: 12px 14px;
      font-size: 0.82rem;
      color: var(--text-muted, #4b5563);
      margin-bottom: 20px;
      line-height: 1.5;
    }
    .art-btn-primary {
      display: block;
      width: 100%;
      padding: 14px 20px;
      border: none;
      border-radius: 10px;
      background: var(--accent);
      color: #fff;
      font-size: 1rem;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: background 0.15s;
    }
    .art-btn-primary:hover { background: var(--accent-hover); }
    .art-btn-primary:disabled { opacity: 0.5; cursor: default; }
    .art-btn-secondary {
      display: inline-block;
      padding: 10px 18px;
      border: 1px solid var(--border, #d1d5db);
      border-radius: 8px;
      background: transparent;
      color: var(--text, #1a1a1a);
      font-size: 0.9rem;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.15s;
      text-decoration: none;
    }
    .art-btn-secondary:hover {
      background: var(--accent-soft);
      border-color: var(--accent);
    }
    .art-skip-link {
      display: block;
      width: 100%;
      margin-top: 14px;
      padding: 8px;
      background: transparent;
      border: none;
      color: var(--text-muted, #6b7280);
      font-size: 0.85rem;
      font-family: inherit;
      cursor: pointer;
      text-decoration: underline;
      text-underline-offset: 3px;
      text-decoration-thickness: 1px;
      text-align: center;
    }
    .art-skip-link:hover { color: var(--accent); }

    .art-eval-elapsed {
      margin-top: 14px;
      font-family: ui-monospace, 'SF Mono', Menlo, monospace;
      font-size: 0.82rem;
      color: var(--text-muted, #9ca3af);
      font-variant-numeric: tabular-nums;
    }

    /* ========== Phase: read aloud ========== */
    .art-reading-container { margin-top: 16px; }
    .art-article {
      background: var(--surface, #fff);
      border: 1px solid var(--border, #e5e7eb);
      border-radius: 14px;
      padding: 28px 32px 24px;
      margin-bottom: 16px;
    }
    .art-article h2 {
      font-size: 1.35rem;
      font-weight: 700;
      line-height: 1.3;
      margin: 0 0 14px 0;
      letter-spacing: -0.015em;
    }
    .art-article .perex {
      font-size: 1.02rem;
      font-weight: 600;
      line-height: 1.55;
      margin: 0 0 18px 0;
      color: var(--text, #1a1a1a);
    }
    .art-article .body {
      font-size: 0.97rem;
      line-height: 1.7;
      color: var(--text, #1a1a1a);
    }
    .art-article .body p { margin: 0 0 14px 0; }
    .art-article .body p:last-child { margin-bottom: 0; }
    .art-article .body h3 {
      font-size: 1.05rem;
      font-weight: 700;
      margin: 22px 0 10px 0;
      letter-spacing: -0.01em;
    }
    .art-meta {
      font-size: 0.78rem;
      color: var(--text-muted, #9ca3af);
      text-transform: uppercase;
      letter-spacing: 0.03em;
      margin-bottom: 16px;
    }

    /* ========== Sticky record toolbar (inside reading view) ========== */
    .art-record-sticky {
      position: sticky;
      top: 0;
      z-index: 20;
      background: var(--surface, #fff);
      border: 1px solid var(--border, #e5e7eb);
      border-radius: 12px;
      padding: 10px 14px;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      box-shadow: 0 2px 8px rgba(15, 23, 42, 0.04);
      backdrop-filter: saturate(1.2);
    }
    .art-record-sticky-label {
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--text-muted, #6b7280);
      margin-right: auto;
    }
    .art-record-sticky-label-strong { color: var(--text, #1a1a1a); }

    .art-record-btn {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 8px 14px;
      border-radius: 22px;
      border: 1px solid var(--border, #d1d5db);
      background: var(--surface, #fff);
      color: var(--text, #1a1a1a);
      font-size: 0.88rem;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.15s;
      white-space: nowrap;
    }
    .art-record-btn:hover { background: var(--accent-soft); border-color: var(--accent); }
    .art-record-btn.recording {
      background: #fee2e2;
      border-color: #fca5a5;
      color: #991b1b;
    }
    .art-record-btn.recording:hover { background: #fecaca; }
    .art-record-btn.recording .art-rec-dot { animation: pulse 1.2s ease-in-out infinite; }
    .art-rec-dot {
      width: 9px; height: 9px;
      border-radius: 50%;
      background: #dc2626;
      flex-shrink: 0;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.45; transform: scale(1.25); }
    }
    .art-rec-timer {
      font-family: ui-monospace, 'SF Mono', Menlo, monospace;
      font-size: 0.9rem;
      color: var(--text-muted, #6b7280);
      font-variant-numeric: tabular-nums;
      min-width: 48px;
    }
    .art-rec-timer.active { color: #dc2626; }

    .art-rec-jump-link {
      background: none;
      border: none;
      color: var(--accent);
      font-size: 0.82rem;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 6px;
      text-decoration: none;
    }
    .art-rec-jump-link:hover { background: var(--accent-soft); }

    .art-record-error {
      background: #fee2e2;
      border: 1px solid #fca5a5;
      color: #991b1b;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 0.82rem;
      flex-basis: 100%;
      margin-top: 6px;
    }

    /* ========== Playback panel (at natural bottom position) ========== */
    .art-playback-panel {
      background: var(--surface, #fff);
      border: 1px solid var(--border, #e5e7eb);
      border-radius: 14px;
      padding: 20px 24px;
      margin-bottom: 16px;
    }
    .art-playback-title {
      font-size: 0.95rem;
      font-weight: 600;
      margin: 0 0 10px 0;
    }
    .art-playback-panel audio { width: 100%; margin-bottom: 10px; }
    .art-playback-actions {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
      margin-top: 4px;
    }
    .art-playback-rerecord {
      background: none;
      border: none;
      color: var(--accent);
      font-size: 0.85rem;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 6px;
      text-decoration: underline;
      text-underline-offset: 3px;
    }
    .art-playback-rerecord:hover { color: var(--accent-hover); background: var(--accent-soft); text-decoration: none; }
    .art-record-hint {
      font-size: 0.78rem;
      color: var(--text-muted, #9ca3af);
      font-style: italic;
      margin: 0;
      flex: 1;
      min-width: 180px;
    }

    .art-phase-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 14px;
      margin-top: 8px;
    }

    /* ========== Phase: write ========== */
    .art-writing-container { margin-top: 16px; }
    .art-ref-panel {
      background: var(--surface, #fff);
      border: 1px solid var(--border, #e5e7eb);
      border-radius: 14px;
      margin-bottom: 14px;
      overflow: hidden;
    }
    .art-ref-header {
      padding: 14px 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--accent-soft);
      border-bottom: 1px solid var(--accent-soft-border);
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--accent);
      user-select: none;
    }
    .art-ref-header:hover { background: #d7e2f7; }
    .art-ref-toggle {
      font-size: 0.85rem;
      transition: transform 0.2s;
    }
    .art-ref-panel.collapsed .art-ref-toggle { transform: rotate(-90deg); }
    .art-ref-body { padding: 22px 28px; max-height: 50vh; overflow-y: auto; }
    .art-ref-panel.collapsed .art-ref-body { display: none; }
    .art-ref-body h3.ref-title {
      font-size: 1.1rem;
      font-weight: 700;
      margin: 0 0 10px 0;
      line-height: 1.3;
    }
    .art-ref-body .ref-perex {
      font-weight: 600;
      font-size: 0.95rem;
      margin: 0 0 14px 0;
      line-height: 1.5;
    }
    .art-ref-body .ref-body {
      font-size: 0.92rem;
      line-height: 1.65;
    }
    .art-ref-body .ref-body p { margin: 0 0 10px 0; }
    .art-ref-body .ref-body h4 {
      font-size: 0.98rem;
      font-weight: 700;
      margin: 14px 0 8px 0;
    }

    .art-write-panel {
      background: var(--surface, #fff);
      border: 1px solid var(--border, #e5e7eb);
      border-radius: 14px;
      padding: 20px 24px 24px;
    }
    .art-write-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
      gap: 14px;
      flex-wrap: wrap;
    }
    .art-write-title {
      font-size: 1rem;
      font-weight: 600;
    }
    .art-timer {
      display: flex;
      align-items: center;
      gap: 6px;
      font-family: ui-monospace, 'SF Mono', Menlo, monospace;
      font-size: 0.95rem;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      color: var(--text-muted, #6b7280);
    }
    .art-timer.over { color: #dc2626; }
    .art-timer-icon {
      display: inline-block;
      width: 14px; height: 14px;
      border: 1.8px solid currentColor;
      border-radius: 50%;
      position: relative;
    }
    .art-timer-icon::before {
      content: '';
      position: absolute;
      top: 50%; left: 50%;
      width: 4px; height: 1.5px;
      background: currentColor;
      transform-origin: left center;
      transform: rotate(-30deg);
    }
    .art-textarea {
      width: 100%;
      min-height: 340px;
      padding: 14px 16px;
      border: 1.5px solid var(--border, #d1d5db);
      border-radius: 10px;
      font-family: inherit;
      font-size: 0.97rem;
      line-height: 1.65;
      resize: vertical;
      box-sizing: border-box;
    }
    .art-textarea:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-soft);
    }
    .art-write-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 14px;
      gap: 14px;
      flex-wrap: wrap;
    }
    .art-word-count {
      font-size: 0.82rem;
      color: var(--text-muted, #6b7280);
      font-variant-numeric: tabular-nums;
    }
    .art-word-count.low { color: #d97706; }
    .art-submit-btn {
      padding: 11px 24px;
      border: none;
      border-radius: 8px;
      background: var(--accent);
      color: #fff;
      font-size: 0.95rem;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: background 0.15s;
    }
    .art-submit-btn:hover:not(:disabled) { background: var(--accent-hover); }
    .art-submit-btn:disabled { opacity: 0.5; cursor: default; }

    /* ========== Phase: evaluating (loading) ========== */
    .art-eval-loading {
      text-align: center;
      padding: 80px 20px;
    }
    .art-spinner {
      width: 44px; height: 44px;
      border: 3px solid var(--accent-soft);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
      margin: 0 auto 18px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .art-eval-title {
      font-size: 1.05rem;
      font-weight: 600;
      margin-bottom: 6px;
    }
    .art-eval-sub {
      color: var(--text-muted, #6b7280);
      font-size: 0.88rem;
    }

    /* ========== Phase: results ========== */
    .art-results-hero {
      background: var(--surface, #fff);
      border: 1px solid var(--border, #e5e7eb);
      border-radius: 14px;
      padding: 32px;
      margin-top: 16px;
      margin-bottom: 14px;
      display: flex;
      gap: 32px;
      align-items: center;
      flex-wrap: wrap;
    }
    .art-grade-circle {
      width: 130px; height: 130px;
      border-radius: 50%;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      color: #fff;
      flex-shrink: 0;
    }
    .art-grade-circle.g1 { background: #16a34a; }
    .art-grade-circle.g2 { background: #65a30d; }
    .art-grade-circle.g3 { background: #d97706; }
    .art-grade-circle.g4 { background: #ea580c; }
    .art-grade-circle.g5 { background: #dc2626; }
    .art-grade-number {
      font-size: 3.4rem;
      font-weight: 700;
      line-height: 1;
      letter-spacing: -0.03em;
    }
    .art-grade-name {
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-top: 2px;
      opacity: 0.95;
    }
    .art-results-summary { flex: 1; min-width: 240px; }
    .art-results-heading {
      font-size: 1.1rem;
      font-weight: 700;
      margin: 0 0 4px 0;
    }
    .art-results-subtitle {
      color: var(--text-muted, #6b7280);
      font-size: 0.85rem;
      margin-bottom: 16px;
    }
    .art-dimensions {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }
    .art-dim {
      background: var(--accent-soft);
      border-radius: 10px;
      padding: 10px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .art-dim-name {
      font-size: 0.83rem;
      font-weight: 600;
      color: var(--text, #1a1a1a);
    }
    .art-dim-value {
      font-size: 1.1rem;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      min-width: 20px;
      text-align: center;
    }
    .art-dim-value.g1 { color: #16a34a; }
    .art-dim-value.g2 { color: #65a30d; }
    .art-dim-value.g3 { color: #d97706; }
    .art-dim-value.g4 { color: #ea580c; }
    .art-dim-value.g5 { color: #dc2626; }

    .art-feedback-block {
      background: var(--surface, #fff);
      border: 1px solid var(--border, #e5e7eb);
      border-radius: 14px;
      padding: 22px 28px;
      margin-bottom: 12px;
    }
    .art-feedback-title {
      font-size: 0.82rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      font-weight: 700;
      color: var(--accent);
      margin: 0 0 10px 0;
    }
    .art-feedback-text {
      font-size: 0.93rem;
      line-height: 1.65;
      color: var(--text, #1a1a1a);
      white-space: pre-wrap;
      margin: 0;
    }

    .art-results-actions {
      display: flex;
      gap: 12px;
      margin-top: 22px;
      flex-wrap: wrap;
    }

    /* ========== Error state ========== */
    .art-error-card {
      background: #fef2f2;
      border: 1px solid #fecaca;
      border-radius: 14px;
      padding: 24px 28px;
      margin-top: 16px;
    }
    .art-error-title {
      font-size: 1rem;
      font-weight: 700;
      color: #991b1b;
      margin: 0 0 6px 0;
    }
    .art-error-text {
      color: #7f1d1d;
      font-size: 0.9rem;
      line-height: 1.55;
      margin: 0 0 16px 0;
    }

    /* ========== Responsive ========== */
    @media (max-width: 640px) {
      .art-intro-card, .art-article, .art-playback-panel, .art-write-panel,
      .art-ref-body, .art-results-hero, .art-feedback-block { padding: 18px 20px; }
      .art-results-hero { gap: 20px; padding: 24px; }
      .art-grade-circle { width: 100px; height: 100px; }
      .art-grade-number { font-size: 2.7rem; }
      .art-dimensions { grid-template-columns: 1fr 1fr; }
    }
  </style>
</head>

  const MIN_SUBMIT_WORDS = 30;   // below this, submit button is disabled
  const EVAL_TIMEOUT_MS = 60_000; // client-side timeout for the eval fetch
  const LOCAL_ARTICLE_KEY = "sk_article_current"; // survives reload across phases

  // ---------- Supabase client ----------
  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
    auth: { persistSession: true, autoRefreshToken: true }
  });

  // ---------- App state ----------
  const state = {
    phase: "loading",       // loading | intro | reading | writing | evaluating | results | evalError | error
    article: null,          // the picked article
    articles: null,         // full pool (cached after first load)
    allArticlesSeen: false, // true when user has done all 300 and we're on a repeat
    session: null,
    recording: null,        // { blob, url, durationSec }
    writingStartedAt: null,
    pendingAttemptId: null, // set after insert, used for retry after eval failure
    evalElapsedInterval: null,
    result: null,           // eval row from DB
    errorMessage: null
  };

  const root = document.getElementById("appRoot");

  // ---------- Auth check ----------
  const { data: { session } } = await sb.auth.getSession();
  if (!session) {
    // No session — redirect to login (or show a message)
    root.innerHTML = `
      <div class="art-error-card">
        <p class="art-error-title">Musíte byť prihlásený</p>
        <p class="art-error-text">Pre prístup k tréningu článku sa prosím prihláste.</p>
        <a href="/slovensko/login.html" class="art-btn-secondary">Prihlásiť sa →</a>
      </div>`;
    return;
  }
  state.session = session;

  // ---------- Logout hookup ----------
  document.getElementById("logoutLink")?.addEventListener("click", async (e) => {
    e.preventDefault();
    await sb.auth.signOut();
    location.href = "/slovensko/login.html";
  });

  // ---------- Mobile menu ----------
  document.querySelector(".menu-toggle")?.addEventListener("click", () => {
    document.body.classList.toggle("menu-open");
  });
  document.getElementById("menuOverlay")?.addEventListener("click", () => {
    document.body.classList.remove("menu-open");
  });

  // ---------- Load articles & pick ----------
  try {
    const res = await fetch(ARTICLES_URL);
    if (!res.ok) throw new Error(`Nepodarilo sa načítať zoznam článkov (${res.status})`);
    const data = await res.json();
    state.articles = data.articles;
  } catch (e) {
    state.phase = "error";
    state.errorMessage = String(e.message || e);
    render();
    return;
  }

  // Fetch which articles the user has already attempted (any status)
  // so we prefer unseen articles. No unique constraint on (user, article)
  // so technically repeats are allowed — we just avoid them if possible.
  let seenIds = new Set();
  try {
    const { data: seenRows } = await sb
      .from("sk_article_attempts")
      .select("article_id")
      .eq("user_id", state.session.user.id);
    if (seenRows) {
      seenIds = new Set(seenRows.map(r => r.article_id));
    }
  } catch { /* non-fatal — if this fails we just pick from full pool */ }

  // Pick from unseen first; fall back to full pool if user has done all 300
  const unseen = state.articles.filter(a => !seenIds.has(a.id));
  const pool = unseen.length > 0 ? unseen : state.articles;
  state.article = pool[Math.floor(Math.random() * pool.length)];
  state.allArticlesSeen = unseen.length === 0 && state.articles.length > 0;

  state.phase = "intro";
  render();

  // ================================================================
  // RENDERING
  // ================================================================
  function render() {
    switch (state.phase) {
      case "intro": return renderIntro();
      case "reading": return renderReading();
      case "writing": return renderWriting();
      case "evaluating": return renderEvaluating();
      case "results": return renderResults();
      case "evalError": return renderEvalError();
      case "error": return renderError();
    }
  }

  // ---------- Intro ----------
  function renderIntro() {
    const allSeenBanner = state.allArticlesSeen ? `
      <div class="art-legal-note" style="background:#fef3c7; border-left-color:#d97706; color:#78350f;">
        Už ste vyskúšali všetkých ${state.articles.length} článkov. Budete dostávať opakovania — rovnako ako na reálnej skúške môžete dostať článok, ktorý poznáte z tréningu.
      </div>
    ` : "";

    root.innerHTML = `
      <div class="art-intro-card">
        <h1>Článok a písomný súhrn</h1>
        <p class="sub">Precvičte si druhú časť skúšky zo slovenského jazyka.</p>

        ${allSeenBanner}

        <div class="art-legal-note">
          Tento tréning simuluje bod <strong>b) a c)</strong> skúšky podľa § 8 ods. 6 zákona 40/1993 Z. z.: hlasné prečítanie náhodne vybraného článku (aspoň 500 slov) a napísanie jeho obsahu v časovom limite 30 minút.
        </div>

        <div class="art-steps">
          <div class="art-step-num">1</div>
          <div class="art-step-body">
            <div class="art-step-title">Prečítajte článok nahlas</div>
            <div class="art-step-text">Náhodne vybraný novinový článok. Môžete sa nahrať, aby ste si svoj prednes vypočuli. Nahrávka nie je hodnotená — komisia na skúške však bude počúvať, či viete plynulo čítať v slovenčine.</div>
          </div>

          <div class="art-step-num">2</div>
          <div class="art-step-body">
            <div class="art-step-title">Napíšte súhrn (30 minút)</div>
            <div class="art-step-text">Vlastnými slovami zhrňte obsah článku. Článok budete mať naďalej k dispozícii. Časomiera odráža reálny limit skúšky.</div>
          </div>

          <div class="art-step-num">3</div>
          <div class="art-step-body">
            <div class="art-step-title">Dostanete podrobné hodnotenie</div>
            <div class="art-step-text">Slovenskú školskú známku (1–5) v štyroch dimenziách: vernosť obsahu, úplnosť, jazyk, súdržnosť. Plus konkrétne odporúčania.</div>
          </div>
        </div>

        <button class="art-btn-primary" id="startBtn">Začať tréning</button>
        <button class="art-skip-link" id="skipToWriting" type="button">
          Preskočiť čítanie — prejsť priamo na písanie →
        </button>
      </div>
    `;

    document.getElementById("startBtn").addEventListener("click", () => {
      state.phase = "reading";
      render();
    });

    document.getElementById("skipToWriting").addEventListener("click", () => {
      state.phase = "writing";
      state.writingStartedAt = Date.now();
      render();
    });
  }

  // ---------- Reading (with optional audio) ----------
  function renderReading() {
    const a = state.article;
    const hasRecording = !!state.recording;

    root.innerHTML = `
      <div class="art-reading-container">
        <!-- Sticky toolbar — always visible while scrolling -->
        <div class="art-record-sticky" id="recStickyBar">
          <span class="art-record-sticky-label">
            ${hasRecording
              ? '<span class="art-record-sticky-label-strong">Nahrávka hotová</span>'
              : 'Nahrávanie <span style="opacity:0.6">(voliteľné)</span>'}
          </span>
          <button class="art-record-btn" id="recBtn">
            <span class="art-rec-dot"></span>
            <span id="recBtnLabel">${hasRecording ? 'Nahrať znovu' : 'Začať nahrávať'}</span>
          </button>
          <span class="art-rec-timer" id="recTimer">${hasRecording ? formatTime(state.recording.durationSec) : '00:00'}</span>
          ${hasRecording
            ? '<button class="art-rec-jump-link" id="jumpToPlayback">▶ Prehrať ↓</button>'
            : ''}
          <div id="recError"></div>
        </div>

        <div class="art-article">
          <div class="art-meta">Krok 1 z 3 · Čítanie nahlas</div>
          <h2>${escapeHtml(a.title)}</h2>
          <p class="perex">${escapeHtml(a.perex)}</p>
          <div class="body">${renderBody(a.body)}</div>
        </div>

        <!-- Playback panel — only shown if a recording exists -->
        ${hasRecording ? `
          <div class="art-playback-panel" id="playbackPanel">
            <div class="art-playback-title">Vaša nahrávka</div>
            <audio controls src="${state.recording.url}"></audio>
            <div class="art-playback-actions">
              <button class="art-playback-rerecord" id="rerecordBtn">Nahrať znovu</button>
              <p class="art-record-hint">Nahrávka nie je hodnotená — slúži len vám na kontrolu. Reálny článok z tlače obsahuje <strong>${a.word_count} slov</strong>.</p>
            </div>
          </div>
        ` : `
          <div style="margin-bottom:16px;">
            <p class="art-record-hint" style="margin:0;">Tip: môžete si čítanie nahrať pomocou tlačidla hore. Nahrávka nie je hodnotená — slúži len vám na kontrolu. Reálny článok z tlače obsahuje <strong>${a.word_count} slov</strong>.</p>
          </div>
        `}

        <div class="art-phase-nav">
          <button class="art-btn-secondary" id="backToIntro">← Naspäť</button>
          <button class="art-btn-primary" id="toWriting" style="width:auto; display:inline-block; padding:11px 24px;">
            Pokračovať k písaniu →
          </button>
        </div>
      </div>
    `;

    document.getElementById("backToIntro").addEventListener("click", () => {
      if (state.recording) cleanupRecording();
      state.phase = "intro";
      render();
    });

    document.getElementById("toWriting").addEventListener("click", () => {
      state.phase = "writing";
      state.writingStartedAt = Date.now();
      render();
    });

    // Smooth-scroll to playback panel when "Prehrať ↓" clicked
    const jumpBtn = document.getElementById("jumpToPlayback");
    if (jumpBtn) {
      jumpBtn.addEventListener("click", () => {
        const panel = document.getElementById("playbackPanel");
        if (panel) panel.scrollIntoView({ behavior: "smooth", block: "center" });
      });
    }

    // Re-record from playback panel: clear current, re-render, then auto-start
    const rerecordBtn = document.getElementById("rerecordBtn");
    if (rerecordBtn) {
      rerecordBtn.addEventListener("click", () => {
        cleanupRecording();
        render();
        // After re-render, the sticky bar is back in start-fresh mode.
        // Scroll to top so the user sees the button they're about to click.
        window.scrollTo({ top: 0, behavior: "smooth" });
      });
    }

    setupRecording();
  }

  // Audio recording ==============
  let mediaRecorder = null;
  let recordedChunks = [];
  let recTimerInterval = null;
  let recStartTime = 0;

  function setupRecording() {
    const btn = document.getElementById("recBtn");
    const label = document.getElementById("recBtnLabel");
    const timer = document.getElementById("recTimer");
    const errBox = document.getElementById("recError");

    // (Initial UI state for the case where a recording already exists
    //  is handled by the template in renderReading(). No imperative DOM
    //  setup needed here for that case.)

    btn.addEventListener("click", async () => {
      errBox.innerHTML = "";

      // Currently recording → stop
      if (btn.classList.contains("recording")) {
        mediaRecorder?.stop();
        return;
      }

      // Re-record: discard existing recording first.
      // We re-render after cleanup so the playback panel disappears.
      if (state.recording) {
        cleanupRecording();
        render();
        return; // new render will re-bind; this click's work is done
      }

      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        recordedChunks = [];
        mediaRecorder = new MediaRecorder(stream);
        mediaRecorder.ondataavailable = e => {
          if (e.data.size > 0) recordedChunks.push(e.data);
        };
        mediaRecorder.onstop = () => {
          const blob = new Blob(recordedChunks, { type: mediaRecorder.mimeType || "audio/webm" });
          const url = URL.createObjectURL(blob);
          const durationSec = Math.round((Date.now() - recStartTime) / 1000);
          state.recording = { blob, url, durationSec };

          // Stop mic
          stream.getTracks().forEach(t => t.stop());

          // Tear down recording-loop timer
          clearInterval(recTimerInterval);

          // Re-render: playback panel appears, sticky bar switches to "Nahrať znovu"
          render();
        };

        mediaRecorder.start();
        recStartTime = Date.now();
        btn.classList.add("recording");
        label.textContent = "Zastaviť nahrávanie";
        timer.textContent = "00:00";
        timer.classList.add("active");
        recTimerInterval = setInterval(() => {
          const s = Math.floor((Date.now() - recStartTime) / 1000);
          // Guard: if user navigated away mid-recording, element may be gone
          const t = document.getElementById("recTimer");
          if (!t) { clearInterval(recTimerInterval); return; }
          t.textContent = formatTime(s);
        }, 250);
      } catch (err) {
        errBox.innerHTML = `<div class="art-record-error">
          Nepodarilo sa získať prístup k mikrofónu. ${err?.name === "NotAllowedError"
            ? "V prehliadači ste zamietli povolenie na mikrofón."
            : "Skontrolujte, či je mikrofón pripojený."}
          Nahrávanie môžete preskočiť — nie je povinné.
        </div>`;
      }
    });
  }

  function cleanupRecording() {
    if (state.recording?.url) URL.revokeObjectURL(state.recording.url);
    state.recording = null;
    clearInterval(recTimerInterval);
  }

  function formatTime(totalSec) {
    const m = Math.floor(totalSec / 60);
    const s = totalSec % 60;
    return `${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`;
  }

  // ---------- Writing ----------
  function renderWriting() {
    const a = state.article;
    root.innerHTML = `
      <div class="art-writing-container">
        <div class="art-ref-panel" id="refPanel">
          <div class="art-ref-header" id="refHeader">
            <span>📄 Článok na referenciu — ${escapeHtml(a.title.slice(0, 80))}${a.title.length > 80 ? "…" : ""}</span>
            <span class="art-ref-toggle">▼</span>
          </div>
          <div class="art-ref-body">
            <h3 class="ref-title">${escapeHtml(a.title)}</h3>
            <p class="ref-perex">${escapeHtml(a.perex)}</p>
            <div class="ref-body">${renderBody(a.body, "h4")}</div>
          </div>
        </div>

        <div class="art-write-panel">
          <div class="art-write-header">
            <div class="art-write-title">Napíšte súhrn článku v slovenčine</div>
            <div class="art-timer" id="writeTimer">
              <span class="art-timer-icon"></span>
              <span id="writeTimerValue">30:00</span>
            </div>
          </div>

          <textarea class="art-textarea" id="summaryArea" placeholder="Vlastnými slovami zhrňte, o čom článok je. Sústreďte sa na hlavné body: kto, čo, kde, kedy, prečo. Nekopírujte vety z článku."></textarea>

          <div class="art-write-footer">
            <div class="art-word-count low" id="wordCount">0 slov</div>
            <button class="art-submit-btn" id="submitBtn" disabled>Odoslať súhrn</button>
          </div>
        </div>
      </div>
    `;

    // Ref panel collapse toggle
    document.getElementById("refHeader").addEventListener("click", () => {
      document.getElementById("refPanel").classList.toggle("collapsed");
    });

    // Timer
    let timerInterval = setInterval(() => {
      const elapsed = Math.floor((Date.now() - state.writingStartedAt) / 1000);
      const remaining = TIMER_SECONDS - elapsed;
      const t = document.getElementById("writeTimer");
      const v = document.getElementById("writeTimerValue");
      if (!v) { clearInterval(timerInterval); return; }
      if (remaining >= 0) {
        v.textContent = formatTime(remaining);
      } else {
        // Past 30 min — show overflow
        v.textContent = `+${formatTime(-remaining)}`;
        t.classList.add("over");
      }
    }, 500);

    // Word count
    const textarea = document.getElementById("summaryArea");
    const wc = document.getElementById("wordCount");
    const submitBtn = document.getElementById("submitBtn");

    textarea.addEventListener("input", () => {
      const words = countWords(textarea.value);
      wc.textContent = `${words} ${pluralSlov(words)}`;
      wc.classList.toggle("low", words < MIN_SUBMIT_WORDS);
      submitBtn.disabled = words < MIN_SUBMIT_WORDS;
    });
    textarea.focus();

    // Submit
    submitBtn.addEventListener("click", async () => {
      const summary = textarea.value.trim();
      if (countWords(summary) < MIN_SUBMIT_WORDS) return;

      const confirmed = confirm(
        "Odoslať súhrn na vyhodnotenie?\n\nPo odoslaní už súhrn nemôžete upraviť."
      );
      if (!confirmed) return;

      clearInterval(timerInterval);
      state.phase = "evaluating";
      render();
      await submitAndEvaluate(summary);
    });
  }

  function countWords(text) {
    return text.trim() ? text.trim().split(/\s+/).length : 0;
  }

  function pluralSlov(n) {
    if (n === 1) return "slovo";
    if (n >= 2 && n <= 4) return "slová";
    return "slov";
  }

  // ---------- Evaluating (loading) ----------
  function renderEvaluating() {
    root.innerHTML = `
      <div class="art-eval-loading">
        <div class="art-spinner"></div>
        <div class="art-eval-title">Hodnotenie prebieha…</div>
        <div class="art-eval-sub">AI číta váš súhrn a porovnáva ho s článkom. Zvyčajne to trvá 10–15 sekúnd.</div>
        <div class="art-eval-elapsed" id="evalElapsed">0 s</div>
      </div>
    `;

    // Live elapsed counter — so the spinner doesn't feel frozen
    const start = Date.now();
    if (state.evalElapsedInterval) clearInterval(state.evalElapsedInterval);
    state.evalElapsedInterval = setInterval(() => {
      const el = document.getElementById("evalElapsed");
      if (!el) { clearInterval(state.evalElapsedInterval); return; }
      const secs = Math.floor((Date.now() - start) / 1000);
      el.textContent = `${secs} s`;
    }, 1000);
  }

  async function submitAndEvaluate(summaryText) {
    try {
      // 1. Insert attempt row — this writes the user's summary to the DB
      //    so their work is never lost even if evaluation fails
      const { data: attempt, error: insertErr } = await sb
        .from("sk_article_attempts")
        .insert({
          user_id: state.session.user.id,
          article_id: state.article.id,
          summary_text: summaryText,
          writing_started_at: new Date(state.writingStartedAt).toISOString()
          // audio_url stays null — session-only playback
        })
        .select()
        .single();
      if (insertErr) throw new Error("Nepodarilo sa uložiť pokus: " + insertErr.message);

      state.pendingAttemptId = attempt.id;
      await evaluateWithTimeout(attempt.id);
    } catch (e) {
      clearInterval(state.evalElapsedInterval);
      state.phase = state.pendingAttemptId ? "evalError" : "error";
      state.errorMessage = String(e.message || e);
      render();
    }
  }

  async function evaluateWithTimeout(attemptId) {
    const controller = new AbortController();
    const timeoutId = setTimeout(() => controller.abort(), EVAL_TIMEOUT_MS);

    try {
      const evalRes = await fetch(EDGE_FN_URL, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "Authorization": `Bearer ${state.session.access_token}`,
          "apikey": SUPABASE_ANON_KEY
        },
        body: JSON.stringify({ attempt_id: attemptId }),
        signal: controller.signal
      });

      clearTimeout(timeoutId);
      clearInterval(state.evalElapsedInterval);

      if (!evalRes.ok) {
        const errText = await evalRes.text().catch(() => "");
        throw new Error(`Vyhodnotenie zlyhalo (${evalRes.status}). ${errText.slice(0, 180)}`);
      }
      const body = await evalRes.json();
      if (!body.attempt) throw new Error("Vyhodnotenie vrátilo prázdnu odpoveď.");
      state.result = body.attempt;

      // Update Language gauge cache so the sidebar reflects this new grade
      // immediately, on this page and on every other page the user visits.
      // Dashboard will recompute a more accurate running avg on next visit.
      if (window.CLSKGauge && body.attempt.grade_overall != null) {
        const score = Math.round((6 - body.attempt.grade_overall) * 20);
        window.CLSKGauge.updateLanguage(score, 1);
      }

      state.phase = "results";
      render();
    } catch (e) {
      clearTimeout(timeoutId);
      clearInterval(state.evalElapsedInterval);
      if (e.name === "AbortError") {
        throw new Error("Vyhodnotenie trvá neobvykle dlho. Môžete to skúsiť znovu alebo sa pozrieť do histórie neskôr — váš súhrn je v bezpečí uložený.");
      }
      throw e;
    }
  }

  // ---------- Eval error (with retry) ----------
  function renderEvalError() {
    root.innerHTML = `
      <div class="art-error-card">
        <p class="art-error-title">Vyhodnotenie sa nepodarilo</p>
        <p class="art-error-text">${escapeHtml(state.errorMessage || "")}</p>
        <p class="art-error-text" style="margin-top:10px; font-size: 0.85rem;">
          Váš súhrn je uložený v databáze. Môžete skúsiť vyhodnotenie znovu, alebo sa k nemu vrátiť neskôr cez históriu pokusov.
        </p>
        <div style="display:flex; gap:12px; flex-wrap:wrap; margin-top:4px;">
          <button class="art-btn-primary" id="retryEvalBtn" style="width:auto; display:inline-block; padding:11px 24px;">
            Skúsiť vyhodnotenie znovu
          </button>
          <a href="article-history.html" class="art-btn-secondary">Pozrieť neskôr v histórii</a>
          <a href="index.html" class="art-btn-secondary">Späť na prehľad</a>
        </div>
      </div>
    `;

    document.getElementById("retryEvalBtn").addEventListener("click", async () => {
      if (!state.pendingAttemptId) {
        state.phase = "error";
        state.errorMessage = "Nepodarilo sa nájsť ID pokusu na opakovanie.";
        render();
        return;
      }
      state.phase = "evaluating";
      render();
      try {
        await evaluateWithTimeout(state.pendingAttemptId);
      } catch (e) {
        state.phase = "evalError";
        state.errorMessage = String(e.message || e);
        render();
      }
    });
  }

  // ---------- Results ----------
  function renderResults() {
    const r = state.result;
    const GRADE_NAMES = {
      1: "Výborný", 2: "Chválitebný", 3: "Dobrý", 4: "Dostatočný", 5: "Nedostatočný"
    };

    root.innerHTML = `
      <div class="art-results-hero">
        <div class="art-grade-circle g${r.grade_overall}">
          <div class="art-grade-number">${r.grade_overall}</div>
          <div class="art-grade-name">${GRADE_NAMES[r.grade_overall]}</div>
        </div>
        <div class="art-results-summary">
          <h2 class="art-results-heading">Celkové hodnotenie</h2>
          <p class="art-results-subtitle">
            Celková známka zodpovedá najhoršej z dimenzií nižšie — tak ako to posudzuje skutočná komisia.
          </p>
          <div class="art-dimensions">
            ${renderDim("Vernosť obsahu", r.grade_fidelity)}
            ${renderDim("Úplnosť", r.grade_completeness)}
            ${renderDim("Jazyk", r.grade_language)}
            ${renderDim("Súdržnosť", r.grade_coherence)}
          </div>
        </div>
      </div>

      <div class="art-feedback-block">
        <p class="art-feedback-title">✓ Čo sa vám podarilo</p>
        <p class="art-feedback-text">${escapeHtml(r.feedback_captured || "")}</p>
      </div>

      <div class="art-feedback-block">
        <p class="art-feedback-title">⚠ Čo bolo nepresné alebo chýbalo</p>
        <p class="art-feedback-text">${escapeHtml(r.feedback_missed || "")}</p>
      </div>

      <div class="art-feedback-block">
        <p class="art-feedback-title">✎ Jazykové odporúčania</p>
        <p class="art-feedback-text">${escapeHtml(r.feedback_language || "")}</p>
      </div>

      <div class="art-results-actions">
        <a href="/slovensko/article.html" class="art-btn-primary" style="width:auto; display:inline-block; padding:11px 24px; text-decoration:none; text-align:center;">
          Skúsiť ďalší článok
        </a>
        <a href="/slovensko/index.html" class="art-btn-secondary">Späť na prehľad</a>
        <a href="/slovensko/article-history.html" class="art-btn-secondary">Pozrieť všetky pokusy</a>
      </div>
    `;
  }

  function renderDim(name, grade) {
    return `
      <div class="art-dim">
        <span class="art-dim-name">${name}</span>
        <span class="art-dim-value g${grade}">${grade}</span>
      </div>
    `;
  }

  // ---------- Error ----------
  function renderError() {
    root.innerHTML = `
      <div class="art-error-card">
        <p class="art-error-title">Niečo sa pokazilo</p>
        <p class="art-error-text">${escapeHtml(state.errorMessage || "Neznáma chyba.")}</p>
        <a href="/slovensko/article.html" class="art-btn-secondary">Skúsiť znovu</a>
      </div>
    `;
  }

  // ---------- Utilities ----------
  function escapeHtml(s) {
    return String(s ?? "").replace(/[&<>"']/g, c => ({
      "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;"
    }[c]));
  }

  /** Render article body: paragraphs separated by blank lines, ## lines become h3/h4 */
  function renderBody(body, headingTag = "h3") {
    return body.split(/\n\s*\n/).map(block => {
      const trimmed = block.trim();
      if (!trimmed) return "";
      if (trimmed.startsWith("## ")) {
        return `<${headingTag}>${escapeHtml(trimmed.slice(3).trim())}</${headingTag}>`;
      }
      return `<p>${escapeHtml(trimmed)}</p>`;
    }).join("");
  }
})();
</script>
<script src="/slovensko/assets/js/gauge-bar-sk.js"></script>
</body>
