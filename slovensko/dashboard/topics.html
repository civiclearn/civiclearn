<script>
document.addEventListener("DOMContentLoaded", () => {
  const cfg = window.CIVICEDGE_CONFIG || {};
  const container = document.getElementById("topicContainer");
  const startBtn = document.getElementById("startBtn");
  const selected = new Set();
  const bankPath = cfg.bank && cfg.bank.path;
  const lang = window.CIVICEDGE_LANG || "sk";

  const topicToMicros = {};

  // Slovak plural: 1 otázka, 2-4 otázky, 5+ otázok
  function pluralOtazok(n) {
    if (n === 1) return "otázka";
    if (n >= 2 && n <= 4) return "otázky";
    return "otázok";
  }

  async function loadBankTopics() {
    if (!bankPath) return [];
    try {
      const res = await fetch(bankPath);
      const raw = await res.json();
      return Array.isArray(raw) ? raw : (raw.questions || []);
    } catch (e) { return []; }
  }

  function isTopicMastered(topicCanon, bankQuestions, progress) {
    const qs = bankQuestions.filter(q => q.topic && q.topic.en === topicCanon);
    for (const q of qs) {
      const microKey = q.microtopic && typeof q.microtopic === "object" ? q.microtopic.en : "";
      const key = `${microKey}:${q.id}`;
      const entry = progress[key];
      if (!(entry && entry.correct === 1)) return false;
    }
    return qs.length > 0;
  }

  function getTopicProgress(topicCanon, bankQuestions, progress) {
    const qs = bankQuestions.filter(q => q.topic && q.topic.en === topicCanon);
    let mastered = 0;
    for (const q of qs) {
      const microKey = q.microtopic && typeof q.microtopic === "object" ? q.microtopic.en : "";
      const key = `${microKey}:${q.id}`;
      const entry = progress[key];
      if (entry && entry.correct === 1) mastered++;
    }
    return { mastered, total: qs.length };
  }

  async function initTopics() {
    const bankQuestions = await loadBankTopics();
    const progress = JSON.parse(localStorage.getItem("civicedge_progress") || "{}");

    const topics = {};
    bankQuestions.forEach(q => {
      if (!q.topic || typeof q.topic !== "object") return;
      const canon = q.topic.en;
      if (!canon) return;
      const label = q.topic[lang] || q.topic.en;
      const microCanon = q.microtopic && typeof q.microtopic === "object" ? q.microtopic.en : "";

      if (!topics[canon]) topics[canon] = { label, total: 0, micros: new Set() };
      topics[canon].total++;
      if (microCanon) topics[canon].micros.add(microCanon);
    });

    Object.entries(topics).forEach(([canon, t]) => {
      topicToMicros[canon] = Array.from(t.micros);
    });

    container.innerHTML = "";

    Object.entries(topics).forEach(([canon, topic]) => {
      const prog = getTopicProgress(canon, bankQuestions, progress);
      const pct = topic.total > 0 ? Math.round((prog.mastered / topic.total) * 100) : 0;
      const mastered = isTopicMastered(canon, bankQuestions, progress);

      const chip = document.createElement("button");
      chip.className = "topic-card";
      if (mastered) chip.classList.add("mastered");

      chip.innerHTML = `
        <div class="topic-card-name">${topic.label}</div>
        <div class="topic-card-meta">
          <span class="topic-card-count">${topic.total} ${pluralOtazok(topic.total)}</span>
          <span class="topic-card-pct">${pct}%</span>
        </div>
        <div class="topic-card-bar"><div class="topic-card-bar-fill" style="width:${pct}%"></div></div>
      `;

      chip.addEventListener("click", () => {
        chip.classList.toggle("active");
        if (chip.classList.contains("active")) {
          selected.add(canon);
        } else {
          selected.delete(canon);
        }
        startBtn.style.display = selected.size > 0 ? "inline-block" : "none";
        if (selected.size > 0 && window.innerWidth < 768) {
          setTimeout(() => startBtn.scrollIntoView({ behavior: "smooth", block: "center" }), 150);
        }
      });

      container.appendChild(chip);
    });

    startBtn.addEventListener("click", () => {
      const microKeys = [];
      selected.forEach(topicCanon => {
        if (topicToMicros[topicCanon]) microKeys.push(...topicToMicros[topicCanon]);
      });
      const limit = (cfg.topics && cfg.topics.questionCount) || 10;
      document.getElementById("quizArea").style.display = "block";
      document.querySelector("section").style.display = "none";
      CivicEdgeEngine.start("topics", { topics: microKeys, limit: limit });
      window.scrollTo({ top: 0, behavior: "smooth" });
    });
  }

  initTopics();

  const toggle = document.querySelector(".menu-toggle");
  const overlay = document.getElementById("menuOverlay");
  if (toggle) toggle.addEventListener("click", () => document.body.classList.toggle("menu-open"));
  if (overlay) overlay.addEventListener("click", () => document.body.classList.remove("menu-open"));
});
</script>
