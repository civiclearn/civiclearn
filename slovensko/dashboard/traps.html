      font-weight: 600;

<script>
document.addEventListener("DOMContentLoaded", async () => {
  const bankPath = window.CIVICEDGE_CONFIG?.bank?.path;
  if (!bankPath) return;
  let fullBank = [];
  try {
    const res = await fetch(bankPath);
    const raw = await res.json();
    fullBank = Array.isArray(raw) ? raw : (raw.questions || []);
  } catch { return; }

  /* TAB A: PERSONAL TRAPS */
  let progress = {};
  try { progress = JSON.parse(localStorage.getItem("civicedge_progress") || "{}"); } catch {}

  const trickyKeys = Object.keys(progress).filter(
    id => (progress[id].wrongs || 0) >= 3 && (progress[id].rights || 0) < 2
  );
  const normalizedSet = new Set(trickyKeys);
  const personalTraps = fullBank.filter(q => {
    const qKey = `${q.microtopic?.en || q.topic?.en || ""}:${q.id}`;
    return normalizedSet.has(qKey);
  });

  /* TAB B: 100 HARDEST (from tricky-sk.json) */
  let commonTraps = [];
  try {
    const res = await fetch("/slovensko/data/tricky-sk.json");
    if (res.ok) {
      const data = await res.json();
      const commonSet = new Set(data.questions || []);
      // Match on q.sk (multilingual {sk, en})
      commonTraps = fullBank.filter(q => {
        const qText = typeof q.q === "object" ? q.q.sk : q.q;
        return commonSet.has(qText);
      });
    }
  } catch (e) {
    console.warn("[Traps] Could not load tricky-sk.json:", e.message);
  }

  document.getElementById("mineCount").textContent = personalTraps.length;
  document.getElementById("commonCount").textContent = commonTraps.length;

  const quizArea = document.getElementById("quizArea");
  let activeTab = "mine";

  function startTab(tab) {
    activeTab = tab;
    document.querySelectorAll(".traps-tab").forEach(btn => {
      btn.classList.toggle("active", btn.dataset.tab === tab);
    });

    const bank = tab === "mine" ? personalTraps : commonTraps;

    if (bank.length === 0) {
      const emptyTitle = tab === "mine"
        ? "Zatiaľ žiadne časté chyby"
        : "Zatiaľ žiadne často chybné otázky";
      const emptyBody = tab === "mine"
        ? "Ešte nemáte dosť nesprávnych odpovedí. Pokračujte v precvičovaní a táto sekcia sa naplní."
        : "Táto funkcia sa aktivuje, keď nazbierame dosť používateľských dát. Pokračujte v precvičovaní!";

      quizArea.innerHTML = `
        <div class="ce-card">
          <h2>${emptyTitle}</h2>
          <p>${emptyBody}</p>
        </div>`;
      return;
    }

    quizArea.innerHTML = '<div id="quiz"></div>';
    CivicEdgeEngine.start("traps", {
      bank: bank,
      limit: 20,
      timed: false,
      simulation: false,
      recursive: false,
      showFeedback: true
    });
  }

  document.getElementById("trapsTabs").addEventListener("click", (e) => {
    const tab = e.target.closest(".traps-tab");
    if (!tab || tab.dataset.tab === activeTab) return;
    startTab(tab.dataset.tab);
  });

  startTab("mine");
});

document.addEventListener("DOMContentLoaded", () => {
  const toggle = document.querySelector(".menu-toggle");
  const overlay = document.getElementById("menuOverlay");
  if (toggle) toggle.addEventListener("click", () => document.body.classList.toggle("menu-open"));
  if (overlay) overlay.addEventListener("click", () => document.body.classList.remove("menu-open"));
});
</script>
