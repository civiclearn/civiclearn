<script>
document.addEventListener("DOMContentLoaded", async () => {
  const bankPath = window.CIVICEDGE_CONFIG?.bank?.path;
  if (!bankPath) return;
  let fullBank = [];
  try {
    const res = await fetch(bankPath);
    const raw = await res.json();
    fullBank = Array.isArray(raw) ? raw : (raw.questions || []);
  } catch { return; }

  let progress = {};
  try { progress = JSON.parse(localStorage.getItem("civicedge_progress") || "{}"); } catch {}

  const trickyKeys = Object.keys(progress).filter(
    id => (progress[id].wrongs || 0) >= 3 && (progress[id].rights || 0) < 2
  );
  const normalizedSet = new Set(trickyKeys);
  const personalTraps = fullBank.filter(q => {
    const qKey = `${q.microtopic?.en || q.topic?.en || ""}:${q.id}`;
    return normalizedSet.has(qKey);
  });

  const quizArea = document.getElementById("quizArea");

  if (personalTraps.length === 0) {
    quizArea.innerHTML = `
      <div class="ce-card">
        <h2>Zatiaľ žiadne časté chyby</h2>
        <p>Ešte nemáte dosť nesprávnych odpovedí. Pokračujte v precvičovaní a táto sekcia sa naplní.</p>
      </div>`;
    return;
  }

  quizArea.innerHTML = '<div id="quiz"></div>';
  CivicEdgeEngine.start("traps", {
    bank: personalTraps,
    limit: 20,
    timed: false,
    simulation: false,
    recursive: false,
    showFeedback: true
  });
});

document.addEventListener("DOMContentLoaded", () => {
  const toggle = document.querySelector(".menu-toggle");
  const overlay = document.getElementById("menuOverlay");
  if (toggle) toggle.addEventListener("click", () => document.body.classList.toggle("menu-open"));
  if (overlay) overlay.addEventListener("click", () => document.body.classList.remove("menu-open"));
});
</script>
