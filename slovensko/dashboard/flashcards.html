<head>
  <meta charset="utf-8">

  <meta name="apple-mobile-web-app-title" content="CivicLearn">
  <meta name="apple-mobile-web-app-capable" content="yes">

  <link rel="stylesheet" href="/slovensko/assets/css/civic-v2.css">
  <link rel="stylesheet" href="/slovensko/assets/css/test-v2.css">
  <link rel="stylesheet" href="/slovensko/assets/css/flashcards-v2.css">

  <style>
    :root {
      --accent: #0B4EA2;
      --accent-hover: #08407f;
      --accent-soft: #e8efff;
      --accent-soft-border: #b8cfee;
    }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="/slovensko/assets/js/sk-auth.js"></script>
</head>

<body class="test-page">

<button class="menu-toggle" aria-label="Menu">☰</button>

<div class="wrap">
  <aside class="sidebar">
    <div class="brand">
      CivicLearn®
      <svg class="flag-icon" viewBox="0 0 640 400" aria-label="Slovensko">
        <rect width="640" height="133" fill="#FFFFFF"/>
        <rect y="133" width="640" height="134" fill="#0B4EA2"/>
        <rect y="267" width="640" height="133" fill="#EE1C25"/>
      </svg>
    </div>
    <div class="sidebar-gauge">
      <div class="sidebar-gauge-header">
        <span class="sidebar-gauge-label">Znalosti</span>
        <span class="sidebar-gauge-score" id="clGaugeKnowledge">–</span>
      </div>
      <div class="sidebar-gauge-track">
        <div class="sidebar-gauge-fill" id="clGaugeKnowledgeFill"></div>
        <div class="sidebar-gauge-pass" id="clGaugeKnowledgePass"></div>
      </div>
    </div>
    <div class="sidebar-gauge" style="margin-top:10px;">
      <div class="sidebar-gauge-header">
        <span class="sidebar-gauge-label">Jazyk</span>
        <span class="sidebar-gauge-score" id="clGaugeLanguage">–</span>
      </div>
      <div class="sidebar-gauge-track">
        <div class="sidebar-gauge-fill" id="clGaugeLanguageFill"></div>
        <div class="sidebar-gauge-pass" id="clGaugeLanguagePass"></div>
      </div>
    </div>
    <nav class="nav">
      <a href="index.html">Prehľad</a>
      <a href="simulation.html">Simulácia testu</a>
      <a href="quick.html">Rýchly test</a>
      <a href="topics.html">Testy podľa témy</a>
      <a href="traps.html">Časté chyby</a>
      <a href="flashcards.html" class="active">Kartičky</a>
      <a href="article.html">Článok a súhrn</a>
      <div class="nav-sep"></div>
      <a href="pohovor-tipy.html">Tipy na pohovor</a>
      <a href="history.html">História</a>
      <a href="my-list.html">Môj zoznam</a>
      <a href="help.html">Pomoc</a>
      <a href="#" id="logoutLink">Odhlásiť</a>
    </nav>
    <div class="spacer"></div>
  </aside>
  <div class="overlay" id="menuOverlay"></div>

  <main class="flashcards-layout left">
    <header class="ce-header"><h1>Kartičky</h1></header>
    <section id="flashcardsApp">
      <div id="topicsWrapper" class="fc-topics-wrapper">
        <p class="muted">Vyberte témy, ktoré chcete precvičovať:</p>
        <div class="fc-segmented">
          <button id="fcAllTopics" class="active">Všetky témy</button>
          <button id="fcWeakTopics">Zamerať sa na slabé</button>
        </div>
        <div id="topicContainer" class="fc-topic-toggles"></div>
        <button id="startBtn" class="btn fc-btn-primary">Začať</button>
      </div>
      <div class="flashcard" id="card">
        <div class="card-inner">
          <div class="card-front" id="qText"></div>
          <div class="card-back" id="aText"></div>
        </div>
      </div>
      <div class="controls">
        <button id="flipBtn">Otočiť</button>
        <button id="knownBtn" class="primary">Viem to</button>
        <button id="againBtn">Ešte raz</button>
      </div>
      <div class="controls-row">
        <button id="fcPrev" class="fc-nav" aria-label="Predchádzajúca"><svg width="20" height="20" viewBox="0 0 20 20"><circle cx="10" cy="10" r="9" stroke="var(--accent)" stroke-width="2" fill="none"/><path d="M11 6 L7 10 L11 14" stroke="var(--accent)" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        <button id="fcNext" class="fc-nav" aria-label="Nasledujúca"><svg width="20" height="20" viewBox="0 0 20 20"><circle cx="10" cy="10" r="9" stroke="var(--accent)" stroke-width="2" fill="none"/><path d="M9 6 L13 10 L9 14" stroke="var(--accent)" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      </div>
      <div id="status" class="fc-status"></div>
    </section>
  </main>
</div>

<script src="/slovensko/assets/js/lang-bootstrap-sk.js"></script>
<script src="/slovensko/assets/js/config-sk.js"></script>
<script src="/slovensko/assets/js/engine-sk.js"></script>
<script src="/slovensko/assets/js/sync.js"></script>
<script src="/slovensko/assets/js/flashcards-sk.js"></script>

<script>
document.addEventListener("DOMContentLoaded", () => {
  const toggle = document.querySelector(".menu-toggle");
  const overlay = document.getElementById("menuOverlay");
  if (toggle) toggle.addEventListener("click", () => document.body.classList.toggle("menu-open"));
  if (overlay) overlay.addEventListener("click", () => document.body.classList.remove("menu-open"));
});
</script>

<script src="/slovensko/assets/js/gauge-bar-sk.js"></script>
<script src="/slovensko/assets/js/study-timer.js"></script>
<script src="/assets/js/maintenance-bar.js"></script>
<script src="/assets/js/signout.js"></script>
