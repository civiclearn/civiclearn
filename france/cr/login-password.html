<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Définir votre mot de passe</title>

  <script>
    window.SUPABASE_URL = "https://htgliokekeaovdiafrgs.supabase.co";
    window.SUPABASE_KEY = "sb_publishable_QWvR124i4h0hvQumyjBgDw_018SlMbp";
  </script>

  <style>
    * { box-sizing: border-box; }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      background: #f7f7f9;
      color: #333;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 16px;
    }

    .box {
      background: #fff;
      padding: 28px 30px;
      border-radius: 14px;
      box-shadow: 0 10px 30px rgba(0,0,0,.08);
      max-width: 420px;
      width: 100%;
      text-align: center;
    }

    h2 {
      margin-top: 0;
    }

    .form-group {
      margin-bottom: 18px;
    }

    /* ===== PASSWORD WRAPPER (HARDENED) ===== */
    .form-group.pwd-wrap {
      position: relative;
    }

    .form-group.pwd-wrap input {
      width: 100%;
      padding: 12px 96px 12px 12px; /* HARD SPACE FOR TOGGLE */
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
      line-height: 1.2;
    }

    .pwd-toggle {
      position: absolute;
      right: 16px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: #6b4eff;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      padding: 0;
      white-space: nowrap;
    }

    button.primary {
      background-color: #6b4eff;
      color: #fff;
      padding: 12px 16px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      width: 100%;
    }

    #status {
      margin-top: 14px;
      font-weight: 500;
    }

    .error { color: #c0392b; }
    .success { color: #1e8449; }
  </style>
</head>

<body>

  <!-- LOADING -->
  <div class="box" id="loading">
    <strong>Préparation de la définition du mot de passe…</strong>
  </div>

  <!-- FORM -->
  <div class="box" id="form" style="display:none;">
    <h2>Mot de passe</h2>
    <p>Définissez un mot de passe pour accéder à votre compte CivicLearn.</p>

    <div class="form-group pwd-wrap">
      <input
        type="password"
        id="password"
        placeholder="Mot de passe"
        minlength="6"
        autocomplete="new-password"
        required
      >
      <button type="button" class="pwd-toggle"
              onclick="togglePwd('password', this)">
        Afficher
      </button>
    </div>

    <div class="form-group pwd-wrap">
      <input
        type="password"
        id="confirm"
        placeholder="Confirmer le mot de passe"
        minlength="6"
        autocomplete="new-password"
        required
      >
      <button type="button" class="pwd-toggle"
              onclick="togglePwd('confirm', this)">
        Afficher
      </button>
    </div>

    <button class="primary" onclick="updatePassword()">
      Enregistrer le mot de passe
    </button>

    <div id="status"></div>
  </div>

<script>
/* Load Supabase */
(function () {
  const s = document.createElement("script");
  s.src = "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.7.1/dist/umd/supabase.js";
  s.onload = () => {
    window.sb = window.supabase.createClient(
      window.SUPABASE_URL,
      window.SUPABASE_KEY
    );

    window.sb.auth.onAuthStateChange((_event, session) => {
  if (!session?.user) return;
  document.getElementById("loading").style.display = "none";
  document.getElementById("form").style.display = "block";
});

window.sb.auth.getSession().then(({ data }) => {
  if (!data?.session?.user) return;
  document.getElementById("loading").style.display = "none";
  document.getElementById("form").style.display = "block";
});

  };
  document.head.appendChild(s);
})();
</script>

<script>
async function updatePassword() {
  const pwd = document.getElementById("password").value;
  const conf = document.getElementById("confirm").value;
  const status = document.getElementById("status");

  status.textContent = "";
  status.className = "";

  if (pwd.length < 6) {
    status.textContent = "Le mot de passe doit contenir au moins 6 caractères.";
    status.className = "error";
    return;
  }

  if (pwd !== conf) {
    status.textContent = "Les mots de passe ne correspondent pas.";
    status.className = "error";
    return;
  }

  status.textContent = "Enregistrement du mot de passe…";

  const { data, error } = await window.sb.auth.updateUser({ password: pwd });
  
    
  // ✅ NEW: log password-setup auto-login
try {
  const email = data?.user?.email;

  if (email) {
    await window.sb.from("login_history").insert({
      email: email.toLowerCase(),
      status: "success",
      method: "pw-set"
    });
  }
} catch (_) {
  // NEW: failure here does NOTHING — redirect still happens
}


  if (error) {
    status.textContent = "Une erreur est survenue. Veuillez réessayer.";
    status.className = "error";
    return;
  }

  status.textContent = "Mot de passe enregistré. Redirection…";
  status.className = "success";

const email = data?.user?.email;

localStorage.setItem("cl_auth", "ok");
localStorage.setItem("cl_login_at", Date.now().toString());

if (email) {
  localStorage.setItem("cl_email", email.toLowerCase());
}

const parts = location.pathname.split("/").filter(Boolean);
const base = "/" + parts.slice(0, -1).join("/");
location.replace(base + "/dashboard/");

}
</script>

<script>
function togglePwd(id, btn) {
  const input = document.getElementById(id);
  if (input.type === "password") {
    input.type = "text";
    btn.textContent = "Masquer";
  } else {
    input.type = "password";
    btn.textContent = "Afficher";
  }
}
</script>

</body>
</html>
