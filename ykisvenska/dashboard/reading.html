<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YKI - Textförståelse</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="/ykisvenska/assets/js/ykisvenska-auth.js?v=2"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/yki-styles.css">
  <style>
    body { font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, sans-serif; }
    
    .test-badge {
      display: inline-block;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 0.875rem;
      font-weight: 600;
      margin-bottom: 12px;
      letter-spacing: 0.5px;
    }
    
    .timer-box {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      background: #fff5f5;
      border: 2px solid #fc8181;
      padding: 12px 20px;
      border-radius: 12px;
      font-size: 1.1rem;
      font-weight: 600;
      color: #c53030;
      margin-top: 12px;
    }
    
    .timer-icon { font-size: 1.5rem; }
    
    #countdown-timer {
      font-family: 'Space Grotesk', monospace;
      font-size: 1.3rem;
      font-weight: 700;
      letter-spacing: 1px;
    }
    
    .timer-box.warning {
      background: #fffaf0; border-color: #ed8936; color: #c05621;
      animation: pulse 1s ease-in-out infinite;
    }
    
    .timer-box.critical {
      background: #fff5f5; border-color: #f56565; color: #c53030;
      animation: pulse 0.5s ease-in-out infinite;
    }
    
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.8; } }
    
    .card { padding: 1.75rem; }
    .card-title { font-size: 1.75rem; margin-bottom: 0.5rem; }
    .card-subtitle { font-size: 1rem; margin-bottom: 1rem; }
    
    .btn {
      font-family: 'Space Grotesk', sans-serif;
      padding: 14px 28px; border-radius: 10px; border: none;
      font-size: 1rem; font-weight: 600; cursor: pointer;
      transition: all 0.2s ease;
      display: inline-flex; align-items: center; gap: 8px;
    }
    .btn-secondary { background: #f7fafc; color: #2d3748; border: 2px solid #e2e8f0; }
    .btn-secondary:hover { background: #edf2f7; border-color: #cbd5e0; transform: translateY(-1px); }
    .btn-primary {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white; box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
    }
    .btn-primary:hover { box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4); transform: translateY(-2px); }
    .btn-primary:active, .btn-secondary:active { transform: translateY(0); }
    .btn-large { padding: 16px 32px; font-size: 1.05rem; }
    
    .nav-buttons {
      display: flex; gap: 16px; justify-content: space-between;
      margin-top: 2rem; padding-top: 2rem; border-top: 1px solid #e2e8f0;
    }
    
    .text-passage {
      background: #f7fafc; padding: 20px; border-left: 4px solid #667eea;
      border-radius: 8px; margin-bottom: 16px; line-height: 1.7; font-size: 0.95rem;
    }
  </style>
</head>
<body>

  <!-- Progress Header -->
  <div class="test-header">
    <div class="progress-container">
      <div class="progress-info">
        <span>Testprogress</span>
        <span id="progress-text">1/4 Delar</span>
      </div>
      <div class="progress-bar">
        <div class="progress-fill" id="progress-fill" style="width: 25%"></div>
      </div>
    </div>
  </div>

  <!-- Main Content -->
  <div class="container">
    
    <div class="card">
      <div class="test-badge" id="test-badge">YKI-XX</div>
      <h1 class="card-title">Textförståelse</h1>
      <p class="card-subtitle">Läs texterna noggrant och svara på frågorna.</p>
      <div class="timer-box" id="timer-display">
        <span class="timer-icon">⏱️</span>
        <div>
          <div style="font-size: 0.75rem; opacity: 0.8; margin-bottom: 2px;">Tid kvar:</div>
          <div id="countdown-timer">1:00:00</div>
        </div>
      </div>
      <div class="alert alert-info" style="margin-top: 1rem;">
        <strong>Instruktioner:</strong> Varje text har 5 flervalsfrågor. Välj det bästa svaret. Dina svar sparas automatiskt.
      </div>
    </div>

    <div id="tasks-container"></div>

    <div class="nav-buttons">
      <button class="btn btn-secondary" onclick="goToDashboard()">
        ← Tillbaka till panelen
      </button>
      <button class="btn" onclick="restartTest()" style="background: #ed8936; color: white; border: 2px solid #dd6b20;">
        🔄 Starta om testet
      </button>
      <button class="btn btn-primary btn-large" id="complete-btn" onclick="completeReading()">
        Slutför Textförståelse →
      </button>
    </div>

  </div>

  <div id="loading-overlay" class="loading-overlay" style="display: none;">
    <div class="spinner"></div>
  </div>

  <script src="../assets/js/yki-engine.js?v=1"></script>
  <script>
    let readingData = null;
    
    const urlParams = new URLSearchParams(window.location.search);
    const EXAM_ID = urlParams.get('exam') || 'yki-01';
    
    document.getElementById('test-badge').textContent = EXAM_ID.toUpperCase();
    
    window.addEventListener('DOMContentLoaded', async () => {
      try {
        YKIEngine.init(EXAM_ID);
        
        const response = await fetch(`../data/${EXAM_ID}-reading.json`);
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        
        readingData = await response.json();
        renderTasks();
        updateProgress();
        startTimer();
        
      } catch (error) {
        console.error('Error:', error);
        alert('Fel vid laddning av testet. Ladda om sidan.\n\n' + error.message);
      }
    });
    
    // ==========================================================================
    // RENDER TASKS
    // ==========================================================================
    
    function renderTasks() {
      const container = document.getElementById('tasks-container');
      container.innerHTML = '';
      
      readingData.tasks.forEach((task, taskIndex) => {
        const taskDiv = document.createElement('div');
        taskDiv.className = 'card task-container';
        
        taskDiv.innerHTML = `
          <div class="task-header">
            <h2 class="task-title">${task.title}</h2>
            <p class="task-instructions">${task.instructions || ''}</p>
          </div>
        `;
        
        // Text passage
        if (task.content && task.content.text) {
          const passageDiv = document.createElement('div');
          passageDiv.className = 'text-passage';
          passageDiv.innerHTML = task.content.text.replace(/\n/g, '<br>');
          taskDiv.appendChild(passageDiv);
        }
        
        // Questions (MCQ radio)
        const contentDiv = document.createElement('div');
        contentDiv.className = 'task-content';
        
        task.questions.forEach((question, qIndex) => {
          const questionDiv = document.createElement('div');
          questionDiv.className = 'question-block';
          
          const uniqueName = `${task.task_id}-${question.id}`;
          
          // Shuffle options (options can be strings or {text, id} objects)
          const shuffledOptions = shuffleArray([...question.options]);
          
          questionDiv.innerHTML = `
            <div class="question-prompt">${question.prompt}</div>
            <div class="options-container">
              ${shuffledOptions.map((option, oIdx) => {
                const optText = typeof option === 'string' ? option : option.text;
                const optValue = typeof option === 'string' ? option : (option.id || option.text);
                const escapedValue = optValue.replace(/"/g, '&quot;').replace(/'/g, '&#39;');
                return `
                  <label class="option-button">
                    <input type="radio" name="${uniqueName}" value="${escapedValue}"
                      data-question-id="${question.id}"
                      onchange="saveAnswer('${task.task_id}', '${question.id}', this.value)">
                    <span>${optText}</span>
                  </label>
                `;
              }).join('')}
            </div>
          `;
          
          contentDiv.appendChild(questionDiv);
          
          // Restore saved answer
          const savedAnswer = YKIEngine.currentTest.sections.reading.answers[uniqueName];
          if (savedAnswer) {
            const radios = questionDiv.querySelectorAll(`input[name="${uniqueName}"]`);
            radios.forEach(radio => {
              if (radio.value === savedAnswer) {
                radio.checked = true;
                radio.closest('.option-button').classList.add('selected');
              }
            });
          }
        });
        
        taskDiv.appendChild(contentDiv);
        container.appendChild(taskDiv);
      });
    }
    
    function shuffleArray(array) {
      const shuffled = [...array];
      for (let i = shuffled.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
      }
      return shuffled;
    }
    
    // ==========================================================================
    // SAVE ANSWER
    // ==========================================================================
    
    function saveAnswer(taskId, questionId, optionId) {
      const answerKey = `${taskId}-${questionId}`;
      
      // Update selected styling
      const uniqueName = `${taskId}-${questionId}`;
      document.querySelectorAll(`input[name="${uniqueName}"]`).forEach(r => {
        r.closest('.option-button').classList.remove('selected');
        if (r.checked) r.closest('.option-button').classList.add('selected');
      });
      
      YKIEngine.saveReadingAnswer(answerKey, optionId);
      console.log('Answer saved:', answerKey, optionId);
    }
    
    // ==========================================================================
    // TIMER (45 minutes for Reading)
    // ==========================================================================
    
    let timeRemaining = 60 * 60;
    let timerInterval = null;
    const TIMER_KEY = `yki_timer_${EXAM_ID}_reading`;
    
    function startTimer() {
      const savedTimer = localStorage.getItem(TIMER_KEY);
      
      if (savedTimer) {
        const timerData = JSON.parse(savedTimer);
        const elapsed = Math.floor((Date.now() - timerData.startTime) / 1000);
        timeRemaining = Math.max(0, timerData.totalTime - elapsed);
      } else {
        localStorage.setItem(TIMER_KEY, JSON.stringify({
          startTime: Date.now(), totalTime: timeRemaining
        }));
      }
      
      updateTimerDisplay();
      timerInterval = setInterval(() => {
        timeRemaining--;
        if (timeRemaining <= 0) {
          clearInterval(timerInterval);
          timeRemaining = 0;
          updateTimerDisplay();
          alert('⏰ Tiden är slut!\n\nDen officiella tiden för Textförståelse har gått ut.\n\nDu kan fortsätta svara eller gå vidare till nästa del.');
          return;
        }
        updateTimerDisplay();
      }, 1000);
    }
    
    function updateTimerDisplay() {
      const minutes = Math.floor(timeRemaining / 60);
      const seconds = timeRemaining % 60;
      const h = Math.floor(minutes / 60), m = minutes % 60;
      document.getElementById('countdown-timer').textContent = 
        `${h}:${m.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
      
      const timerBox = document.getElementById('timer-display');
      if (timeRemaining <= 300) { timerBox.classList.add('critical'); timerBox.classList.remove('warning'); }
      else if (timeRemaining <= 600) { timerBox.classList.add('warning'); }
      else { timerBox.classList.remove('warning', 'critical'); }
    }
    
    window.addEventListener('beforeunload', () => { if (timerInterval) clearInterval(timerInterval); });
    
    // ==========================================================================
    // COMPLETE READING
    // ==========================================================================
    
    function completeReading() {
      const totalQuestions = readingData.tasks.reduce((sum, task) => sum + task.questions.length, 0);
      const answeredCount = Object.keys(YKIEngine.currentTest.sections.reading.answers).length;
      
      if (answeredCount < totalQuestions) {
        const unanswered = totalQuestions - answeredCount;
        if (!confirm(`Du har ${unanswered} obesvarade frågor.\n\nÄr du säker på att du vill fortsätta?`)) return;
      }
      
      localStorage.removeItem(TIMER_KEY);
      if (timerInterval) clearInterval(timerInterval);
      
      document.getElementById('loading-overlay').style.display = 'flex';
      
      setTimeout(() => {
        const result = YKIEngine.completeReadingSection(readingData);
        document.getElementById('loading-overlay').style.display = 'none';
        console.log('✅ Reading completed:', result);
        
        // Navigate to LISTENING (next section)
        window.location.href = `listening.html?exam=${EXAM_ID}`;
      }, 500);
    }
    
    function goToDashboard() {
      if (confirm('Tillbaka till panelen? Dina framsteg sparas.')) {
        window.location.href = 'index.html';
      }
    }
    
    function restartTest() {
      if (!confirm('Starta om detta test?\n\nAlla framsteg raderas.\n\nDetta kan inte ångras.')) return;
      
      localStorage.removeItem(`yki_test_${EXAM_ID}`);
      localStorage.removeItem(`yki_timer_${EXAM_ID}_reading`);
      localStorage.removeItem(`yki_timer_${EXAM_ID}_listening`);
      localStorage.removeItem(`yki_timer_${EXAM_ID}_writing`);
      localStorage.removeItem(`yki_timer_${EXAM_ID}_speaking`);
      
      alert('✅ Testet har startats om!\n\nDu kan börja om.');
      window.location.href = 'index.html';
    }
    
    function updateProgress() {
      const progress = YKIEngine.getProgress();
      document.getElementById('progress-text').textContent = `${progress.completed}/4 Delar`;
      document.getElementById('progress-fill').style.width = `${progress.percentage}%`;
    }
  </script>

</body>
</html>
