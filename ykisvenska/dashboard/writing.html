<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YKI - Skriftlig framställning</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="/ykisvenska/assets/js/ykisvenska-auth.js?v=2"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/ykisvenska/assets/css/yki-styles.css">
  <style>
    body { font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, sans-serif; }
    
    .test-badge {
      display: inline-block;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white; padding: 6px 16px; border-radius: 20px;
      font-size: 0.875rem; font-weight: 600; margin-bottom: 12px; letter-spacing: 0.5px;
    }
    
    .timer-box {
      display: inline-flex; align-items: center; gap: 12px;
      background: #fff5f5; border: 2px solid #fc8181;
      padding: 12px 20px; border-radius: 12px;
      font-size: 1.1rem; font-weight: 600; color: #c53030; margin-top: 12px;
    }
    .timer-icon { font-size: 1.5rem; }
    #countdown-timer { font-family: 'Space Grotesk', monospace; font-size: 1.3rem; font-weight: 700; letter-spacing: 1px; }
    .timer-box.warning { background: #fffaf0; border-color: #ed8936; color: #c05621; animation: pulse 1s ease-in-out infinite; }
    .timer-box.critical { background: #fff5f5; border-color: #f56565; color: #c53030; animation: pulse 0.5s ease-in-out infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.8; } }
    
    .card { padding: 1.75rem; }
    .card-title { font-size: 1.75rem; margin-bottom: 0.5rem; }
    .card-subtitle { font-size: 1rem; margin-bottom: 1rem; }
    
    .btn {
      font-family: 'Space Grotesk', sans-serif; padding: 14px 28px; border-radius: 10px;
      border: none; font-size: 1rem; font-weight: 600; cursor: pointer;
      transition: all 0.2s ease; display: inline-flex; align-items: center; gap: 8px;
    }
    .btn-secondary { background: #f7fafc; color: #2d3748; border: 2px solid #e2e8f0; }
    .btn-secondary:hover { background: #edf2f7; border-color: #cbd5e0; transform: translateY(-1px); }
    .btn-primary {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white; box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
    }
    .btn-primary:hover { box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4); transform: translateY(-2px); }
    .btn-primary:active, .btn-secondary:active { transform: translateY(0); }
    .btn-large { padding: 16px 32px; font-size: 1.05rem; }
    
    .nav-buttons {
      display: flex; gap: 16px; justify-content: space-between;
      margin-top: 2rem; padding-top: 2rem; border-top: 1px solid #e2e8f0;
    }
    
    .writing-textarea {
      width: 100%; min-height: 250px; padding: 16px;
      border: 2px solid #e2e8f0; border-radius: 10px;
      font-family: 'Space Grotesk', sans-serif; font-size: 1rem;
      line-height: 1.6; resize: vertical; transition: border-color 0.2s;
    }
    .writing-textarea:focus { outline: none; border-color: #667eea; box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1); }
    
    .word-count { margin-top: 8px; font-size: 0.9rem; font-weight: 600; color: #4a5568; text-align: right; }
    .word-count.warning { color: #d69e2e; }
    .word-count.error { color: #e53e3e; }
    
    .writing-context, .writing-message {
      background: #f7fafc; padding: 16px; border-left: 4px solid #667eea;
      border-radius: 8px; margin-bottom: 12px; line-height: 1.6;
    }
    .textarea-container { margin-top: 16px; }
  </style>
</head>
<body>

  <div class="test-header">
    <div class="progress-container">
      <div class="progress-info">
        <span>Testprogress</span>
        <span id="progress-text">3/4 Delar</span>
      </div>
      <div class="progress-bar">
        <div class="progress-fill" id="progress-fill" style="width: 75%"></div>
      </div>
    </div>
  </div>

  <div class="container">
    
    <div class="card">
      <div class="test-badge" id="test-badge">YKI-XX</div>
      <h1 class="card-title">Skriftlig framställning</h1>
      <p class="card-subtitle">Skriv svar på alla tre uppgifter.</p>
      <div class="timer-box" id="timer-display">
        <span class="timer-icon">⏱️</span>
        <div>
          <div style="font-size: 0.75rem; opacity: 0.8; margin-bottom: 2px;">Tid kvar:</div>
          <div id="countdown-timer">0:55:00</div>
        </div>
      </div>
      <div class="alert alert-info" style="margin-top: 1rem;">
        <strong>Instruktioner:</strong> Respektera ordgränserna som anges. 
        Din text utvärderas av AI enligt officiella YKI-kriterier.
      </div>
    </div>

    <div id="tasks-container"></div>

    <div class="nav-buttons">
      <button class="btn btn-secondary" onclick="goBack()">← Tillbaka till Talförståelse</button>
      <button class="btn" onclick="restartTest()" style="background: #ed8936; color: white; border: 2px solid #dd6b20;">
        🔄 Starta om testet
      </button>
      <button class="btn btn-primary btn-large" id="complete-btn" onclick="completeWriting()">
        Slutför Skrivning →
      </button>
    </div>

  </div>

  <div id="loading-overlay" class="loading-overlay" style="display: none;"><div class="spinner"></div></div>

  <script src="/ykisvenska/assets/js/yki-engine.js?v=1"></script>
  <script>
    let writingData = null;
    
    const urlParams = new URLSearchParams(window.location.search);
    const EXAM_ID = urlParams.get('exam') || 'yki-01';
    
    document.getElementById('test-badge').textContent = EXAM_ID.toUpperCase();
    
    window.addEventListener('DOMContentLoaded', async () => {
      try {
        YKIEngine.init(EXAM_ID);
        
        const response = await fetch(`../data/${EXAM_ID}-writing.json`);
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        
        writingData = await response.json();
        renderTasks();
        updateProgress();
        startTimer();
        
      } catch (error) {
        console.error('Error:', error);
        alert('Fel vid laddning av testet.\n\n' + error.message);
      }
    });
    
    function renderTasks() {
      const container = document.getElementById('tasks-container');
      container.innerHTML = '';
      
      writingData.tasks.forEach((task, taskIndex) => {
        const taskDiv = document.createElement('div');
        taskDiv.className = 'card task-container';
        
        taskDiv.innerHTML = `
          <div class="task-header">
            <h2 class="task-title">${task.title}</h2>
            <p class="task-instructions">${task.instructions}</p>
          </div>
        `;
        
        const contentDiv = document.createElement('div');
        contentDiv.className = 'task-content';
        
        // Writing Prompt
        const promptDiv = document.createElement('div');
        promptDiv.className = 'writing-prompt';
        
        if (task.prompt && task.prompt.context) {
          promptDiv.innerHTML += `<div class="writing-context">${task.prompt.context}</div>`;
        }
        if (task.prompt && task.prompt.topic) {
          promptDiv.innerHTML += `<div class="writing-context"><strong>Ämne:</strong> ${task.prompt.topic}</div>`;
        }
        if (task.prompt && typeof task.prompt === 'string') {
          promptDiv.innerHTML += `<div class="writing-context">${task.prompt}</div>`;
        }
        
        contentDiv.appendChild(promptDiv);
        
        // Word count constraints
        const constraintsDiv = document.createElement('div');
        constraintsDiv.className = 'alert alert-warning';
        constraintsDiv.innerHTML = `
          <strong>Ordgränser:</strong> 
          Minst ${task.constraints.min_words} ord, 
          max ${task.constraints.max_words} ord.
        `;
        contentDiv.appendChild(constraintsDiv);
        
        // Textarea
        const textareaContainer = document.createElement('div');
        textareaContainer.className = 'textarea-container';
        
        const textarea = document.createElement('textarea');
        textarea.className = 'writing-textarea';
        textarea.id = `textarea-${task.task_id}`;
        textarea.placeholder = 'Skriv ditt svar här...';
        textarea.setAttribute('data-task-id', task.task_id);
        textarea.setAttribute('data-min-words', task.constraints.min_words);
        textarea.setAttribute('data-max-words', task.constraints.max_words);
        
        // Restore saved text
        const savedText = YKIEngine.currentTest.sections.writing.responses[task.task_id];
        if (savedText) textarea.value = savedText;
        
        textarea.addEventListener('input', () => {
          updateWordCount(task.task_id);
          saveText(task.task_id);
        });
        
        textareaContainer.appendChild(textarea);
        
        const wordCountDiv = document.createElement('div');
        wordCountDiv.className = 'word-count';
        wordCountDiv.id = `word-count-${task.task_id}`;
        wordCountDiv.textContent = '0 ord';
        
        textareaContainer.appendChild(wordCountDiv);
        contentDiv.appendChild(textareaContainer);
        taskDiv.appendChild(contentDiv);
        container.appendChild(taskDiv);
        
        updateWordCount(task.task_id);
      });
    }
    
    function countWords(text) {
      if (!text || text.trim() === '') return 0;
      return text.trim().split(/\s+/).length;
    }
    
    function updateWordCount(taskId) {
      const textarea = document.getElementById(`textarea-${taskId}`);
      const wordCountDiv = document.getElementById(`word-count-${taskId}`);
      if (!textarea || !wordCountDiv) return;
      
      const wc = countWords(textarea.value);
      const minW = parseInt(textarea.getAttribute('data-min-words'));
      const maxW = parseInt(textarea.getAttribute('data-max-words'));
      
      wordCountDiv.textContent = `${wc} ord`;
      wordCountDiv.classList.remove('warning', 'error');
      
      if (wc < minW) { wordCountDiv.classList.add('warning'); wordCountDiv.textContent += ` (minst: ${minW})`; }
      else if (wc > maxW) { wordCountDiv.classList.add('error'); wordCountDiv.textContent += ` (max: ${maxW})`; }
    }
    
    function saveText(taskId) {
      const textarea = document.getElementById(`textarea-${taskId}`);
      if (!textarea) return;
      YKIEngine.saveWritingResponse(taskId, textarea.value);
    }
    
    // Timer (45 minutes)
    let timeRemaining = 55 * 60;
    let timerInterval = null;
    const TIMER_KEY = `yki_timer_${EXAM_ID}_writing`;
    
    function startTimer() {
      const savedTimer = localStorage.getItem(TIMER_KEY);
      if (savedTimer) {
        const td = JSON.parse(savedTimer);
        const elapsed = Math.floor((Date.now() - td.startTime) / 1000);
        timeRemaining = Math.max(0, td.totalTime - elapsed);
      } else {
        localStorage.setItem(TIMER_KEY, JSON.stringify({ startTime: Date.now(), totalTime: timeRemaining }));
      }
      updateTimerDisplay();
      timerInterval = setInterval(() => {
        timeRemaining--;
        if (timeRemaining <= 0) {
          clearInterval(timerInterval); timeRemaining = 0; updateTimerDisplay();
          alert('⏰ Tiden är slut!\n\nDen officiella tiden för Skrivning har gått ut.\n\nDu kan fortsätta skriva eller gå vidare.');
          return;
        }
        updateTimerDisplay();
      }, 1000);
    }
    
    function updateTimerDisplay() {
      const m = Math.floor(timeRemaining / 60), s = timeRemaining % 60;
      document.getElementById('countdown-timer').textContent = `0:${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`;
      const tb = document.getElementById('timer-display');
      if (timeRemaining <= 300) { tb.classList.add('critical'); tb.classList.remove('warning'); }
      else if (timeRemaining <= 600) { tb.classList.add('warning'); }
      else { tb.classList.remove('warning', 'critical'); }
    }
    
    window.addEventListener('beforeunload', () => { if (timerInterval) clearInterval(timerInterval); });
    
    function completeWriting() {
      let allValid = true;
      const errors = [];
      
      writingData.tasks.forEach(task => {
        const textarea = document.getElementById(`textarea-${task.task_id}`);
        const text = textarea.value.trim();
        const wc = countWords(text);
        
        if (text === '') {
          allValid = false; errors.push(`${task.title}: Ingen text skriven.`);
        } else if (wc < task.constraints.min_words) {
          allValid = false; errors.push(`${task.title}: Texten är för kort (${wc} ord, minst ${task.constraints.min_words}).`);
        } else if (wc > task.constraints.max_words) {
          allValid = false; errors.push(`${task.title}: Texten är för lång (${wc} ord, max ${task.constraints.max_words}).`);
        }
      });
      
      if (!allValid) { alert('Vänligen korrigera följande:\n\n' + errors.join('\n')); return; }
      
      if (!confirm('Är du säker på att du vill skicka in dina svar?\n\nTexterna utvärderas av AI enligt YKI-kriterierna.')) return;
      
      localStorage.removeItem(TIMER_KEY);
      if (timerInterval) clearInterval(timerInterval);
      
      YKIEngine.completeWritingSection();
      console.log('✅ Writing completed');
      
      window.location.href = `speaking.html?exam=${EXAM_ID}`;
    }
    
    function goBack() {
      if (confirm('Tillbaka till Talförståelse? Dina framsteg sparas.')) {
        window.location.href = `listening.html?exam=${EXAM_ID}`;
      }
    }
    
    function restartTest() {
      if (!confirm('Starta om detta test?\n\nAlla framsteg raderas.\n\nDetta kan inte ångras.')) return;
      localStorage.removeItem(`yki_test_${EXAM_ID}`);
      ['reading','listening','writing','speaking'].forEach(s => localStorage.removeItem(`yki_timer_${EXAM_ID}_${s}`));
      alert('✅ Testet har startats om!');
      window.location.href = 'index.html';
    }
    
    function updateProgress() {
      const p = YKIEngine.getProgress();
      document.getElementById('progress-text').textContent = `${p.completed}/4 Delar`;
      document.getElementById('progress-fill').style.width = `${p.percentage}%`;
    }
  </script>

</body>
</html>
