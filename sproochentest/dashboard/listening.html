<!DOCTYPE html>
<html lang="lb">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sproochentest — Héierverstoen</title>
  <script src="/assets/js/auth-guard-sproochentest.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/yki-styles.css">
  <style>
    body { font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, sans-serif; }
    
    .test-badge {
      display: inline-block;
      background: linear-gradient(135deg, #d4145a 0%, #fbb03b 100%);
      color: white; padding: 6px 16px; border-radius: 20px;
      font-size: 0.875rem; font-weight: 600; margin-bottom: 12px; letter-spacing: 0.5px;
    }
    
    .timer-box {
      display: inline-flex; align-items: center; gap: 12px;
      background: #fff5f5; border: 2px solid #fc8181;
      padding: 12px 20px; border-radius: 12px;
      font-size: 1.1rem; font-weight: 600; color: #c53030; margin-top: 12px;
    }
    .timer-icon { font-size: 1.5rem; }
    #countdown-timer { font-family: 'Space Grotesk', monospace; font-size: 1.3rem; font-weight: 700; letter-spacing: 1px; }
    .timer-box.warning { background: #fffaf0; border-color: #ed8936; color: #c05621; animation: pulse 1s ease-in-out infinite; }
    .timer-box.critical { background: #fff5f5; border-color: #f56565; color: #c53030; animation: pulse 0.5s ease-in-out infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.8; } }
    
    .card { padding: 1.75rem; }
    .card-title { font-size: 1.75rem; margin-bottom: 0.5rem; }
    .card-subtitle { font-size: 1rem; margin-bottom: 1rem; }
    
    .btn {
      font-family: 'Space Grotesk', sans-serif; padding: 14px 28px; border-radius: 10px;
      border: none; font-size: 1rem; font-weight: 600; cursor: pointer;
      transition: all 0.2s ease; display: inline-flex; align-items: center; gap: 8px;
    }
    .btn-secondary { background: #f7fafc; color: #2d3748; border: 2px solid #e2e8f0; }
    .btn-secondary:hover { background: #edf2f7; border-color: #cbd5e0; transform: translateY(-1px); }
    .btn-primary {
      background: linear-gradient(135deg, #d4145a 0%, #fbb03b 100%);
      color: white; box-shadow: 0 4px 12px rgba(212, 20, 90, 0.3);
    }
    .btn-primary:hover { box-shadow: 0 6px 20px rgba(212, 20, 90, 0.4); transform: translateY(-2px); }
    .btn-primary:active, .btn-secondary:active { transform: translateY(0); }
    .btn-large { padding: 16px 32px; font-size: 1.05rem; }
    
    .nav-buttons {
      display: flex; gap: 16px; justify-content: space-between; flex-wrap: wrap;
      margin-top: 2rem; padding-top: 2rem; border-top: 1px solid #e2e8f0;
    }
    
    .audio-container {
      margin: 1.5rem 0; padding: 1.5rem;
      background: linear-gradient(135deg, #f7fafc 0%, #edf2f7 100%);
      border-radius: 12px; border: 2px solid #e2e8f0;
    }
    .audio-player { width: 100%; height: 48px; border-radius: 8px; }
  </style>
</head>
<body>

  <div class="test-header">
    <div class="progress-container">
      <div class="progress-info">
        <span>Testfortschrëtt</span>
        <span id="progress-text">1/2 Deeler</span>
      </div>
      <div class="progress-bar">
        <div class="progress-fill" id="progress-fill" style="width: 50%"></div>
      </div>
    </div>
  </div>

  <div class="container">
    
    <div class="card">
      <div class="test-badge" id="test-badge">TEST XX</div>
      <h1 class="card-title">Héierverstoen</h1>
      <p class="card-subtitle">Lauschtert gutt no an äntwert d'Froen.</p>
      <div class="timer-box" id="timer-display">
        <span class="timer-icon">⏱️</span>
        <div>
          <div style="font-size: 0.75rem; opacity: 0.8; margin-bottom: 2px;">Zäit iwwreg:</div>
          <div id="countdown-timer">0:30:00</div>
        </div>
      </div>
      <div class="alert alert-info" style="margin-top: 1rem;">
        <strong>Instruktiounen:</strong> Dir kënnt all Audio <strong>bis zu 2 Mol</strong> lauschteren 
        (wéi am offizielle Sproochentest). Är Äntwerten ginn automatesch gespäichert.
      </div>
    </div>

    <div id="tasks-container"></div>

    <div class="nav-buttons">
      <button class="btn btn-secondary" onclick="goBack()">← Zréck zum Schwätzen</button>
      <button class="btn" onclick="restartTest()" style="background: #ed8936; color: white; border: 2px solid #dd6b20;">
        🔄 Test nei starten
      </button>
      <button class="btn btn-primary btn-large" id="complete-btn" onclick="completeListeningAndSubmit()">
        Test ofschécken →
      </button>
    </div>

  </div>

  <div id="loading-overlay" class="loading-overlay" style="display: none;">
    <div style="text-align: center;">
      <div class="spinner"></div>
      <p id="loading-text" style="color: #4a5568; font-weight: 600; margin-top: 1rem; font-family: 'Space Grotesk', sans-serif;">
        Test gëtt ofgeschéckt...
      </p>
    </div>
  </div>

  <script src="../assets/js/sproochentest-engine.js"></script>
  <script>
    let listeningData = null;
    
    const urlParams = new URLSearchParams(window.location.search);
    const EXAM_ID = urlParams.get('exam') || 'sproochentest-01';
    
    document.getElementById('test-badge').textContent = EXAM_ID.replace('sproochentest-', 'Test ').replace(/^Test 0/, 'Test ');
    
    window.addEventListener('DOMContentLoaded', async () => {
      try {
        SproochEngine.init(EXAM_ID);
        
        const response = await fetch(`../data/${EXAM_ID}-listening.json`);
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        
        listeningData = await response.json();
        renderTasks();
        updateProgress();
        startTimer();
        
      } catch (error) {
        console.error('Error:', error);
        alert('Feeler beim Lueden vum Test.\n\n' + error.message);
      }
    });
    
    function renderTasks() {
      const container = document.getElementById('tasks-container');
      container.innerHTML = '';
      
      listeningData.tasks.forEach((task, taskIndex) => {
        const taskDiv = document.createElement('div');
        taskDiv.className = 'card task-container';
        
        taskDiv.innerHTML = `
          <div class="task-header">
            <h2 class="task-title">${task.title}</h2>
            <p class="task-instructions">${task.instructions || ''}</p>
          </div>
        `;
        
        // Audio Player
        const audioDiv = document.createElement('div');
        audioDiv.className = 'audio-container';
        const audioId = `audio-${task.task_id}`;
        audioDiv.innerHTML = `
          <div style="display: flex; align-items: center; gap: 1rem; margin-bottom: 0.5rem;">
            <audio controls class="audio-player" preload="metadata" id="${audioId}">
              <source src="${task.audio_url}" type="audio/mpeg">
              Äre Browser ënnerstëtzt keen Audio-Element.
            </audio>
            <div id="play-count-${task.task_id}" style="font-size: 0.875rem; color: #718096; font-weight: 600;">
              🎧 0/2 Mol gelaauschtert
            </div>
          </div>
          <div id="play-warning-${task.task_id}" style="display: none; margin-top: 0.5rem;">
            <div class="alert alert-warning" style="font-size: 0.875rem;">⚠️ Lescht Mol lauschteren!</div>
          </div>
          <div id="play-limit-${task.task_id}" style="display: none; margin-top: 0.5rem;">
            <div class="alert alert-error" style="font-size: 0.875rem; background: #fff5f5; border-color: #fc8181; color: #c53030;">
              🔒 Limit vun 2 Mol erreecht (offiziell Proufbedingung)
            </div>
          </div>
        `;
        taskDiv.appendChild(audioDiv);
        
        // Enforce 2-listen limit
        setTimeout(() => {
          const audioElement = document.getElementById(audioId);
          if (!audioElement) return;
          let playCount = 0;
          
          audioElement.addEventListener('play', () => {
            if (playCount >= 2) { audioElement.pause(); audioElement.currentTime = 0; return; }
          });
          
          audioElement.addEventListener('ended', () => {
            playCount++;
            document.getElementById(`play-count-${task.task_id}`).textContent = `🎧 ${playCount}/2 Mol gelaauschtert`;
            
            if (playCount === 1) {
              document.getElementById(`play-warning-${task.task_id}`).style.display = 'block';
            } else if (playCount >= 2) {
              audioElement.controls = false;
              document.getElementById(`play-warning-${task.task_id}`).style.display = 'none';
              document.getElementById(`play-limit-${task.task_id}`).style.display = 'block';
              document.getElementById(`play-count-${task.task_id}`).style.color = '#e53e3e';
            }
          });
        }, 100);
        
        // Render MCQ questions
        const contentDiv = document.createElement('div');
        contentDiv.className = 'task-content';
        
        task.questions.forEach((question, qIndex) => {
          const questionDiv = document.createElement('div');
          questionDiv.className = 'question-block';
          const uniqueName = `${task.task_id}-${question.id}`;
          
          const shuffledOptions = shuffleArray([...question.options]);
          
          questionDiv.innerHTML = `
            <div class="question-prompt">${question.prompt}</div>
            <div class="options-container">
              ${shuffledOptions.map((option) => {
                const optText = typeof option === 'string' ? option : option.text;
                const optValue = typeof option === 'string' ? option : (option.id || option.text);
                const escapedValue = optValue.replace(/"/g, '&quot;').replace(/'/g, '&#39;');
                return `
                <label class="option-button">
                  <input type="radio" name="${uniqueName}" value="${escapedValue}"
                    data-question-id="${question.id}"
                    onchange="saveAnswer('${question.id}', this.value)">
                  <span>${optText}</span>
                </label>
              `}).join('')}
            </div>
          `;
          
          contentDiv.appendChild(questionDiv);
          
          // Restore saved answer
          const savedAnswer = SproochEngine.currentTest.sections.listening.answers[question.id];
          if (savedAnswer) {
            const radios = questionDiv.querySelectorAll(`input[name="${uniqueName}"]`);
            radios.forEach(radio => {
              if (radio.value === savedAnswer) {
                radio.checked = true;
                radio.closest('.option-button').classList.add('selected');
              }
            });
          }
        });
        
        taskDiv.appendChild(contentDiv);
        container.appendChild(taskDiv);
      });
    }
    
    function shuffleArray(array) {
      const s = [...array];
      for (let i = s.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [s[i], s[j]] = [s[j], s[i]];
      }
      return s;
    }
    
    function saveAnswer(questionId, optionId) {
      const allRadios = document.querySelectorAll(`input[data-question-id="${questionId}"]`);
      allRadios.forEach(r => {
        r.closest('.option-button').classList.remove('selected');
        if (r.checked) r.closest('.option-button').classList.add('selected');
      });
      
      SproochEngine.saveListeningAnswer(questionId, optionId);
    }
    
    // Timer (30 minutes)
    let timeRemaining = 30 * 60;
    let timerInterval = null;
    const TIMER_KEY = `sproochentest_timer_${EXAM_ID}_listening`;
    
    function startTimer() {
      const saved = localStorage.getItem(TIMER_KEY);
      if (saved) {
        const td = JSON.parse(saved);
        const elapsed = Math.floor((Date.now() - td.startTime) / 1000);
        timeRemaining = Math.max(0, td.totalTime - elapsed);
      } else {
        localStorage.setItem(TIMER_KEY, JSON.stringify({ startTime: Date.now(), totalTime: timeRemaining }));
      }
      updateTimerDisplay();
      timerInterval = setInterval(() => {
        timeRemaining--;
        if (timeRemaining <= 0) {
          clearInterval(timerInterval); timeRemaining = 0; updateTimerDisplay();
          alert('⏰ D\'Zäit ass eriwwer!\n\nDir kënnt trotzdem weider äntweren oder den Test ofschécken.');
          return;
        }
        updateTimerDisplay();
      }, 1000);
    }
    
    function updateTimerDisplay() {
      const m = Math.floor(timeRemaining / 60), s = timeRemaining % 60;
      document.getElementById('countdown-timer').textContent = `0:${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`;
      const tb = document.getElementById('timer-display');
      if (timeRemaining <= 300) { tb.classList.add('critical'); tb.classList.remove('warning'); }
      else if (timeRemaining <= 600) { tb.classList.add('warning'); }
      else { tb.classList.remove('warning', 'critical'); }
    }
    
    window.addEventListener('beforeunload', () => { if (timerInterval) clearInterval(timerInterval); });
    
    // ─── Complete Listening + Submit Entire Test ───
    
    async function completeListeningAndSubmit() {
      const totalQuestions = listeningData.tasks.reduce((sum, t) => sum + t.questions.length, 0);
      const answeredCount = Object.keys(SproochEngine.currentTest.sections.listening.answers).length;
      
      if (answeredCount < totalQuestions) {
        if (!confirm(`Dir hutt ${totalQuestions - answeredCount} obeäntwert Froen.\n\nWollt Dir trotzdem ofschécken?`)) return;
      }
      
      if (!confirm('Test ofschécken?\n\nD\'Héierverstoen gëtt direkt korrigéiert.\nD\'Schwätzen gëtt duerch KI evaluéiert (1–2 Minutten).')) return;
      
      localStorage.removeItem(TIMER_KEY);
      localStorage.removeItem(`sproochentest_timer_${EXAM_ID}_speaking`);
      if (timerInterval) clearInterval(timerInterval);
      
      // Score listening locally
      SproochEngine.completeListeningSection(listeningData);
      
      // Show loading
      document.getElementById('loading-overlay').style.display = 'flex';
      document.getElementById('loading-text').textContent = 'Test gëtt ofgeschéckt...';
      
      try {
        const result = await SproochEngine.submitForEvaluation();
        console.log('✅ Submitted:', result);
        
        document.getElementById('loading-text').textContent = 'Gëtt evaluéiert... ⏳';
        
        setTimeout(() => {
          window.location.href = `results.html?attempt_id=${result.attempt_id}&exam=${EXAM_ID}`;
        }, 1000);
        
      } catch (error) {
        console.error('Submission error:', error);
        document.getElementById('loading-overlay').style.display = 'none';
        alert('Feeler beim Ofschécken:\n\n' + error.message + '\n\nProbéiert et nach eng Kéier.');
      }
    }
    
    function goBack() {
      if (confirm('Zréck zum Schwätzen? Är Fortschrëtt ginn gespäichert.')) {
        window.location.href = `speaking.html?exam=${EXAM_ID}`;
      }
    }
    
    function restartTest() {
      if (!confirm('Test nei starten?\n\nAlle Fortschrëtt gëtt geläscht.\n\nDat kann net réckgängeg gemaach ginn.')) return;
      SproochEngine.clearTestData(EXAM_ID);
      localStorage.removeItem(TIMER_KEY);
      localStorage.removeItem(`sproochentest_timer_${EXAM_ID}_speaking`);
      alert('✅ Den Test gouf nei gestart!');
      window.location.href = 'index.html';
    }
    
    function updateProgress() {
      const p = SproochEngine.getProgress();
      document.getElementById('progress-text').textContent = `${p.completed}/2 Deeler`;
      document.getElementById('progress-fill').style.width = `${p.percentage}%`;
    }
  </script>

</body>
</html>
