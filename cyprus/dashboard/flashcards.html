      <div class="controls">

        <button id="knownBtn" class="primary" data-i18n="flashcards_known"></button>
        <button id="againBtn" data-i18n="flashcards_again"></button>
      </div>
      <div class="controls-row">
        <button id="fcPrev" class="fc-nav"><svg width="20" height="20" viewBox="0 0 20 20"><circle cx="10" cy="10" r="9" stroke="var(--accent)" stroke-width="2" fill="none"/><path d="M11 6 L7 10 L11 14" stroke="var(--accent)" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></button>

<script src="/cyprus/assets/js/lang-bootstrap-cy.js"></script>

<script src="/assets/js/engine-cy.js"></script>
<script src="/assets/js/sync.js"></script>
<script>
CivicLearnI18n.onReady(() => {
  const s = document.createElement("script");
  s.src = "/cyprus/assets/js/flashcards-cy.js";
  document.body.appendChild(s);
});
</script>
<script>
document.addEventListener("DOMContentLoaded", () => {
  const toggle = document.querySelector(".menu-toggle");
  const overlay = document.getElementById("menuOverlay");
  if (toggle) toggle.addEventListener("click", () => document.body.classList.toggle("menu-open"));
  if (overlay) overlay.addEventListener("click", () => document.body.classList.remove("menu-open"));
  const current = window.CIVICEDGE_LANG;
  document.querySelectorAll(".lang-switch button").forEach(btn => {
    if (btn.dataset.lang === current) btn.classList.add("active");
    btn.addEventListener("click", () => {
      if (btn.dataset.lang === current) return;
      localStorage.setItem("civicedge_lang", btn.dataset.lang);
      location.reload();
    });
  });
});
</script>
<script src="/cyprus/assets/js/gauge-bar.js"></script>
