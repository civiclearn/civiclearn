<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CELPE-BRAS — Entrar</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,600;0,9..144,700;1,9..144,400&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --green:#009c3b; --green-dim:#e6f5ec; --green-dark:#007a2f;
      --yellow:#ffdf00; --blue:#002776;
      --navy:#0f172a; --slate:#334155; --muted:#64748b;
      --border:#e2e8f0; --surface:#ffffff; --bg:#f8f7f4;
      --red:#dc2626;
    }
    *{box-sizing:border-box;margin:0;padding:0;}
    body{font-family:"DM Sans",system-ui,sans-serif;background:var(--bg);color:var(--navy);min-height:100vh;display:flex;flex-direction:column;}

    .topbar{background:var(--navy);border-bottom:3px solid var(--green);padding:0 28px;height:56px;display:flex;align-items:center;justify-content:space-between;}
    .topbar-brand{display:flex;align-items:center;gap:14px;}
    .topbar-flag{width:28px;height:20px;background:var(--green);border-radius:2px;position:relative;overflow:hidden;flex-shrink:0;}
    .topbar-flag::before{content:'';position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:16px;height:10px;background:var(--yellow);clip-path:polygon(50% 0%,100% 50%,50% 100%,0% 50%);}
    .topbar-flag::after{content:'';position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:6px;height:6px;border-radius:50%;background:var(--blue);}
    .brand-text{display:flex;flex-direction:column;line-height:1.1;}
    .brand-title{font-family:"Fraunces",serif;font-size:1rem;font-weight:600;color:#fff;letter-spacing:0.01em;}
    .brand-sub{font-size:0.72rem;color:#64748b;}

    .main{flex:1;display:flex;align-items:center;justify-content:center;padding:40px 20px;}
    .login-card{background:var(--surface);border:1.5px solid var(--border);border-radius:20px;padding:40px 36px;width:100%;max-width:420px;box-shadow:0 4px 24px rgba(0,0,0,0.04);}

    .view-header{text-align:center;margin-bottom:22px;}
    .view-title{font-family:"Fraunces",serif;font-size:1.3rem;font-weight:700;letter-spacing:-0.02em;margin-bottom:4px;}
    .view-subtitle{font-size:0.85rem;color:var(--muted);line-height:1.5;}

    .form-group{margin-bottom:16px;}
    .form-label{display:block;font-size:0.78rem;font-weight:600;color:var(--slate);margin-bottom:6px;}
    .form-input{width:100%;padding:12px 14px;border:1.5px solid var(--border);border-radius:10px;font-family:"DM Sans",sans-serif;font-size:0.92rem;color:var(--navy);background:var(--bg);transition:border-color 0.15s;outline:none;}
    .form-input:focus{border-color:var(--green);box-shadow:0 0 0 3px var(--green-dim);}
    .form-input::placeholder{color:#94a3b8;}
    .pwd-wrap{position:relative;}
    .pwd-toggle{position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;font-size:0.75rem;color:var(--muted);cursor:pointer;font-family:inherit;font-weight:600;}
    .pwd-toggle:hover{color:var(--navy);}

    .action-btn{width:100%;padding:13px;border:none;border-radius:10px;font-family:"DM Sans",sans-serif;font-size:0.92rem;font-weight:600;cursor:pointer;transition:opacity 0.15s;margin-top:4px;background:var(--green);color:#fff;}
    .action-btn:hover{opacity:0.85;}
    .action-btn:disabled{opacity:0.4;cursor:default;}

    .form-footer{text-align:center;margin-top:14px;}
    .form-link{font-size:0.8rem;color:var(--muted);cursor:pointer;background:none;border:none;font-family:inherit;text-decoration:underline;}
    .form-link:hover{color:var(--navy);}

    .msg{display:none;border-radius:10px;padding:10px 14px;font-size:0.82rem;margin-bottom:16px;text-align:center;}
    .msg.visible{display:block;}
    .msg.error{background:#fef2f2;border:1px solid #fecaca;color:var(--red);}
    .msg.success{background:var(--green-dim);border:1px solid #bbf7d0;color:#166534;}

    .page-footer{text-align:center;padding:20px;font-size:0.75rem;color:var(--muted);}
    .page-footer a{color:var(--green);text-decoration:none;font-weight:600;}

    @media(max-width:480px){.login-card{padding:28px 22px;border-radius:16px;}}
  </style>
</head>
<body>

<div class="topbar">
  <div class="topbar-brand">
    <div class="topbar-flag"></div>
    <div class="brand-text">
      <span class="brand-title">CELPE-BRAS</span>
      <span class="brand-sub">Simulação do exame</span>
    </div>
  </div>
</div>

<div class="main">
  <div class="login-card">
    <div class="msg error" id="globalError"></div>
    <div class="msg success" id="globalSuccess"></div>

    <div class="view-header">
      <div class="view-title">Entrar</div>
      <div class="view-subtitle">Use seu e-mail e senha</div>
    </div>

    <div class="form-group">
      <label class="form-label" for="loginEmail">E-mail</label>
      <input class="form-input" id="loginEmail" type="email" placeholder="seu@email.com" autocomplete="email">
    </div>
    <div class="form-group">
      <label class="form-label" for="loginPwd">Senha</label>
      <div class="pwd-wrap">
        <input class="form-input" id="loginPwd" type="password" placeholder="••••••••" autocomplete="current-password">
        <button class="pwd-toggle" type="button" onclick="togglePwd()">Mostrar</button>
      </div>
    </div>
    <button class="action-btn" id="loginBtn" onclick="handleLogin()">Entrar</button>
    <div class="form-footer">
      <button class="form-link" onclick="handleForgot()">Esqueci minha senha</button>
    </div>
  </div>
</div>

<div class="page-footer">
  <a href="https://celpebras.org">celpebras.org</a> — Simulação CELPE-BRAS com avaliação por IA
</div>

<script>
  const SUPABASE_URL = 'https://htgliokekeaovdiafrgs.supabase.co';
  const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imh0Z2xpb2tla2Vhb3ZkaWFmcmdzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjM1NTcxMzMsImV4cCI6MjA3OTEzMzEzM30.nGWQn8GJn7aJct3Fu36p63NQvCqnifiPYQnF8QJKLYs';
  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  const params    = new URLSearchParams(location.search);
  const returnUrl = params.get('return') || '/celpe/dashboard/index.html';

  // Check if already logged in
  (async () => {
    const { data: { session } } = await sb.auth.getSession();
    if (session) window.location.href = returnUrl;
  })();

  // Password login
  async function handleLogin() {
    hideMessages();
    const email    = document.getElementById('loginEmail').value.trim().toLowerCase();
    const password = document.getElementById('loginPwd').value;
    if (!email || !password) return showError('Preencha e-mail e senha.');
    if (!email.includes('@') || !email.includes('.')) return showError('Digite um e-mail válido.');

    const btn = document.getElementById('loginBtn');
    btn.disabled = true; btn.textContent = 'Entrando…';

    const { error } = await sb.auth.signInWithPassword({ email, password });
    if (error) {
      btn.disabled = false; btn.textContent = 'Entrar';
      return showError(translateError(error.message));
    }

    try { await sb.from('login_history').insert({ email, status: 'success', method: 'password' }); } catch(e) {}
    window.location.href = returnUrl;
  }

  // Forgot password — uses the email already typed in the login field
  async function handleForgot() {
    hideMessages();
    const email = document.getElementById('loginEmail').value.trim().toLowerCase();
    if (!email) return showError('Preencha seu e-mail primeiro.');
    if (!email.includes('@') || !email.includes('.')) return showError('Digite um e-mail válido para receber o link.');

    const { error } = await sb.auth.resetPasswordForEmail(email, {
      redirectTo: window.location.origin + '/set-password.html',
    });

    if (error) return showError('Não foi possível enviar o link. Tente novamente.');
    showSuccess('Link enviado! Verifique seu e-mail (e a pasta de spam).');
  }

  // Helpers
  function togglePwd() {
    const el = document.getElementById('loginPwd');
    const btn = document.querySelector('.pwd-toggle');
    if (el.type === 'password') { el.type = 'text'; btn.textContent = 'Ocultar'; }
    else { el.type = 'password'; btn.textContent = 'Mostrar'; }
  }

  function showError(msg) { const el = document.getElementById('globalError'); el.textContent = msg; el.classList.add('visible'); }
  function showSuccess(msg) { const el = document.getElementById('globalSuccess'); el.textContent = msg; el.classList.add('visible'); }
  function hideMessages() { document.querySelectorAll('.msg').forEach(el => el.classList.remove('visible')); }

  function translateError(msg) {
    const l = msg.toLowerCase();
    if (l.includes('invalid login'))       return 'E-mail ou senha incorretos.';
    if (l.includes('email not confirmed')) return 'E-mail não confirmado. Verifique sua caixa de entrada.';
    if (l.includes('too many requests'))   return 'Muitas tentativas. Aguarde e tente novamente.';
    if (l.includes('user not found'))      return 'Nenhuma conta encontrada com esse e-mail.';
    if (l.includes('network'))             return 'Erro de conexão. Verifique sua internet.';
    return msg;
  }

  document.getElementById('loginPwd')?.addEventListener('keydown', e => { if (e.key === 'Enter') handleLogin(); });
</script>
</body>
</html>
