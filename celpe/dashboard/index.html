<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CELPE-BRAS — Simulações</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="/assets/js/celpe-auth.js"></script>
  <script src="/assets/js/celpe-engine.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,600;0,9..144,700;1,9..144,400&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --green:     #009c3b;
      --green-dim: #e6f5ec;
      --yellow:    #ffdf00;
      --blue:      #002776;
      --navy:      #0f172a;
      --slate:     #334155;
      --muted:     #64748b;
      --border:    #e2e8f0;
      --surface:   #ffffff;
      --bg:        #f8f7f4;
      --pass-bg:   #dcfce7;
      --pass-fg:   #166534;
      --fail-bg:   #fee2e2;
      --fail-fg:   #991b1b;
      --idle-bg:   #f1f5f9;
      --idle-fg:   #475569;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "DM Sans", system-ui, sans-serif;
      background: var(--bg); color: var(--navy);
      min-height: 100vh;
    }

    /* ─── TOPBAR ─────────────────────────────────────── */
    .topbar {
      background: var(--navy); border-bottom: 3px solid var(--green);
      padding: 0 32px; height: 56px;
      display: flex; align-items: center; justify-content: space-between;
      position: sticky; top: 0; z-index: 100;
    }
    .topbar-brand { display: flex; align-items: center; gap: 14px; }
    .topbar-flag {
      width: 28px; height: 20px; background: var(--green);
      border-radius: 2px; position: relative; overflow: hidden; flex-shrink: 0;
    }
    .topbar-flag::before {
      content: ''; position: absolute;
      left: 50%; top: 50%; transform: translate(-50%,-50%);
      width: 16px; height: 10px; background: var(--yellow);
      clip-path: polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%);
    }
    .topbar-flag::after {
      content: ''; position: absolute;
      left: 50%; top: 50%; transform: translate(-50%,-50%);
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--blue);
    }
    .brand-text { display: flex; flex-direction: column; line-height: 1.1; }
    .brand-title {
      font-family: "Fraunces", serif; font-size: 1rem;
      font-weight: 600; color: #fff; letter-spacing: 0.01em;
    }
    .brand-sub { font-size: 0.72rem; color: #64748b; }
    .topbar-right { display: flex; align-items: center; gap: 12px; }
    .user-pill {
      background: #1e293b; border-radius: 99px;
      padding: 5px 14px; font-size: 0.75rem; color: #94a3b8;
    }
    .signout-link {
      background: none; border: none; color: #64748b;
      font-size: 0.75rem; cursor: pointer; font-family: inherit;
    }
    .signout-link:hover { color: #fff; }

    /* ─── LOADING ─────────────────────────────────────── */
    #loading-overlay {
      position: fixed; inset: 0; background: var(--bg);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 16px;
      z-index: 9999; transition: opacity 0.35s;
    }
    #loading-overlay.hidden { opacity: 0; pointer-events: none; }
    .loading-spinner {
      width: 32px; height: 32px; border-radius: 50%;
      border: 3px solid var(--border); border-top-color: var(--green);
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-text { font-size: 0.9rem; color: var(--muted); }

    /* ─── HERO ────────────────────────────────────────── */
    .hero {
      max-width: 860px; margin: 0 auto;
      padding: 56px 28px 32px;
    }
    .hero-eyebrow {
      font-size: 0.72rem; font-weight: 600; text-transform: uppercase;
      letter-spacing: 0.1em; color: var(--green);
      display: flex; align-items: center; gap: 8px; margin-bottom: 14px;
    }
    .hero-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--green); }
    .hero h1 {
      font-family: "Fraunces", serif;
      font-size: clamp(1.6rem, 3.5vw, 2.2rem);
      font-weight: 700; letter-spacing: -0.03em; line-height: 1.1;
      margin-bottom: 10px;
    }
    .hero-subtitle {
      font-size: 0.95rem; color: var(--slate); line-height: 1.6; max-width: 600px;
    }

    /* ─── SIM CARDS ───────────────────────────────────── */
    .sim-grid {
      max-width: 860px; margin: 0 auto;
      padding: 0 28px 80px;
      display: grid; grid-template-columns: 1fr; gap: 20px;
    }
    .sim-card {
      background: var(--surface); border: 2px solid var(--border);
      border-radius: 16px; overflow: hidden;
      transition: border-color 0.15s, box-shadow 0.15s, transform 0.12s;
    }
    .sim-card:hover {
      border-color: #94a3b8;
      box-shadow: 0 4px 20px rgba(0,0,0,0.06);
      transform: translateY(-2px);
    }
    .sc-header {
      padding: 20px 24px 16px;
      display: flex; align-items: flex-start; justify-content: space-between; gap: 16px;
    }
    .sc-num {
      background: var(--navy); color: var(--yellow);
      border-radius: 8px; padding: 5px 12px;
      font-size: 0.72rem; font-weight: 700; flex-shrink: 0;
    }
    .sc-status {
      border-radius: 99px; padding: 4px 12px;
      font-size: 0.7rem; font-weight: 600;
    }
    .sc-status.idle      { background: var(--idle-bg); color: var(--idle-fg); }
    .sc-status.progress  { background: #fef9c3; color: #854d0e; }
    .sc-status.complete  { background: var(--pass-bg); color: var(--pass-fg); }
    .sc-body { padding: 0 24px 20px; }
    .sc-title {
      font-family: "Fraunces", serif; font-size: 1.15rem;
      font-weight: 700; margin-bottom: 6px;
    }
    .sc-desc { font-size: 0.84rem; color: var(--muted); line-height: 1.55; }
    .sc-footer {
      padding: 14px 24px; border-top: 1px solid var(--border);
      background: #f8fafc;
      display: flex; align-items: center; justify-content: space-between;
    }
    .sc-meta { font-size: 0.75rem; color: var(--muted); }
    .sc-btn {
      background: var(--green); color: white; border: none;
      border-radius: 8px; padding: 9px 22px;
      font-family: "DM Sans", sans-serif; font-size: 0.83rem; font-weight: 600;
      cursor: pointer; transition: opacity 0.15s; text-decoration: none;
    }
    .sc-btn:hover { opacity: 0.85; }
    .sc-btn.resume { background: var(--navy); }

    /* ─── RESULT ROW ──────────────────────────────────── */
    .sc-result {
      padding: 12px 24px; border-top: 1px solid var(--border);
      display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
    }
    .result-level {
      font-weight: 700; font-size: 0.85rem;
      padding: 4px 12px; border-radius: 8px;
    }
    .result-level.pass { background: var(--pass-bg); color: var(--pass-fg); }
    .result-level.fail { background: var(--fail-bg); color: var(--fail-fg); }
    .result-scores { font-size: 0.78rem; color: var(--muted); }

    @media (max-width: 600px) {
      .hero { padding: 36px 16px 24px; }
      .sim-grid { padding: 0 16px 60px; }
      .topbar { padding: 0 16px; }
      .topbar-right { gap: 8px; }
    }
  </style>
</head>
<body>

<div id="loading-overlay">
  <div class="loading-spinner"></div>
  <div class="loading-text">Carregando…</div>
</div>

<!-- TOPBAR -->
<div class="topbar">
  <div class="topbar-brand">
    <div class="topbar-flag"></div>
    <div class="brand-text">
      <span class="brand-title">CELPE-BRAS</span>
      <span class="brand-sub">Simulação do exame</span>
    </div>
  </div>
  <div class="topbar-right">
    <div class="user-pill" id="userEmail"></div>
    <button class="signout-link" onclick="celpeAuth.signOut()">Sair</button>
  </div>
</div>

<!-- HERO -->
<div class="hero">
  <div class="hero-eyebrow">
    <div class="hero-dot"></div>
    SIMULAÇÕES DISPONÍVEIS
  </div>
  <h1>Pratique para o CELPE-BRAS</h1>
  <p class="hero-subtitle">
    Cada simulação inclui a Parte Escrita (4 tarefas) e a Parte Oral, 
    com avaliação por IA usando os critérios oficiais do exame.
  </p>
</div>

<!-- SIM CARDS -->
<div class="sim-grid" id="simGrid">
  <!-- Populated by JS -->
</div>

<script>
document.addEventListener('DOMContentLoaded', async () => {
  const { user } = await CELPE.init();
  document.getElementById('userEmail').textContent = user.email;

  // Fetch hydrate data
  const data = await CELPE.hydrateData(user.id, 'any');
  const attempts = data?.attempts || [];

  // Simulation definitions
  const SIMS = [
    {
      id: 'sim01',
      title: 'Simulação 1',
      desc: 'Horta Girassol • Catadores do Rio • ColheDireto • Livro no Barco + 20 Elementos Provocadores',
      meta: '4 tarefas escritas + parte oral',
    },
    // Future simulations will be added here
  ];

  const grid = document.getElementById('simGrid');

  SIMS.forEach(sim => {
    // Find attempts for this simulation
    const simAttempts = attempts.filter(a => a.simulation_id === sim.id);
    const latest = simAttempts[0]; // hydrate returns newest first

    let statusHtml = '<span class="sc-status idle">Não iniciada</span>';
    let footerHtml = '';
    let resultHtml = '';

    if (latest) {
      if (latest.status === 'complete') {
        statusHtml = '<span class="sc-status complete">Concluída</span>';
        const level = latest.certification_level || latest.grade_overall || '—';
        const isPass = level !== 'Sem Certificação' && level !== '—';
        resultHtml = `
          <div class="sc-result">
            <span class="result-level ${isPass ? 'pass' : 'fail'}">${CELPE.escapeHtml(String(level))}</span>
            <span class="result-scores">
              Escrita: ${latest.grade_escrita ?? '—'}/25 · 
              Oral: ${latest.grade_oral ?? '—'}/25 · 
              Geral: ${latest.grade_overall ?? '—'}/25
            </span>
          </div>`;
        footerHtml = `
          <span class="sc-meta">Concluída</span>
          <a class="sc-btn" href="/celpe/dashboard/exam.html?sim=${sim.id}&attempt=${latest.id}">Ver resultados</a>`;
      } else {
        statusHtml = '<span class="sc-status progress">Em andamento</span>';
        footerHtml = `
          <span class="sc-meta">Continuar de onde parou</span>
          <a class="sc-btn resume" href="/celpe/dashboard/exam.html?sim=${sim.id}&attempt=${latest.id}">Continuar</a>`;
      }
    } else {
      footerHtml = `
        <span class="sc-meta">~3h30 no total</span>
        <button class="sc-btn" onclick="startSim('${sim.id}')">Começar simulação</button>`;
    }

    grid.innerHTML += `
      <div class="sim-card">
        <div class="sc-header">
          <span class="sc-num">${sim.id.replace('sim', 'SIM #')}</span>
          ${statusHtml}
        </div>
        <div class="sc-body">
          <div class="sc-title">${sim.title}</div>
          <div class="sc-desc">${sim.desc}</div>
        </div>
        ${resultHtml}
        <div class="sc-footer">${footerHtml}</div>
      </div>`;
  });

  CELPE.hideLoading();
});

async function startSim(simId) {
  const btn = event.target;
  btn.disabled = true;
  btn.textContent = 'Criando…';

  try {
    const result = await CELPE.apiFetch('celpe-submit-test', {
      simulation_id: simId,
      user_id: celpeAuth.userId,
    });
    if (result.success) {
      window.location.href = `/celpe/dashboard/exam.html?sim=${simId}&attempt=${result.attempt.id}`;
    } else {
      throw new Error(result.error || 'Falha ao criar simulação');
    }
  } catch (err) {
    console.error('Start sim error:', err);
    btn.disabled = false;
    btn.textContent = 'Começar simulação';
    CELPE.toast('Erro ao criar simulação. Tente novamente.');
  }
}
</script>
</body>
</html>
