<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CELPE-BRAS — Tarefas 2–4</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="/assets/js/celpe-auth.js"></script>
  <script src="/assets/js/celpe-engine.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,600;0,9..144,700;1,9..144,400&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --green:#009c3b; --green-dim:#e6f5ec; --yellow:#ffdf00; --blue:#002776;
      --navy:#0f172a; --slate:#334155; --muted:#64748b; --border:#e2e8f0;
      --surface:#ffffff; --bg:#f8f7f4;
      --pass:#166534; --pass-bg:#f0fdf4; --pass-border:#bbf7d0;
      --amber:#92400e; --amber-bg:#fffbeb; --amber-border:#fde68a;
    }
    *{box-sizing:border-box;margin:0;padding:0;}
    body{font-family:"DM Sans",system-ui,sans-serif;background:var(--bg);color:var(--navy);min-height:100vh;}

    /* ── TOPBAR ─── */
    .topbar{background:var(--navy);border-bottom:3px solid var(--green);padding:0 28px;height:52px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:200;}
    .topbar-left{display:flex;align-items:center;gap:12px;}
    .back-link{color:#64748b;text-decoration:none;font-size:0.8rem;display:flex;align-items:center;gap:5px;}
    .back-link:hover{color:#fff;}
    .topbar-divider{width:1px;height:20px;background:#1e293b;}
    .topbar-flag{width:22px;height:16px;background:var(--green);border-radius:2px;position:relative;overflow:hidden;flex-shrink:0;}
    .topbar-flag::before{content:'';position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:14px;height:8px;background:var(--yellow);clip-path:polygon(50% 0%,100% 50%,50% 100%,0% 50%);}
    .topbar-flag::after{content:'';position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:5px;height:5px;border-radius:50%;background:var(--blue);}
    .topbar-title{font-family:"Fraunces",serif;font-size:0.9rem;font-weight:600;color:#fff;}
    .topbar-right{display:flex;align-items:center;gap:10px;}
    .timer-pill{background:#1e293b;border-radius:99px;padding:4px 14px;font-size:0.8rem;color:#94a3b8;font-variant-numeric:tabular-nums;}
    .timer-pill span{color:#fff;font-weight:600;}
    .timer-pill.warning{color:#fbbf24;}
    .timer-pill.danger span{color:#ef4444;}
    .wc-pill{background:#1e293b;border-radius:99px;padding:4px 12px;font-size:0.75rem;color:#94a3b8;}
    .wc-pill span{color:#fff;font-weight:600;}

    /* ── LOADING ─── */
    #loading-overlay{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;z-index:9999;transition:opacity 0.35s;}
    #loading-overlay.hidden{opacity:0;pointer-events:none;}
    .loading-spinner{width:32px;height:32px;border-radius:50%;border:3px solid var(--border);border-top-color:var(--green);animation:spin 0.8s linear infinite;}
    @keyframes spin{to{transform:rotate(360deg);}}

    /* ── TAB BAR ─── */
    .tab-bar{display:flex;border-bottom:2px solid var(--border);background:var(--surface);position:sticky;top:52px;z-index:150;overflow-x:auto;}
    .tab-btn{flex:1;min-width:0;padding:13px 10px;background:none;border:none;border-bottom:3px solid transparent;
      font-family:"DM Sans",sans-serif;font-size:0.82rem;font-weight:600;color:var(--muted);cursor:pointer;
      text-align:center;white-space:nowrap;transition:color 0.15s,border-color 0.15s;}
    .tab-btn:hover{color:var(--navy);}
    .tab-btn.active{color:var(--navy);border-bottom-color:var(--green);}
    .tab-btn .tab-badge{display:inline-block;margin-left:6px;font-size:0.65rem;padding:1px 7px;border-radius:99px;vertical-align:middle;}
    .tab-badge.todo{background:var(--border);color:var(--muted);}
    .tab-badge.done{background:var(--pass-bg);color:var(--pass);}
    .tab-badge.skipped{background:#f1f5f9;color:#94a3b8;}

    /* ── LAYOUT ─── */
    .exam-layout{display:grid;grid-template-columns:minmax(0,1fr) 420px;min-height:calc(100vh - 104px);max-width:1200px;margin:0 auto;width:100%;}
    @media(max-width:900px){.exam-layout{grid-template-columns:1fr;}}

    /* ── LEFT: SOURCE ─── */
    .source-column{border-right:1px solid var(--border);overflow-y:auto;}
    @media(min-width:901px){.source-column{position:sticky;top:104px;height:calc(100vh - 104px);}}
    .source-inner{max-width:640px;padding:28px 32px 80px;}
    .source-badge{display:inline-flex;align-items:center;gap:6px;background:var(--navy);color:var(--yellow);border-radius:7px;padding:4px 11px;font-size:0.72rem;font-weight:700;margin-bottom:16px;}
    .source-title{font-family:"Fraunces",serif;font-size:1.1rem;font-weight:700;margin-bottom:6px;}
    .source-meta{font-size:0.78rem;color:var(--muted);margin-bottom:16px;}
    .audio-player{margin-bottom:20px;}
    .audio-player audio{width:100%;border-radius:8px;}
    .source-text-box{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:16px;font-size:0.84rem;color:var(--slate);line-height:1.7;margin-bottom:16px;white-space:pre-wrap;}
    .enunciado-card{background:var(--amber-bg);border:1px solid var(--amber-border);border-radius:10px;padding:14px 16px;font-size:0.84rem;color:var(--amber);line-height:1.6;margin-bottom:16px;}
    .enunciado-card strong{font-weight:700;}
    .key-facts{font-size:0.82rem;color:var(--slate);line-height:1.65;}
    .key-facts li{margin-bottom:4px;}

    /* ── RIGHT: WRITE ─── */
    .write-column{position:sticky;top:104px;height:calc(100vh - 104px);overflow-y:auto;background:var(--surface);display:flex;flex-direction:column;}
    @media(max-width:900px){.write-column{position:relative;top:auto;height:auto;min-height:60vh;}}
    .write-header{padding:18px 22px 14px;border-bottom:1px solid var(--border);flex-shrink:0;}
    .write-eyebrow{font-size:0.68rem;font-weight:600;text-transform:uppercase;letter-spacing:0.08em;color:var(--muted);margin-bottom:6px;}
    .write-header h2{font-family:"Fraunces",serif;font-size:1.05rem;font-weight:700;}

    .task-checklist{margin:14px 22px 0;flex-shrink:0;}
    .task-checklist-title{font-size:0.68rem;font-weight:700;text-transform:uppercase;letter-spacing:0.08em;color:var(--muted);margin-bottom:8px;}
    .task-item{display:flex;align-items:flex-start;gap:8px;padding:5px 0;font-size:0.8rem;color:var(--slate);transition:color 0.2s;}
    .task-item.done{color:var(--pass);}
    .task-bullet{width:18px;height:18px;border-radius:50%;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:0.6rem;color:transparent;flex-shrink:0;transition:all 0.2s;}
    .task-item.done .task-bullet{background:var(--pass);border-color:var(--pass);color:#fff;}

    .wc-bar-wrap{padding:12px 22px 0;flex-shrink:0;}
    .wc-bar{height:6px;background:var(--border);border-radius:3px;overflow:hidden;}
    .wc-bar-fill{height:100%;background:var(--green);border-radius:3px;transition:width 0.3s;width:0%;}
    .wc-bar-fill.good{background:var(--pass);}
    .wc-bar-fill.over{background:#f59e0b;}
    .wc-row{display:flex;justify-content:space-between;padding:4px 22px 0;}
    .wc-count{font-size:0.75rem;color:var(--navy);font-weight:600;}
    .wc-hint{font-size:0.72rem;color:var(--muted);}
    .wc-hint.good{color:var(--pass);}
    .wc-hint.over{color:#f59e0b;}

    .write-area{flex:1;display:flex;flex-direction:column;padding:0 22px 0;}
    .reply-textarea{flex:1;width:100%;border:none;outline:none;resize:none;font-family:"DM Sans",sans-serif;font-size:0.92rem;line-height:1.8;color:var(--navy);padding:14px 0;min-height:200px;}
    .reply-textarea::placeholder{color:#94a3b8;}

    .write-footer{padding:14px 22px 20px;flex-shrink:0;}
    .submit-btn{width:100%;padding:12px;border:none;border-radius:10px;background:var(--green);color:#fff;font-family:"DM Sans",sans-serif;font-size:0.9rem;font-weight:600;cursor:pointer;transition:opacity 0.15s;}
    .submit-btn:hover{opacity:0.85;}
    .submit-btn:disabled{opacity:0.4;cursor:default;}
    .submit-info{font-size:0.72rem;color:var(--muted);text-align:center;margin-top:8px;}
    .skip-link{display:block;text-align:center;margin-top:8px;font-size:0.78rem;color:var(--muted);cursor:pointer;background:none;border:none;font-family:inherit;}
    .skip-link:hover{color:var(--navy);}

    .notice-card{display:none;margin:20px 22px;padding:16px;border-radius:10px;text-align:center;font-size:0.88rem;}
    .notice-card.visible{display:block;}
    .notice-card.done{background:var(--pass-bg);color:var(--pass);border:1px solid var(--pass-border);}
    .continue-btn{display:none;margin:12px 22px;padding:11px;border:none;border-radius:10px;background:var(--navy);color:#fff;width:calc(100% - 44px);font-family:"DM Sans",sans-serif;font-size:0.88rem;font-weight:600;cursor:pointer;}

    /* ── ALL-DONE BANNER ─── */
    .all-done-banner{display:none;padding:14px 22px;background:var(--pass-bg);border-top:1px solid var(--pass-border);text-align:center;flex-shrink:0;}
    .all-done-banner.visible{display:block;}
    .all-done-banner a{color:var(--pass);font-weight:600;font-size:0.88rem;text-decoration:none;}
  </style>
</head>
<body>

<div id="loading-overlay">
  <div class="loading-spinner"></div>
  <div class="loading-text">Carregando tarefas…</div>
</div>

<div class="topbar">
  <div class="topbar-left">
    <a class="back-link" id="backLink" href="#">← Exame</a>
    <div class="topbar-divider"></div>
    <div class="topbar-flag"></div>
    <span class="topbar-title">Tarefas 2–4</span>
  </div>
  <div class="topbar-right">
    <div class="timer-pill" id="timerPill">⏱ <span id="timerDisplay">2:30:00</span></div>
    <div class="wc-pill">Palavras: <span id="topbarWc">0</span></div>
  </div>
</div>

<!-- TAB BAR -->
<div class="tab-bar" id="tabBar"></div>

<!-- CONTENT -->
<div class="exam-layout">
  <div class="source-column" id="sourceColumn">
    <div class="source-inner" id="sourceInner"></div>
  </div>
  <div class="write-column" id="writeColumn"></div>
</div>

<script>
// ═══════════════════════════════════════════════════════════════════
// CONFIG
// ═══════════════════════════════════════════════════════════════════
const TASKS = ['tarefa2', 'tarefa3', 'tarefa4'];
const WC_MIN = 150, WC_TARGET = 300, WC_SOFT = 50;
const TIME_LIMIT = 150 * 60; // 2h30 = 150 min

const TASK_LABELS = {
  tarefa2: { num: 2, icon: '🔊', label: 'Tarefa 2 — Áudio', badgeLabel: 'ÁUDIO — TAREFA 2' },
  tarefa3: { num: 3, icon: '📄', label: 'Tarefa 3 — Texto', badgeLabel: 'TEXTO — TAREFA 3' },
  tarefa4: { num: 4, icon: '📄', label: 'Tarefa 4 — Texto', badgeLabel: 'TEXTO — TAREFA 4' },
};

let simId, attemptId, user;
let activeTab = 'tarefa2';
let examDataMap = {};    // tarefa2/3/4 JSON data
let draftMap = {};       // { tarefa2: 'text…', … }
let statusMap = {};      // { tarefa2: 'not_started', … }
let timerSeconds = TIME_LIMIT;
let timerInterval = null;

// ═══════════════════════════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════════════════════════
document.addEventListener('DOMContentLoaded', async () => {
  const ctx = await CELPE.init('tarefa2');
  user      = ctx.user;
  simId     = ctx.simId;
  attemptId = ctx.attemptId;
  activeTab = ctx.elemKey || 'tarefa2';
  if (!TASKS.includes(activeTab)) activeTab = 'tarefa2';

  document.getElementById('backLink').href = `/celpe/dashboard/exam.html?sim=${simId}&attempt=${attemptId}`;

  // Restore drafts from localStorage
  TASKS.forEach(k => {
    draftMap[k] = localStorage.getItem(`celpe_draft_${attemptId}_${k}`) || '';
  });

  // Restore shared timer
  const savedTimer = localStorage.getItem(`celpe_timer_${attemptId}_shared234`);
  if (savedTimer) {
    timerSeconds = Math.max(0, parseInt(savedTimer, 10));
  }

  // Check statuses
  const data = await CELPE.hydrateData(user.email, attemptId);
  const attempt = (data?.attempts || []).find(a => a.id === attemptId);
  const elems = attempt?.elements || [];
  TASKS.forEach(k => {
    const el = elems.find(e => e.element_key === k);
    statusMap[k] = el?.submission_status || 'not_started';
  });

  // Load JSON data
  try {
    const [d2, d3, d4] = await Promise.all(
      TASKS.map(k => fetch(`/celpe/dashboard/data/sim01_${k}.json`).then(r => r.json()))
    );
    examDataMap = { tarefa2: d2, tarefa3: d3, tarefa4: d4 };
  } catch (err) {
    CELPE.showError('Não foi possível carregar as tarefas.', simId, attemptId);
    return;
  }

  renderTabs();
  switchTab(activeTab);
  startTimer();
  CELPE.hideLoading();
});

// ═══════════════════════════════════════════════════════════════════
// TABS
// ═══════════════════════════════════════════════════════════════════
function renderTabs() {
  const bar = document.getElementById('tabBar');
  bar.innerHTML = TASKS.map(k => {
    const info = TASK_LABELS[k];
    const st = statusMap[k];
    let badgeCls = 'todo', badgeText = '·';
    if (st === 'submitted') { badgeCls = 'done'; badgeText = '✓'; }
    else if (st === 'skipped') { badgeCls = 'skipped'; badgeText = '—'; }
    return `<button class="tab-btn ${k === activeTab ? 'active' : ''}" data-key="${k}" onclick="switchTab('${k}')">
      ${info.icon} ${info.label}
      <span class="tab-badge ${badgeCls}">${badgeText}</span>
    </button>`;
  }).join('');
}

function switchTab(key) {
  // Save current draft
  saveDraft();

  activeTab = key;

  // Update tab UI
  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.key === key);
  });

  // Update URL without reload
  const url = new URL(location);
  url.searchParams.set('key', key);
  history.replaceState(null, '', url);

  renderSource(key);
  renderWritePane(key);
}

// ═══════════════════════════════════════════════════════════════════
// RENDER SOURCE (left column)
// ═══════════════════════════════════════════════════════════════════
function renderSource(key) {
  const data = examDataMap[key];
  if (!data) return;
  const info = TASK_LABELS[key];
  const src = data.source || {};
  const container = document.getElementById('sourceInner');

  let mediaHtml = '';
  if (data.source_type === 'audio') {
    mediaHtml = `<div class="audio-player"><audio controls preload="metadata"><source src="/celpe/dashboard/data/audio/${src.asset}" type="audio/mpeg">Áudio não suportado</audio></div>`;
  }

  let textHtml = '';
  if (src.source_text) {
    textHtml = `<div class="source-text-box">${CELPE.escapeHtml(src.source_text)}</div>`;
  }

  const facts = src.key_facts || [];
  let factsHtml = '';
  if (facts.length) {
    factsHtml = `<div class="key-facts">
      <div style="font-size:0.72rem;font-weight:700;text-transform:uppercase;letter-spacing:0.06em;color:var(--muted);margin-bottom:8px;">Informações-chave</div>
      <ul style="padding-left:18px;">${facts.map(f => `<li>${CELPE.escapeHtml(f)}</li>`).join('')}</ul>
    </div>`;
  }

  container.innerHTML = `
    <div class="source-badge">${info.icon} ${info.badgeLabel}</div>
    ${mediaHtml}
    <div class="source-title">${CELPE.escapeHtml(src.title || data.title || '')}</div>
    <div class="source-meta">${CELPE.escapeHtml(src.origin || '')}${src.duration_seconds ? ' · ' + Math.floor(src.duration_seconds/60) + 'min' : ''}</div>
    ${textHtml}
    <div class="enunciado-card"><strong>Enunciado:</strong> ${CELPE.escapeHtml(data.enunciado || '')}</div>
    ${factsHtml}
  `;
}

// ═══════════════════════════════════════════════════════════════════
// RENDER WRITE PANE (right column)
// ═══════════════════════════════════════════════════════════════════
function renderWritePane(key) {
  const data = examDataMap[key];
  if (!data) return;
  const st = statusMap[key];
  const draft = draftMap[key] || '';
  const wc = CELPE.countWords(draft);
  const col = document.getElementById('writeColumn');

  const isDone = (st === 'submitted' || st === 'skipped');
  const allDone = TASKS.every(k => statusMap[k] === 'submitted' || statusMap[k] === 'skipped');

  // Task actions checklist
  const actions = data.task_actions || [];
  const checklistHtml = actions.map((a, i) => `
    <div class="task-item" id="titem-${key}-${i}">
      <div class="task-bullet">✓</div>
      <span>${CELPE.escapeHtml(a)}</span>
    </div>`).join('');

  col.innerHTML = `
    <div class="write-header">
      <div class="write-eyebrow">SUA RESPOSTA</div>
      <h2>Escreva: ${CELPE.escapeHtml(data.genre || '')}</h2>
    </div>
    <div class="task-checklist">
      <div class="task-checklist-title">Checklist da tarefa</div>
      ${checklistHtml}
    </div>
    <div class="wc-bar-wrap"><div class="wc-bar"><div class="wc-bar-fill" id="wcBarFill"></div></div></div>
    <div class="wc-row">
      <div class="wc-count"><span id="wcCount">${wc}</span> palavras</div>
      <div class="wc-hint" id="wcHint"></div>
    </div>
    <div class="write-area">
      <textarea class="reply-textarea" id="replyTextarea" placeholder="Comece a escrever aqui…"
        oninput="onTextChange()" ${isDone ? 'disabled' : ''}>${CELPE.escapeHtml(draft)}</textarea>
    </div>
    <div id="doneNotice" class="notice-card done ${isDone ? 'visible' : ''}">
      ✅ ${st === 'skipped' ? 'Tarefa pulada.' : 'Tarefa entregue! Avaliação em andamento.'}
    </div>
    <div class="all-done-banner ${allDone ? 'visible' : ''}" id="allDoneBanner">
      <a href="/celpe/dashboard/exam.html?sim=${simId}&attempt=${attemptId}">✅ Todas as 3 tarefas concluídas — voltar ao painel →</a>
    </div>
    <div class="write-footer" id="writeFooter" ${isDone ? 'style="display:none"' : ''}>
      <button class="submit-btn" id="submitBtn" ${wc < WC_SOFT ? 'disabled' : ''} onclick="submitActive()">Entregar tarefa ${TASK_LABELS[key].num}</button>
      <div class="submit-info">Tempo compartilhado entre as 3 tarefas</div>
      <button class="skip-link" onclick="skipActive()">Pular esta tarefa</button>
    </div>
    <button id="continueBtn" class="continue-btn" ${isDone ? '' : 'style="display:none"'} onclick="goNext()">
      ${allDone ? '← Voltar ao painel' : 'Ir para próxima tarefa →'}
    </button>
  `;

  updateWcUI(wc);
  if (!isDone) updateChecklist(draft, key);
}

// ═══════════════════════════════════════════════════════════════════
// TEXT INPUT
// ═══════════════════════════════════════════════════════════════════
function onTextChange() {
  const text = document.getElementById('replyTextarea').value;
  draftMap[activeTab] = text;
  const wc = CELPE.countWords(text);
  updateWcUI(wc);
  updateChecklist(text, activeTab);
  document.getElementById('topbarWc').textContent = wc;

  const btn = document.getElementById('submitBtn');
  if (btn) btn.disabled = wc < WC_SOFT;

  // Auto-save draft
  clearTimeout(window._saveTimeout);
  window._saveTimeout = setTimeout(saveDraft, 800);
}

function saveDraft() {
  TASKS.forEach(k => {
    if (draftMap[k] !== undefined) {
      localStorage.setItem(`celpe_draft_${attemptId}_${k}`, draftMap[k]);
    }
  });
}

function updateWcUI(count) {
  document.getElementById('wcCount').textContent = count;
  document.getElementById('topbarWc').textContent = count;
  const fill = document.getElementById('wcBarFill');
  const hint = document.getElementById('wcHint');
  if (!fill || !hint) return;

  if (count === 0) {
    fill.style.width = '0%'; fill.className = 'wc-bar-fill';
    hint.textContent = `Escreva entre ${WC_MIN}–${WC_TARGET} palavras`; hint.className = 'wc-hint';
  } else if (count < WC_MIN) {
    fill.style.width = (count/WC_MIN*70)+'%'; fill.className = 'wc-bar-fill';
    hint.textContent = `Faltam ${WC_MIN-count} para o mínimo`; hint.className = 'wc-hint';
  } else if (count <= WC_TARGET) {
    fill.style.width = (70+((count-WC_MIN)/(WC_TARGET-WC_MIN))*30)+'%';
    fill.className = 'wc-bar-fill good';
    hint.textContent = `✓ Bom tamanho`; hint.className = 'wc-hint good';
  } else {
    fill.style.width = '100%'; fill.className = 'wc-bar-fill over';
    hint.textContent = `${count-WC_TARGET} acima do recomendado`; hint.className = 'wc-hint over';
  }
}

function updateChecklist(text, key) {
  const data = examDataMap[key];
  if (!data) return;
  const lower = text.toLowerCase();
  const wc = CELPE.countWords(text);
  (data.task_actions || []).forEach((a, i) => {
    const words = a.toLowerCase().replace(/[().,!?]/g, '').split(/\s+/).filter(w => w.length > 4);
    const matches = words.filter(w => lower.includes(w)).length;
    const done = wc > 30 && matches >= Math.min(2, words.length);
    const el = document.getElementById(`titem-${key}-${i}`);
    if (el) el.classList.toggle('done', done);
  });
}

// ═══════════════════════════════════════════════════════════════════
// TIMER (shared across all 3 tarefas)
// ═══════════════════════════════════════════════════════════════════
function startTimer() {
  updateTimerDisplay();
  timerInterval = setInterval(() => {
    timerSeconds--;
    localStorage.setItem(`celpe_timer_${attemptId}_shared234`, String(timerSeconds));
    updateTimerDisplay();
    if (timerSeconds <= 0) {
      clearInterval(timerInterval);
      autoSubmitAll();
    }
  }, 1000);
}

function updateTimerDisplay() {
  const total = Math.max(0, timerSeconds);
  const h = Math.floor(total / 3600);
  const m = Math.floor((total % 3600) / 60);
  const s = total % 60;
  const display = h > 0
    ? `${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`
    : `${m}:${String(s).padStart(2,'0')}`;
  document.getElementById('timerDisplay').textContent = display;

  const pill = document.getElementById('timerPill');
  pill.className = 'timer-pill';
  if (total <= 120) pill.classList.add('danger');
  else if (total <= 600) pill.classList.add('warning');
}

async function autoSubmitAll() {
  for (const k of TASKS) {
    if (statusMap[k] !== 'not_started' && statusMap[k] !== 'in_progress') continue;
    const text = draftMap[k] || '';
    if (CELPE.countWords(text) >= WC_SOFT) {
      await doSubmit(k, text);
    } else {
      await CELPE.skip({ attemptId, elemKey: k });
      statusMap[k] = 'skipped';
    }
  }
  renderTabs();
  renderWritePane(activeTab);
}

// ═══════════════════════════════════════════════════════════════════
// SUBMIT / SKIP
// ═══════════════════════════════════════════════════════════════════
async function submitActive() {
  const text = (draftMap[activeTab] || '').trim();
  if (!text) return;
  const btn = document.getElementById('submitBtn');
  btn.disabled = true; btn.textContent = 'Enviando…';

  try {
    await doSubmit(activeTab, text);
  } catch (err) {
    console.error(err);
    btn.disabled = false; btn.textContent = `Entregar tarefa ${TASK_LABELS[activeTab].num}`;
    CELPE.toast('Algo deu errado. Tente novamente.');
    return;
  }

  statusMap[activeTab] = 'submitted';
  localStorage.removeItem(`celpe_draft_${attemptId}_${activeTab}`);
  renderTabs();
  renderWritePane(activeTab);
}

async function doSubmit(key, text) {
  const data = examDataMap[key];
  const responseJson = {
    task_title:          data?.title,
    enunciado:           data?.enunciado,
    genre:               data?.genre,
    interlocutor:        data?.interlocutor,
    source_summary:      data?.source?.transcript_summary,
    task_actions:        data?.task_actions,
    evaluation_criteria: data?.evaluation_criteria,
    ai_evaluation_prompt: data?.ai_evaluation_prompt,
    word_count:          CELPE.countWords(text),
    time_remaining:      timerSeconds,
    user_answer:         text,
  };

  await CELPE.submit({ attemptId, elemKey: key, text, json: responseJson });
}

async function skipActive() {
  if (!confirm('Tem certeza? Você receberá 0 pontos nesta tarefa.')) return;
  await CELPE.skip({ attemptId, elemKey: activeTab });
  statusMap[activeTab] = 'skipped';
  localStorage.removeItem(`celpe_draft_${attemptId}_${activeTab}`);
  renderTabs();
  renderWritePane(activeTab);
}

function goNext() {
  const allDone = TASKS.every(k => statusMap[k] === 'submitted' || statusMap[k] === 'skipped');
  if (allDone) {
    CELPE.goBack(simId, attemptId);
    return;
  }
  // Find next undone
  const next = TASKS.find(k => statusMap[k] !== 'submitted' && statusMap[k] !== 'skipped');
  if (next) switchTab(next);
}
</script>
