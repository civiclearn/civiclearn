<!DOCTYPE html>
<html lang="lt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CivicLearn – Login</title>

  <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <script>
    window.SUPABASE_URL = "https://htgliokekeaovdiafrgs.supabase.co";
    window.SUPABASE_KEY = "sb_publishable_QWvR124i4h0hvQumyjBgDw_018SlMbp";
  </script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.7.1/dist/umd/supabase.js"></script>

  <style>
    :root {
      --purple:#7c3aed;
      --yellow:#f1c40f;
      --black:#333;
      --bg:#fdfaf5;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:'Lexend',sans-serif;
      background:var(--bg);
      color:#111;
    }

    /* HEADER – DANISH WIDTH */
    .site-header{
      background:#fff;
      padding:15px 0;
      border-bottom:1px solid rgba(0,0,0,.04);
    }
    .header-inner{
      max-width:1100px;
      margin:0 auto;
      padding:0 20px;
      display:flex;
      justify-content:space-between;
      align-items:center;
    }
    .brand-main{
      display:flex;
      gap:10px;
      font-weight:700;
      align-items:center;
    }
    .btn-small-purple{
      background:var(--purple);
      color:#fff;
      padding:8px 20px;
      border-radius:20px;
      font-size:14px;
      font-weight:600;
      text-decoration:none;
    }

    /* LANGUAGE SWITCH */
    .lang-switch{
      display:flex;
      justify-content:center;
      gap:8px;
      margin-bottom:20px;
    }
    .lang-switch button{
      width:44px;height:34px;
      border-radius:10px;
      border:1px solid #d8d6e3;
      background:#f6f5fb;
      font-weight:600;
      cursor:pointer;
    }
    .lang-switch button.active{
      background:#6b4eff;
      color:#fff;
      border-color:#6b4eff;
    }

    /* GRID */
    .login-grid{
      display:flex;
      justify-content:center;
      align-items:stretch;
      max-width:1100px;
      margin:60px auto 40px;
      padding:20px;
    }
    .auth-card{
      width:320px;
      background:#fff;
      padding:40px 30px;
      display:flex;
      flex-direction:column;
    }
    .card-left{
      background:#f3ebff;
      border:1px solid #e0d0f9;
      border-radius:20px 0 0 20px;
    }
    .card-center{
      border-radius:20px;
      margin:-20px 0;
      padding:60px 40px;
      border:1px solid #eee;
      box-shadow:0 15px 40px rgba(0,0,0,.08);
      z-index:10;
    }
    .card-right{
      background:#fffdf0;
      border:1px solid #f9edbc;
      border-radius:0 20px 20px 0;
    }

    h2{font-size:20px;margin:0 0 15px}
    p{font-size:14px;color:#555;margin:0 0 20px;line-height:1.5}
    label{font-size:13px;font-weight:600;margin-bottom:8px;display:block}
    input{
      width:100%;
      padding:12px;
      border:2px solid #e5dfd2;
      border-radius:10px;
      margin-bottom:15px;
      font-family:'Lexend',sans-serif;
    }
    .btn-action{
      width:100%;
      padding:14px;
      border-radius:10px;
      border:none;
      font-weight:700;
      cursor:pointer;
      margin-top:auto;
    }
    .btn-purple{background:var(--purple);color:#fff}
    .btn-black{background:var(--black);color:#fff}
    .btn-yellow{background:var(--yellow);color:#111}

    .pwd-container{position:relative}
    .pwd-container input{padding-right:72px}
    .toggle-pwd{
      position:absolute;
      right:14px;
      top:50%;
      transform:translateY(-50%);
      background:none;
      border:none;
      color:var(--purple);
      font-size:12px;
      font-weight:700;
      cursor:pointer;
    }

    .status-msg{
      position:fixed;
      top:100px;
      left:50%;
      transform:translateX(-50%);
      padding:12px 24px;
      border-radius:30px;
      font-size:14px;
      display:none;
      z-index:100;
    }
    .success{background:#dcfce7;color:#166534;display:block}
    .error{background:#fee2e2;color:#dc2626;display:block}

    @media(max-width:900px){
      .login-grid{flex-direction:column;gap:20px}
      .auth-card{width:100%;max-width:420px;border-radius:20px}
      .card-center{margin:0}
    }
  </style>
</head>

<body>

<header class="site-header">
  <div class="header-inner">
    <div class="brand-main">
      <img src="/assets/images/lt.svg" width="24">
      CivicLearn Lietuva
    </div>
    <a href="/lt/checkout.html" class="btn-small-purple" data-t="nav_signup"></a>
  </div>
</header>

<div id="status" class="status-msg"></div>

<div class="login-grid">

  <!-- LEFT -->
  <div class="auth-card card-left">
    <h2 data-t="first_title"></h2>
    <p data-t="first_text"></p>
    <input type="email" id="setupEmail" placeholder="you@example.com">
    <button class="btn-action btn-purple" onclick="handleSetup()" data-t="first_btn"></button>
  </div>

  <!-- CENTER -->
  <div class="auth-card card-center">
    <div class="lang-switch">
      <button data-lang="lt">LT</button>
      <button data-lang="en">EN</button>
      <button data-lang="ru">RU</button>
    </div>

    <h2 style="font-size:28px;text-align:center;" data-t="login_title"></h2>

    <label data-t="email_label"></label>
    <input type="email" id="loginEmail" placeholder="you@example.com">

    <label data-t="password_label"></label>
    <div class="pwd-container">
      <input type="password" id="loginPwd">
      <button type="button" class="toggle-pwd" onclick="togglePwd()" data-t="show"></button>
    </div>

    <button class="btn-action btn-black" onclick="handleLogin()" data-t="login_btn"></button>
  </div>

  <!-- RIGHT -->
  <div class="auth-card card-right">
    <h2 data-t="pin_title"></h2>
    <p data-t="pin_text"></p>

    <label data-t="email_label"></label>
   <input type="email" id="pinEmail" placeholder="you@example.com">

    <button class="btn-action btn-yellow" onclick="showPin()" data-t="pin_btn"></button>

    <div id="pinArea" style="display:none;margin-top:15px;">
      <div id="pinShown" style="text-align:center;font-size:28px;letter-spacing:6px;font-weight:700;color:var(--purple);margin-bottom:10px;">0000</div>
      <input type="text" id="pinEnter" maxlength="4" inputmode="numeric" style="text-align:center;letter-spacing:2px;">
      <button class="btn-action btn-black" onclick="pinLogin()" data-t="continue"></button>
    </div>
  </div>

</div>

<script>
/* ===== I18N ===== */
const I18N={
lt:{
nav_signup:"Sukurti prieigą",
first_title:"Pirmą kartą?",
first_text:"Neseniai įsigijote prieigą? Sukurkite slaptažodį čia.",
first_btn:"Siųsti nustatymo nuorodą",
login_title:"Prisijungimas",
email_label:"El. paštas",
password_label:"Slaptažodis",
login_btn:"Prisijungti",
show:"Rodyti",
pin_title:"Problemos?",
pin_text:"Naudokite laikiną PIN, jei slaptažodis neveikia.",
pin_btn:"Rodyti PIN",
continue:"Tęsti"
},
en:{
nav_signup:"Create access",
first_title:"First time?",
first_text:"Just purchased access? Create your password here.",
first_btn:"Send setup link",
login_title:"Login",
email_label:"Email address",
password_label:"Password",
login_btn:"Login",
show:"Show",
pin_title:"Problems?",
pin_text:"Use a temporary PIN if password login fails.",
pin_btn:"Show PIN",
continue:"Continue"
},
ru:{
nav_signup:"Получить доступ",
first_title:"Впервые здесь?",
first_text:"Вы только что купили доступ? Создайте пароль.",
first_btn:"Отправить ссылку",
login_title:"Вход",
email_label:"Эл. почта",
password_label:"Пароль",
login_btn:"Войти",
show:"Показать",
pin_title:"Проблемы?",
pin_text:"Используйте PIN, если пароль не работает.",
pin_btn:"Показать PIN",
continue:"Продолжить"
}
};

let currentLang="lt";
function applyLang(l){
  currentLang=l;
  document.querySelectorAll("[data-t]").forEach(el=>{
    el.textContent=I18N[l][el.dataset.t];
  });
  document.querySelectorAll(".lang-switch button").forEach(b=>{
    b.classList.toggle("active",b.dataset.lang===l);
  });
}
document.querySelectorAll(".lang-switch button").forEach(b=>{
  b.onclick=()=>applyLang(b.dataset.lang);
});
applyLang("lt");

/* ===== LOGIC ===== */
const supabase=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
function notify(t,m){
  const s=document.getElementById("status");
  s.textContent=m;s.className="status-msg "+t;
}
function togglePwd(){
  loginPwd.type=loginPwd.type==="password"?"text":"password";
}
async function handleSetup(){
  await supabase.auth.resetPasswordForEmail(setupEmail.value.trim().toLowerCase(),{
    redirectTo:location.origin+"/lt/login-password.html"
  });
  notify("success","✓");
}
async function handleLogin(){
  const {error}=await supabase.auth.signInWithPassword({
    email:loginEmail.value.trim().toLowerCase(),
    password:loginPwd.value
  });
  if(error) return notify("error","✕");
  location.href="/lt/dashboard/";
}
function utcDayOfYear(d){
  const s=new Date(Date.UTC(d.getUTCFullYear(),0,0));
  return Math.floor((d-s)/86400000);
}
function computePin(e){
  const n=new Date();
  return String(((utcDayOfYear(n)*37)+(n.getUTCHours()*91)+(e.length*17))%10000).padStart(4,"0");
}
async function showPin(){
  pinShown.textContent=computePin(pinEmail.value.trim().toLowerCase());
  pinArea.style.display="block";
}
async function pinLogin(){
  location.href="/lt/dashboard/";
}
</script>

</body>
</html>
