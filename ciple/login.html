<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Acesso – CivicLearn CIPLE</title>

 <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <script>
    window.SUPABASE_URL = "https://htgliokekeaovdiafrgs.supabase.co";
    window.SUPABASE_KEY = "sb_publishable_QWvR124i4h0hvQumyjBgDw_018SlMbp";
  </script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.7.1/dist/umd/supabase.js"></script>

  <style>
    :root {
      --purple:#7c3aed;
      --yellow:#f1c40f;
      --black:#333;
      --bg:#fdfaf5;
    }

    * { box-sizing:border-box; }

   body, html, *, input, button {
  font-family: 'Lexend', sans-serif !important;
}

    .site-header {
      background:#fff;
      padding:15px 0;
      border-bottom:1px solid rgba(0,0,0,.04);
    }
    .header-inner {
      max-width:1100px;
      margin:0 auto;
      padding:0 20px;
      display:flex;
      align-items:center;
      justify-content:space-between;
    }

    .brand-main {
      display:flex;
      align-items:center;
      gap:10px;
      font-weight:700;
      text-decoration:none;
      color:inherit;
    }

    .btn-small-purple {
      background:var(--purple);
      color:#fff;
      padding:8px 20px;
      border-radius:20px;
      font-size:14px;
      font-weight:600;
      text-decoration:none;
      white-space:nowrap;
    }

    .login-grid {
      display:flex;
      justify-content:center;
      align-items:stretch;
      max-width:1100px;
      margin:80px auto 40px;
      padding:20px;
    }

    .auth-card {
      width:320px;
      background:#fff;
      padding:40px 30px;
      display:flex;
      flex-direction:column;
    }

    .card-left {
      background:#f3ebff;
      border:1px solid #e0d0f9;
      border-radius:20px 0 0 20px;
    }

    .card-center {
      border-radius:20px;
      margin:-20px 0;
      padding:60px 40px;
      border:1px solid #eee;
      box-shadow:0 15px 40px rgba(0,0,0,.08);
      z-index:10;
    }

    .card-right {
      background:#fff;
      border:1px solid #f9edbc;
      border-radius:0 20px 20px 0;
    }

    h2 { font-size:20px; margin:0 0 15px; }
    p  { font-size:14px; color:#555; line-height:1.5; margin:0 0 20px; }

    label {
      font-size:13px;
      font-weight:600;
      margin-bottom:8px;
      display:block;
    }

    input {
      width:100%;
      padding:12px;
      border:2px solid #e5dfd2;
      border-radius:10px;
      margin-bottom:15px;
      font-family:'Space Grotesk', sans-serif;
      background:#fff;
    }

    .btn-action {
      width:100%;
      padding:14px;
      border-radius:10px;
      border:none;
      font-weight:700;
      font-family:'Space Grotesk', sans-serif;
      cursor:pointer;
      margin-top:auto;
    }

    .btn-purple { background:var(--purple); color:#fff; }
    .btn-black  { background:var(--black); color:#fff; }
    .btn-yellow { background:var(--yellow); color:#111; }

    .pwd-container { position:relative; }
    .pwd-container input { padding-right:72px; }

    .toggle-pwd {
      position:absolute;
      right:14px;
      top:50%;
      transform:translateY(-50%);
      background:none;
      border:none;
      color:var(--purple);
      font-size:12px;
      font-weight:700;
      cursor:pointer;
    }

    .status-msg {
      position:fixed;
      top:100px;
      left:50%;
      transform:translateX(-50%);
      padding:12px 24px;
      border-radius:30px;
      font-size:14px;
      font-weight:500;
      display:none;
      z-index:100;
      box-shadow:0 4px 12px rgba(0,0,0,.1);
    }
    .error   { background:#fee2e2; color:#dc2626; display:block; }
    .success { background:#dcfce7; color:#166534; display:block; }

    @media (max-width:900px){
      .login-grid{ flex-direction:column; gap:20px; }
      .auth-card{ width:100%; max-width:420px; border-radius:20px; }
      .card-center{ margin:0; padding:50px 30px; }
    }
  </style>
</head>

<body>

<header class="site-header">
  <div class="header-inner">
    <a href="/ciple/" class="brand-main">
      <img src="/assets/images/pt.svg" width="24" alt="PT">
      CivicLearn CIPLE
    </a>
    <a href="/ciple/checkout.html" class="btn-small-purple">Comprar acesso</a>
  </div>
</header>

<div id="status" class="status-msg"></div>

<div class="login-grid">

  <div class="auth-card card-left">
    <h2 style="color:var(--purple);">Primeira vez aqui?</h2>
    <p>
      Acabou de comprar o seu acesso? Crie a sua palavra-passe aqui.
    </p>

    <input type="email" id="setupEmail" placeholder="nome@exemplo.pt">
    <button
      type="button"
      id="setupBtn"
      class="btn-action btn-purple"
      onclick="handleSetup()">
      Enviar link de configuração
    </button>

    <div style="font-size:10px;color:var(--purple);font-weight:600;margin-top:15px;text-align:center;">
      ℹ️ Verifique também a pasta de spam.
    </div>
  </div>

  <div class="auth-card card-center">
    <h2 style="font-size:28px;text-align:center;">Acesso</h2>

    <label>E-mail</label>
    <input type="email" id="loginEmail">

    <label>Palavra-passe</label>
    <div class="pwd-container">
      <input type="password" id="loginPwd">
      <button type="button" class="toggle-pwd" onclick="toggleMainPwd()">Mostrar</button>
    </div>

    <button class="btn-action btn-black" onclick="handleLogin()">
      Entrar com palavra-passe
    </button>
  </div>

  <div class="auth-card card-right">
    <h2 style="color:#856404;">Problemas?</h2>
    <p>
      Use um PIN temporário se o acesso com palavra-passe não funcionar.
      O PIN não é enviado por e-mail.
    </p>

    <label>E-mail</label>
    <input type="email" id="pinEmail" placeholder="nome@exemplo.pt">

    <button class="btn-action btn-yellow" onclick="showPin()">
      Mostrar PIN de acesso
    </button>

    <div id="pinArea" style="display:none;margin-top:15px;">
      <div id="pinShown"
           style="text-align:center;font-size:28px;letter-spacing:6px;font-weight:700;color:var(--purple);margin-bottom:10px;">
        0000
      </div>

      <label>Introduza o PIN</label>
      <input type="text" id="pinEnter" maxlength="4" inputmode="numeric"
             style="text-align:center;letter-spacing:2px;">

      <button class="btn-action btn-black" onclick="pinLogin()">
        Continuar
      </button>
    </div>
  </div>

</div>

<script>
const supabase = window.supabase.createClient(
  window.SUPABASE_URL,
  window.SUPABASE_KEY
);

function notify(type,text){
  const el=document.getElementById("status");
  el.textContent=text;
  el.className="status-msg "+type;
  el.style.display="block";
  setTimeout(()=>el.style.display="none",6000);
}

async function handleSetup(){
  const btn = document.getElementById("setupBtn");
  const email = setupEmail.value.trim().toLowerCase();

  if (!email) {
    notify("error","Introduza o seu e-mail.");
    return;
  }

  if (btn.disabled) return;

  btn.disabled = true;
  btn.textContent = "Aguarde…";

  const { error } = await supabase.auth.resetPasswordForEmail(email,{
    redirectTo: window.location.origin + "/ciple/login-password.html"
  });

  if (error) {
    btn.disabled = false;
    btn.textContent = "Enviar link de configuração";
    notify("error","Não foi possível enviar o link.");
    return;
  }

  btn.textContent = "Verifique o seu e-mail";
  setTimeout(() => btn.remove(), 2500);

  notify("success","Se o e-mail existir, o link foi enviado.");
}


async function handleLogin(){
  const email=loginEmail.value.trim().toLowerCase();
  const password=loginPwd.value;

  const { error }=await supabase.auth.signInWithPassword({ email,password });
  if(error) return notify("error","E-mail ou palavra-passe incorretos.");

  localStorage.setItem("cl_auth","ok");
  localStorage.setItem("cl_email",email);
  location.href="/ciple/dashboard/index.html";
}

function utcDayOfYear(d){
  const s=new Date(Date.UTC(d.getUTCFullYear(),0,0));
  return Math.floor((d-s)/86400000);
}

function computePin(email){
  const n=new Date();
  const v=(utcDayOfYear(n)*37)+(n.getUTCHours()*91)+(email.length*17);
  return String(v%10000).padStart(4,"0");
}

async function showPin(){
  const email=pinEmail.value.trim().toLowerCase();
  if(!email) return notify("error","Introduza o seu e-mail.");

  const res=await fetch(
    "https://htgliokekeaovdiafrgs.supabase.co/functions/v1/check-user-exists",
    {
      method:"POST",
      headers:{ "Content-Type":"application/json" },
      body:JSON.stringify({ email })
    }
  );

  const data=await res.json();
  if(!data.exists) return notify("error","Este e-mail não existe no sistema.");

  pinShown.textContent=computePin(email);
  pinArea.style.display="block";
  localStorage.setItem("cl_email",email);
}

async function pinLogin(){
  const email=localStorage.getItem("cl_email");
  const enteredPin=pinEnter.value.trim();

  const res=await fetch(
    "https://htgliokekeaovdiafrgs.supabase.co/functions/v1/verify-pin-and-log",
    {
      method:"POST",
      headers:{
        "Content-Type":"application/json",
        "apikey":window.SUPABASE_KEY
      },
      body:JSON.stringify({ email, enteredPin })
    }
  );

  const data=await res.json();
  if(!data.success) return notify("error","PIN incorreto.");

  localStorage.setItem("cl_auth","ok");
  localStorage.setItem("cl_email", email);
  localStorage.setItem("cl_login_at", Date.now().toString());
  location.href="/ciple/dashboard/index.html";
}

function toggleMainPwd(){
  const pwd=loginPwd;
  const btn=document.querySelector(".toggle-pwd");
  if(pwd.type==="password"){
    pwd.type="text"; btn.textContent="Ocultar";
  } else {
    pwd.type="password"; btn.textContent="Mostrar";
  }
}
</script>

</body>
</html>
