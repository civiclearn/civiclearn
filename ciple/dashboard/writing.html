<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CIPLE - Produção Escrita</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/ciple/assets/css/ciple-styles.css">
  <style>
    /* Modern font */
    body {
      font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, sans-serif;
    }
    
    /* Test identifier badge */
    .test-badge {
      display: inline-block;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 0.875rem;
      font-weight: 600;
      margin-bottom: 12px;
      letter-spacing: 0.5px;
    }
    
    /* Shared timer display */
    .timer-box {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      background: #fff5f5;
      border: 2px solid #fc8181;
      padding: 12px 20px;
      border-radius: 12px;
      font-size: 1.1rem;
      font-weight: 600;
      color: #c53030;
      margin-top: 12px;
    }
    
    .timer-icon {
      font-size: 1.5rem;
    }
    
    #countdown-timer {
      font-family: 'Space Grotesk', monospace;
      font-size: 1.3rem;
      font-weight: 700;
      letter-spacing: 1px;
    }
    
    .timer-box.warning {
      background: #fffaf0;
      border-color: #ed8936;
      color: #c05621;
      animation: pulse 1s ease-in-out infinite;
    }
    
    .timer-box.critical {
      background: #fff5f5;
      border-color: #f56565;
      color: #c53030;
      animation: pulse 0.5s ease-in-out infinite;
    }
    
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.8; }
    }
    
    /* Compact card styling */
    .card {
      padding: 1.75rem;
    }
    
    .card-title {
      font-size: 1.75rem;
      margin-bottom: 0.5rem;
    }
    
    .card-subtitle {
      font-size: 1rem;
      margin-bottom: 1rem;
    }
    
    /* Professional button styles */
    .btn {
      font-family: 'Space Grotesk', sans-serif;
      padding: 14px 28px;
      border-radius: 10px;
      border: none;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    
    .btn-secondary {
      background: #f7fafc;
      color: #2d3748;
      border: 2px solid #e2e8f0;
    }
    
    .btn-secondary:hover {
      background: #edf2f7;
      border-color: #cbd5e0;
      transform: translateY(-1px);
    }
    
    .btn-primary {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
    }
    
    .btn-primary:hover {
      box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
      transform: translateY(-2px);
    }
    
    .btn-primary:active, .btn-secondary:active {
      transform: translateY(0);
    }
    
    .btn-large {
      padding: 16px 32px;
      font-size: 1.05rem;
    }
    
    .nav-buttons {
      display: flex;
      gap: 16px;
      justify-content: space-between;
      margin-top: 2rem;
      padding-top: 2rem;
      border-top: 1px solid #e2e8f0;
    }
    
    /* Writing-specific styles */
    .writing-textarea {
      width: 100%;
      min-height: 250px;
      padding: 16px;
      border: 2px solid #e2e8f0;
      border-radius: 10px;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1rem;
      line-height: 1.6;
      resize: vertical;
      transition: border-color 0.2s;
    }
    
    .writing-textarea:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }
    
    .word-count {
      margin-top: 8px;
      font-size: 0.9rem;
      font-weight: 600;
      color: #4a5568;
      text-align: right;
    }
    
    .word-count.warning {
      color: #d69e2e;
    }
    
    .word-count.error {
      color: #e53e3e;
    }
    
    .writing-context, .writing-message {
      background: #f7fafc;
      padding: 16px;
      border-left: 4px solid #667eea;
      border-radius: 8px;
      margin-bottom: 12px;
      line-height: 1.6;
    }
    
    .textarea-container {
      margin-top: 16px;
    }
  </style>
</head>
<body>

  <!-- Progress Header -->
  <div class="test-header">
    <div class="progress-container">
      <div class="progress-info">
        <span>Progresso do Teste</span>
        <span id="progress-text">3/4 Secções</span>
      </div>
      <div class="progress-bar">
        <div class="progress-fill" id="progress-fill" style="width: 75%"></div>
      </div>
    </div>
  </div>

  <!-- Main Content -->
  <div class="container">
    
    <!-- Instructions Card -->
    <div class="card">
      <div class="test-badge" id="test-badge">CIPLE-XX</div>
      <h1 class="card-title">Produção Escrita</h1>
      <p class="card-subtitle">
        Complete as duas tarefas de escrita.
      </p>
      <div class="timer-box" id="timer-display">
        <span class="timer-icon">⏱️</span>
        <div>
          <div style="font-size: 0.75rem; opacity: 0.8; margin-bottom: 2px;">Tempo restante (partilhado com Leitura):</div>
          <div id="countdown-timer">1:15:00</div>
        </div>
      </div>
      <div class="alert alert-info" style="margin-top: 1rem;">
        <strong>Instruções:</strong> Respeite os limites de palavras indicados. 
        O seu texto será avaliado por IA segundo os critérios oficiais do CIPLE.
      </div>
    </div>

    <!-- Tasks Container -->
    <div id="tasks-container">
      <!-- Tasks will be dynamically loaded here -->
    </div>

    <!-- Navigation -->
    <div class="nav-buttons">
      <button class="btn btn-secondary" onclick="goBack()">
        ← Voltar ao Oral
      </button>
      <button class="btn btn-primary btn-large" id="complete-btn" onclick="completeWriting()">
        Completar Escrita →
      </button>
    </div>

  </div>

  <!-- Loading Overlay -->
  <div id="loading-overlay" class="loading-overlay" style="display: none;">
    <div class="spinner"></div>
  </div>

  <!-- Scripts -->
  <script src="/ciple/assets/js/ciple-engine-v2.js"></script>
  <script>
    // ==========================================================================
    // WRITING TEST LOGIC
    // ==========================================================================
    
    let writingData = null;
    
    // Get exam ID from URL parameter
    const urlParams = new URLSearchParams(window.location.search);
    const EXAM_ID = urlParams.get('exam') || 'ciple-04';
    
    // Update test badge
    document.getElementById('test-badge').textContent = EXAM_ID.toUpperCase();
    
    // Initialize on page load
    window.addEventListener('DOMContentLoaded', async () => {
      try {
        // Initialize engine
        CIPLEEngine.init(EXAM_ID);
        
        // Load writing JSON (dynamic based on exam ID)
        const response = await fetch(`/ciple/data/${EXAM_ID}-writing.json`);
        
        if (!response.ok) {
          throw new Error(`Failed to load test data: ${response.status} ${response.statusText}`);
        }
        
        writingData = await response.json();
        
        // Render tasks
        renderTasks();
        
        // Update progress
        updateProgress();
        
        // Start shared timer
        startSharedTimer();
        
      } catch (error) {
        console.error('Error loading writing test:', error);
        alert('Erro ao carregar o teste. Por favor, recarregue a página.\n\nDetalhes: ' + error.message);
      }
    });
    
    // ==========================================================================
    // RENDER TASKS
    // ==========================================================================
    
    function renderTasks() {
      const container = document.getElementById('tasks-container');
      container.innerHTML = '';
      
      writingData.tasks.forEach((task, taskIndex) => {
        const taskDiv = document.createElement('div');
        taskDiv.className = 'card task-container';
        
        // Task Header
        taskDiv.innerHTML = `
          <div class="task-header">
            <h2 class="task-title">${task.title}</h2>
            <p class="task-instructions">${task.instructions}</p>
          </div>
        `;
        
        // Task Content
        const contentDiv = document.createElement('div');
        contentDiv.className = 'task-content';
        
        // Writing Prompt
        const promptDiv = document.createElement('div');
        promptDiv.className = 'writing-prompt';
        
        if (task.prompt.context) {
          promptDiv.innerHTML += `
            <div class="writing-context">${task.prompt.context}</div>
          `;
        }
        
        if (task.prompt.incoming_message) {
          promptDiv.innerHTML += `
            <div class="writing-message">${task.prompt.incoming_message}</div>
          `;
        }
        
        if (task.prompt.email_opening) {
          promptDiv.innerHTML += `
            <div class="writing-message">${task.prompt.email_opening}</div>
          `;
        }
        
        contentDiv.appendChild(promptDiv);
        
        // Word count constraints info
        const constraintsDiv = document.createElement('div');
        constraintsDiv.className = 'alert alert-warning';
        constraintsDiv.innerHTML = `
          <strong>Limites de palavras:</strong> 
          Mínimo ${task.constraints.min_words} palavras, 
          máximo ${task.constraints.max_words} palavras.
        `;
        contentDiv.appendChild(constraintsDiv);
        
        // Textarea
        const textareaContainer = document.createElement('div');
        textareaContainer.className = 'textarea-container';
        
        const textarea = document.createElement('textarea');
        textarea.className = 'writing-textarea';
        textarea.id = `textarea-${task.task_id}`;
        textarea.placeholder = 'Escreva a sua resposta aqui...';
        textarea.setAttribute('data-task-id', task.task_id);
        textarea.setAttribute('data-min-words', task.constraints.min_words);
        textarea.setAttribute('data-max-words', task.constraints.max_words);
        
        // Restore saved text
        const savedText = CIPLEEngine.currentTest.sections.writing.responses[task.task_id];
        if (savedText) {
          textarea.value = savedText;
        }
        
        // Word count tracking
        textarea.addEventListener('input', (e) => {
          updateWordCount(task.task_id);
          saveText(task.task_id);
        });
        
        textareaContainer.appendChild(textarea);
        
        // Word counter display
        const wordCountDiv = document.createElement('div');
        wordCountDiv.className = 'word-count';
        wordCountDiv.id = `word-count-${task.task_id}`;
        wordCountDiv.textContent = '0 palavras';
        
        textareaContainer.appendChild(wordCountDiv);
        contentDiv.appendChild(textareaContainer);
        
        taskDiv.appendChild(contentDiv);
        container.appendChild(taskDiv);
        
        // Initialize word count display
        updateWordCount(task.task_id);
      });
    }
    
    // ==========================================================================
    // WORD COUNT
    // ==========================================================================
    
    function countWords(text) {
      if (!text || text.trim() === '') return 0;
      return text.trim().split(/\s+/).length;
    }
    
    function updateWordCount(taskId) {
      const textarea = document.getElementById(`textarea-${taskId}`);
      const wordCountDiv = document.getElementById(`word-count-${taskId}`);
      
      if (!textarea || !wordCountDiv) return;
      
      const text = textarea.value;
      const wordCount = countWords(text);
      const minWords = parseInt(textarea.getAttribute('data-min-words'));
      const maxWords = parseInt(textarea.getAttribute('data-max-words'));
      
      wordCountDiv.textContent = `${wordCount} palavras`;
      wordCountDiv.classList.remove('warning', 'error');
      
      if (wordCount < minWords) {
        wordCountDiv.classList.add('warning');
        wordCountDiv.textContent += ` (mínimo: ${minWords})`;
      } else if (wordCount > maxWords) {
        wordCountDiv.classList.add('error');
        wordCountDiv.textContent += ` (máximo: ${maxWords})`;
      }
    }
    
    // ==========================================================================
    // SAVE TEXT
    // ==========================================================================
    
    function saveText(taskId) {
      const textarea = document.getElementById(`textarea-${taskId}`);
      if (!textarea) return;
      
      const text = textarea.value;
      CIPLEEngine.saveWritingResponse(taskId, text);
      
      console.log('Writing saved:', taskId, `${countWords(text)} words`);
    }
    
    // ==========================================================================
    // SHARED TIMER (Reading + Writing combined: 1h15m)
    // ==========================================================================
    
    let timeRemaining = 0;
    let timerInterval = null;
    const TIMER_KEY = `ciple_timer_${EXAM_ID}_reading_writing`;
    
    function startSharedTimer() {
      // Check if timer was already started in reading section
      const savedTimer = localStorage.getItem(TIMER_KEY);
      
      if (savedTimer) {
        const timerData = JSON.parse(savedTimer);
        const elapsed = Math.floor((Date.now() - timerData.startTime) / 1000);
        timeRemaining = Math.max(0, timerData.totalTime - elapsed);
        console.log('📝 Resumed shared timer from reading:', timeRemaining, 'seconds remaining');
      } else {
        // Timer not started yet (shouldn't happen, but fallback)
        timeRemaining = 75 * 60; // 1h15m
        const timerData = {
          startTime: Date.now(),
          totalTime: timeRemaining
        };
        localStorage.setItem(TIMER_KEY, JSON.stringify(timerData));
        console.log('⏱️ Started new timer (fallback)');
      }
      
      updateTimerDisplay();
      
      timerInterval = setInterval(() => {
        timeRemaining--;
        
        if (timeRemaining <= 0) {
          clearInterval(timerInterval);
          alert('⏰ Tempo esgotado!\n\nO tempo oficial para Leitura e Escrita terminou.');
          timeRemaining = 0;
        }
        
        updateTimerDisplay();
      }, 1000);
    }
    
    function updateTimerDisplay() {
      const hours = Math.floor(timeRemaining / 3600);
      const minutes = Math.floor((timeRemaining % 3600) / 60);
      const seconds = timeRemaining % 60;
      
      const display = `${hours}:${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
      document.getElementById('countdown-timer').textContent = display;
      
      const timerBox = document.getElementById('timer-display');
      
      if (timeRemaining <= 300) {
        timerBox.classList.add('critical');
        timerBox.classList.remove('warning');
      } else if (timeRemaining <= 600) {
        timerBox.classList.add('warning');
      } else {
        timerBox.classList.remove('warning', 'critical');
      }
    }
    
    // Clean up timer on page unload
    window.addEventListener('beforeunload', () => {
      if (timerInterval) clearInterval(timerInterval);
    });
    
    // ==========================================================================
    // COMPLETE WRITING SECTION
    // ==========================================================================
    
    function completeWriting() {
      // Validate all tasks
      let allValid = true;
      const validationErrors = [];
      
      writingData.tasks.forEach(task => {
        const textarea = document.getElementById(`textarea-${task.task_id}`);
        const text = textarea.value.trim();
        const wordCount = countWords(text);
        const minWords = task.constraints.min_words;
        const maxWords = task.constraints.max_words;
        
        if (text === '') {
          allValid = false;
          validationErrors.push(`${task.title}: Nenhum texto foi escrito.`);
        } else if (wordCount < minWords) {
          allValid = false;
          validationErrors.push(
            `${task.title}: Texto muito curto (${wordCount} palavras, mínimo ${minWords}).`
          );
        } else if (wordCount > maxWords) {
          allValid = false;
          validationErrors.push(
            `${task.title}: Texto muito longo (${wordCount} palavras, máximo ${maxWords}).`
          );
        }
      });
      
      if (!allValid) {
        alert(
          'Por favor, corrija os seguintes problemas:\n\n' + 
          validationErrors.join('\n')
        );
        return;
      }
      
      if (!confirm(
        'Tem a certeza que quer submeter as suas respostas?\n\n' +
        'Os textos serão avaliados por IA segundo os critérios do CIPLE.'
      )) {
        return;
      }
      
      // Clear the shared timer
      localStorage.removeItem(TIMER_KEY);
      if (timerInterval) clearInterval(timerInterval);
      
      CIPLEEngine.completeWritingSection();
      
      alert(
        'Secção de Escrita Completa!\n\n' +
        'Os seus textos foram guardados e serão avaliados no final.\n\n' +
        'Agora vamos para a última secção: Produção Oral.'
      );
      
      window.location.href = `speaking.html?exam=${EXAM_ID}`;
    }
    
    // ==========================================================================
    // NAVIGATION
    // ==========================================================================
    
    function goBack() {
      if (confirm('Tem a certeza que quer voltar? O progresso está guardado.')) {
        window.location.href = `listening.html?exam=${EXAM_ID}`;
      }
    }
    
    function updateProgress() {
      const progress = CIPLEEngine.getProgress();
      document.getElementById('progress-text').textContent = `${progress.completed}/4 Secções`;
      document.getElementById('progress-fill').style.width = `${progress.percentage}%`;
    }
    
  </script>

</body>
</html>
