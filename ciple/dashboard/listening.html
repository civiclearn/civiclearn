<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CIPLE - Compreensão do Oral</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="/ciple/assets/js/ciple-auth.js?v=2"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/ciple-styles.css">
  <style>
    /* Modern font */
    body {
      font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, sans-serif;
    }
    
    /* Test identifier badge */
    .test-badge {
      display: inline-block;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 0.875rem;
      font-weight: 600;
      margin-bottom: 12px;
      letter-spacing: 0.5px;
    }
    
    /* Timer display */
    .timer-box {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      background: #fff5f5;
      border: 2px solid #fc8181;
      padding: 12px 20px;
      border-radius: 12px;
      font-size: 1.1rem;
      font-weight: 600;
      color: #c53030;
      margin-top: 12px;
    }
    
    .timer-icon {
      font-size: 1.5rem;
    }
    
    #countdown-timer {
      font-family: 'Space Grotesk', monospace;
      font-size: 1.3rem;
      font-weight: 700;
      letter-spacing: 1px;
    }
    
    .timer-box.warning {
      background: #fffaf0;
      border-color: #ed8936;
      color: #c05621;
      animation: pulse 1s ease-in-out infinite;
    }
    
    .timer-box.critical {
      background: #fff5f5;
      border-color: #f56565;
      color: #c53030;
      animation: pulse 0.5s ease-in-out infinite;
    }
    
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.8; }
    }
    
    /* Compact card styling */
    .card {
      padding: 1.75rem;
    }
    
    .card-title {
      font-size: 1.75rem;
      margin-bottom: 0.5rem;
    }
    
    .card-subtitle {
      font-size: 1rem;
      margin-bottom: 1rem;
    }
    
    /* Professional button styles */
    .btn {
      font-family: 'Space Grotesk', sans-serif;
      padding: 14px 28px;
      border-radius: 10px;
      border: none;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    
    .btn-secondary {
      background: #f7fafc;
      color: #2d3748;
      border: 2px solid #e2e8f0;
    }
    
    .btn-secondary:hover {
      background: #edf2f7;
      border-color: #cbd5e0;
      transform: translateY(-1px);
    }
    
    .btn-primary {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
    }
    
    .btn-primary:hover {
      box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
      transform: translateY(-2px);
    }
    
    .btn-primary:active, .btn-secondary:active {
      transform: translateY(0);
    }
    
    .btn-large {
      padding: 16px 32px;
      font-size: 1.05rem;
    }
    
    .nav-buttons {
      display: flex;
      gap: 16px;
      justify-content: space-between;
      margin-top: 2rem;
      padding-top: 2rem;
      border-top: 1px solid #e2e8f0;
    }
    
    /* Audio player styling */
    .audio-container {
      margin: 1.5rem 0;
      padding: 1.5rem;
      background: linear-gradient(135deg, #f7fafc 0%, #edf2f7 100%);
      border-radius: 12px;
      border: 2px solid #e2e8f0;
    }
    
    .audio-player {
      width: 100%;
      height: 48px;
      border-radius: 8px;
    }
  </style>
</head>
<body>

  <!-- Progress Header -->
  <div class="test-header">
    <div class="progress-container">
      <div class="progress-info">
        <span>Progresso do Teste</span>
        <span id="progress-text">2/4 Secções</span>
      </div>
      <div class="progress-bar">
        <div class="progress-fill" id="progress-fill" style="width: 50%"></div>
      </div>
    </div>
  </div>

  <!-- Main Content -->
  <div class="container">
    
    <!-- Instructions Card -->
    <div class="card">
      <div class="test-badge" id="test-badge">CIPLE-XX</div>
      <h1 class="card-title">Compreensão do Oral</h1>
      <p class="card-subtitle">
        Ouça atentamente os áudios e responda às questões.
      </p>
      <div class="timer-box" id="timer-display">
        <span class="timer-icon">⏱️</span>
        <div>
          <div style="font-size: 0.75rem; opacity: 0.8; margin-bottom: 2px;">Tempo restante:</div>
          <div id="countdown-timer">0:30:00</div>
        </div>
      </div>
      <div class="alert alert-info" style="margin-top: 1rem;">
        <strong>Instruções:</strong> Pode ouvir cada áudio <strong>até 2 vezes</strong> (como no exame oficial). 
        As suas respostas são guardadas automaticamente.
      </div>
    </div>

    <!-- Tasks Container -->
    <div id="tasks-container">
      <!-- Tasks will be dynamically loaded here -->
    </div>

    <!-- Navigation -->
    <div class="nav-buttons">
      <button class="btn btn-secondary" onclick="goBack()">
        ← Voltar à Escrita
      </button>
      <button class="btn" onclick="restartTest()" style="background: #ed8936; color: white; border: 2px solid #dd6b20;">
        🔄 Recomeçar Teste
      </button>
      <button class="btn btn-primary btn-large" id="complete-btn" onclick="completeListening()">
        Completar Oral →
      </button>
    </div>

  </div>

  <!-- Loading Overlay -->
  <div id="loading-overlay" class="loading-overlay" style="display: none;">
    <div class="spinner"></div>
  </div>

  <!-- Scripts -->
  <script src="/ciple/assets/js/ciple-engine-v2.js?v=4"></script>
  <script>
    // ==========================================================================
    // LISTENING TEST LOGIC
    // ==========================================================================
    
    let listeningData = null;
    
    // Get exam ID from URL parameter
    const urlParams = new URLSearchParams(window.location.search);
    const EXAM_ID = urlParams.get('exam') || 'ciple-04';
    
    // Update test badge
    document.getElementById('test-badge').textContent = EXAM_ID.toUpperCase();
    
    // Initialize on page load
    window.addEventListener('DOMContentLoaded', async () => {
      try {
        // Initialize engine
        CIPLEEngine.init(EXAM_ID);
        
        // Load listening JSON (dynamic based on exam ID)
        const response = await fetch(`../data/${EXAM_ID}-listening.json`);
        
        if (!response.ok) {
          throw new Error(`Failed to load test data: ${response.status} ${response.statusText}`);
        }
        
        listeningData = await response.json();
        
        // Render tasks
        renderTasks();
        
        // Update progress
        updateProgress();
        
        // Start timer
        startTimer();
        
      } catch (error) {
        console.error('Error loading listening test:', error);
        alert('Erro ao carregar o teste. Por favor, recarregue a página.\n\nDetalhes: ' + error.message);
      }
    });
    
    // ==========================================================================
    // RENDER TASKS
    // ==========================================================================
    
    function renderTasks() {
      const container = document.getElementById('tasks-container');
      container.innerHTML = '';
      
      listeningData.tasks.forEach((task, taskIndex) => {
        const taskDiv = document.createElement('div');
        taskDiv.className = 'card task-container';
        
        // Task Header
        taskDiv.innerHTML = `
          <div class="task-header">
            <h2 class="task-title">${task.title}</h2>
            <p class="task-instructions">${task.instructions}</p>
          </div>
        `;
        
        // Audio Player
        const audioDiv = document.createElement('div');
        audioDiv.className = 'audio-container';
        const audioId = `audio-${task.task_id}`;
        audioDiv.innerHTML = `
          <div style="display: flex; align-items: center; gap: 1rem; margin-bottom: 0.5rem;">
            <audio controls class="audio-player" preload="metadata" id="${audioId}">
              <source src="${task.content.audio}" type="audio/mpeg">
              O seu navegador não suporta o elemento de áudio.
            </audio>
            <div id="play-count-${task.task_id}" style="font-size: 0.875rem; color: #718096; font-weight: 600;">
              🎧 0/2 reproduções
            </div>
          </div>
          <div id="play-warning-${task.task_id}" style="display: none; margin-top: 0.5rem;">
            <div class="alert alert-warning" style="font-size: 0.875rem;">
              ⚠️ Última reprodução disponível!
            </div>
          </div>
          <div id="play-limit-${task.task_id}" style="display: none; margin-top: 0.5rem;">
            <div class="alert alert-error" style="font-size: 0.875rem; background: #fff5f5; border-color: #fc8181; color: #c53030;">
              🔒 Limite de 2 reproduções atingido (condição oficial do exame)
            </div>
          </div>
        `;
        taskDiv.appendChild(audioDiv);
        
        // Enforce 2-listen limit
        setTimeout(() => {
          const audioElement = document.getElementById(audioId);
          let playCount = 0;
          
          audioElement.addEventListener('play', () => {
            if (playCount >= 2) {
              audioElement.pause();
              audioElement.currentTime = 0;
              return;
            }
          });
          
          audioElement.addEventListener('ended', () => {
            playCount++;
            document.getElementById(`play-count-${task.task_id}`).textContent = 
              `🎧 ${playCount}/2 reproduções`;
            
            if (playCount === 1) {
              document.getElementById(`play-warning-${task.task_id}`).style.display = 'block';
            } else if (playCount >= 2) {
              audioElement.controls = false;
              document.getElementById(`play-warning-${task.task_id}`).style.display = 'none';
              document.getElementById(`play-limit-${task.task_id}`).style.display = 'block';
              document.getElementById(`play-count-${task.task_id}`).style.color = '#e53e3e';
            }
          });
        }, 100);
        
        // Render questions based on task type
        if (task.type === 'single_audio_mcq') {
          renderSingleAudioMCQ(taskDiv, task, taskIndex);
        } else if (task.type === 'match_one') {
          renderMatchOne(taskDiv, task, taskIndex);
        }
        
        container.appendChild(taskDiv);
      });
    }
    
    // ==========================================================================
    // RENDER: Single Audio MCQ
    // ==========================================================================
    
    function renderSingleAudioMCQ(container, task, taskIndex) {
      const contentDiv = document.createElement('div');
      contentDiv.className = 'task-content';
      
      task.questions.forEach((question, qIndex) => {
        const questionDiv = document.createElement('div');
        questionDiv.className = 'question-block';
        
        const uniqueName = `${task.task_id}-${question.id}`;
        
        questionDiv.innerHTML = `
          <div class="question-prompt">
            ${question.prompt}
          </div>
          <div class="options-container">
            ${question.options.map((option, optIndex) => {
              const escapedOption = option.replace(/"/g, '&quot;').replace(/'/g, '&#39;');
              return `
                <label class="option-button">
                  <input 
                    type="radio" 
                    name="${uniqueName}" 
                    value="${escapedOption}"
                    data-question-id="${question.id}"
                    onchange="saveAnswer('${question.id}', this.value)"
                  >
                  <span>${option}</span>
                </label>
              `;
            }).join('')}
          </div>
        `;
        
        contentDiv.appendChild(questionDiv);
        
        // Restore saved answer
        const savedAnswer = CIPLEEngine.currentTest.sections.listening.answers[question.id];
        if (savedAnswer) {
          const radios = questionDiv.querySelectorAll(`input[name="${uniqueName}"]`);
          radios.forEach(radio => {
            if (radio.value === savedAnswer) {
              radio.checked = true;
              radio.closest('.option-button').classList.add('selected');
            }
          });
        }
      });
      
      container.appendChild(contentDiv);
    }
    
    // ==========================================================================
    // HELPER: Shuffle array
    // ==========================================================================
    
    function shuffleArray(array) {
      const shuffled = [...array];
      for (let i = shuffled.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
      }
      return shuffled;
    }
    
    // ==========================================================================
    // RENDER: Match One (Dropdown style)
    // ==========================================================================
    
    function renderMatchOne(container, task, taskIndex) {
      const contentDiv = document.createElement('div');
      contentDiv.className = 'task-content';
      
      const instructionDiv = document.createElement('div');
      instructionDiv.className = 'alert alert-info';
      instructionDiv.innerHTML = `
        <strong>Instruções:</strong> Ouça o áudio. Contém 10 conversas numeradas (1, 2, 3...).
        Para cada conversa, selecione onde se passa a situação.
      `;
      contentDiv.appendChild(instructionDiv);
      
      // SHUFFLE OPTIONS to prevent predictable order
      const shuffledOptions = shuffleArray(task.content.options);
      
      const tableDiv = document.createElement('div');
      tableDiv.style.cssText = 'margin-top: 1.5rem;';
      
      task.questions.forEach((question, qIndex) => {
        const row = document.createElement('div');
        row.style.cssText = 'display: grid; grid-template-columns: 60px 1fr; gap: 1rem; padding: 1rem; border-bottom: 1px solid var(--border-color); align-items: center;';
        
        const numberCol = document.createElement('div');
        numberCol.style.cssText = 'font-weight: 700; font-size: 1.125rem; color: var(--primary-color); text-align: center;';
        numberCol.textContent = `${qIndex + 1}.`;
        
        const optionsCol = document.createElement('div');
        const uniqueName = `${task.task_id}-${question.id}`;
        const selectId = `select-${question.id}`;
        
        optionsCol.innerHTML = `
          <select 
            id="${selectId}"
            name="${uniqueName}"
            data-question-id="${question.id}"
            onchange="saveAnswer('${question.id}', this.value)"
            style="width: 100%; padding: 0.75rem; border: 2px solid var(--border-color); border-radius: 8px; font-size: 1rem; background: white; cursor: pointer; font-family: 'Space Grotesk', sans-serif;"
          >
            <option value="">Selecione o local...</option>
            ${shuffledOptions.map(option => {
              const escapedOption = option.replace(/"/g, '&quot;').replace(/'/g, '&#39;');
              return `<option value="${escapedOption}">${option}</option>`;
            }).join('')}
          </select>
        `;
        
        row.appendChild(numberCol);
        row.appendChild(optionsCol);
        tableDiv.appendChild(row);
        
        // Restore saved answer
        const savedAnswer = CIPLEEngine.currentTest.sections.listening.answers[question.id];
        if (savedAnswer) {
          setTimeout(() => {
            const select = document.getElementById(selectId);
            if (select) {
              select.value = savedAnswer;
              select.style.borderColor = 'var(--primary-color)';
              select.style.background = 'var(--bg-light)';
            }
          }, 0);
        }
      });
      
      contentDiv.appendChild(tableDiv);
      container.appendChild(contentDiv);
    }
    
    // ==========================================================================
    // SAVE ANSWER
    // ==========================================================================
    
    function saveAnswer(questionId, selectedOption) {
      const allRadios = document.querySelectorAll(`input[data-question-id="${questionId}"]`);
      
      let selectedRadio = null;
      allRadios.forEach(radio => {
        if (radio.value === selectedOption && radio.checked) {
          selectedRadio = radio;
        }
      });
      
      if (selectedRadio) {
        const uniqueName = selectedRadio.name;
        document.querySelectorAll(`input[name="${uniqueName}"]`).forEach(r => {
          r.closest('.option-button').classList.remove('selected');
        });
        selectedRadio.closest('.option-button').classList.add('selected');
      }
      
      CIPLEEngine.saveListeningAnswer(questionId, selectedOption);
      console.log('Answer saved:', questionId, selectedOption);
    }
    
    // ==========================================================================
    // COUNTDOWN TIMER (30 minutes for Listening)
    // ==========================================================================
    
    let timeRemaining = 30 * 60; // 30 minutes in seconds
    let timerInterval = null;
    const TIMER_KEY = `ciple_timer_${EXAM_ID}_listening`;
    
    function startTimer() {
      const savedTimer = localStorage.getItem(TIMER_KEY);
      
      if (savedTimer) {
        const timerData = JSON.parse(savedTimer);
        const elapsed = Math.floor((Date.now() - timerData.startTime) / 1000);
        timeRemaining = Math.max(0, timerData.totalTime - elapsed);
        console.log('⏱️ Resumed listening timer:', timeRemaining, 'seconds remaining');
      } else {
        const timerData = {
          startTime: Date.now(),
          totalTime: timeRemaining
        };
        localStorage.setItem(TIMER_KEY, JSON.stringify(timerData));
        console.log('⏱️ Started listening timer: 30 minutes');
      }
      
      updateTimerDisplay();
      
      timerInterval = setInterval(() => {
        timeRemaining--;
        
        if (timeRemaining <= 0) {
          clearInterval(timerInterval);
          timeRemaining = 0;
          updateTimerDisplay();
          
          // Enable the complete button even if unanswered
          document.getElementById('complete-btn').disabled = false;
          
          alert('⏰ Tempo esgotado!\n\nO tempo oficial para Compreensão do Oral terminou.\n\nPode continuar a responder ou avançar para a próxima secção.');
          return;
        }
        
        updateTimerDisplay();
      }, 1000);
    }
    
    function updateTimerDisplay() {
      const minutes = Math.floor(timeRemaining / 60);
      const seconds = timeRemaining % 60;
      
      const display = `0:${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
      document.getElementById('countdown-timer').textContent = display;
      
      const timerBox = document.getElementById('timer-display');
      
      if (timeRemaining <= 300) {
        timerBox.classList.add('critical');
        timerBox.classList.remove('warning');
      } else if (timeRemaining <= 600) {
        timerBox.classList.add('warning');
      } else {
        timerBox.classList.remove('warning', 'critical');
      }
    }
    
    window.addEventListener('beforeunload', () => {
      if (timerInterval) clearInterval(timerInterval);
    });
    
    // ==========================================================================
    // COMPLETE LISTENING SECTION
    // ==========================================================================
    
    function completeListening() {
      const totalQuestions = listeningData.tasks.reduce((sum, task) => 
        sum + task.questions.length, 0
      );
      
      const answeredCount = Object.keys(
        CIPLEEngine.currentTest.sections.listening.answers
      ).length;
      
      if (answeredCount < totalQuestions) {
        const unanswered = totalQuestions - answeredCount;
        if (!confirm(
          `Ainda tem ${unanswered} pergunta(s) por responder.\n\n` +
          `Tem a certeza que quer continuar?`
        )) {
          return;
        }
      }
      
      // Clear timer
      localStorage.removeItem(TIMER_KEY);
      if (timerInterval) clearInterval(timerInterval);
      
      showLoading();
      
      setTimeout(() => {
        const result = CIPLEEngine.completeListeningSection(listeningData);
        hideLoading();
        
        // Silent completion - keep suspense
        console.log('✅ Listening completed:', result);
        
        // Navigate to SPEAKING (final section)
        window.location.href = `speaking.html?exam=${EXAM_ID}`;
      }, 500);
    }
    
    function goBack() {
      if (confirm('Tem a certeza que quer voltar? O progresso está guardado.')) {
        window.location.href = `writing.html?exam=${EXAM_ID}`;
      }
    }
    
    function restartTest() {
      if (!confirm(
        'Recomeçar este teste?\n\n' +
        'Todo o progresso atual será apagado e poderá começar de novo.\n\n' +
        'Esta ação não pode ser revertida.'
      )) {
        return;
      }
      
      localStorage.removeItem(`ciple_test_${EXAM_ID}`);
      localStorage.removeItem(`ciple_timer_${EXAM_ID}_reading_writing`);
      localStorage.removeItem(`ciple_timer_${EXAM_ID}_listening`);
      localStorage.removeItem(`ciple_timer_${EXAM_ID}_speaking`);
      
      alert('✅ Teste reiniciado com sucesso!\n\nPode começar de novo.');
      window.location.href = 'index.html';
    }
    
    function updateProgress() {
      const progress = CIPLEEngine.getProgress();
      document.getElementById('progress-text').textContent = `${progress.completed}/4 Secções`;
      document.getElementById('progress-fill').style.width = `${progress.percentage}%`;
    }
    
    function showLoading() {
      document.getElementById('loading-overlay').style.display = 'flex';
    }
    
    function hideLoading() {
      document.getElementById('loading-overlay').style.display = 'none';
    }
    
  </script>

</body>
</html>
