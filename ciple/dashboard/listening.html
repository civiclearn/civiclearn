<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CIPLE - Compreensão do Oral</title>
  <link rel="stylesheet" href="../assets/css/ciple-styles.css">
</head>
<body>

  <!-- Progress Header -->
  <div class="test-header">
    <div class="progress-container">
      <div class="progress-info">
        <span>Progresso do Teste</span>
        <span id="progress-text">2/4 Secções</span>
      </div>
      <div class="progress-bar">
        <div class="progress-fill" id="progress-fill" style="width: 50%"></div>
      </div>
    </div>
  </div>

  <!-- Main Content -->
  <div class="container">
    
    <!-- Instructions Card -->
    <div class="card">
      <h1 class="card-title">Compreensão do Oral</h1>
      <p class="card-subtitle">
        Ouça atentamente os áudios e responda às questões. 
        Tempo sugerido: <strong>35 minutos</strong>
      </p>
      <div class="alert alert-info">
        <strong>Instruções:</strong> Pode ouvir cada áudio quantas vezes quiser. 
        As suas respostas são guardadas automaticamente.
      </div>
    </div>

    <!-- Tasks Container -->
    <div id="tasks-container">
      <!-- Tasks will be dynamically loaded here -->
    </div>

    <!-- Navigation -->
    <div class="nav-buttons">
      <button class="btn btn-secondary" onclick="goBack()">
        ← Voltar à Leitura
      </button>
      <button class="btn btn-primary btn-large" id="complete-btn" onclick="completeListening()">
        Completar Oral →
      </button>
    </div>

  </div>

  <!-- Loading Overlay -->
  <div id="loading-overlay" class="loading-overlay" style="display: none;">
    <div class="spinner"></div>
  </div>

  <!-- Scripts -->
  <script src="../assets/js/ciple-engine-v2.js"></script>
  <script>
    // ==========================================================================
    // LISTENING TEST LOGIC
    // ==========================================================================
    
    let listeningData = null;
    
    // Get exam ID from URL parameter
    const urlParams = new URLSearchParams(window.location.search);
    const EXAM_ID = urlParams.get('exam') || 'ciple-04';
    
    // Initialize on page load
    window.addEventListener('DOMContentLoaded', async () => {
      try {
        // Initialize engine
        CIPLEEngine.init(EXAM_ID);
        
        // Load listening JSON (dynamic based on exam ID)
        const response = await fetch(`../data/${EXAM_ID}-listening.json`);
        
        if (!response.ok) {
          throw new Error(`Failed to load test data: ${response.status} ${response.statusText}`);
        }
        
        listeningData = await response.json();
        
        // Render tasks
        renderTasks();
        
        // Update progress
        updateProgress();
        
      } catch (error) {
        console.error('Error loading listening test:', error);
        alert('Erro ao carregar o teste. Por favor, recarregue a página.\n\nDetalhes: ' + error.message);
      }
    });
    
    // ==========================================================================
    // RENDER TASKS
    // ==========================================================================
    
    function renderTasks() {
      const container = document.getElementById('tasks-container');
      container.innerHTML = '';
      
      listeningData.tasks.forEach((task, taskIndex) => {
        const taskDiv = document.createElement('div');
        taskDiv.className = 'card task-container';
        
        // Task Header
        taskDiv.innerHTML = `
          <div class="task-header">
            <h2 class="task-title">${task.title}</h2>
            <p class="task-instructions">${task.instructions}</p>
          </div>
        `;
        
        // Audio Player
        const audioDiv = document.createElement('div');
        audioDiv.className = 'audio-container';
        audioDiv.innerHTML = `
          <audio controls class="audio-player" preload="metadata">
            <source src="${task.content.audio}" type="audio/mpeg">
            O seu navegador não suporta o elemento de áudio.
          </audio>
        `;
        taskDiv.appendChild(audioDiv);
        
        // Render questions based on task type
        if (task.type === 'single_audio_mcq') {
          renderSingleAudioMCQ(taskDiv, task, taskIndex);
        } else if (task.type === 'match_one') {
          renderMatchOne(taskDiv, task, taskIndex);
        }
        
        container.appendChild(taskDiv);
      });
    }
    
    // ==========================================================================
    // RENDER: Single Audio MCQ (Tasks 1-10)
    // ==========================================================================
    
    function renderSingleAudioMCQ(container, task, taskIndex) {
      const contentDiv = document.createElement('div');
      contentDiv.className = 'task-content';
      
      task.questions.forEach((question, qIndex) => {
        const questionDiv = document.createElement('div');
        questionDiv.className = 'question-block';
        
        // FIXED: Use unique radio button name combining task_id and question_id
        const uniqueName = `${task.task_id}-${question.id}`;
        
        questionDiv.innerHTML = `
          <div class="question-prompt">
            ${question.prompt}
          </div>
          <div class="options-container">
            ${question.options.map((option, optIndex) => {
              // Escape special characters for HTML attributes
              const escapedOption = option.replace(/"/g, '&quot;').replace(/'/g, '&#39;');
              return `
                <label class="option-button">
                  <input 
                    type="radio" 
                    name="${uniqueName}" 
                    value="${escapedOption}"
                    data-question-id="${question.id}"
                    onchange="saveAnswer('${question.id}', this.value)"
                  >
                  <span>${option}</span>
                </label>
              `;
            }).join('')}
          </div>
        `;
        
        contentDiv.appendChild(questionDiv);
        
        // Restore saved answer
        const savedAnswer = CIPLEEngine.currentTest.sections.listening.answers[question.id];
        if (savedAnswer) {
          const radios = questionDiv.querySelectorAll(`input[name="${uniqueName}"]`);
          radios.forEach(radio => {
            if (radio.value === savedAnswer) {
              radio.checked = true;
              radio.closest('.option-button').classList.add('selected');
            }
          });
        }
      });
      
      container.appendChild(contentDiv);
    }
    
function renderMatchOne(container, task, taskIndex) {
  const contentDiv = document.createElement('div');
  contentDiv.className = 'task-content';
  
  // Instructions
  const instructionDiv = document.createElement('div');
  instructionDiv.className = 'alert alert-info';
  instructionDiv.innerHTML = `
    <strong>Instruções:</strong> Ouça o áudio. Contém 10 conversas numeradas (1, 2, 3...).
    Para cada conversa, selecione onde se passa a situação.
  `;
  contentDiv.appendChild(instructionDiv);
  
  // Create table-style layout
  const tableDiv = document.createElement('div');
  tableDiv.style.cssText = 'margin-top: 1.5rem;';
  
  task.questions.forEach((question, qIndex) => {
    const row = document.createElement('div');
    row.style.cssText = 'display: grid; grid-template-columns: 60px 1fr; gap: 1rem; padding: 1rem; border-bottom: 1px solid var(--border-color); align-items: center;';
    
    // Number column
    const numberCol = document.createElement('div');
    numberCol.style.cssText = 'font-weight: 700; font-size: 1.125rem; color: var(--primary-color); text-align: center;';
    numberCol.textContent = `${qIndex + 1}.`;
    
    // Options column
    const optionsCol = document.createElement('div');
    const uniqueName = `${task.task_id}-${question.id}`;
    
    // Use SELECT dropdown instead of radio buttons
    const selectId = `select-${question.id}`;
    optionsCol.innerHTML = `
      <select 
        id="${selectId}"
        name="${uniqueName}"
        data-question-id="${question.id}"
        onchange="saveAnswer('${question.id}', this.value)"
        style="width: 100%; padding: 0.75rem; border: 2px solid var(--border-color); border-radius: 8px; font-size: 1rem; background: white; cursor: pointer;"
      >
        <option value="">Selecione o local...</option>
        ${task.content.options.map(option => {
          const escapedOption = option.replace(/"/g, '&quot;').replace(/'/g, '&#39;');
          return `<option value="${escapedOption}">${option}</option>`;
        }).join('')}
      </select>
    `;
    
    row.appendChild(numberCol);
    row.appendChild(optionsCol);
    tableDiv.appendChild(row);
    
    // Restore saved answer
    const savedAnswer = CIPLEEngine.currentTest.sections.listening.answers[question.id];
    if (savedAnswer) {
      setTimeout(() => {
        const select = document.getElementById(selectId);
        if (select) {
          select.value = savedAnswer;
          select.style.borderColor = 'var(--primary-color)';
          select.style.background = 'var(--bg-light)';
        }
      }, 0);
    }
  });
  
  contentDiv.appendChild(tableDiv);
  container.appendChild(contentDiv);
}
    
    // ==========================================================================
    // SAVE ANSWER - FIXED
    // ==========================================================================
    
    function saveAnswer(questionId, selectedOption) {
      // Find the radio button that was just selected
      const allRadios = document.querySelectorAll(`input[data-question-id="${questionId}"]`);
      
      // Find which one was selected
      let selectedRadio = null;
      allRadios.forEach(radio => {
        if (radio.value === selectedOption && radio.checked) {
          selectedRadio = radio;
        }
      });
      
      if (selectedRadio) {
        // Get the unique name for this question's radio group
        const uniqueName = selectedRadio.name;
        
        // Remove 'selected' class from all options in this question's group
        document.querySelectorAll(`input[name="${uniqueName}"]`).forEach(r => {
          r.closest('.option-button').classList.remove('selected');
        });
        
        // Add 'selected' class to chosen option
        selectedRadio.closest('.option-button').classList.add('selected');
      }
      
      // Save to engine (this stores by question.id, which is what we want)
      CIPLEEngine.saveListeningAnswer(questionId, selectedOption);
      
      console.log('Answer saved:', questionId, selectedOption);
    }
    
    // ==========================================================================
    // COMPLETE LISTENING SECTION
    // ==========================================================================
    
    function completeListening() {
      // Count total questions
      const totalQuestions = listeningData.tasks.reduce((sum, task) => 
        sum + task.questions.length, 0
      );
      
      const answeredCount = Object.keys(
        CIPLEEngine.currentTest.sections.listening.answers
      ).length;
      
      if (answeredCount < totalQuestions) {
        const unanswered = totalQuestions - answeredCount;
        if (!confirm(
          `Ainda tem ${unanswered} pergunta(s) por responder.\n\n` +
          `Tem a certeza que quer continuar?`
        )) {
          return;
        }
      }
      
      // Grade the section
      showLoading();
      
      setTimeout(() => {
        const result = CIPLEEngine.completeListeningSection(listeningData);
        
        hideLoading();
        
        // Show results
        alert(
          `Secção de Oral Completa!\n\n` +
          `Pontuação: ${result.score}%\n` +
          `Corretas: ${result.correctCount}/${result.totalQuestions}\n\n` +
          `Agora vamos para a Produção Escrita.`
        );
        
        // Navigate to writing (pass exam ID)
        window.location.href = `writing.html?exam=${EXAM_ID}`;
      }, 500);
    }
    
    // ==========================================================================
    // NAVIGATION
    // ==========================================================================
    
    function goBack() {
      if (confirm('Tem a certeza que quer voltar? O progresso está guardado.')) {
        window.location.href = `reading.html?exam=${EXAM_ID}`;
      }
    }
    
    // ==========================================================================
    // PROGRESS UPDATE
    // ==========================================================================
    
    function updateProgress() {
      const progress = CIPLEEngine.getProgress();
      document.getElementById('progress-text').textContent = 
        `${progress.completed}/4 Secções`;
      document.getElementById('progress-fill').style.width = 
        `${progress.percentage}%`;
    }
    
    // ==========================================================================
    // LOADING OVERLAY
    // ==========================================================================
    
    function showLoading() {
      document.getElementById('loading-overlay').style.display = 'flex';
    }
    
    function hideLoading() {
      document.getElementById('loading-overlay').style.display = 'none';
    }
    
  </script>

</body>
</html>
