<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CIPLE - Compreensão da Leitura</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/ciple-styles.css">
  <style>
    /* Override font for modern look */
    body {
      font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, sans-serif;
    }
    
    /* Test identifier badge */
    .test-badge {
      display: inline-block;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 0.875rem;
      font-weight: 600;
      margin-bottom: 12px;
      letter-spacing: 0.5px;
    }
    
    /* Timer display */
    .timer-box {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #fff5f5;
      border: 2px solid #fc8181;
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 600;
      color: #c53030;
      margin-top: 12px;
    }
    
    .timer-icon {
      font-size: 1.2rem;
    }
    
    /* Compact card styling */
    .card {
      padding: 1.75rem;
    }
    
    .card-title {
      font-size: 1.75rem;
      margin-bottom: 0.5rem;
    }
    
    .card-subtitle {
      font-size: 1rem;
      margin-bottom: 1rem;
    }
    
    /* Progress header tweaks */
    .test-header {
      background: white;
      border-bottom: 1px solid #e2e8f0;
      padding: 1rem 0;
      margin-bottom: 1.5rem;
    }
    
    .progress-info span {
      font-size: 0.9rem;
    }
  </style>
</head>
<body>

  <!-- Progress Header -->
  <div class="test-header">
    <div class="progress-container">
      <div class="progress-info">
        <span>Progresso do Teste</span>
        <span id="progress-text">1/4 Secções</span>
      </div>
      <div class="progress-bar">
        <div class="progress-fill" id="progress-fill" style="width: 25%"></div>
      </div>
    </div>
  </div>

  <!-- Main Content -->
  <div class="container">
    
    <!-- Instructions Card -->
    <div class="card">
      <div class="test-badge" id="test-badge">CIPLE-XX</div>
      <h1 class="card-title">Compreensão da Leitura</h1>
      <p class="card-subtitle">
        Leia atentamente os textos e responda às questões.
      </p>
      <div class="timer-box">
        <span class="timer-icon">⏱️</span>
        <span>Tempo oficial: <strong>1h15m</strong> (Leitura + Escrita combinadas)</span>
      </div>
      <div class="alert alert-info" style="margin-top: 1rem;">
        <strong>Instruções:</strong> As suas respostas são guardadas automaticamente. 
        Pode rever as suas respostas antes de submeter.
      </div>
    </div>

    <!-- Tasks Container -->
    <div id="tasks-container">
      <!-- Tasks will be dynamically loaded here -->
    </div>

    <!-- Navigation -->
    <div class="nav-buttons">
      <button class="btn btn-secondary" onclick="goToDashboard()">
        ← Voltar ao Painel
      </button>
      <button class="btn btn-primary btn-large" id="complete-btn" onclick="completeReading()">
        Completar Leitura →
      </button>
    </div>

  </div>

  <!-- Loading Overlay -->
  <div id="loading-overlay" class="loading-overlay" style="display: none;">
    <div class="spinner"></div>
  </div>

  <!-- Scripts -->
  <script src="../assets/js/ciple-engine-v2.js"></script>
  <script>
    // ==========================================================================
    // READING TEST LOGIC
    // ==========================================================================
    
    let readingData = null;
    
    // Get exam ID from URL parameter
    const urlParams = new URLSearchParams(window.location.search);
    const EXAM_ID = urlParams.get('exam') || 'ciple-04';
    
    // Update test badge
    document.getElementById('test-badge').textContent = EXAM_ID.toUpperCase();
    
    // Initialize on page load
    window.addEventListener('DOMContentLoaded', async () => {
      try {
        // Initialize engine
        CIPLEEngine.init(EXAM_ID);
        
        // Load reading JSON (dynamic based on exam ID)
        const response = await fetch(`../data/${EXAM_ID}-reading.json`);
        
        if (!response.ok) {
          throw new Error(`Failed to load test data: ${response.status} ${response.statusText}`);
        }
        
        readingData = await response.json();
        
        // Render tasks
        renderTasks();
        
        // Update progress
        updateProgress();
        
      } catch (error) {
        console.error('Error loading reading test:', error);
        alert('Erro ao carregar o teste. Por favor, recarregue a página.\n\nDetalhes: ' + error.message);
      }
    });
    
    // ==========================================================================
    // RENDER TASKS
    // ==========================================================================
    
    function renderTasks() {
      const container = document.getElementById('tasks-container');
      container.innerHTML = '';
      
      readingData.tasks.forEach((task, taskIndex) => {
        const taskDiv = document.createElement('div');
        taskDiv.className = 'card task-container';
        
        // Task Header
        taskDiv.innerHTML = `
          <div class="task-header">
            <h2 class="task-title">${task.title}</h2>
            <p class="task-instructions">${task.instructions}</p>
          </div>
        `;
        
        // Render based on task type
        if (task.type === 'match_one') {
          renderMatchOneTask(taskDiv, task, taskIndex);
        } else if (task.type === 'single_text_mcq') {
          renderSingleTextMCQ(taskDiv, task, taskIndex);
        } else if (task.type === 'long_text_mcq') {
          renderLongTextMCQ(taskDiv, task, taskIndex);
        }
        
        container.appendChild(taskDiv);
      });
    }
    
    // ==========================================================================
    // RENDER: Match One (Reading Task 1)
    // ==========================================================================
    
    function renderMatchOneTask(container, task, taskIndex) {
      const contentDiv = document.createElement('div');
      contentDiv.className = 'task-content';
      
      task.questions.forEach((question, qIndex) => {
        const questionDiv = document.createElement('div');
        questionDiv.className = 'question-block';
        
        // FIXED: Use unique radio button name combining task_id and question_id
        const uniqueName = `${task.task_id}-${question.id}`;
        
        questionDiv.innerHTML = `
          <div class="question-prompt">
            ${qIndex + 1}. ${question.prompt}
          </div>
          <div class="options-container">
            ${question.options.map(option => `
              <label class="option-button">
                <input 
                  type="radio" 
                  name="${uniqueName}" 
                  value="${option.id}"
                  data-question-id="${question.id}"
                  onchange="saveAnswer('${task.task_id}-${question.id}', '${option.id}')"
                >
                <span>${option.text}</span>
              </label>
            `).join('')}
          </div>
        `;
        
        contentDiv.appendChild(questionDiv);
        
        // Restore saved answer
        const savedAnswer = CIPLEEngine.currentTest.sections.reading.answers[`${task.task_id}-${question.id}`];
        if (savedAnswer) {
          const radio = questionDiv.querySelector(`input[name="${uniqueName}"][value="${savedAnswer}"]`);
          if (radio) {
            radio.checked = true;
            radio.closest('.option-button').classList.add('selected');
          }
        }
      });
      
      container.appendChild(contentDiv);
    }
    
    // ==========================================================================
    // RENDER: Single Text MCQ (Reading Task 2)
    // ==========================================================================
    
    function renderSingleTextMCQ(container, task, taskIndex) {
      const contentDiv = document.createElement('div');
      contentDiv.className = 'task-content';
      
      // Create a map of texts
      const textsMap = {};
      task.content.texts.forEach(t => {
        textsMap[t.id] = t.text;
      });
      
      task.questions.forEach((question, qIndex) => {
        const questionDiv = document.createElement('div');
        questionDiv.className = 'question-block';
        
        // Show the text for this question
        const textContent = textsMap[question.text_id];
        
        const uniqueName = `${task.task_id}-${question.id}`;
        
        questionDiv.innerHTML = `
          <div class="reading-text">
            ${textContent.replace(/\n/g, '<br>')}
          </div>
          <div class="question-prompt">
            ${qIndex + 1}. ${question.question}
          </div>
          <div class="options-container">
            ${question.options.map(option => `
              <label class="option-button">
                <input 
                  type="radio" 
                  name="${uniqueName}" 
                  value="${option.id}"
                  data-question-id="${question.id}"
                  onchange="saveAnswer('${task.task_id}-${question.id}', '${option.id}')"
                >
                <span>${option.text}</span>
              </label>
            `).join('')}
          </div>
        `;
        
        contentDiv.appendChild(questionDiv);
        
        // Restore saved answer
        const savedAnswer = CIPLEEngine.currentTest.sections.reading.answers[`${task.task_id}-${question.id}`];
        if (savedAnswer) {
          const radio = questionDiv.querySelector(`input[name="${uniqueName}"][value="${savedAnswer}"]`);
          if (radio) {
            radio.checked = true;
            radio.closest('.option-button').classList.add('selected');
          }
        }
      });
      
      container.appendChild(contentDiv);
    }
    
    // ==========================================================================
    // RENDER: Long Text MCQ (Reading Tasks 3 & 4)
    // ==========================================================================
    
    function renderLongTextMCQ(container, task, taskIndex) {
      const contentDiv = document.createElement('div');
      contentDiv.className = 'task-content';
      
      // Show the main text once at the top
      contentDiv.innerHTML = `
        <div class="reading-text">
          ${task.content.text.replace(/\n/g, '<br>')}
        </div>
      `;
      
      task.questions.forEach((question, qIndex) => {
        const questionDiv = document.createElement('div');
        questionDiv.className = 'question-block';
        
        // FIXED: Use unique radio button name combining task_id and question_id
        const uniqueName = `${task.task_id}-${question.id}`;
        
        questionDiv.innerHTML = `
          <div class="question-prompt">
            ${qIndex + 1}. ${question.question}
          </div>
          <div class="options-container">
            ${question.options.map(option => `
              <label class="option-button">
                <input 
                  type="radio" 
                  name="${uniqueName}" 
                  value="${option.id}"
                  data-question-id="${question.id}"
                  onchange="saveAnswer('${task.task_id}-${question.id}', '${option.id}')"
                >
                <span>${option.text}</span>
              </label>
            `).join('')}
          </div>
        `;
        
        contentDiv.appendChild(questionDiv);
        
        // Restore saved answer
        const savedAnswer = CIPLEEngine.currentTest.sections.reading.answers[`${task.task_id}-${question.id}`];
        if (savedAnswer) {
          const radio = questionDiv.querySelector(`input[name="${uniqueName}"][value="${savedAnswer}"]`);
          if (radio) {
            radio.checked = true;
            radio.closest('.option-button').classList.add('selected');
          }
        }
      });
      
      container.appendChild(contentDiv);
    }
    
    // ==========================================================================
    // SAVE ANSWER
    // ==========================================================================
    
    function saveAnswer(questionId, selectedOption) {
      CIPLEEngine.saveReadingAnswer(questionId, selectedOption);
      
      // Visual feedback
      document.querySelectorAll(`input[name="${questionId}"]`).forEach(radio => {
        radio.closest('.option-button').classList.remove('selected');
      });
      
      const selectedRadio = document.querySelector(`input[name="${questionId}"][value="${selectedOption}"]`);
      if (selectedRadio) {
        selectedRadio.closest('.option-button').classList.add('selected');
      }
      
      console.log(`Saved: ${questionId} = ${selectedOption}`);
    }
    
    // ==========================================================================
    // COMPLETE READING
    // ==========================================================================
    
    function completeReading() {
      const result = CIPLEEngine.completeReadingSection(readingData);
      
      alert(`Secção de Leitura Completa!\n\nPontuação: ${result.score}%\nCorretas: ${result.correctCount} de ${result.totalQuestions}`);
      
      // Go to next section or dashboard
      window.location.href = 'index.html';
    }
    
    // ==========================================================================
    // NAVIGATION
    // ==========================================================================
    
    function goToDashboard() {
      window.location.href = 'index.html';
    }
    
    // ==========================================================================
    // PROGRESS
    // ==========================================================================
    
    function updateProgress() {
      const progress = CIPLEEngine.getProgress();
      document.getElementById('progress-text').textContent = `${progress.completed}/4 Secções`;
      document.getElementById('progress-fill').style.width = `${progress.percentage}%`;
    }
    
  </script>

</body>
</html>
