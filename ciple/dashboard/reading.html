<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CIPLE - Compreensão da Leitura</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="/ciple/assets/js/ciple-auth.js?v=2"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/ciple-styles.css">
  <style>
    /* Override font for modern look */
    body {
      font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, sans-serif;
    }
    
    /* Test identifier badge */
    .test-badge {
      display: inline-block;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 0.875rem;
      font-weight: 600;
      margin-bottom: 12px;
      letter-spacing: 0.5px;
    }
    
    /* Timer display */
    .timer-box {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      background: #fff5f5;
      border: 2px solid #fc8181;
      padding: 12px 20px;
      border-radius: 12px;
      font-size: 1.1rem;
      font-weight: 600;
      color: #c53030;
      margin-top: 12px;
    }
    
    .timer-icon {
      font-size: 1.5rem;
    }
    
    #countdown-timer {
      font-family: 'Space Grotesk', monospace;
      font-size: 1.3rem;
      font-weight: 700;
      letter-spacing: 1px;
    }
    
    .timer-box.warning {
      background: #fffaf0;
      border-color: #ed8936;
      color: #c05621;
      animation: pulse 1s ease-in-out infinite;
    }
    
    .timer-box.critical {
      background: #fff5f5;
      border-color: #f56565;
      color: #c53030;
      animation: pulse 0.5s ease-in-out infinite;
    }
    
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.8; }
    }
    
    /* Compact card styling */
    .card {
      padding: 1.75rem;
    }
    
    .card-title {
      font-size: 1.75rem;
      margin-bottom: 0.5rem;
    }
    
    .card-subtitle {
      font-size: 1rem;
      margin-bottom: 1rem;
    }
    
    /* Progress header tweaks */
    .test-header {
      background: white;
      border-bottom: 1px solid #e2e8f0;
      padding: 1rem 0;
      margin-bottom: 1.5rem;
    }
    
    .progress-info span {
      font-size: 0.9rem;
    }
    
    /* PROFESSIONAL BUTTON STYLES */
    .btn {
      font-family: 'Space Grotesk', sans-serif;
      padding: 14px 28px;
      border-radius: 10px;
      border: none;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    
    .btn-secondary {
      background: #f7fafc;
      color: #2d3748;
      border: 2px solid #e2e8f0;
    }
    
    .btn-secondary:hover {
      background: #edf2f7;
      border-color: #cbd5e0;
      transform: translateY(-1px);
    }
    
    .btn-primary {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
    }
    
    .btn-primary:hover {
      box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
      transform: translateY(-2px);
    }
    
    .btn-primary:active, .btn-secondary:active {
      transform: translateY(0);
    }
    
    .btn-large {
      padding: 16px 32px;
      font-size: 1.05rem;
    }
    
    .nav-buttons {
      display: flex;
      gap: 16px;
      justify-content: space-between;
      margin-top: 2rem;
      padding-top: 2rem;
      border-top: 1px solid #e2e8f0;
    }
  </style>
</head>
<body>

  <!-- Progress Header -->
  <div class="test-header">
    <div class="progress-container">
      <div class="progress-info">
        <span>Progresso do Teste</span>
        <span id="progress-text">1/4 Secções</span>
      </div>
      <div class="progress-bar">
        <div class="progress-fill" id="progress-fill" style="width: 25%"></div>
      </div>
    </div>
  </div>

  <!-- Main Content -->
  <div class="container">
    
    <!-- Instructions Card -->
    <div class="card">
      <div class="test-badge" id="test-badge">CIPLE-XX</div>
      <h1 class="card-title">Compreensão da Leitura</h1>
      <p class="card-subtitle">
        Leia atentamente os textos e responda às questões.
      </p>
      <div class="timer-box" id="timer-display">
        <span class="timer-icon">⏱️</span>
        <div>
          <div style="font-size: 0.75rem; opacity: 0.8; margin-bottom: 2px;">Tempo restante:</div>
          <div id="countdown-timer">1:15:00</div>
        </div>
      </div>
      <div class="alert alert-info" style="margin-top: 1rem;">
        <strong>Instruções:</strong> As suas respostas são guardadas automaticamente. 
        Pode rever as suas respostas antes de submeter.
      </div>
    </div>

    <!-- Tasks Container -->
    <div id="tasks-container">
      <!-- Tasks will be dynamically loaded here -->
    </div>

    <!-- Navigation -->
    <div class="nav-buttons">
      <button class="btn btn-secondary" onclick="goToDashboard()">
        ← Voltar ao Painel
      </button>
      <button class="btn" onclick="restartTest()" style="background: #ed8936; color: white; border: 2px solid #dd6b20;">
        🔄 Recomeçar Teste
      </button>
      <button class="btn btn-primary btn-large" id="complete-btn" onclick="completeReading()">
        Completar Leitura →
      </button>
    </div>

  </div>

  <!-- Loading Overlay -->
  <div id="loading-overlay" class="loading-overlay" style="display: none;">
    <div class="spinner"></div>
  </div>

  <!-- Scripts -->
  <script src="/ciple/assets/js/ciple-engine-v2.js?v=4"></script>
  <script>
    // ==========================================================================
    // READING TEST LOGIC
    // ==========================================================================
    
    let readingData = null;
    
    // Get exam ID from URL parameter
    const urlParams = new URLSearchParams(window.location.search);
    const EXAM_ID = urlParams.get('exam') || 'ciple-04';
    
    // Update test badge
    document.getElementById('test-badge').textContent = EXAM_ID.toUpperCase();
    
    // Initialize on page load
    window.addEventListener('DOMContentLoaded', async () => {
      try {
        // Initialize engine
        CIPLEEngine.init(EXAM_ID);
        
        // Load reading JSON (dynamic based on exam ID)
        const response = await fetch(`../data/${EXAM_ID}-reading.json`);
        
        if (!response.ok) {
          throw new Error(`Failed to load test data: ${response.status} ${response.statusText}`);
        }
        
        readingData = await response.json();
        
        // Render tasks
        renderTasks();
        
        // Update progress
        updateProgress();
        
      } catch (error) {
        console.error('Error loading reading test:', error);
        alert('Erro ao carregar o teste. Por favor, recarregue a página.\n\nDetalhes: ' + error.message);
      }
    });
    
    // ==========================================================================
    // RENDER TASKS
    // ==========================================================================
    
    function renderTasks() {
      const container = document.getElementById('tasks-container');
      container.innerHTML = '';
      
      readingData.tasks.forEach((task, taskIndex) => {
        const taskDiv = document.createElement('div');
        taskDiv.className = 'card task-container';
        
        // Task Header
        taskDiv.innerHTML = `
          <div class="task-header">
            <h2 class="task-title">${task.title}</h2>
            <p class="task-instructions">${task.instructions}</p>
          </div>
        `;
        
        // Render based on task type
        if (task.type === 'match_one') {
          renderMatchOneTask(taskDiv, task, taskIndex);
        } else if (task.type === 'single_text_mcq') {
          renderSingleTextMCQ(taskDiv, task, taskIndex);
        } else if (task.type === 'long_text_mcq') {
          renderLongTextMCQ(taskDiv, task, taskIndex);
        }
        
        container.appendChild(taskDiv);
      });
    }
    
    // ==========================================================================
    // RENDER: Match One (Reading Task 1 - radio buttons with individual options)
    // ==========================================================================
    
    function renderMatchOneTask(container, task, taskIndex) {
      const contentDiv = document.createElement('div');
      contentDiv.className = 'task-content';
      
      task.questions.forEach((question, qIndex) => {
        const questionDiv = document.createElement('div');
        questionDiv.className = 'question-block';
        
        // FIXED: Use unique radio button name combining task_id and question_id
        const uniqueName = `${task.task_id}-${question.id}`;
        
        questionDiv.innerHTML = `
          <div class="question-prompt">
            ${qIndex + 1}. ${question.prompt}
          </div>
          <div class="options-container">
            ${question.options.map(option => `
              <label class="option-button">
                <input 
                  type="radio" 
                  name="${uniqueName}" 
                  value="${option.id}"
                  data-question-id="${question.id}"
                  onchange="saveAnswer('${task.task_id}-${question.id}', '${option.id}')"
                >
                <span>${option.text}</span>
              </label>
            `).join('')}
          </div>
        `;
        
        contentDiv.appendChild(questionDiv);
        
        // Restore saved answer
        const savedAnswer = CIPLEEngine.currentTest.sections.reading.answers[`${task.task_id}-${question.id}`];
        if (savedAnswer) {
          const radio = questionDiv.querySelector(`input[name="${uniqueName}"][value="${savedAnswer}"]`);
          if (radio) {
            radio.checked = true;
            radio.closest('.option-button').classList.add('selected');
          }
        }
      });
      
      container.appendChild(contentDiv);
    }
    
    // ==========================================================================
    // RENDER: Single Text MCQ (Reading Task 2)
    // ==========================================================================
    
    function renderSingleTextMCQ(container, task, taskIndex) {
      const contentDiv = document.createElement('div');
      contentDiv.className = 'task-content';
      
      // Create a map of texts
      const textsMap = {};
      task.content.texts.forEach(t => {
        textsMap[t.id] = t.text;
      });
      
      task.questions.forEach((question, qIndex) => {
        const questionDiv = document.createElement('div');
        questionDiv.className = 'question-block';
        
        // Show the text for this question
        const textContent = textsMap[question.text_id];
        
        const uniqueName = `${task.task_id}-${question.id}`;
        
        questionDiv.innerHTML = `
          <div class="reading-text">
            ${textContent.replace(/\n/g, '<br>')}
          </div>
          <div class="question-prompt">
            ${qIndex + 1}. ${question.question}
          </div>
          <div class="options-container">
            ${question.options.map(option => `
              <label class="option-button">
                <input 
                  type="radio" 
                  name="${uniqueName}" 
                  value="${option.id}"
                  data-question-id="${question.id}"
                  onchange="saveAnswer('${task.task_id}-${question.id}', '${option.id}')"
                >
                <span>${option.text}</span>
              </label>
            `).join('')}
          </div>
        `;
        
        contentDiv.appendChild(questionDiv);
        
        // Restore saved answer
        const savedAnswer = CIPLEEngine.currentTest.sections.reading.answers[`${task.task_id}-${question.id}`];
        if (savedAnswer) {
          const radio = questionDiv.querySelector(`input[name="${uniqueName}"][value="${savedAnswer}"]`);
          if (radio) {
            radio.checked = true;
            radio.closest('.option-button').classList.add('selected');
          }
        }
      });
      
      container.appendChild(contentDiv);
    }
    
    // ==========================================================================
    // HELPER: Shuffle array
    // ==========================================================================
    
    function shuffleArray(array) {
      const shuffled = [...array];
      for (let i = shuffled.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
      }
      return shuffled;
    }
    
    // ==========================================================================
    // RENDER: Long Text MCQ (Reading Tasks 3 & 4)
    // Task 7 (Karim) uses same 5 options for all questions - shuffle once
    // Task 8 (Tânia) uses different options per question - shuffle individually
    // ==========================================================================
    
    function renderLongTextMCQ(container, task, taskIndex) {
      const contentDiv = document.createElement('div');
      contentDiv.className = 'task-content';
      
      // Show the main text once at the top
      contentDiv.innerHTML = `
        <div class="reading-text">
          ${task.content.text.replace(/\n/g, '<br>')}
        </div>
      `;
      
      // Check if all questions share same options (like Task 7)
      // Compare option TEXT not just IDs (Task 8 reuses a,b,c but different text)
      const firstOptions = task.questions[0].options.map(o => o.text).sort().join('|');
      const allSameOptions = task.questions.every(q => 
        q.options.map(o => o.text).sort().join('|') === firstOptions
      );
      
      // If shared options, shuffle once; otherwise shuffle per question
      const sharedShuffledOptions = allSameOptions ? shuffleArray([...task.questions[0].options]) : null;
      
      task.questions.forEach((question, qIndex) => {
        const questionDiv = document.createElement('div');
        questionDiv.className = 'question-block';
        
        const uniqueName = `${task.task_id}-${question.id}`;
        
        // Use shared shuffled options OR shuffle this question's options
        const optionsToRender = sharedShuffledOptions || shuffleArray([...question.options]);
        
        questionDiv.innerHTML = `
          <div class="question-prompt">
            ${qIndex + 1}. ${question.question}
          </div>
          <div class="options-container">
            ${optionsToRender.map(option => `
              <label class="option-button">
                <input 
                  type="radio" 
                  name="${uniqueName}" 
                  value="${option.id}"
                  data-question-id="${question.id}"
                  onchange="saveAnswer('${task.task_id}-${question.id}', '${option.id}')"
                >
                <span>${option.text}</span>
              </label>
            `).join('')}
          </div>
        `;
        
        contentDiv.appendChild(questionDiv);
        
        // Restore saved answer
        const savedAnswer = CIPLEEngine.currentTest.sections.reading.answers[`${task.task_id}-${question.id}`];
        if (savedAnswer) {
          const radio = questionDiv.querySelector(`input[name="${uniqueName}"][value="${savedAnswer}"]`);
          if (radio) {
            radio.checked = true;
            radio.closest('.option-button').classList.add('selected');
          }
        }
      });
      
      container.appendChild(contentDiv);
    }
    
    // ==========================================================================
    // SAVE ANSWER
    // ==========================================================================
    
    function saveAnswer(questionId, selectedOption) {
      CIPLEEngine.saveReadingAnswer(questionId, selectedOption);
      
      // Visual feedback
      document.querySelectorAll(`input[name="${questionId}"]`).forEach(radio => {
        radio.closest('.option-button').classList.remove('selected');
      });
      
      const selectedRadio = document.querySelector(`input[name="${questionId}"][value="${selectedOption}"]`);
      if (selectedRadio) {
        selectedRadio.closest('.option-button').classList.add('selected');
      }
      
      console.log(`Saved: ${questionId} = ${selectedOption}`);
    }
    
    // ==========================================================================
    // COMPLETE READING
    // ==========================================================================
    
    function completeReading() {
      const result = CIPLEEngine.completeReadingSection(readingData);
      
      // Silent completion - keep suspense for final results
      console.log('✅ Reading completed:', result);
      
      // Navigate to WRITING (they share the same 1h15m timer)
      window.location.href = `writing.html?exam=${EXAM_ID}`;
    }
    
    // ==========================================================================
    // NAVIGATION
    // ==========================================================================
    
    function goToDashboard() {
      window.location.href = 'index.html';
    }
    
    function restartTest() {
      if (!confirm(
        'Recomeçar este teste?\n\n' +
        'Todo o progresso atual será apagado e poderá começar de novo.\n\n' +
        'Esta ação não pode ser revertida.'
      )) {
        return;
      }
      
      // Clear all test data for this exam
      localStorage.removeItem(`ciple_test_${EXAM_ID}`);
      localStorage.removeItem(`ciple_timer_${EXAM_ID}_reading_writing`);
      localStorage.removeItem(`ciple_timer_${EXAM_ID}_listening`);
      localStorage.removeItem(`ciple_timer_${EXAM_ID}_speaking`);
      
      // Redirect to dashboard
      alert('✅ Teste reiniciado com sucesso!\n\nPode começar de novo.');
      window.location.href = 'index.html';
    }
    
    // ==========================================================================
    // PROGRESS
    // ==========================================================================
    
    function updateProgress() {
      const progress = CIPLEEngine.getProgress();
      document.getElementById('progress-text').textContent = `${progress.completed}/4 Secções`;
      document.getElementById('progress-fill').style.width = `${progress.percentage}%`;
    }
    
    // ==========================================================================
    // COUNTDOWN TIMER (Shared with Writing: 1h15m total)
    // ==========================================================================
    
    let timeRemaining = 75 * 60; // 1h15m in seconds
    let timerInterval = null;
    const TIMER_KEY = `ciple_timer_${EXAM_ID}_reading_writing`;
    
    function startTimer() {
      // If this is a fresh test (no reading answers yet), clear any stale timer
      const hasReadingAnswers = Object.keys(CIPLEEngine.currentTest.sections.reading.answers).length > 0;
      const hasWritingData = CIPLEEngine.currentTest.sections.writing.completed || 
                             Object.keys(CIPLEEngine.currentTest.sections.writing.responses).length > 0;
      
      if (!hasReadingAnswers && !hasWritingData) {
        // Fresh test - remove any old timer
        localStorage.removeItem(TIMER_KEY);
        console.log('🔄 Cleared stale timer for fresh test');
      }
      
      // Check if timer already exists (returning to reading)
      const savedTimer = localStorage.getItem(TIMER_KEY);
      
      if (savedTimer) {
        const timerData = JSON.parse(savedTimer);
        const elapsed = Math.floor((Date.now() - timerData.startTime) / 1000);
        timeRemaining = Math.max(0, timerData.totalTime - elapsed);
        console.log('⏱️ Resumed timer:', timeRemaining, 'seconds remaining');
      } else {
        // First time starting timer
        const timerData = {
          startTime: Date.now(),
          totalTime: timeRemaining
        };
        localStorage.setItem(TIMER_KEY, JSON.stringify(timerData));
        console.log('⏱️ Started new timer: 1h15m');
      }
      
      updateTimerDisplay();
      
      timerInterval = setInterval(() => {
        timeRemaining--;
        
        if (timeRemaining <= 0) {
          clearInterval(timerInterval);
          timeRemaining = 0;
          updateTimerDisplay();
          
          // Enable the complete button even if unanswered
          document.getElementById('complete-btn').disabled = false;
          
          alert('⏰ Tempo esgotado!\n\nO tempo oficial para Leitura e Escrita terminou.\n\nPode continuar a responder ou avançar para a próxima secção.');
          return;
        }
        
        updateTimerDisplay();
      }, 1000);
    }
    
    function updateTimerDisplay() {
      const hours = Math.floor(timeRemaining / 3600);
      const minutes = Math.floor((timeRemaining % 3600) / 60);
      const seconds = timeRemaining % 60;
      
      const display = `${hours}:${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
      document.getElementById('countdown-timer').textContent = display;
      
      const timerBox = document.getElementById('timer-display');
      
      // Visual warnings
      if (timeRemaining <= 300) { // Last 5 minutes
        timerBox.classList.add('critical');
        timerBox.classList.remove('warning');
      } else if (timeRemaining <= 600) { // Last 10 minutes
        timerBox.classList.add('warning');
      } else {
        timerBox.classList.remove('warning', 'critical');
      }
    }
    
    // Start timer when page loads
    window.addEventListener('DOMContentLoaded', () => {
      startTimer();
    });
    
    // Stop timer when leaving page (but keep in localStorage)
    window.addEventListener('beforeunload', () => {
      if (timerInterval) clearInterval(timerInterval);
    });
    
  </script>

</body>
</html>
