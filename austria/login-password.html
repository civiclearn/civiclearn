<!DOCTYPE html>
<html lang="de-AT">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Passwort festlegen – CivicLearn Österreich</title>

  <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <script>
    window.SUPABASE_URL = "https://htgliokekeaovdiafrgs.supabase.co";
    window.SUPABASE_KEY = "sb_publishable_QWvR124i4h0hvQumyjBgDw_018SlMbp";
  </script>

  <style>
    :root{
      --purple:#7c3aed;
      --purple-dark:#5b21b6;
      --bg:#f7f7f9;
      --card:#ffffff;
      --text:#111;
      --muted:#666;
      --border:rgba(0,0,0,.1);
      --radius:16px;
    }

    *{ box-sizing:border-box; }

    body{
      margin:0;
      font-family:"Lexend",system-ui,sans-serif;
      background:var(--bg);
      color:var(--text);
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:24px;
    }

    .card{
      width:100%;
      max-width:420px;
      background:var(--card);
      border-radius:var(--radius);
      padding:32px 28px;
      box-shadow:0 12px 32px rgba(0,0,0,.12);
      border:1px solid var(--border);
      text-align:center;
    }

    h1{
      margin:0 0 8px;
      font-size:26px;
      font-weight:600;
    }

    .subtitle{
      font-size:15px;
      color:var(--muted);
      margin-bottom:18px;
    }

    .note{
      font-size:14px;
      color:var(--muted);
      background:rgba(124,58,237,.06);
      border:1px solid rgba(124,58,237,.25);
      border-radius:12px;
      padding:12px 14px;
      margin-bottom:18px;
      text-align:left;
    }

    label{
      display:block;
      font-size:14px;
      font-weight:500;
      text-align:left;
      margin:14px 0 6px;
    }

    .pwd-wrap{
      position:relative;
    }

    input{
      width:100%;
      padding:12px 14px;
      border-radius:12px;
      border:1px solid rgba(0,0,0,.15);
      font-size:15px;
    }

    .pwd-wrap input{
      padding-right:70px;
    }

    input:focus{
      outline:none;
      border-color:var(--purple);
      box-shadow:0 0 0 2px rgba(124,58,237,.15);
    }

    .pwd-toggle{
      position:absolute;
      right:12px;
      top:50%;
      transform:translateY(-50%);
      background:none;
      border:none;
      color:var(--purple);
      font-size:13px;
      font-weight:600;
      cursor:pointer;
    }

    .rules{
      margin-top:8px;
      font-size:13px;
      color:var(--muted);
      text-align:left;
    }

    .btn{
      margin-top:20px;
      width:100%;
      padding:13px;
      border-radius:14px;
      border:none;
      background:var(--purple);
      color:#fff;
      font-size:15px;
      font-weight:600;
      cursor:pointer;
    }

    .btn:hover{
      background:var(--purple-dark);
    }

    .msg{
      margin-top:14px;
      font-size:14px;
    }

    .msg.error{ color:#b91c1c; }
    .msg.success{ color:#15803d; }
  </style>
</head>

<body>

<div class="card" id="loading">
  <strong>Passwort wird vorbereitet…</strong>
</div>

<div class="card" id="form" style="display:none;">
  <h1>Passwort festlegen</h1>
  <div class="subtitle">Zugang zu Ihrem CivicLearn-Konto</div>

  <div class="note">
    Falls Sie bereits früher ein Passwort hatten, können Sie hier problemlos ein neues festlegen.
  </div>

  <label for="password">Neues Passwort</label>
  <div class="pwd-wrap">
    <input
      type="password"
      id="password"
      placeholder="Neues Passwort"
      minlength="6"
      autocomplete="new-password"
      required
    >
    <button type="button" class="pwd-toggle" onclick="togglePwd('password', this)">Anzeigen</button>
  </div>

  <label for="confirm">Passwort wiederholen</label>
  <div class="pwd-wrap">
    <input
      type="password"
      id="confirm"
      placeholder="Passwort wiederholen"
      minlength="6"
      autocomplete="new-password"
      required
    >
    <button type="button" class="pwd-toggle" onclick="togglePwd('confirm', this)">Anzeigen</button>
  </div>

  <div class="rules">
    • Mindestens 6 Zeichen<br>
    • Beide Passwörter müssen identisch sein
  </div>

  <button type="button" class="btn" onclick="updatePassword()">Passwort speichern</button>
  <div id="status" class="msg"></div>
</div>

<script>
(function () {
  const s = document.createElement("script");
  s.src = "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.7.1/dist/umd/supabase.js";

  s.onload = () => {
    window.supabase = supabase.createClient(
      window.SUPABASE_URL,
      window.SUPABASE_KEY
    );

    supabase.auth.onAuthStateChange((_event, session) => {
      if (!session?.user) return;
      document.getElementById("loading").style.display = "none";
      document.getElementById("form").style.display = "block";
    });
  };

  document.head.appendChild(s);
})();
</script>

<script>
async function updatePassword() {
  const pwd = document.getElementById("password").value;
  const conf = document.getElementById("confirm").value;
  const msg = document.getElementById("status");

  msg.textContent = "";
  msg.className = "msg";

  if (pwd.length < 6) {
    msg.textContent = "Das Passwort muss mindestens 6 Zeichen enthalten.";
    msg.classList.add("error");
    return;
  }

  if (pwd !== conf) {
    msg.textContent = "Die Passwörter stimmen nicht überein.";
    msg.classList.add("error");
    return;
  }

  msg.textContent = "Passwort wird gespeichert…";

  const { error } = await supabase.auth.updateUser({ password: pwd });

  if (error) {
    msg.textContent = "Ein Fehler ist aufgetreten. Bitte versuchen Sie es erneut.";
    msg.classList.add("error");
    return;
  }

  msg.textContent = "Passwort gespeichert. Weiterleitung…";
  msg.classList.add("success");

  // Required for hardened auth-guard
  localStorage.setItem("cl_auth","ok");

  const parts = location.pathname.split("/").filter(Boolean);
  const basePath = "/" + parts.slice(0, -1).join("/");
  const dashboard = `${basePath}/dashboard/`;

  setTimeout(() => {
    location.replace(dashboard);
  }, 900);
}

function togglePwd(id, btn){
  const input = document.getElementById(id);
  if (input.type === "password") {
    input.type = "text";
    btn.textContent = "Verbergen";
  } else {
    input.type = "password";
    btn.textContent = "Anzeigen";
  }
}
</script>

</body>
</html>
