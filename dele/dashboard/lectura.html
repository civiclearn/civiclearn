<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DELE A2 — Comprensión de lectura</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="/dele/assets/js/dele-auth.js"></script>
  <script src="/dele/assets/js/dele-engine.js?v=2"></script>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{--brand:#AA151B;--brand-dim:#fce8ea;--yellow:#F1BF00;--navy:#0f172a;--muted:#64748b;--border:#e2e8f0;--surface:#fff;--bg:#f8f7f4;--pass:#166534;--pass-bg:#dcfce7;--fail:#991b1b;--fail-bg:#fee2e2}
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:"DM Sans",system-ui,sans-serif;background:var(--bg);color:var(--navy);min-height:100vh}

    /* Topbar */
    .topbar{background:var(--navy);border-bottom:3px solid var(--brand);padding:0 28px;height:52px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:200}
    .topbar-left{display:flex;align-items:center;gap:12px}
    .back-link{color:#64748b;text-decoration:none;font-size:0.8rem;display:flex;align-items:center;gap:5px}
    .back-link:hover{color:#fff}
    .topbar-divider{width:1px;height:20px;background:#1e293b}
    .topbar-title{font-size:0.9rem;font-weight:700;color:#fff}
    .topbar-flag{width:22px;height:16px;background:var(--brand);border-radius:2px;position:relative;overflow:hidden;flex-shrink:0}
    .topbar-flag::before{content:'';position:absolute;top:4px;left:0;right:0;height:8px;background:var(--yellow)}

    /* Loading */
    #loading-overlay{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;z-index:9999;transition:opacity 0.35s}
    #loading-overlay.hidden{opacity:0;pointer-events:none}
    .loading-spinner{width:32px;height:32px;border-radius:50%;border:3px solid var(--border);border-top-color:var(--brand);animation:spin 0.8s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}

    .exam-wrap{max-width:820px;margin:0 auto;padding:28px 24px 80px}

    /* Task card */
    .task-card{background:var(--surface);border:1.5px solid var(--border);border-radius:14px;padding:24px;margin-bottom:28px}
    .task-header{display:flex;align-items:center;gap:10px;margin-bottom:8px}
    .task-num{width:32px;height:32px;border-radius:8px;background:var(--brand-dim);color:var(--brand);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:0.85rem;flex-shrink:0}
    .task-title{font-weight:700;font-size:1rem}
    .task-instructions{font-size:0.84rem;color:var(--muted);line-height:1.55;margin-bottom:18px;padding-bottom:14px;border-bottom:1px solid #f1f5f9}

    /* MCQ passage */
    .passage{background:#fafaf8;border:1px solid var(--border);border-radius:10px;padding:18px 20px;margin-bottom:20px;font-size:0.9rem;line-height:1.75;white-space:pre-line}
    .passage-title{font-weight:700;font-size:0.98rem;margin-bottom:10px;color:var(--navy)}

    /* MCQ question */
    .question{margin-bottom:20px;padding-bottom:16px;border-bottom:1px solid #f1f5f9}
    .question:last-child{border-bottom:none;margin-bottom:0;padding-bottom:0}
    .q-prompt{font-weight:600;font-size:0.9rem;margin-bottom:10px;line-height:1.5}
    .q-options{display:flex;flex-direction:column;gap:6px}
    .q-option{display:flex;align-items:flex-start;gap:10px;padding:10px 14px;border:1.5px solid var(--border);border-radius:10px;cursor:pointer;transition:all 0.15s;font-size:0.88rem;line-height:1.45}
    .q-option:hover{border-color:#94a3b8;background:#fafaf8}
    .q-option.selected{border-color:var(--brand);background:var(--brand-dim)}
    .q-option.correct{border-color:var(--pass);background:var(--pass-bg)}
    .q-option.wrong{border-color:var(--fail);background:var(--fail-bg)}
    .q-radio{width:18px;height:18px;border-radius:50%;border:2px solid var(--border);flex-shrink:0;margin-top:1px;display:flex;align-items:center;justify-content:center;transition:all 0.15s}
    .q-option.selected .q-radio{border-color:var(--brand);background:var(--brand)}
    .q-option.selected .q-radio::after{content:'';width:6px;height:6px;border-radius:50%;background:#fff}
    .q-opt-id{font-weight:700;color:var(--muted);margin-right:6px}
    .q-option.selected .q-opt-id{color:var(--brand)}

    /* Matching: statements bank */
    .match-bank{background:#fafaf8;border:1px solid var(--border);border-radius:10px;padding:14px 16px;margin-bottom:20px}
    .match-bank-title{font-weight:700;font-size:0.74rem;text-transform:uppercase;letter-spacing:0.06em;color:var(--muted);margin-bottom:10px}
    .match-bank-row{display:flex;gap:10px;align-items:flex-start;padding:5px 0;font-size:0.86rem;line-height:1.55}
    .match-bank-letter{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:6px;background:var(--brand-dim);color:var(--brand);font-weight:700;font-size:0.78rem;flex-shrink:0}

    /* Matching: items */
    .match-item{margin-bottom:18px;padding-bottom:18px;border-bottom:1px solid #f1f5f9}
    .match-item:last-child{border-bottom:none;margin-bottom:0;padding-bottom:0}
    .match-item-label{font-weight:700;font-size:0.85rem;color:var(--brand);margin-bottom:6px}
    .match-item-text{font-size:0.9rem;line-height:1.65;margin-bottom:12px;color:var(--navy)}
    .match-picker{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
    .match-picker-label{font-size:0.78rem;color:var(--muted);margin-right:4px;flex-shrink:0}
    .letter-btn{width:34px;height:34px;border-radius:8px;border:1.5px solid var(--border);background:#fff;color:var(--navy);font-family:inherit;font-weight:600;font-size:0.85rem;cursor:pointer;transition:all 0.15s;padding:0}
    .letter-btn:hover:not(:disabled){border-color:#94a3b8;background:#fafaf8}
    .letter-btn.selected{border-color:var(--brand);background:var(--brand);color:#fff}
    .letter-btn.correct{border-color:var(--pass);background:var(--pass-bg);color:var(--pass)}
    .letter-btn.wrong{border-color:var(--fail);background:var(--fail-bg);color:var(--fail)}
    .letter-btn.correct-missed{border:1.5px dashed var(--pass);background:#fff;color:var(--pass)}
    .letter-btn:disabled{cursor:default}

    /* Bottom bar */
    .bottom-bar{position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--border);padding:12px 24px;display:flex;justify-content:space-between;align-items:center;z-index:100}
    .progress-text{font-size:0.82rem;color:var(--muted);font-weight:500}
    .btn-row{display:flex;gap:10px}
    .btn{padding:10px 24px;border-radius:8px;font-size:0.88rem;font-weight:600;border:none;cursor:pointer;font-family:inherit;transition:opacity 0.15s;text-decoration:none;display:inline-block}
    .btn:hover{opacity:0.85}
    .btn-skip{background:#f1f5f9;color:var(--navy)}
    .btn-submit{background:var(--brand);color:#fff}
    .btn-submit:disabled{opacity:0.4;cursor:not-allowed}
    .btn-back{background:var(--navy);color:#fff}

    /* Result banner */
    .result-banner{background:var(--surface);border:2px solid var(--border);border-radius:14px;padding:24px;text-align:center;margin-bottom:24px}
    .result-score{font-size:2rem;font-weight:700}
    .result-score.high{color:var(--pass)}
    .result-score.mid{color:#92400e}
    .result-score.low{color:var(--fail)}

    @media(max-width:600px){
      .exam-wrap{padding:20px 14px 80px}
      .task-card{padding:18px 16px}
      .passage{padding:14px 16px;font-size:0.86rem}
      .match-bank{padding:12px 14px}
      .match-bank-row{font-size:0.84rem}
      .letter-btn{width:32px;height:32px;font-size:0.82rem}
    }
  </style>
</head>
<body>

<div id="loading-overlay">
  <div class="loading-spinner"></div>
  <div style="font-size:0.9rem;color:var(--muted)">Cargando comprensión de lectura…</div>
</div>

<div class="topbar">
  <div class="topbar-left">
    <a class="back-link" id="backLink" href="#">← Volver</a>
    <div class="topbar-divider"></div>
    <div class="topbar-flag"></div>
    <span class="topbar-title">Comprensión de lectura</span>
  </div>
</div>

<div class="exam-wrap" id="examContent"></div>

<div class="bottom-bar" id="bottomBar">
  <div class="progress-text" id="progressText">0 de 0 respondidas</div>
  <div class="btn-row">
    <button class="btn btn-skip" onclick="handleSkip()">Saltar</button>
    <button class="btn btn-submit" id="submitBtn" onclick="handleSubmit()" disabled>Enviar</button>
  </div>
</div>

<script>
let simId, attemptId, user, examData;
let userAnswers = {};   // { itemOrQuestionId: chosenLetter }  e.g. { q1: "E", q14: "B" }
let submitted = false;

document.addEventListener('DOMContentLoaded', async () => {
  const ctx = await DELE.init('lectura');
  user = ctx.user; simId = ctx.simId; attemptId = ctx.attemptId;

  document.getElementById('backLink').href = `/dele/dashboard/exam.html?sim=${simId}&attempt=${attemptId}`;

  const alreadyDone = await DELE.isSubmitted(user.id, attemptId, 'lectura');
  if (alreadyDone) {
    document.getElementById('examContent').innerHTML = `
      <div style="text-align:center;padding:60px 20px;">
        <div style="font-size:2rem;">✅</div>
        <h2 style="margin:12px 0;">Esta parte ya está enviada</h2>
        <p style="color:var(--muted);">Ya has respondido a la comprensión de lectura.</p>
        <a href="/dele/dashboard/exam.html?sim=${simId}&attempt=${attemptId}" style="display:inline-block;margin-top:16px;color:var(--brand);font-weight:600;">← Volver al examen</a>
      </div>`;
    document.getElementById('bottomBar').style.display = 'none';
    DELE.hideLoading();
    return;
  }

  const jsonPath = `/dele/data/${ctx.simId}-lectura.json`;
  try {
    const res = await fetch(jsonPath);
    if (!res.ok) throw new Error('JSON not found');
    examData = await res.json();
  } catch (err) {
    DELE.showError(`No se pudieron cargar los datos del examen: ${err.message}`, simId, attemptId);
    return;
  }

  renderExam();
  DELE.hideLoading();
});

function esc(str) { return DELE.escapeHtml(str || ''); }

function renderExam() {
  const wrap = document.getElementById('examContent');
  let html = '';
  let globalNum = 0;

  examData.tasks.forEach((task, ti) => {
    html += `<div class="task-card">
      <div class="task-header">
        <div class="task-num">${ti + 1}</div>
        <div class="task-title">${esc(task.title)}</div>
      </div>`;

    if (task.instructions) {
      html += `<div class="task-instructions">${esc(task.instructions)}</div>`;
    }

    if (task.type === 'text_matching') {
      html += renderMatchingTask(task, () => ++globalNum);
    } else if (task.type === 'text_mcq') {
      html += renderMcqTask(task, () => ++globalNum);
    } else {
      html += `<div style="color:var(--fail);">Tipo de tarea desconocido: ${esc(task.type)}</div>`;
    }

    html += `</div>`;
  });

  wrap.innerHTML = html;
  updateProgress();
}

function renderMatchingTask(task, nextNum) {
  let html = '';

  // Statements bank (visible above items)
  html += `<div class="match-bank">
    <div class="match-bank-title">Enunciados</div>`;
  task.statements_bank.forEach(s => {
    html += `<div class="match-bank-row">
      <span class="match-bank-letter">${esc(s.id)}</span>
      <span>${esc(s.text)}</span>
    </div>`;
  });
  html += `</div>`;

  // Items
  task.items.forEach(item => {
    const n = nextNum();
    html += `<div class="match-item" data-item-id="${esc(item.id)}">
      <div class="match-item-label">${n}. ${esc(item.label || '')}</div>
      <div class="match-item-text">${esc(item.text)}</div>
      <div class="match-picker">
        <span class="match-picker-label">Selecciona:</span>`;
    task.statements_bank.forEach(s => {
      html += `<button type="button" class="letter-btn" data-item="${esc(item.id)}" data-letter="${esc(s.id)}" onclick="selectMatch('${esc(item.id)}','${esc(s.id)}')">${esc(s.id)}</button>`;
    });
    html += `</div></div>`;
  });

  return html;
}

function renderMcqTask(task, nextNum) {
  let html = '';

  // Passage (if present)
  if (task.content?.text) {
    html += `<div class="passage">`;
    if (task.content.title) {
      html += `<div class="passage-title">${esc(task.content.title)}</div>`;
    }
    html += esc(task.content.text);
    html += `</div>`;
  }

  // Questions
  task.questions.forEach(q => {
    const n = nextNum();
    html += `<div class="question" data-qid="${esc(q.id)}">
      <div class="q-prompt">${n}. ${esc(q.prompt)}</div>
      <div class="q-options">`;
    q.options.forEach(opt => {
      html += `<div class="q-option" data-qid="${esc(q.id)}" data-optid="${esc(opt.id)}" onclick="selectOption('${esc(q.id)}','${esc(opt.id)}')">
        <div class="q-radio"></div>
        <div><span class="q-opt-id">${esc(opt.id)}</span>${esc(opt.text || '')}</div>
      </div>`;
    });
    html += `</div></div>`;
  });

  return html;
}

function selectOption(qId, optId) {
  if (submitted) return;
  userAnswers[qId] = optId;
  document.querySelectorAll(`.q-option[data-qid="${qId}"]`).forEach(el => el.classList.remove('selected'));
  const target = document.querySelector(`.q-option[data-qid="${qId}"][data-optid="${optId}"]`);
  if (target) target.classList.add('selected');
  updateProgress();
}

function selectMatch(itemId, letter) {
  if (submitted) return;
  userAnswers[itemId] = letter;
  document.querySelectorAll(`.letter-btn[data-item="${itemId}"]`).forEach(el => el.classList.remove('selected'));
  const target = document.querySelector(`.letter-btn[data-item="${itemId}"][data-letter="${letter}"]`);
  if (target) target.classList.add('selected');
  updateProgress();
}

// Returns flat list of all gradable items: { id, correct_answer }
function getAllItems() {
  const items = [];
  examData.tasks.forEach(task => {
    if (task.type === 'text_matching') {
      task.items.forEach(it => items.push({ id: it.id, correct_answer: it.correct_answer, type: 'matching' }));
    } else if (task.type === 'text_mcq') {
      task.questions.forEach(q => items.push({ id: q.id, correct_answer: q.correct_answer, type: 'mcq' }));
    }
  });
  return items;
}

function updateProgress() {
  const total = getAllItems().length;
  const answered = Object.keys(userAnswers).length;
  document.getElementById('progressText').textContent = `${answered} de ${total} respondidas`;
  document.getElementById('submitBtn').disabled = answered === 0;
}

function gradeExam() {
  const items = getAllItems();
  let correct = 0;
  items.forEach(it => {
    if (userAnswers[it.id] === it.correct_answer) correct++;
  });
  return {
    correct,
    total: items.length,
    percentage: items.length > 0 ? Math.round((correct / items.length) * 100) : 0
  };
}

function showCorrectness() {
  examData.tasks.forEach(task => {
    if (task.type === 'text_mcq') {
      task.questions.forEach(q => {
        const opts = document.querySelectorAll(`.q-option[data-qid="${q.id}"]`);
        opts.forEach(el => {
          el.style.cursor = 'default';
          el.style.pointerEvents = 'none';
          const optId = el.dataset.optid;
          if (optId === q.correct_answer) el.classList.add('correct');
          else if (userAnswers[q.id] === optId) el.classList.add('wrong');
        });
      });
    } else if (task.type === 'text_matching') {
      task.items.forEach(item => {
        const btns = document.querySelectorAll(`.letter-btn[data-item="${item.id}"]`);
        const userPicked = userAnswers[item.id];
        btns.forEach(el => {
          el.disabled = true;
          const letter = el.dataset.letter;
          if (letter === userPicked && letter === item.correct_answer) el.classList.add('correct');
          else if (letter === userPicked && letter !== item.correct_answer) el.classList.add('wrong');
          else if (letter === item.correct_answer && letter !== userPicked) el.classList.add('correct-missed');
        });
      });
    }
  });
}

async function handleSubmit() {
  if (submitted) return;
  const result = gradeExam();
  const answered = Object.keys(userAnswers).length;

  if (!confirm(`Has respondido ${answered} de ${result.total} preguntas.\n\n¿Quieres enviar?`)) return;

  submitted = true;
  document.getElementById('submitBtn').disabled = true;
  document.getElementById('submitBtn').textContent = 'Enviando…';

  showCorrectness();

  // Result banner
  const banner = document.createElement('div');
  banner.className = 'result-banner';
  const pctClass = result.percentage >= 60 ? 'high' : result.percentage >= 40 ? 'mid' : 'low';
  banner.innerHTML = `
    <div style="font-size:1.5rem;">📖</div>
    <div class="result-score ${pctClass}">${result.correct}/${result.total}</div>
    <div style="font-size:0.88rem;color:var(--muted);margin-top:4px;">${result.percentage}% correctas</div>`;
  document.getElementById('examContent').prepend(banner);
  window.scrollTo({ top: 0, behavior: 'smooth' });

  try {
    await DELE.submit({
      attemptId, elemKey: 'lectura',
      score: result.correct,
      total_questions: result.total,
      correct_answers: result.correct,
      json: { answers: userAnswers, result }
    });
  } catch (err) {
    console.error('Submit error:', err);
    DELE.toast('Error al enviar, pero tus respuestas se guardaron localmente.');
  }

  document.getElementById('bottomBar').innerHTML = `
    <div class="progress-text">${result.percentage}% correctas (${result.correct}/${result.total})</div>
    <div class="btn-row">
      <a class="btn btn-back" href="/dele/dashboard/exam.html?sim=${simId}&attempt=${attemptId}">← Volver al examen</a>
    </div>`;
}

async function handleSkip() {
  if (submitted) return;
  if (!confirm('¿Quieres saltar la comprensión de lectura? Recibirás 0 puntos.')) return;
  try { await DELE.skip({ attemptId, elemKey: 'lectura' }); } catch (e) {}
  window.location.href = `/dele/dashboard/exam.html?sim=${simId}&attempt=${attemptId}`;
}
</script>
</body>
</html>
