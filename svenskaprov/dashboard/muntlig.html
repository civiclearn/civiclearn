<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SvenskaProv — Muntlig färdighet</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="/svenskaprov/assets/js/sp-auth.js"></script>
  <script src="/svenskaprov/assets/js/sp-engine.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{--blue:#006AA7;--blue-dim:#e8f1f8;--yellow:#FECC02;--navy:#0f172a;--muted:#64748b;--border:#e2e8f0;--surface:#fff;--bg:#f8f7f4;--red:#dc2626;--pass:#166534;--pass-bg:#dcfce7}
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:"DM Sans",system-ui,sans-serif;background:var(--bg);color:var(--navy);min-height:100vh}

    .topbar{background:var(--navy);border-bottom:3px solid var(--blue);padding:0 28px;height:52px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:200}
    .topbar-left{display:flex;align-items:center;gap:12px}
    .back-link{color:#64748b;text-decoration:none;font-size:0.8rem;display:flex;align-items:center;gap:5px}
    .back-link:hover{color:#fff}
    .topbar-divider{width:1px;height:20px;background:#1e293b}
    .topbar-title{font-size:0.9rem;font-weight:700;color:#fff}
    .topbar-flag{width:22px;height:16px;background:var(--blue);border-radius:2px;position:relative;overflow:hidden;flex-shrink:0}
    .topbar-flag::before{content:'';position:absolute;top:0;left:6px;width:3px;height:100%;background:var(--yellow)}
    .topbar-flag::after{content:'';position:absolute;top:6px;left:0;width:100%;height:3px;background:var(--yellow)}

    #loading-overlay{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;z-index:9999;transition:opacity 0.35s}
    #loading-overlay.hidden{opacity:0;pointer-events:none}
    .loading-spinner{width:32px;height:32px;border-radius:50%;border:3px solid var(--border);border-top-color:var(--blue);animation:spin 0.8s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}

    .exam-wrap{max-width:820px;margin:0 auto;padding:28px 24px 80px}

    .task-card{background:var(--surface);border:1.5px solid var(--border);border-radius:14px;padding:24px;margin-bottom:28px}
    .task-header{display:flex;align-items:center;gap:10px;margin-bottom:16px}
    .task-num{width:32px;height:32px;border-radius:8px;background:var(--blue-dim);color:var(--blue);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:0.85rem;flex-shrink:0}
    .task-title{font-weight:700;font-size:1rem}

    .prompt-card{background:#fffbeb;border:1px solid #fde68a;border-radius:10px;padding:14px 16px;font-size:0.88rem;color:#92400e;line-height:1.6;margin-bottom:16px}
    .task-image{width:100%;max-height:360px;object-fit:contain;border-radius:10px;border:1px solid var(--border);margin-bottom:16px}
    .guidance{font-size:0.78rem;color:var(--muted);margin-bottom:16px;line-height:1.5}

    .rec-area{text-align:center;padding:20px}
    .rec-btn{width:64px;height:64px;border-radius:50%;border:none;cursor:pointer;font-size:1.4rem;transition:all 0.2s;display:inline-flex;align-items:center;justify-content:center}
    .rec-btn.idle{background:var(--blue);color:#fff}
    .rec-btn.recording{background:var(--red);color:#fff;animation:pulse 1.2s infinite}
    @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(220,38,38,0.4)}50%{box-shadow:0 0 0 12px rgba(220,38,38,0)}}
    .rec-btn.done{background:var(--pass);color:#fff}
    .rec-label{font-size:0.82rem;color:var(--muted);margin-top:8px}
    .rec-timer{font-size:0.85rem;font-weight:600;color:var(--red);margin-top:4px;font-variant-numeric:tabular-nums}

    .playback{margin-top:12px}
    .playback audio{width:100%;max-width:400px}

    .bottom-bar{position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--border);padding:12px 24px;display:flex;justify-content:space-between;align-items:center;z-index:100}
    .btn-row{display:flex;gap:10px}
    .btn{padding:10px 24px;border-radius:8px;font-size:0.88rem;font-weight:600;border:none;cursor:pointer;font-family:inherit;transition:opacity 0.15s}
    .btn:hover{opacity:0.85}
    .btn-skip{background:#f1f5f9;color:var(--navy)}
    .btn-submit{background:var(--blue);color:#fff}
    .btn-submit:disabled{opacity:0.4;cursor:not-allowed}

    @media(max-width:600px){.exam-wrap{padding:20px 14px 80px}.task-card{padding:18px 16px}}
  </style>
</head>
<body>

<div id="loading-overlay">
  <div class="loading-spinner"></div>
  <div style="font-size:0.9rem;color:var(--muted)">Laddar taluppgifter…</div>
</div>

<div class="topbar">
  <div class="topbar-left">
    <a class="back-link" id="backLink" href="#">← Tillbaka</a>
    <div class="topbar-divider"></div>
    <div class="topbar-flag"></div>
    <span class="topbar-title">Muntlig färdighet</span>
  </div>
</div>

<div class="exam-wrap" id="examContent"></div>

<div class="bottom-bar" id="bottomBar">
  <div style="font-size:0.82rem;color:var(--muted)">Spela in dina svar ovan</div>
  <div class="btn-row">
    <button class="btn btn-skip" onclick="handleSkip()">Hoppa över</button>
    <button class="btn btn-submit" id="submitBtn" onclick="handleSubmit()" disabled>Skicka in</button>
  </div>
</div>

<script>
let simId, attemptId, user, examData;
let submitted = false;
let recordings = {}; // { task_id: { blob, base64, duration } }
let activeRecorder = null;
let activeTaskId = null;
let recStartTime = null;
let recTimerInterval = null;

document.addEventListener('DOMContentLoaded', async () => {
  const ctx = await SP.init('speaking');
  user = ctx.user; simId = ctx.simId; attemptId = ctx.attemptId;
  document.getElementById('backLink').href = `/svenskaprov/dashboard/exam.html?sim=${simId}&attempt=${attemptId}`;

  const alreadyDone = await SP.isSubmitted(user.id, attemptId, 'speaking');
  if (alreadyDone) {
    document.getElementById('examContent').innerHTML = `
      <div style="text-align:center;padding:60px 20px;">
        <div style="font-size:2rem;">✅</div>
        <h2 style="margin:12px 0;">Muntlig del redan inskickad</h2>
        <p style="color:var(--muted);">Dina inspelningar bedöms av AI.</p>
        <a href="/svenskaprov/dashboard/exam.html?sim=${simId}&attempt=${attemptId}" style="display:inline-block;margin-top:16px;color:var(--blue);font-weight:600;">← Tillbaka till provet</a>
      </div>`;
    document.getElementById('bottomBar').style.display = 'none';
    SP.hideLoading(); return;
  }

  const simNum = ctx.simNum;
  const jsonPath = `/svenskaprov/data/sp-${String(simNum).padStart(2,'0')}-speaking.json`;
  try {
    const res = await fetch(jsonPath);
    if (!res.ok) throw new Error('JSON not found');
    examData = await res.json();
  } catch (err) {
    SP.showError(`Kunde inte ladda provdata: ${err.message}`, simId, attemptId);
    return;
  }

  renderExam();
  SP.hideLoading();
});

function renderExam() {
  const wrap = document.getElementById('examContent');
  let html = '';

  examData.tasks.forEach((task, ti) => {
    const hasImage = task.content?.image;
    html += `<div class="task-card">
      <div class="task-header">
        <div class="task-num">${ti + 1}</div>
        <div class="task-title">${SP.escapeHtml(task.title)}</div>
      </div>
      <div class="prompt-card">${SP.escapeHtml(task.instructions || task.prompt || '')}</div>`;

    if (hasImage) {
      html += `<img class="task-image" src="${task.content.image}" alt="Bild att beskriva" loading="lazy">`;
    }

    html += `<div class="guidance">Tips: Tala tydligt och i fullständiga meningar. Försök använda varierat ordförråd.</div>
      <div class="rec-area" id="recArea${ti}">
        <button class="rec-btn idle" id="recBtn${ti}" onclick="toggleRecording('${task.task_id}', ${ti})">🎤</button>
        <div class="rec-label" id="recLabel${ti}">Klicka för att börja spela in</div>
        <div class="rec-timer" id="recTimer${ti}" style="display:none">0:00</div>
        <div class="playback" id="playback${ti}" style="display:none"></div>
      </div>
    </div>`;
  });

  wrap.innerHTML = html;
}

async function toggleRecording(taskId, idx) {
  if (submitted) return;

  // If currently recording this task → stop
  if (activeRecorder && activeTaskId === taskId) {
    activeRecorder.stop();
    return;
  }

  // If recording another task → stop first
  if (activeRecorder) {
    activeRecorder.stop();
    await new Promise(r => setTimeout(r, 200));
  }

  // Start recording
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    const mimeType = MediaRecorder.isTypeSupported('audio/webm;codecs=opus') ? 'audio/webm;codecs=opus' : 'audio/webm';
    const recorder = new MediaRecorder(stream, { mimeType });
    const chunks = [];

    recorder.ondataavailable = e => { if (e.data.size > 0) chunks.push(e.data); };
    recorder.onstop = async () => {
      stream.getTracks().forEach(t => t.stop());
      clearInterval(recTimerInterval);

      const blob = new Blob(chunks, { type: recorder.mimeType || 'audio/webm' });
      const duration = (Date.now() - recStartTime) / 1000;

      // Convert to base64
      const reader = new FileReader();
      reader.onloadend = () => {
        recordings[taskId] = { blob, base64: reader.result, duration };

        // Show playback
        const url = URL.createObjectURL(blob);
        document.getElementById(`playback${idx}`).innerHTML = `<audio controls src="${url}"></audio>`;
        document.getElementById(`playback${idx}`).style.display = 'block';

        // Update button
        const btn = document.getElementById(`recBtn${idx}`);
        btn.className = 'rec-btn done';
        btn.textContent = '✓';
        document.getElementById(`recLabel${idx}`).textContent = `Inspelat (${Math.round(duration)}s) — klicka för att spela in igen`;
        document.getElementById(`recTimer${idx}`).style.display = 'none';

        btn.className = 'rec-btn idle';
        btn.textContent = '🎤';

        // Enable submit if at least one recording
        document.getElementById('submitBtn').disabled = Object.keys(recordings).length === 0;
      };
      reader.readAsDataURL(blob);

      activeRecorder = null;
      activeTaskId = null;
    };

    recorder.start();
    activeRecorder = recorder;
    activeTaskId = taskId;
    recStartTime = Date.now();

    const btn = document.getElementById(`recBtn${idx}`);
    btn.className = 'rec-btn recording';
    btn.textContent = '⏹';
    document.getElementById(`recLabel${idx}`).textContent = 'Spelar in… Klicka för att stoppa';
    document.getElementById(`recTimer${idx}`).style.display = 'block';

    recTimerInterval = setInterval(() => {
      const elapsed = Math.floor((Date.now() - recStartTime) / 1000);
      const m = Math.floor(elapsed / 60);
      const s = elapsed % 60;
      document.getElementById(`recTimer${idx}`).textContent = `${m}:${String(s).padStart(2, '0')}`;
    }, 500);

  } catch (err) {
    SP.toast('Kunde inte komma åt mikrofonen. Kontrollera dina inställningar.');
    console.error('Mic error:', err);
  }
}

async function handleSubmit() {
  if (submitted) return;
  if (Object.keys(recordings).length === 0) {
    SP.toast('Spela in minst en uppgift innan du skickar in.');
    return;
  }

  if (!confirm('Vill du skicka in dina inspelningar? De kommer bedömas av AI.')) return;

  submitted = true;
  document.getElementById('submitBtn').disabled = true;
  document.getElementById('submitBtn').textContent = 'Skickar…';

  // Combine all recordings into a single base64 (use the longest/first one)
  // For SvenskaProv we'll concatenate task info and send the combined audio
  const taskEntries = examData.tasks.map(t => ({
    task_id: t.task_id,
    title: t.title,
    prompt: t.instructions || t.prompt || '',
    has_recording: !!recordings[t.task_id],
    duration: recordings[t.task_id]?.duration || 0,
  }));

  // Use the first recording's base64 for now (simplified pattern)
  // In production, we could concatenate blobs
  const firstRec = Object.values(recordings)[0];

  try {
    await SP.submitAudio({
      attemptId, elemKey: 'speaking',
      audioBase64: firstRec.base64,
      responseJson: {
        tasks: taskEntries,
        total_recordings: Object.keys(recordings).length,
        total_duration: Object.values(recordings).reduce((s, r) => s + r.duration, 0),
      }
    });
    SP.toast('Inskickat! AI bedömer dina inspelningar…');
  } catch (err) {
    console.error('Submit error:', err);
    SP.toast('Fel vid inskickning.');
  }

  document.getElementById('bottomBar').innerHTML = `
    <div style="font-size:0.82rem;color:var(--muted)">✓ Inskickat — AI bedömer dina inspelningar</div>
    <div class="btn-row">
      <a class="btn" style="background:var(--navy);color:#fff" href="/svenskaprov/dashboard/exam.html?sim=${simId}&attempt=${attemptId}">← Tillbaka till provet</a>
    </div>`;
}

async function handleSkip() {
  if (submitted) return;
  if (!confirm('Vill du hoppa över den muntliga delen? Du får 0 poäng.')) return;
  try { await SP.skip({ attemptId, elemKey: 'speaking' }); } catch (e) {}
  window.location.href = `/svenskaprov/dashboard/exam.html?sim=${simId}&attempt=${attemptId}`;
}
</script>
</body>
</html>
