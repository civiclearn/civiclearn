<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SvenskaProv — Skriftlig färdighet</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="/svenskaprov/assets/js/sp-auth.js"></script>
  <script src="/svenskaprov/assets/js/sp-engine.js?v=2"></script>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{--blue:#006AA7;--blue-dim:#e8f1f8;--yellow:#FECC02;--navy:#0f172a;--muted:#64748b;--border:#e2e8f0;--surface:#fff;--bg:#f8f7f4;--pass:#166534;--pass-bg:#dcfce7;--amber:#92400e;--amber-bg:#fffbeb;--amber-border:#fde68a}
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:"DM Sans",system-ui,sans-serif;background:var(--bg);color:var(--navy);min-height:100vh}

    .topbar{background:var(--navy);border-bottom:3px solid var(--blue);padding:0 28px;height:52px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:200}
    .topbar-left{display:flex;align-items:center;gap:12px}
    .back-link{color:#64748b;text-decoration:none;font-size:0.8rem;display:flex;align-items:center;gap:5px}
    .back-link:hover{color:#fff}
    .topbar-divider{width:1px;height:20px;background:#1e293b}
    .topbar-title{font-size:0.9rem;font-weight:700;color:#fff}
    .topbar-flag{width:22px;height:16px;background:var(--blue);border-radius:2px;position:relative;overflow:hidden;flex-shrink:0}
    .topbar-flag::before{content:'';position:absolute;top:0;left:6px;width:3px;height:100%;background:var(--yellow)}
    .topbar-flag::after{content:'';position:absolute;top:6px;left:0;width:100%;height:3px;background:var(--yellow)}
    .wc-pill{background:#1e293b;border-radius:99px;padding:4px 12px;font-size:0.75rem;color:#94a3b8}
    .wc-pill span{color:#fff;font-weight:600}

    #loading-overlay{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;z-index:9999;transition:opacity 0.35s}
    #loading-overlay.hidden{opacity:0;pointer-events:none}
    .loading-spinner{width:32px;height:32px;border-radius:50%;border:3px solid var(--border);border-top-color:var(--blue);animation:spin 0.8s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}

    .exam-wrap{max-width:820px;margin:0 auto;padding:28px 24px 80px}

    .task-card{background:var(--surface);border:1.5px solid var(--border);border-radius:14px;padding:24px;margin-bottom:28px}
    .task-header{display:flex;align-items:center;gap:10px;margin-bottom:16px}
    .task-num{width:32px;height:32px;border-radius:8px;background:var(--blue-dim);color:var(--blue);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:0.85rem;flex-shrink:0}
    .task-title{font-weight:700;font-size:1rem}

    .prompt-card{background:var(--amber-bg);border:1px solid var(--amber-border);border-radius:10px;padding:14px 16px;font-size:0.88rem;color:var(--amber);line-height:1.6;margin-bottom:16px}
    .constraints{font-size:0.78rem;color:var(--muted);margin-bottom:12px}

    .text-area{width:100%;min-height:150px;padding:14px 16px;border:1.5px solid var(--border);border-radius:10px;font-family:inherit;font-size:0.88rem;line-height:1.6;resize:vertical;color:var(--navy);background:var(--bg);transition:border-color 0.15s}
    .text-area:focus{outline:none;border-color:var(--blue)}
    .text-area.short{min-height:100px}
    .text-area.long{min-height:200px}

    .word-count{display:flex;justify-content:flex-end;margin-top:6px;font-size:0.75rem;color:var(--muted)}
    .word-count.ok{color:var(--pass)}
    .word-count.over{color:#991b1b}

    .bottom-bar{position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--border);padding:12px 24px;display:flex;justify-content:space-between;align-items:center;z-index:100}
    .progress-text{font-size:0.82rem;color:var(--muted);font-weight:500}
    .btn-row{display:flex;gap:10px}
    .btn{padding:10px 24px;border-radius:8px;font-size:0.88rem;font-weight:600;border:none;cursor:pointer;font-family:inherit;transition:opacity 0.15s}
    .btn:hover{opacity:0.85}
    .btn-skip{background:#f1f5f9;color:var(--navy)}
    .btn-submit{background:var(--blue);color:#fff}
    .btn-submit:disabled{opacity:0.4;cursor:not-allowed}

    @media(max-width:600px){.exam-wrap{padding:20px 14px 80px}.task-card{padding:18px 16px}}
  </style>
</head>
<body>

<div id="loading-overlay">
  <div class="loading-spinner"></div>
  <div style="font-size:0.9rem;color:var(--muted)">Laddar skrivuppgifter…</div>
</div>

<div class="topbar">
  <div class="topbar-left">
    <a class="back-link" id="backLink" href="#">← Tillbaka</a>
    <div class="topbar-divider"></div>
    <div class="topbar-flag"></div>
    <span class="topbar-title">Skriftlig färdighet</span>
  </div>
</div>

<div class="exam-wrap" id="examContent"></div>

<div class="bottom-bar" id="bottomBar">
  <div class="progress-text" id="progressText">Skriv dina svar ovan</div>
  <div class="btn-row">
    <button class="btn btn-skip" onclick="handleSkip()">Hoppa över</button>
    <button class="btn btn-submit" id="submitBtn" onclick="handleSubmit()" disabled>Skicka in</button>
  </div>
</div>

<script>
let simId, attemptId, user, examData;
let submitted = false;

document.addEventListener('DOMContentLoaded', async () => {
  const ctx = await SP.init('writing');
  user = ctx.user; simId = ctx.simId; attemptId = ctx.attemptId;
  document.getElementById('backLink').href = `/svenskaprov/dashboard/exam.html?sim=${simId}&attempt=${attemptId}`;

  const alreadyDone = await SP.isSubmitted(user.id, attemptId, 'writing');
  if (alreadyDone) {
    document.getElementById('examContent').innerHTML = `
      <div style="text-align:center;padding:60px 20px;">
        <div style="font-size:2rem;">✅</div>
        <h2 style="margin:12px 0;">Skriftlig del redan inskickad</h2>
        <p style="color:var(--muted);">Dina svar bedöms av AI. Kontrollera resultaten i provöversikten.</p>
        <a href="/svenskaprov/dashboard/exam.html?sim=${simId}&attempt=${attemptId}" style="display:inline-block;margin-top:16px;color:var(--blue);font-weight:600;">← Tillbaka till provet</a>
      </div>`;
    document.getElementById('bottomBar').style.display = 'none';
    SP.hideLoading(); return;
  }

  const simNum = ctx.simNum;
  const jsonPath = `/svenskaprov/data/sp-${String(simNum).padStart(2,'0')}-writing.json`;
  try {
    const res = await fetch(jsonPath);
    if (!res.ok) throw new Error('JSON not found');
    examData = await res.json();
  } catch (err) {
    SP.showError(`Kunde inte ladda provdata: ${err.message}`, simId, attemptId);
    return;
  }

  renderExam();
  SP.hideLoading();
});

function renderExam() {
  const wrap = document.getElementById('examContent');
  let html = '';

  examData.tasks.forEach((task, ti) => {
    const isShort = task.title.toLowerCase().includes('kort');
    const minW = task.constraints?.min_words || (isShort ? 30 : 70);
    const maxW = task.constraints?.max_words || (isShort ? 60 : 150);

    html += `<div class="task-card">
      <div class="task-header">
        <div class="task-num">${ti + 1}</div>
        <div class="task-title">${SP.escapeHtml(task.title)}</div>
      </div>
      <div class="prompt-card">${SP.escapeHtml(task.instructions || task.prompt?.context || '')}</div>
      <div class="constraints">Skriv minst ${minW} och högst ${maxW} ord.</div>
      <textarea class="text-area ${isShort ? 'short' : 'long'}" id="text${ti}"
        placeholder="Skriv ditt svar här…"
        oninput="onTextInput(${ti}, ${minW}, ${maxW})"></textarea>
      <div class="word-count" id="wc${ti}">0 ord</div>
    </div>`;
  });

  wrap.innerHTML = html;
}

function onTextInput(idx, minW, maxW) {
  const text = document.getElementById(`text${idx}`).value;
  const wc = SP.countWords(text);
  const el = document.getElementById(`wc${idx}`);
  el.textContent = `${wc} ord`;
  el.className = 'word-count' + (wc >= minW && wc <= maxW ? ' ok' : wc > maxW ? ' over' : '');

  // Enable submit if at least one task has words
  let anyContent = false;
  examData.tasks.forEach((_, i) => {
    if (SP.countWords(document.getElementById(`text${i}`).value) > 0) anyContent = true;
  });
  document.getElementById('submitBtn').disabled = !anyContent;
}

async function handleSubmit() {
  if (submitted) return;

  // Gather responses
  const tasks = examData.tasks.map((task, i) => ({
    title: task.title,
    prompt: task.instructions || task.prompt?.context || '',
    response: document.getElementById(`text${i}`).value.trim(),
  }));

  const combined = tasks.map(t => t.response).join('\n\n');
  if (combined.trim().length < 10) {
    SP.toast('Skriv minst några ord innan du skickar in.');
    return;
  }

  if (!confirm('Vill du skicka in dina skriftliga svar? De kommer bedömas av AI.')) return;

  submitted = true;
  document.getElementById('submitBtn').disabled = true;
  document.getElementById('submitBtn').textContent = 'Skickar…';

  // Disable textareas
  examData.tasks.forEach((_, i) => {
    document.getElementById(`text${i}`).disabled = true;
  });

  try {
    await SP.submit({
      attemptId, elemKey: 'writing',
      text: combined,
      json: { tasks }
    });
  } catch (err) {
    console.error('Submit error:', err);
  }

  // Redirect immediately — AI evaluation happens in background
  window.location.href = `/svenskaprov/dashboard/exam.html?sim=${simId}&attempt=${attemptId}`;
}

async function handleSkip() {
  if (submitted) return;
  if (!confirm('Vill du hoppa över den skriftliga delen? Du får 0 poäng.')) return;
  try { await SP.skip({ attemptId, elemKey: 'writing' }); } catch (e) {}
  window.location.href = `/svenskaprov/dashboard/exam.html?sim=${simId}&attempt=${attemptId}`;
}
</script>
</body>
</html>
