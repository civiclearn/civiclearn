<!DOCTYPE html>
<html lang="is">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nidurstodur - Rikisborgaraprof</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,wght@0,400;0,600;0,700;1,400&family=DM+Sans:wght@400;500;600;700&display=swap');

  :root {
    --blue: #003897; --blue-light: #e8eef8; --blue-hover: #002a73;
    --red: #d72828; --green: #1a7a3a;
    --green-light: #e6f4ea; --red-light: #fde8e8;
    --amber: #b45309; --amber-light: #fef3c7; --amber-border: #fde68a;
    --gray-50: #f8f9fa; --gray-100: #f1f3f5; --gray-200: #e2e5e9;
    --gray-400: #8b95a5; --gray-600: #4a5568; --gray-800: #1e2a3a;
    --radius: 8px;
    --shadow: 0 1px 3px rgba(0,0,0,.08), 0 1px 2px rgba(0,0,0,.04);
    --shadow-lg: 0 4px 12px rgba(0,0,0,.1);
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'DM Sans', system-ui, sans-serif; background: var(--gray-50); color: var(--gray-800); line-height: 1.6; min-height: 100vh; }

  .topbar { background: var(--blue); color: #fff; padding: 14px 24px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; }
  .topbar-left { display: flex; align-items: center; gap: 12px; }
  .topbar-flag { width: 24px; height: 18px; display: block; }
  .topbar-title { font-weight: 600; font-size: 0.95rem; color: #fff; }
  .topbar-section { font-size: 0.85rem; opacity: 0.85; }
  .topbar-right { display: flex; align-items: center; gap: 16px; }
  .topbar-sim { background: rgba(255,255,255,0.15); padding: 5px 12px; border-radius: 20px; font-size: 0.8rem; font-weight: 500; }
  .topbar-back { color: #fff; text-decoration: none; font-size: 0.85rem; opacity: 0.8; transition: opacity .2s; }
  .topbar-back:hover { color: #fff; opacity: 1; }

  .main { max-width: 720px; margin: 0 auto; padding: 28px 20px 60px; }
  .loading { text-align: center; padding: 80px 20px; color: var(--gray-400); }
  .loading-spinner { width: 32px; height: 32px; border: 3px solid var(--gray-200); border-top-color: var(--blue); border-radius: 50%; animation: spin .7s linear infinite; margin: 0 auto 16px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes fadeIn { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:translateY(0); } }

  .processing-card { background: #fff; border-radius: 12px; padding: 36px 28px; text-align: center; box-shadow: var(--shadow-lg); margin-bottom: 24px; }
  .processing-icon { font-size: 2.8rem; margin-bottom: 12px; }
  .processing-title { font-family: 'Source Serif 4', serif; font-size: 1.4rem; font-weight: 600; margin-bottom: 8px; }
  .processing-sub { color: var(--gray-600); font-size: 0.88rem; margin-bottom: 20px; line-height: 1.5; }
  .processing-progress { display: flex; flex-direction: column; gap: 6px; text-align: left; max-width: 360px; margin: 20px auto 0; }
  .progress-item { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-radius: var(--radius); background: var(--gray-50); font-size: 0.85rem; }
  .progress-icon { font-size: 1.1rem; flex-shrink: 0; }
  .progress-label { flex: 1; }
  .progress-status { font-size: 0.8rem; color: var(--gray-400); }

  .hero-card { border-radius: 12px; overflow: hidden; box-shadow: var(--shadow-lg); margin-bottom: 28px; animation: fadeIn .5s ease; }
  .hero-card.passed { background: var(--green-light); border: 2px solid #bbf7d0; }
  .hero-card.failed { background: var(--red-light); border: 2px solid #fecaca; }
  .hero-card.partial { background: var(--amber-light); border: 2px solid var(--amber-border); }
  .hero-top { padding: 32px 28px 24px; text-align: center; }
  .hero-badge { display: inline-block; padding: 4px 16px; border-radius: 20px; font-size: 0.85rem; font-weight: 600; margin-bottom: 12px; color: #fff; }
  .passed .hero-badge { background: #166534; }
  .failed .hero-badge { background: #991b1b; }
  .partial .hero-badge { background: var(--amber); }
  .hero-score { font-family: 'Source Serif 4', serif; font-size: 3.5rem; font-weight: 700; line-height: 1; }
  .passed .hero-score { color: #166534; }
  .failed .hero-score { color: #991b1b; }
  .partial .hero-score { color: var(--amber); }
  .hero-score-label { font-size: 0.82rem; color: var(--gray-600); margin-top: 4px; }
  .hero-status { font-size: 0.9rem; color: var(--gray-600); margin-top: 8px; }

  .hero-sections { display: grid; grid-template-columns: repeat(4, 1fr); background: #fff; border-top: 1px solid var(--gray-200); }
  .hero-section { padding: 16px 12px; text-align: center; }
  .hero-section:not(:last-child) { border-right: 1px solid var(--gray-200); }
  .hs-icon { font-size: 1.2rem; }
  .hs-label { font-size: 0.72rem; color: var(--gray-400); text-transform: uppercase; letter-spacing: 0.04em; margin-top: 2px; }
  .hs-score { font-family: 'Source Serif 4', serif; font-size: 1.5rem; font-weight: 700; margin-top: 2px; }
  .hs-pass { color: var(--green); }
  .hs-fail { color: var(--red); }
  .hs-pending { color: var(--gray-400); }

  .section-block { margin-bottom: 20px; }
  .section-header { display: flex; align-items: center; gap: 10px; padding: 14px 18px; background: var(--blue); color: #fff; border-radius: 10px 10px 0 0; font-weight: 600; font-size: 0.92rem; }
  .section-score { margin-left: auto; font-size: 0.85rem; opacity: 0.85; }

  .elem-card { background: #fff; border: 1px solid var(--gray-200); border-top: none; }
  .elem-card:last-child { border-radius: 0 0 10px 10px; }
  .elem-header { display: flex; align-items: center; gap: 10px; padding: 14px 18px; cursor: pointer; user-select: none; }
  .elem-header:hover { background: var(--gray-50); }
  .elem-name { flex: 1; font-size: 0.88rem; font-weight: 500; }
  .elem-score-badge { font-size: 0.78rem; font-weight: 600; padding: 3px 10px; border-radius: 12px; }
  .elem-score-badge.high { background: var(--green-light); color: var(--green); }
  .elem-score-badge.mid { background: var(--amber-light); color: var(--amber); }
  .elem-score-badge.low { background: var(--red-light); color: var(--red); }
  .elem-score-badge.pending { background: var(--amber-light); color: var(--amber); }
  .elem-score-badge.skip { background: var(--gray-100); color: var(--gray-400); }
  .elem-chevron { font-size: 0.8rem; color: var(--gray-400); transition: transform .2s; }
  .elem-card.open .elem-chevron { transform: rotate(90deg); }
  .elem-detail { display: none; padding: 0 18px 16px; }
  .elem-card.open .elem-detail { display: block; animation: fadeIn .3s ease; }

  .feedback-section { margin-top: 14px; }
  .feedback-label { font-size: 0.75rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; color: var(--gray-400); margin-bottom: 6px; }
  .feedback-summary { font-size: 0.88rem; color: var(--gray-600); line-height: 1.5; }
  .feedback-list { display: flex; flex-direction: column; gap: 4px; }

  .criteria-row { display: flex; align-items: center; gap: 8px; padding: 4px 0; font-size: 0.82rem; }
  .criteria-name { flex: 0 0 120px; color: var(--gray-600); }
  .criteria-bar-wrap { flex: 1; height: 6px; background: var(--gray-200); border-radius: 3px; overflow: hidden; }
  .criteria-bar-fill { height: 100%; border-radius: 3px; background: var(--blue); transition: width .5s ease; }
  .criteria-score { width: 36px; text-align: right; font-weight: 600; font-size: 0.78rem; }

  .mistakes-list { display: flex; flex-direction: column; gap: 6px; }
  .mistake-row { font-size: 0.85rem; line-height: 1.5; color: var(--gray-600); }
  .mistake-original { color: var(--red); text-decoration: line-through; }
  .mistake-arrow { margin: 0 4px; color: var(--gray-400); }
  .mistake-correction { color: var(--green); font-weight: 500; }
  .mistake-explanation { color: var(--gray-400); font-style: italic; }

  .btn { display: inline-flex; align-items: center; gap: 6px; padding: 10px 20px; border-radius: var(--radius); font-size: 0.88rem; font-weight: 600; cursor: pointer; border: none; transition: all .15s; font-family: inherit; }
  .btn-primary { background: var(--blue); color: #fff; }
  .btn-primary:hover { background: var(--blue-hover); }
  .btn-outline { background: #fff; color: var(--blue); border: 1.5px solid var(--blue); }
  .btn-outline:hover { background: var(--blue-light); }
  .btn-retry { background: var(--amber-light); color: var(--amber); border: 1px solid var(--amber-border); }
  .btn-retry:hover { background: #fde68a; }
  .actions { display: flex; gap: 12px; justify-content: center; margin-top: 28px; flex-wrap: wrap; }
  .pass-note { background: var(--gray-100); border-radius: var(--radius); padding: 14px 18px; font-size: 0.82rem; color: var(--gray-600); margin-bottom: 20px; line-height: 1.5; }

  @media (max-width: 600px) {
    .topbar { padding: 10px 12px; }
    .topbar-section { display: none; }
    .topbar-left { gap: 8px; min-width: 0; }
    .topbar-right { gap: 10px; flex-shrink: 0; }
    .topbar-title { font-size: 0.85rem; }
    .topbar-sim { font-size: 0.72rem; padding: 4px 10px; }
    .topbar-back { font-size: 0.78rem; }
    .main { padding: 20px 14px 60px; }
    .hero-sections { grid-template-columns: repeat(2, 1fr); }
    .hero-section:nth-child(2) { border-right: none; }
    .hero-section:nth-child(-n+2) { border-bottom: 1px solid var(--gray-200); }
    .hero-score { font-size: 2.8rem; }
    .criteria-name { flex: 0 0 90px; }
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-left">
    <img class="topbar-flag" src="/rikisborgaraprof/assets/images/is.svg" alt="Ísland">
    <span class="topbar-title">Ríkisborgarapróf</span>
    <span class="topbar-section">· Niðurstöður</span>
  </div>
  <div class="topbar-right">
    <span class="topbar-sim" id="simLabel">Sim 01</span>
    <a href="index.html" class="topbar-back">← Til baka</a>
  </div>
</div>

<div class="main" id="mainContent">
  <div class="loading" id="loadingState">
    <div class="loading-spinner"></div>
    Hled nidurstoedum...
  </div>
</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="/rikisborgaraprof/assets/js/rik-auth.js?v=2"></script>
<script src="/rikisborgaraprof/assets/js/rik-engine.js"></script>
<script>
(function() {
  'use strict';

  // Poll-only results page. NO eval triggering — that happens server-side.
  // Polls rik-hydrate every 8s until attempt.status === 'complete'.

  const POLL_INTERVAL = 8000;
  let simId, attemptId, user;
  let pollTimer = null;

  document.addEventListener('DOMContentLoaded', async () => {
    const ctx = await RIK.init();
    user      = ctx.user;
    simId     = ctx.simId;
    attemptId = ctx.attemptId;

    if (!attemptId) {
      showError('Engin próftilraun fannst.');
      return;
    }

    document.getElementById('simLabel').textContent = 'Hermipróf ' + ctx.simNum;
    await poll();
  });

  async function poll() {
    try {
      const data    = await RIK.hydrateData(user.email, attemptId, true);
      const attempt = (data?.attempts || []).find(a => a.id === attemptId);

      if (!attempt) { showError('Próftilraun fannst ekki.'); return; }

      if (attempt.status === 'complete') {
        if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
        await renderResults(attempt);
        return;
      }

      // Still processing — show waiting state
      renderWaiting(attempt);

      if (!pollTimer) {
        pollTimer = setInterval(poll, POLL_INTERVAL);
      }
    } catch(err) {
      console.error('[nidurstodur] poll error:', err);
    }
  }

  function renderWaiting(attempt) {
    const elems = attempt.elements || [];
    const pending = elems.filter(e =>
      e.submission_status === 'submitted' &&
      e.eval_status !== 'complete' && e.eval_status !== 'skipped'
    );

    document.getElementById('mainContent').innerHTML = `
      <div class="results-loading">
        <div class="loading-spinner"></div>
        <h2>Reiknar niðurstöður…</h2>
        <p>
          ${pending.length > 0
            ? `Bíður eftir mati á ${pending.length} hluta (ritun og/eða tal).`
            : 'Niðurstöður eru að vera unnar…'}
        </p>
        <p class="poll-note">Síðan uppfærist sjálfkrafa.</p>
      </div>`;
  }

  async function renderResults(attempt) {
    const elems   = attempt.elements || [];
    const overall = attempt.overall_score ?? 0;
    const passed  = attempt.passed;
    const DATA_BASE  = '/rikisborgaraprof/data';
    const AUDIO_BASE = 'https://media.civiclearn.com/rikisborgaraprof/audio';
    const simNum     = simId.replace('sim-', '');

    const scores = {
      lestur:  attempt.reading_score  ?? null,
      hlustun: attempt.listening_score ?? null,
      ritun:   attempt.writing_score  ?? null,
      tal:     attempt.speaking_score ?? null,
    };

    const wFeedback = attempt.writing_feedback;
    const sFeedback = attempt.speaking_feedback;
    const readingAnswers   = attempt.reading_answers  || {};
    const listeningAnswers = attempt.listening_answers || {};

    // Fetch content JSONs for reading/listening error review
    let lesturData = null, hlustunData = null;
    try { lesturData  = await fetch(`${DATA_BASE}/${simId}/lestur.json`).then(r => r.ok ? r.json() : null); } catch(e) {}
    try { hlustunData = await fetch(`${DATA_BASE}/${simId}/hlustun.json`).then(r => r.ok ? r.json() : null); } catch(e) {}

    let html = `
      <div class="result-hero ${passed ? 'pass' : 'fail'}">
        <div class="hero-icon">${passed ? '🎉' : '📋'}</div>
        <h1 class="hero-title">${passed ? 'Staðist!' : 'Ekki staðist'}</h1>
        <p class="hero-sub">${passed
          ? 'Til hamingju! Þú standast ríkisborgaraprófið.'
          : 'Þú náðir ekki 60% í öllum hlutum. Haltu áfram að æfa.'}</p>
        <div class="overall-score">${overall}<span class="score-unit">%</span></div>
        <div class="score-label">Heildareinkunnin</div>
      </div>

      <div class="section-scores">
        ${renderScoreCard('📖', 'Lesskilningur', scores.lestur, 'Sjálfvirkt metið')}
        ${renderScoreCard('🎧', 'Hlustun', scores.hlustun, 'Sjálfvirkt metið')}
        ${renderScoreCard('✍️', 'Ritun', scores.ritun, 'Gervigreind mat')}
        ${renderScoreCard('🎤', 'Tal', scores.tal, 'Gervigreind mat')}
      </div>`;

    // ── Reading errors ──
    if (lesturData && lesturData.texts && Object.keys(readingAnswers).length > 0) {
      const wrongTexts = [];
      lesturData.texts.forEach(text => {
        const wrongQs = text.questions.filter(q => {
          const chosen = readingAnswers[q.questionId];
          return chosen && chosen !== q.correctAnswer;
        });
        if (wrongQs.length > 0) wrongTexts.push({ text, wrongQs });
      });

      if (wrongTexts.length > 0) {
        html += `<div class="feedback-section">
          <h2 class="fb-heading">📖 Lesskilningur — villur</h2>`;
        wrongTexts.forEach(({ text, wrongQs }) => {
          html += `
            <div class="review-source">
              <div class="review-source-title">${esc(text.title)}</div>
              <div class="review-source-passage">${esc(text.passage)}</div>
            </div>`;
          wrongQs.forEach(q => {
            const chosen  = readingAnswers[q.questionId];
            const chosenOpt  = q.options.find(o => o.label === chosen);
            const correctOpt = q.options.find(o => o.label === q.correctAnswer);
            html += `
              <div class="review-error">
                <div class="review-question"><span class="review-qnum">${q.questionNumber}</span>${esc(q.question)}</div>
                <div class="review-answers">
                  <span class="mistake-orig">${chosen}: ${esc(chosenOpt?.text || '')}</span>
                  <span class="mistake-arrow">→</span>
                  <span class="mistake-fix">${q.correctAnswer}: ${esc(correctOpt?.text || '')}</span>
                </div>
              </div>`;
          });
        });
        html += `</div>`;
      }
    }

    // ── Listening errors ──
    if (hlustunData && hlustunData.segments && Object.keys(listeningAnswers).length > 0) {
      const wrongSegs = [];
      hlustunData.segments.forEach((seg, si) => {
        const wrongQs = seg.questions.filter(q => {
          const chosen = listeningAnswers[q.questionId];
          return chosen && chosen !== q.correctAnswer;
        });
        if (wrongQs.length > 0) wrongSegs.push({ seg, si, wrongQs });
      });

      if (wrongSegs.length > 0) {
        html += `<div class="feedback-section">
          <h2 class="fb-heading">🎧 Hlustun — villur</h2>`;
        wrongSegs.forEach(({ seg, si, wrongQs }) => {
          const audioUrl = `${AUDIO_BASE}/sim${simNum.padStart(2,'0')}-hl${si + 1}.mp3`;
          html += `
            <div class="review-source">
              <div class="review-source-title">${esc(seg.title)}</div>
              <div class="review-audio">
                <audio controls preload="none" src="${audioUrl}"></audio>
              </div>
            </div>`;
          wrongQs.forEach(q => {
            const chosen  = listeningAnswers[q.questionId];
            const chosenOpt  = q.options.find(o => o.label === chosen);
            const correctOpt = q.options.find(o => o.label === q.correctAnswer);
            html += `
              <div class="review-error">
                <div class="review-question"><span class="review-qnum">${q.questionNumber}</span>${esc(q.question)}</div>
                <div class="review-answers">
                  <span class="mistake-orig">${chosen}: ${esc(chosenOpt?.text || '')}</span>
                  <span class="mistake-arrow">→</span>
                  <span class="mistake-fix">${q.correctAnswer}: ${esc(correctOpt?.text || '')}</span>
                </div>
              </div>`;
          });
        });
        html += `</div>`;
      }
    }

    // Writing feedback
    if (wFeedback && wFeedback.tasks) {
      html += `<div class="feedback-section">
        <h2 class="fb-heading">✍️ Ritun — nákvæm endurgjöf</h2>
        ${wFeedback.tasks.map(task => `
          <div class="fb-task">
            <div class="fb-task-header">
              <span>Verkefni ${task.taskNumber}</span>
              <span class="fb-score">${task.score ?? 0}%</span>
            </div>
            <p class="fb-text">${esc(task.feedback || '')}</p>
            ${renderCriteria(task.criteria)}
            ${renderMistakes(task.mistakes)}
          </div>`).join('')}
        ${wFeedback.overallFeedback ? `<div class="fb-overall"><strong>Heildarumsögn:</strong> ${esc(wFeedback.overallFeedback)}</div>` : ''}
      </div>`;
    }

    // Speaking feedback
    if (sFeedback && sFeedback.parts) {
      html += `<div class="feedback-section">
        <h2 class="fb-heading">🎤 Tal — nákvæm endurgjöf</h2>
        ${sFeedback.parts.map(part => `
          <div class="fb-task">
            <div class="fb-task-header">
              <span>Hluti ${part.partNumber}</span>
              <span class="fb-score">${part.score ?? 0}%</span>
            </div>
            <p class="fb-text">${esc(part.feedback || '')}</p>
            ${renderCriteria(part.criteria)}
            ${renderMistakes(part.mistakes)}
          </div>`).join('')}
        ${sFeedback.overallFeedback ? `<div class="fb-overall"><strong>Heildarumsögn:</strong> ${esc(sFeedback.overallFeedback)}</div>` : ''}
      </div>`;
    }

    html += `
      <div class="actions-footer">
        <a href="/rikisborgaraprof/dashboard/index.html" class="btn btn-outline">← Til baka í yfirlit</a>
      </div>`;

    document.getElementById('mainContent').innerHTML = html;
  }

  function renderScoreCard(icon, label, score, method) {
    const pct   = score ?? null;
    const pass  = pct !== null && pct >= 60;
    const cls   = pct === null ? 'pending' : pass ? 'pass' : 'fail';
    const disp  = pct !== null ? pct + '%' : '—';
    return `
      <div class="score-card ${cls}">
        <div class="sc-icon">${icon}</div>
        <div class="sc-label">${label}</div>
        <div class="sc-score">${disp}</div>
        <div class="sc-method">${method}</div>
      </div>`;
  }

  function renderCriteria(criteria) {
    if (!criteria || !Object.keys(criteria).length) return '';
    const labels = {
      taskCompletion: 'Verkefnaefni', vocabulary: 'Orðaforði',
      grammar: 'Málfræði', coherence: 'Samhengi',
      fluency: 'Flæði', comprehensibility: 'Skiljanleiki'
    };
    return `<div class="criteria-grid">
      ${Object.entries(criteria).map(([k, v]) => `
        <div class="criteria-item">
          <span class="ci-label">${labels[k] || k}</span>
          <span class="ci-val">${v}/10</span>
        </div>`).join('')}
    </div>`;
  }

  function renderMistakes(mistakes) {
    if (!mistakes || !mistakes.length) return '';
    return `<div class="mistakes-list">
      <div class="mistakes-heading">Villur og leiðréttingar</div>
      ${mistakes.map(m => `
        <div class="mistake-item">
          <span class="mistake-orig">${esc(m.original)}</span>
          <span class="mistake-arrow">→</span>
          <span class="mistake-fix">${esc(m.correction)}</span>
          ${m.explanation ? `<div class="mistake-exp">${esc(m.explanation)}</div>` : ''}
        </div>`).join('')}
    </div>`;
  }

  function showError(msg) {
    document.getElementById('mainContent').innerHTML =
      `<div class="error-msg">⚠️ ${esc(msg)}<br><a href="/rikisborgaraprof/dashboard/index.html">← Til baka</a></div>`;
  }

  function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
})();
</script>

<style>
  .results-loading { text-align:center; padding:80px 20px; }
  .results-loading h2 { font-size:1.3rem; margin:16px 0 8px; }
  .results-loading p { color:#64748b; font-size:0.9rem; }
