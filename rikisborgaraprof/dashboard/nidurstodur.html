<!DOCTYPE html>
<html lang="is">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nidurstodur - Rikisborgaraprof</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,wght@0,400;0,600;0,700;1,400&family=DM+Sans:wght@400;500;600;700&display=swap');

  :root {
    --blue: #003897; --blue-light: #e8eef8; --blue-hover: #002a73;
    --red: #d72828; --green: #1a7a3a;
    --green-light: #e6f4ea; --red-light: #fde8e8;
    --amber: #b45309; --amber-light: #fef3c7; --amber-border: #fde68a;
    --gray-50: #f8f9fa; --gray-100: #f1f3f5; --gray-200: #e2e5e9;
    --gray-400: #8b95a5; --gray-600: #4a5568; --gray-800: #1e2a3a;
    --radius: 8px;
    --shadow: 0 1px 3px rgba(0,0,0,.08), 0 1px 2px rgba(0,0,0,.04);
    --shadow-lg: 0 4px 12px rgba(0,0,0,.1);
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'DM Sans', system-ui, sans-serif; background: var(--gray-50); color: var(--gray-800); line-height: 1.6; min-height: 100vh; }

  .topbar { background: var(--blue); color: #fff; padding: 14px 24px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; }
  .topbar-left { display: flex; align-items: center; gap: 12px; }
  .topbar-flag { font-size: 1.4rem; }
  .topbar-title { font-weight: 600; font-size: 0.95rem; color: #fff; }
  .topbar-section { font-size: 0.85rem; opacity: 0.85; }
  .topbar-right { display: flex; align-items: center; gap: 16px; }
  .topbar-sim { background: rgba(255,255,255,0.15); padding: 5px 12px; border-radius: 20px; font-size: 0.8rem; font-weight: 500; }
  .topbar-back { color: #fff; text-decoration: none; font-size: 0.85rem; opacity: 0.8; transition: opacity .2s; }
  .topbar-back:hover { color: #fff; opacity: 1; }

  .main { max-width: 720px; margin: 0 auto; padding: 28px 20px 60px; }
  .loading { text-align: center; padding: 80px 20px; color: var(--gray-400); }
  .loading-spinner { width: 32px; height: 32px; border: 3px solid var(--gray-200); border-top-color: var(--blue); border-radius: 50%; animation: spin .7s linear infinite; margin: 0 auto 16px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes fadeIn { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:translateY(0); } }

  .processing-card { background: #fff; border-radius: 12px; padding: 36px 28px; text-align: center; box-shadow: var(--shadow-lg); margin-bottom: 24px; }
  .processing-icon { font-size: 2.8rem; margin-bottom: 12px; }
  .processing-title { font-family: 'Source Serif 4', serif; font-size: 1.4rem; font-weight: 600; margin-bottom: 8px; }
  .processing-sub { color: var(--gray-600); font-size: 0.88rem; margin-bottom: 20px; line-height: 1.5; }
  .processing-progress { display: flex; flex-direction: column; gap: 6px; text-align: left; max-width: 360px; margin: 20px auto 0; }
  .progress-item { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-radius: var(--radius); background: var(--gray-50); font-size: 0.85rem; }
  .progress-icon { font-size: 1.1rem; flex-shrink: 0; }
  .progress-label { flex: 1; }
  .progress-status { font-size: 0.8rem; color: var(--gray-400); }

  .hero-card { border-radius: 12px; overflow: hidden; box-shadow: var(--shadow-lg); margin-bottom: 28px; animation: fadeIn .5s ease; }
  .hero-card.passed { background: var(--green-light); border: 2px solid #bbf7d0; }
  .hero-card.failed { background: var(--red-light); border: 2px solid #fecaca; }
  .hero-card.partial { background: var(--amber-light); border: 2px solid var(--amber-border); }
  .hero-top { padding: 32px 28px 24px; text-align: center; }
  .hero-badge { display: inline-block; padding: 4px 16px; border-radius: 20px; font-size: 0.85rem; font-weight: 600; margin-bottom: 12px; color: #fff; }
  .passed .hero-badge { background: #166534; }
  .failed .hero-badge { background: #991b1b; }
  .partial .hero-badge { background: var(--amber); }
  .hero-score { font-family: 'Source Serif 4', serif; font-size: 3.5rem; font-weight: 700; line-height: 1; }
  .passed .hero-score { color: #166534; }
  .failed .hero-score { color: #991b1b; }
  .partial .hero-score { color: var(--amber); }
  .hero-score-label { font-size: 0.82rem; color: var(--gray-600); margin-top: 4px; }
  .hero-status { font-size: 0.9rem; color: var(--gray-600); margin-top: 8px; }

  .hero-sections { display: grid; grid-template-columns: repeat(4, 1fr); background: #fff; border-top: 1px solid var(--gray-200); }
  .hero-section { padding: 16px 12px; text-align: center; }
  .hero-section:not(:last-child) { border-right: 1px solid var(--gray-200); }
  .hs-icon { font-size: 1.2rem; }
  .hs-label { font-size: 0.72rem; color: var(--gray-400); text-transform: uppercase; letter-spacing: 0.04em; margin-top: 2px; }
  .hs-score { font-family: 'Source Serif 4', serif; font-size: 1.5rem; font-weight: 700; margin-top: 2px; }
  .hs-pass { color: var(--green); }
  .hs-fail { color: var(--red); }
  .hs-pending { color: var(--gray-400); }

  .section-block { margin-bottom: 20px; }
  .section-header { display: flex; align-items: center; gap: 10px; padding: 14px 18px; background: var(--blue); color: #fff; border-radius: 10px 10px 0 0; font-weight: 600; font-size: 0.92rem; }
  .section-score { margin-left: auto; font-size: 0.85rem; opacity: 0.85; }

  .elem-card { background: #fff; border: 1px solid var(--gray-200); border-top: none; }
  .elem-card:last-child { border-radius: 0 0 10px 10px; }
  .elem-header { display: flex; align-items: center; gap: 10px; padding: 14px 18px; cursor: pointer; user-select: none; }
  .elem-header:hover { background: var(--gray-50); }
  .elem-name { flex: 1; font-size: 0.88rem; font-weight: 500; }
  .elem-score-badge { font-size: 0.78rem; font-weight: 600; padding: 3px 10px; border-radius: 12px; }
  .elem-score-badge.high { background: var(--green-light); color: var(--green); }
  .elem-score-badge.mid { background: var(--amber-light); color: var(--amber); }
  .elem-score-badge.low { background: var(--red-light); color: var(--red); }
  .elem-score-badge.pending { background: var(--amber-light); color: var(--amber); }
  .elem-score-badge.skip { background: var(--gray-100); color: var(--gray-400); }
  .elem-chevron { font-size: 0.8rem; color: var(--gray-400); transition: transform .2s; }
  .elem-card.open .elem-chevron { transform: rotate(90deg); }
  .elem-detail { display: none; padding: 0 18px 16px; }
  .elem-card.open .elem-detail { display: block; animation: fadeIn .3s ease; }

  .feedback-section { margin-top: 14px; }
  .feedback-label { font-size: 0.75rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; color: var(--gray-400); margin-bottom: 6px; }
  .feedback-summary { font-size: 0.88rem; color: var(--gray-600); line-height: 1.5; }
  .feedback-list { display: flex; flex-direction: column; gap: 4px; }

  .criteria-row { display: flex; align-items: center; gap: 8px; padding: 4px 0; font-size: 0.82rem; }
  .criteria-name { flex: 0 0 120px; color: var(--gray-600); }
  .criteria-bar-wrap { flex: 1; height: 6px; background: var(--gray-200); border-radius: 3px; overflow: hidden; }
  .criteria-bar-fill { height: 100%; border-radius: 3px; background: var(--blue); transition: width .5s ease; }
  .criteria-score { width: 36px; text-align: right; font-weight: 600; font-size: 0.78rem; }

  .mistakes-list { display: flex; flex-direction: column; gap: 6px; }
  .mistake-row { font-size: 0.85rem; line-height: 1.5; color: var(--gray-600); }
  .mistake-original { color: var(--red); text-decoration: line-through; }
  .mistake-arrow { margin: 0 4px; color: var(--gray-400); }
  .mistake-correction { color: var(--green); font-weight: 500; }
  .mistake-explanation { color: var(--gray-400); font-style: italic; }

  .btn { display: inline-flex; align-items: center; gap: 6px; padding: 10px 20px; border-radius: var(--radius); font-size: 0.88rem; font-weight: 600; cursor: pointer; border: none; transition: all .15s; }
  .btn-primary { background: var(--blue); color: #fff; }
  .btn-primary:hover { background: var(--blue-hover); }
  .btn-outline { background: #fff; color: var(--blue); border: 1.5px solid var(--blue); }
  .btn-outline:hover { background: var(--blue-light); }
  .btn-retry { background: var(--amber-light); color: var(--amber); border: 1px solid var(--amber-border); }
  .btn-retry:hover { background: #fde68a; }
  .actions { display: flex; gap: 12px; justify-content: center; margin-top: 28px; flex-wrap: wrap; }
  .pass-note { background: var(--gray-100); border-radius: var(--radius); padding: 14px 18px; font-size: 0.82rem; color: var(--gray-600); margin-bottom: 20px; line-height: 1.5; }

  @media (max-width: 600px) {
    .main { padding: 20px 14px 60px; }
    .hero-sections { grid-template-columns: repeat(2, 1fr); }
    .hero-section:nth-child(2) { border-right: none; }
    .hero-section:nth-child(-n+2) { border-bottom: 1px solid var(--gray-200); }
    .hero-score { font-size: 2.8rem; }
    .criteria-name { flex: 0 0 90px; }
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-left">
    <span class="topbar-flag">🇮🇸</span>
    <span class="topbar-title">Ríkisborgarapróf</span>
    <span class="topbar-section">· Niðurstöður</span>
  </div>
  <div class="topbar-right">
    <span class="topbar-sim" id="simLabel">Sim 01</span>
    <a href="index.html" class="topbar-back">← Til baka</a>
  </div>
</div>

<div class="main" id="mainContent">
  <div class="loading" id="loadingState">
    <div class="loading-spinner"></div>
    Hled nidurstoedum...
  </div>
</div>

<script src="/rikisborgaraprof/assets/js/rik-engine.js"></script>
<script>
(function() {
  'use strict';

  var PASS_THRESHOLD = 60;

  var SECTION_META = {
    lestur:  { icon: '📖', title: 'Lesskilningur', evalType: 'auto' },
    hlustun: { icon: '🎧', title: 'Hlustun',       evalType: 'auto' },
    ritun:   { icon: '✍️', title: 'Ritun',          evalType: 'ai' },
    tal:     { icon: '🎤', title: 'Tal',            evalType: 'ai' }
  };

  var simId  = 'sim-01';
  var params = new URLSearchParams(window.location.search);
  if (params.get('sim')) simId = params.get('sim');
  document.getElementById('simLabel').textContent = 'Sim ' + simId.replace('sim-', '');

  // Engine owns all state — init before using
  RIKEngine.init(simId);

  loadResults();

  /* =========================================================
     LOAD RESULTS — reads from engine, not raw localStorage
     ========================================================= */
  async function loadResults() {
    var data          = RIKEngine.currentTest;
    var sectionStatus = {};

    for (var key in SECTION_META) {
      var section = data[key];
      var meta    = SECTION_META[key];
      if (!section) {
        sectionStatus[key] = 'missing';
      } else if (section.status === 'complete' && section.evaluation) {
        sectionStatus[key] = 'complete';
      } else if (meta.evalType === 'auto' && section.pct !== undefined && section.pct !== null) {
        sectionStatus[key] = 'complete';
      } else if (section.status === 'submitted' || section.responses) {
        sectionStatus[key] = 'pending';
      } else if (section.pct !== undefined && section.pct !== null) {
        sectionStatus[key] = 'complete';
      } else {
        sectionStatus[key] = 'missing';
      }
    }

    var hasPending = Object.values(sectionStatus).includes('pending');

    if (hasPending) {
      renderProcessing(data, sectionStatus);
      await evaluatePending(sectionStatus);
      // Re-read state after evaluations complete
      data = RIKEngine.currentTest;
      for (var k in SECTION_META) {
        var s = data[k];
        if (s && s.status === 'complete' && (s.evaluation || (SECTION_META[k].evalType === 'auto' && s.pct !== undefined)))
          sectionStatus[k] = 'complete';
        else if (s && s.status === 'failed')
          sectionStatus[k] = 'failed';
      }
    }

    var allComplete = Object.values(sectionStatus).every(function(s) { return s === 'complete'; });
    if (allComplete) renderResults(data);
    else renderPartial(data, sectionStatus);
  }

  /* =========================================================
     EVALUATE PENDING — delegates to engine methods
     ========================================================= */
  async function evaluatePending(sectionStatus) {
    var promises = [];
    if (sectionStatus.ritun === 'pending') promises.push(runWritingEval());
    if (sectionStatus.tal  === 'pending') promises.push(runSpeakingEval());
    await Promise.allSettled(promises);
  }

  async function runWritingEval() {
    updateProgressIcon('ritun', '⏳', 'Mat í gangi…');
    try {
      await RIKEngine.evaluateWriting();
      updateProgressIcon('ritun', '✅', 'Lokið');
    } catch(err) {
      console.error('[results] Writing eval failed:', err.message);
      RIKEngine.markEvalFailed('ritun', err.message);
      updateProgressIcon('ritun', '❌', 'Villa');
    }
  }

  async function runSpeakingEval() {
    updateProgressIcon('tal', '⏳', 'Mat í gangi…');
    try {
      await RIKEngine.evaluateSpeaking();
      updateProgressIcon('tal', '✅', 'Lokið');
    } catch(err) {
      console.error('[results] Speaking eval failed:', err.message);
      RIKEngine.markEvalFailed('tal', err.message);
      updateProgressIcon('tal', '❌', 'Villa');
    }
  }

  function updateProgressIcon(key, icon, label) {
    var el = document.getElementById('progress-' + key);
    if (!el) return;
    var ic = el.querySelector('.progress-icon'), st = el.querySelector('.progress-status');
    if (ic) ic.textContent = icon;
    if (st) st.textContent = label;
  }

  /* =========================================================
     RENDER PROCESSING
     ========================================================= */
  function renderProcessing(data, sectionStatus) {
    var items = '';
    for (var key in SECTION_META) {
      var meta   = SECTION_META[key];
      var status = sectionStatus[key];
      var icon   = status === 'complete' ? '✅' : status === 'pending' ? '⏳' : '⬜';
      var text   = status === 'complete' ? 'Lokið' : status === 'pending' ? 'Bíður…' : '';
      items += '<div class="progress-item" id="progress-' + key + '">' +
        '<span class="progress-icon">' + icon + '</span>' +
        '<span class="progress-label">' + meta.icon + ' ' + meta.title + '</span>' +
        '<span class="progress-status">' + text + '</span>' +
        '</div>';
    }
    var doneCount = Object.values(sectionStatus).filter(function(s) { return s === 'complete'; }).length;
    document.getElementById('mainContent').innerHTML =
      '<div class="processing-card">' +
        '<div class="processing-icon">⏳</div>' +
        '<div class="processing-title">Niðurstöður reiknaðar…</div>' +
        '<div class="processing-sub">Svörin þín eru metin af gervigreind. Þessi síða uppfærist sjálfkrafa.' +
          '<br><strong>' + doneCount + ' af 4</strong> hlutar metnar.</div>' +
        '<div class="loading-spinner" style="margin:0 auto"></div>' +
        '<div class="processing-progress">' + items + '</div>' +
      '</div>';
  }

  /* =========================================================
     RENDER FULL RESULTS
     ========================================================= */
  function renderResults(data) {
    var scores = {
      lestur:  data.lestur  ? (data.lestur.pct  || 0) : 0,
      hlustun: data.hlustun ? (data.hlustun.pct || 0) : 0,
      ritun:   data.ritun   ? (data.ritun.pct   || 0) : 0,
      tal:     data.tal     ? (data.tal.pct     || 0) : 0
    };
    var overall  = Math.round((scores.lestur + scores.hlustun + scores.ritun + scores.tal) / 4);
    var allPass  = Object.values(scores).every(function(p) { return p >= PASS_THRESHOLD; });
    var passed   = allPass && overall >= PASS_THRESHOLD;

    var html = renderHero(passed, overall, scores);
    html += '<div class="pass-note">Til að standast þarf minnst ' + PASS_THRESHOLD + '% í hverjum hluta og ' + PASS_THRESHOLD + '% í heild.</div>';
    for (var key in SECTION_META) {
      html += renderSectionBlock(key, SECTION_META[key], data, scores[key]);
    }
    html += '<div class="actions">' +
      '<button class="btn btn-outline" onclick="window.location.href=\'index.html\'">Til baka</button>' +
      '<button class="btn btn-primary" onclick="window.retrySimulation()">Reyna aftur</button>' +
      '</div>';

    document.getElementById('mainContent').innerHTML = html;
    wireToggles();
  }

  /* =========================================================
     RENDER PARTIAL
     ========================================================= */
  function renderPartial(data, sectionStatus) {
    var scores = {};
    for (var key in SECTION_META) {
      var s = data[key];
      scores[key] = (s && s.pct !== undefined && s.pct !== null) ? s.pct : null;
    }
    var hasFailed  = Object.values(sectionStatus).includes('failed');
    var validSum   = 0, validCount = 0;
    for (var k in scores) { if (scores[k] !== null) { validSum += scores[k]; validCount++; } }
    var overall = validCount > 0 ? Math.round(validSum / 4) : null;

    var html = '<div class="hero-card partial">' +
      '<div class="hero-top">' +
        '<div class="hero-badge">' + (hasFailed ? '⚠️ Villa við mat' : '⏳ Ólokið') + '</div>' +
        '<div class="hero-score">' + (overall !== null ? overall + '%' : '—') + '</div>' +
        '<div class="hero-score-label">Heildareinkunn</div>' +
        '<div class="hero-status">' + (hasFailed ? 'Sumir hlutar mistókust við mat.' : 'Sumir hlutar vantar.') + '</div>' +
      '</div>' + renderHeroSections(scores) + '</div>';

    if (hasFailed) {
      html += '<div class="pass-note" style="background:var(--amber-light);border:1px solid var(--amber-border)">' +
        '⚠️ AI-mat mistókst fyrir einhverja hluta. Smelltu á <strong>Reyna aftur</strong> til að meta aftur.</div>';
    }
    for (var key2 in SECTION_META) {
      html += renderSectionBlock(key2, SECTION_META[key2], data, scores[key2], sectionStatus[key2]);
    }
    html += '<div class="actions"><button class="btn btn-outline" onclick="window.location.href=\'index.html\'">Til baka</button>';
    if (hasFailed) html += '<button class="btn btn-retry" onclick="window.retryFailed()">🔄 Reyna aftur (mat)</button>';
    html += '</div>';

    document.getElementById('mainContent').innerHTML = html;
    wireToggles();
  }

  /* =========================================================
     HERO
     ========================================================= */
  function renderHero(passed, overall, scores) {
    return '<div class="hero-card ' + (passed ? 'passed' : 'failed') + '">' +
      '<div class="hero-top">' +
        '<div class="hero-badge">' + (passed ? '✅ Staðist' : '❌ Ekki staðist') + '</div>' +
        '<div class="hero-score">' + overall + '%</div>' +
        '<div class="hero-score-label">Heildareinkunn</div>' +
        '<div class="hero-status">' + (passed ? 'Til hamingju!' : 'Þú náðir ekki lágmarki í þetta sinn.') + '</div>' +
      '</div>' + renderHeroSections(scores) + '</div>';
  }

  function renderHeroSections(scores) {
    var html = '<div class="hero-sections">';
    for (var key in SECTION_META) {
      var meta = SECTION_META[key];
      var pct  = scores[key];
      var cls  = pct === null ? 'hs-pending' : pct >= PASS_THRESHOLD ? 'hs-pass' : 'hs-fail';
      html += '<div class="hero-section">' +
        '<div class="hs-icon">' + meta.icon + '</div>' +
        '<div class="hs-label">' + meta.title + '</div>' +
        '<div class="hs-score ' + cls + '">' + (pct !== null ? pct + '%' : '—') + '</div>' +
        '</div>';
    }
    html += '</div>';
    return html;
  }

  /* =========================================================
     SECTION BLOCK
     ========================================================= */
  function renderSectionBlock(key, meta, data, score, status) {
    var section = data[key];
    var pct     = (score !== null && score !== undefined) ? score : null;
    var html    = '<div class="section-block"><div class="section-header">' +
      '<span>' + meta.icon + ' ' + meta.title + '</span>' +
      '<span class="section-score">' + (pct !== null ? pct + '%' : '') + '</span>' +
      '</div>';

    if (meta.evalType === 'auto') {
      html += renderAutoCard(section);
    } else if (section && section.evaluation) {
      html += renderAICards(section.evaluation);
    } else if (status === 'failed') {
      html += '<div class="elem-card"><div class="elem-header">' +
        '<span class="elem-name">Mat mistókst' + (section && section.error ? ': ' + esc(section.error) : '') + '</span>' +
        '<span class="elem-score-badge low">Villa</span></div></div>';
    } else {
      html += '<div class="elem-card"><div class="elem-header"><span class="elem-name">Engin gögn</span>' +
        '<span class="elem-score-badge skip">—</span></div></div>';
    }
    html += '</div>';
    return html;
  }

  function renderAutoCard(section) {
    if (!section || section.pct === undefined) {
      return '<div class="elem-card"><div class="elem-header"><span class="elem-name">Ekki lokið</span>' +
        '<span class="elem-score-badge skip">—</span></div></div>';
    }
    var pct = section.pct, correct = section.correct || 0, total = section.total || 0;
    var cls = pct >= 80 ? 'high' : pct >= PASS_THRESHOLD ? 'mid' : 'low';
    return '<div class="elem-card"><div class="elem-header">' +
      '<span class="elem-name">Sjálfvirkt mat</span>' +
      '<span class="elem-score-badge ' + cls + '">' + correct + '/' + total + ' (' + pct + '%)</span>' +
      '</div></div>';
  }

  function renderAICards(evaluation) {
    var CRIT_LABELS = {
      taskCompletion: 'Verkefni', vocabulary: 'Orðaforði',
      grammar: 'Málfræði', coherence: 'Samhengi',
      fluency: 'Flæði', comprehensibility: 'Skiljanleiki'
    };
    var html  = '';
    var items = evaluation.tasks || evaluation.parts || [];

    items.forEach(function(item, i) {
      var name  = item.taskId || item.partId || ('Hluti ' + (i + 1));
      var score = item.score || 0;
      var cls   = score >= 80 ? 'high' : score >= PASS_THRESHOLD ? 'mid' : 'low';
      var detail = '';

      if (item.feedback)
        detail += '<div class="feedback-section"><div class="feedback-label">Umöngn</div>' +
          '<div class="feedback-summary">' + esc(item.feedback) + '</div></div>';

      if (item.strengths && item.strengths.length) {
        detail += '<div class="feedback-section"><div class="feedback-label">Styrkur</div><div class="feedback-list">';
        item.strengths.forEach(function(s) {
          detail += '<div style="display:flex;gap:6px;align-items:start;font-size:0.85rem;color:var(--gray-600);margin-bottom:4px"><span>✅</span><span>' + esc(s) + '</span></div>';
        });
        detail += '</div></div>';
      }

      if (item.weaknesses && item.weaknesses.length) {
        detail += '<div class="feedback-section"><div class="feedback-label">Til úbóta</div><div class="feedback-list">';
        item.weaknesses.forEach(function(w) {
          detail += '<div style="display:flex;gap:6px;align-items:start;font-size:0.85rem;color:var(--gray-600);margin-bottom:4px"><span>💡</span><span>' + esc(w) + '</span></div>';
        });
        detail += '</div></div>';
      }

      if (item.criteria) {
        detail += '<div class="feedback-section"><div class="feedback-label">Viðmið</div>';
        for (var ck in item.criteria) {
          var cv = typeof item.criteria[ck] === 'number' ? item.criteria[ck] : 0;
          detail += '<div class="criteria-row">' +
            '<span class="criteria-name">' + (CRIT_LABELS[ck] || ck) + '</span>' +
            '<div class="criteria-bar-wrap"><div class="criteria-bar-fill" style="width:' + cv + '%"></div></div>' +
            '<span class="criteria-score">' + cv + '%</span></div>';
        }
        detail += '</div>';
      }

      if (item.mistakes && item.mistakes.length) {
        detail += '<div class="feedback-section"><div class="feedback-label">Villur</div><div class="mistakes-list">';
        item.mistakes.forEach(function(mk) {
          detail += '<div class="mistake-row">' +
            '<span class="mistake-original">' + esc(mk.original || '') + '</span>' +
            '<span class="mistake-arrow">→</span>' +
            '<span class="mistake-correction">' + esc(mk.correction || '') + '</span>' +
            (mk.explanation ? '<span class="mistake-explanation">— ' + esc(mk.explanation) + '</span>' : '') +
            '</div>';
        });
        detail += '</div></div>';
      }

      html += '<div class="elem-card' + (detail ? '' : ' no-detail') + '">' +
        '<div class="elem-header">' +
          '<span class="elem-name">' + esc(name) + '</span>' +
          '<span class="elem-score-badge ' + cls + '">' + score + '%</span>' +
          (detail ? '<span class="elem-chevron">▸</span>' : '') +
        '</div>' +
        (detail ? '<div class="elem-detail">' + detail + '</div>' : '') +
        '</div>';
    });

    if (evaluation.overallFeedback) {
      html += '<div class="elem-card"><div class="elem-header">' +
        '<span class="elem-name">Heildarumöngn</span><span class="elem-chevron">▸</span></div>' +
        '<div class="elem-detail"><div class="feedback-section">' +
          '<div class="feedback-summary">' + esc(evaluation.overallFeedback) + '</div>' +
        '</div></div></div>';
    }
    return html;
  }

  /* =========================================================
     WIRE TOGGLES
     ========================================================= */
  function wireToggles() {
    document.querySelectorAll('.elem-header').forEach(function(h) {
      if (h.querySelector('.elem-chevron')) {
        h.addEventListener('click', function() { h.closest('.elem-card').classList.toggle('open'); });
      }
    });
  }

  /* =========================================================
     RETRY — delegates to engine
     ========================================================= */
  window.retryFailed = function() {
    RIKEngine.retryFailed();
    loadResults();
  };

  window.retrySimulation = function() {
    RIKEngine.resetTest(simId);
    window.location.href = 'lesskilningur.html?sim=' + simId;
  };

  /* =========================================================
     UTILS
     ========================================================= */
  function esc(s) {
    if (!s) return '';
    var d = document.createElement('div');
    d.textContent = String(s);
    return d.innerHTML;
  }

})();
</script>
</body>
</html>
