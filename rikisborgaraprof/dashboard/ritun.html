<!DOCTYPE html>
<html lang="is">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ritun — Ríkisborgarapróf</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,wght@0,400;0,600;0,700;1,400&family=DM+Sans:wght@400;500;600;700&display=swap');

  :root {
    --blue: #003897;
    --blue-light: #e8eef8;
    --blue-hover: #002a73;
    --red: #d72828;
    --green: #1a7a3a;
    --green-light: #e6f4ea;
    --red-light: #fde8e8;
    --amber: #b45309;
    --amber-light: #fef3c7;
    --gray-50: #f8f9fa;
    --gray-100: #f1f3f5;
    --gray-200: #e2e5e9;
    --gray-400: #8b95a5;
    --gray-600: #4a5568;
    --gray-800: #1e2a3a;
    --radius: 8px;
    --shadow: 0 1px 3px rgba(0,0,0,.08), 0 1px 2px rgba(0,0,0,.04);
    --shadow-lg: 0 4px 12px rgba(0,0,0,.1);
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'DM Sans', system-ui, sans-serif;
    background: var(--gray-50);
    color: var(--gray-800);
    line-height: 1.6;
    min-height: 100vh;
  }

  /* ── Topbar ── */
  .topbar {
    background: var(--blue); color: #fff; padding: 14px 24px;
    display: flex; align-items: center; justify-content: space-between;
    position: sticky; top: 0; z-index: 100;
  }
  .topbar-left { display: flex; align-items: center; gap: 12px; }
  .topbar-flag { font-size: 1.4rem; }
  .topbar-title { font-weight: 600; font-size: 0.95rem; }
  .topbar-section { font-size: 0.85rem; opacity: 0.85; }
  .topbar-right { display: flex; align-items: center; gap: 16px; }
  .topbar-sim { background: rgba(255,255,255,0.15); padding: 5px 12px; border-radius: 20px; font-size: 0.8rem; font-weight: 500; }
  .topbar-back { color: #fff; text-decoration: none; font-size: 0.85rem; opacity: 0.8; transition: opacity .2s; }
  .topbar-back:hover { opacity: 1; }

  .progress-wrap { background: var(--gray-200); height: 4px; width: 100%; }
  .progress-fill { height: 100%; background: var(--blue); transition: width .4s ease; width: 0%; }

  .main { max-width: 780px; margin: 0 auto; padding: 32px 20px 80px; }

  .section-label {
    display: inline-flex; align-items: center; gap: 6px;
    background: var(--blue-light); color: var(--blue);
    font-size: 0.78rem; font-weight: 600; text-transform: uppercase;
    letter-spacing: 0.06em; padding: 5px 12px; border-radius: 20px; margin-bottom: 12px;
  }
  .section-instructions { font-size: 0.9rem; color: var(--gray-600); margin-bottom: 24px; line-height: 1.5; }

  /* ── Task card ── */
  .task-card {
    background: #fff; border-radius: var(--radius);
    box-shadow: var(--shadow); margin-bottom: 28px; overflow: hidden;
  }
  .task-header { padding: 20px 24px 16px; border-bottom: 1px solid var(--gray-200); }
  .task-number { font-size: 0.75rem; font-weight: 600; color: var(--gray-400); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 4px; }
  .task-type-badge {
    display: inline-block; font-size: 0.72rem; font-weight: 600; padding: 3px 8px;
    border-radius: 10px; margin-bottom: 8px;
  }
  .task-type-badge.picture { background: #ede9fe; color: #5b21b6; }
  .task-type-badge.topic { background: #e0f2fe; color: #0369a1; }

  .task-prompt {
    font-family: 'Source Serif 4', Georgia, serif;
    font-size: 1.1rem; font-weight: 600; color: var(--gray-800);
  }

  /* ── Image placeholder ── */
  .image-section { padding: 20px 24px; border-bottom: 1px solid var(--gray-200); background: var(--gray-50); }
  .image-placeholder {
    background: #fff; border: 2px dashed var(--gray-200); border-radius: var(--radius);
    padding: 32px 20px; text-align: center; color: var(--gray-400); font-size: 0.88rem;
  }
  .image-placeholder .img-icon { font-size: 2rem; margin-bottom: 8px; display: block; }
  .image-actual {
    width: 100%; max-height: 400px; object-fit: contain;
    border-radius: var(--radius); display: block; margin: 0 auto;
    transition: opacity .15s;
  }
  .image-section:hover .image-actual { opacity: 0.9; }

  /* Lightbox */
  .lightbox {
    display: none; position: fixed; inset: 0; z-index: 9999;
    background: rgba(0,0,0,.85); align-items: center; justify-content: center;
    cursor: zoom-out;
  }
  .lightbox.open { display: flex; animation: fadeIn .2s ease; }
  .lightbox img { max-width: 92vw; max-height: 90vh; border-radius: 8px; box-shadow: 0 8px 32px rgba(0,0,0,.4); }
  .lightbox-close {
    position: absolute; top: 16px; right: 20px;
    background: rgba(255,255,255,.15); border: none; color: #fff;
    width: 40px; height: 40px; border-radius: 50%; font-size: 1.4rem;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
  }
  .lightbox-close:hover { background: rgba(255,255,255,.3); }

  /* ── Writing area ── */
  .writing-section { padding: 20px 24px 24px; }
  .writing-label { font-size: 0.8rem; font-weight: 600; color: var(--gray-400); text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 10px; }

  .writing-area {
    width: 100%; min-height: 180px; padding: 14px 16px;
    border: 2px solid var(--gray-200); border-radius: var(--radius);
    font-family: 'Source Serif 4', Georgia, serif; font-size: 1.02rem;
    line-height: 1.7; color: var(--gray-800); resize: vertical;
    transition: border-color .2s;
  }
  .writing-area:focus { outline: none; border-color: var(--blue); }
  .writing-area:disabled { background: var(--gray-100); color: var(--gray-600); }

  .writing-meta {
    display: flex; justify-content: space-between; align-items: center;
    margin-top: 8px; flex-wrap: wrap; gap: 8px;
  }
  .sentence-counter { font-size: 0.82rem; color: var(--gray-400); }
  .sentence-counter.ok { color: var(--green); }
  .sentence-counter.low { color: var(--amber); }
  .word-counter { font-size: 0.78rem; color: var(--gray-400); }

  /* ── Feedback panel (shown after AI evaluation) ── */
  .feedback-panel {
    display: none; margin: 16px 24px 24px; padding: 20px;
    border-radius: var(--radius); border: 1px solid var(--gray-200);
  }
  .feedback-panel.visible { display: block; animation: fadeIn .4s ease; }
  .feedback-panel.pass { border-color: var(--green); background: var(--green-light); }
  .feedback-panel.fail { border-color: var(--red); background: var(--red-light); }
  .feedback-panel.pending { border-color: var(--amber); background: var(--amber-light); }

  .feedback-score {
    font-family: 'Source Serif 4', Georgia, serif;
    font-size: 1.6rem; font-weight: 700; margin-bottom: 4px;
  }
  .feedback-label { font-size: 0.82rem; color: var(--gray-600); margin-bottom: 12px; }
  .feedback-text { font-size: 0.9rem; color: var(--gray-800); line-height: 1.6; }

  .feedback-criteria { margin-top: 14px; }
  .criteria-row {
    display: flex; align-items: center; gap: 10px;
    padding: 6px 0; font-size: 0.85rem;
  }
  .criteria-name { flex: 1; color: var(--gray-600); }
  .criteria-bar-wrap { width: 120px; height: 6px; background: var(--gray-200); border-radius: 3px; overflow: hidden; }
  .criteria-bar-fill { height: 100%; border-radius: 3px; background: var(--blue); }
  .criteria-score { width: 36px; text-align: right; font-weight: 600; font-size: 0.8rem; }

  /* ── Buttons ── */
  .actions { display: flex; justify-content: center; gap: 12px; margin-top: 36px; flex-wrap: wrap; }
  .btn {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 13px 32px; border-radius: var(--radius); border: none;
    font-family: inherit; font-size: 0.95rem; font-weight: 600;
    cursor: pointer; transition: all .15s ease;
  }
  .btn-primary { background: var(--blue); color: #fff; }
  .btn-primary:hover { background: var(--blue-hover); transform: translateY(-1px); box-shadow: var(--shadow-lg); }
  .btn-primary:disabled { background: var(--gray-400); cursor: not-allowed; transform: none; box-shadow: none; }
  .btn-outline { background: #fff; color: var(--blue); border: 2px solid var(--blue); }
  .btn-outline:hover { background: var(--blue-light); }

  .skip-link {
    font-size: 0.82rem;
    color: var(--gray-400);
    cursor: pointer;
    text-decoration: underline;
    text-underline-offset: 2px;
  }
  .skip-link:hover { color: var(--gray-600); }

  .submit-status { text-align: center; margin-top: 12px; font-size: 0.85rem; color: var(--gray-400); }
  .submit-status.error { color: var(--red); }

  /* ── Loading spinner ── */
  .loading { text-align: center; padding: 60px 20px; color: var(--gray-400); font-size: 0.95rem; }
  .loading-spinner {
    width: 32px; height: 32px; border: 3px solid var(--gray-200);
    border-top-color: var(--blue); border-radius: 50%;
    animation: spin .7s linear infinite; margin: 0 auto 16px;
  }
  .inline-spinner {
    display: inline-block; width: 16px; height: 16px;
    border: 2px solid rgba(255,255,255,.3); border-top-color: #fff;
    border-radius: 50%; animation: spin .7s linear infinite;
    vertical-align: middle; margin-right: 6px;
  }
  .error-msg { color: var(--red); text-align: center; padding: 40px; }

  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

  @media (max-width: 600px) {
    .topbar { padding: 12px 16px; flex-wrap: wrap; gap: 8px; }
    .main { padding: 20px 14px 60px; }
    .task-header, .image-section, .writing-section { padding-left: 16px; padding-right: 16px; }
    .feedback-panel { margin-left: 16px; margin-right: 16px; }
    .btn { padding: 12px 24px; font-size: 0.88rem; }
    .criteria-bar-wrap { width: 80px; }
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-left">
    <span class="topbar-flag">🇮🇸</span>
    <span class="topbar-title">Ríkisborgarapróf</span>
    <span class="topbar-section">· Ritun</span>
  </div>
  <div class="topbar-right">
    <span class="topbar-sim" id="simLabel">Sim 01</span>
    <a href="index.html" class="topbar-back">← Til baka</a>
  </div>
</div>
<div class="progress-wrap"><div class="progress-fill" id="progressBar"></div></div>

<div class="main" id="mainContent">
  <div class="loading" id="loadingState">
    <div class="loading-spinner"></div>
    Hleð ritunarprófi…
  </div>
</div>

<div class="lightbox" id="lightbox" onclick="window._closeLightbox()">
  <button class="lightbox-close" onclick="window._closeLightbox()">✕</button>
  <img id="lightboxImg" src="" alt="">
</div>

<script src="/rikisborgaraprof/assets/js/auth-guard-rik.js"></script>
<script src="/rikisborgaraprof/assets/js/rik-engine.js"></script>
<script>
(function() {
  'use strict';

  const DATA_BASE  = '/rikisborgaraprof/data';

  let examData  = null;
  let submitted = false;
  let simId     = 'sim-01';

  const params = new URLSearchParams(window.location.search);
  if (params.get('sim')) simId = params.get('sim');
  document.getElementById('simLabel').textContent = 'Sim ' + simId.replace('sim-', '');
  RIKEngine.init(simId);

  const jsonPath = `${DATA_BASE}/${simId}/ritun.json`;

  fetch(jsonPath)
    .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(data => { examData = data; render(); })
    .catch(err => {
      document.getElementById('loadingState').innerHTML =
        `<div class="error-msg">Gat ekki hlaðið gögnum.<br><small>${jsonPath} — ${err.message}</small></div>`;
    });

  /* ── Render ── */
  function render() {
    const main = document.getElementById('mainContent');

    let html = `
      <div class="section-label">✍️ Ritun — Skrifaðu á íslensku</div>
      <div class="section-instructions">
        Hér eru tveir skrifverkefni. Lestu leiðbeiningarnar vel og skrifaðu minnst 5 setningar í hvort verkefni.
      </div>`;

    examData.tasks.forEach((task, ti) => {
      const isPicture = task.type === 'picture_description';
      const typeLabel = isPicture ? 'Myndalýsing' : 'Ritgerð';
      const typeClass = isPicture ? 'picture' : 'topic';

      html += `
        <div class="task-card" id="task-${task.taskId}">
          <div class="task-header">
            <div class="task-number">Verkefni ${task.taskNumber} af ${examData.tasks.length}</div>
            <span class="task-type-badge ${typeClass}">${typeLabel}</span>
            <div class="task-prompt">${esc(task.prompt)}</div>
          </div>

          ${isPicture ? renderImageSection(task) : ''}

          <div class="writing-section">
            <div class="writing-label">Svarið þitt</div>
            <textarea class="writing-area" id="text-${task.taskId}"
                      placeholder="${isPicture ? 'Lýstu myndinni hér…' : 'Skrifaðu hér…'}"
                      oninput="window._updateCounter('${task.taskId}', ${task.minimumSentences})"></textarea>
            <div class="writing-meta">
              <span class="sentence-counter low" id="counter-${task.taskId}">0 / ${task.minimumSentences} setningar</span>
              <span class="word-counter" id="words-${task.taskId}">0 orð</span>
            </div>
          </div>

          <div class="feedback-panel" id="feedback-${task.taskId}"></div>
        </div>`;
    });

    html += `
      <div class="actions">
        <button class="btn btn-primary" id="btnSubmit" onclick="window._submit()">
          Senda svör til yfirferðar
        </button>
      </div>
      <p style="text-align:center; margin-top:8px;"><span class="skip-link" id="skipLink" onclick="window._skip()">Sleppa og halda áfram</span></p>
      <div class="submit-status" id="submitStatus"></div>
      <div class="actions" id="navActions" style="display:none">
        <button class="btn btn-outline" onclick="window._restart()">Reyna aftur</button>
        <button class="btn btn-primary" onclick="window._next()">Áfram í tal →</button>
      </div>`;

    main.innerHTML = html;

    // Restore drafts — engine owns draft storage
    examData.tasks.forEach(task => {
      const saved = RIKEngine.getDraft(task.taskId);
      if (saved) {
        document.getElementById(`text-${task.taskId}`).value = saved;
        window._updateCounter(task.taskId, task.minimumSentences);
      }
    });
  }

  function renderImageSection(task) {
    if (task.imageRef) {
      return `
        <div class="image-section" style="cursor:zoom-in" onclick="window._openLightbox('${task.imageRef}')">
          <img class="image-actual" src="${task.imageRef}" alt="${esc(task.imageDescription)}">
        </div>`;
    }
    return `
      <div class="image-section">
        <div class="image-placeholder">
          <span class="img-icon">🖼️</span>
          <strong>Mynd:</strong> ${esc(task.imageDescription)}
        </div>
      </div>`;
  }

  /* ── Sentence counter + autosave draft ── */
  window._updateCounter = function(taskId, minSentences) {
    const textarea = document.getElementById(`text-${taskId}`);
    const text     = textarea.value.trim();

    const sentences = text.length > 0
      ? text.split(/[.!?]+/).filter(s => s.trim().length > 2).length
      : 0;
    const words = text.length > 0 ? text.split(/\s+/).filter(w => w.length > 0).length : 0;

    const counter = document.getElementById(`counter-${taskId}`);
    counter.textContent = `${sentences} / ${minSentences} setningar`;
    counter.className   = 'sentence-counter ' + (sentences >= minSentences ? 'ok' : 'low');
    document.getElementById(`words-${taskId}`).textContent = `${words} orð`;

    // Engine owns draft storage
    RIKEngine.saveDraft(taskId, textarea.value);
    updateProgress();
  };

  /* ── Submit — engine owns state ── */
  window._submit = function() {
    if (submitted) return;

    let allValid = true;
    examData.tasks.forEach(task => {
      const text = document.getElementById(`text-${task.taskId}`).value.trim();
      if (text.length < 20) {
        allValid = false;
        document.getElementById(`text-${task.taskId}`).style.borderColor = 'var(--red)';
        setTimeout(() => { document.getElementById(`text-${task.taskId}`).style.borderColor = ''; }, 2000);
      }
    });

    if (!allValid) {
      const s = document.getElementById('submitStatus');
      s.textContent = 'Vinsamlegast skrifaðu í öll verkefni.';
      s.className   = 'submit-status error';
      return;
    }

    submitted = true;
    document.getElementById('btnSubmit').disabled = true;
    examData.tasks.forEach(task => { document.getElementById(`text-${task.taskId}`).disabled = true; });

    // Collect responses and hand to engine
    const responses = {};
    examData.tasks.forEach(task => {
      responses[task.taskId] = {
        taskId:      task.taskId,
        taskNumber:  task.taskNumber,
        type:        task.type,
        text:        document.getElementById(`text-${task.taskId}`).value.trim()
      };
      RIKEngine.clearDraft(task.taskId);
    });
    RIKEngine.submitRitun(responses);

    // DOM feedback
    document.getElementById('btnSubmit').style.display = 'none';
    document.getElementById('submitStatus').textContent = '';
    document.getElementById('skipLink').style.display  = 'none';

    examData.tasks.forEach(task => {
      const panel = document.getElementById(`feedback-${task.taskId}`);
      panel.className = 'feedback-panel visible pending';
      panel.innerHTML = `
        <div class="feedback-label">✅ Sent í yfirferð</div>
        <div class="feedback-text">Svarið þitt hefur verið vistað. Niðurstöður birtast á niðurstöðusíðunni.</div>`;
    });

    document.getElementById('navActions').style.display = 'flex';
  };

  /* ── Skip — engine owns state ── */
  window._skip = function() {
    if (submitted) return;
    if (!confirm('Sleppa ritun? Þú færð 0 stig.')) return;
    submitted = true;
    examData.tasks.forEach(task => { RIKEngine.clearDraft(task.taskId); });
    RIKEngine.skipSection('ritun');
    document.getElementById('skipLink').style.display  = 'none';
    document.getElementById('btnSubmit').style.display = 'none';
    document.getElementById('submitStatus').textContent = '';
    document.getElementById('navActions').style.display = 'flex';
  };

  /* ── Restart ── */
  window._restart = function() {
    submitted = false;
    examData.tasks.forEach(task => { RIKEngine.clearDraft(task.taskId); });
    RIKEngine.currentTest.ritun.responses = {};
    RIKEngine.currentTest.ritun.status    = null;
    RIKEngine._save();
    render();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  };

  /* ── Next section ── */
  window._next = function() { window.location.href = `tal.html?sim=${simId}`; };

  /* ── Progress ── */
  function updateProgress() {
    const total = examData.tasks.length;
    let done = 0;
    examData.tasks.forEach(task => {
      const el = document.getElementById(`text-${task.taskId}`);
      if (el && el.value.trim().length > 20) done++;
    });
    document.getElementById('progressBar').style.width = (done / total * 100) + '%';
  }

  /* ── Util ── */
  function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

})();
</script>


<script>
window._openLightbox=function(s){document.getElementById("lightboxImg").src=s;document.getElementById("lightbox").classList.add("open")};
window._closeLightbox=function(){document.getElementById("lightbox").classList.remove("open");document.getElementById("lightboxImg").src=""};
document.addEventListener("keydown",function(e){if(e.key==="Escape")window._closeLightbox()});
</script>
</body>
</html>
