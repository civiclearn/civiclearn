<!DOCTYPE html>
<html lang="is">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Greiðsla tókst — Ríkisborgarapróf</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,wght@0,400;0,600;0,700;1,400&family=DM+Sans:wght@400;500;600;700&display=swap');

  :root {
    --blue: #003897; --blue-hover: #002a73;
    --green: #1a7a3a; --green-light: #e6f4ea;
    --red: #d72828; --red-light: #fde8e8;
    --gray-50: #f8f9fa; --gray-200: #e2e5e9;
    --gray-400: #8b95a5; --gray-600: #4a5568; --gray-800: #1e2a3a;
    --radius: 8px; --shadow-lg: 0 4px 12px rgba(0,0,0,.1);
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'DM Sans', system-ui, sans-serif; background: var(--gray-50); color: var(--gray-800); min-height: 100vh; display: flex; flex-direction: column; }

  .topbar { background: var(--blue); color: #fff; padding: 14px 24px; display: flex; align-items: center; gap: 12px; }
  .topbar-flag  { font-size: 1.4rem; }
  .topbar-title { font-weight: 600; font-size: 0.95rem; }

  .page-wrap { flex: 1; display: flex; align-items: center; justify-content: center; padding: 40px 16px; }

  .card {
    background: #fff; border-radius: 12px;
    box-shadow: var(--shadow-lg); padding: 40px 36px;
    width: 100%; max-width: 440px; text-align: center;
  }

  .step { display: none; }
  .step.active { display: block; }

  /* Step: loading */
  .loading-icon { font-size: 2.5rem; margin-bottom: 16px; }
  .loading-text { font-size: 1rem; color: var(--gray-600); }
  .spinner-large {
    width: 40px; height: 40px; margin: 0 auto 20px;
    border: 3px solid var(--gray-200);
    border-top-color: var(--blue); border-radius: 50%;
    animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Step: set password */
  .step-icon  { font-size: 2.5rem; margin-bottom: 12px; }
  .step-title { font-size: 1.4rem; font-weight: 700; margin-bottom: 8px; }
  .step-sub   { font-size: 0.9rem; color: var(--gray-600); margin-bottom: 24px; line-height: 1.5; }

  .field { margin-bottom: 16px; text-align: left; }
  .field label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 6px; }
  .field input {
    width: 100%; padding: 11px 14px;
    border: 1.5px solid var(--gray-200); border-radius: var(--radius);
    font-family: inherit; font-size: 1rem; outline: none; transition: border-color .2s;
  }
  .field input:focus { border-color: var(--blue); }

  .btn {
    width: 100%; padding: 13px;
    background: var(--blue); color: #fff; border: none;
    border-radius: var(--radius); font-family: inherit;
    font-size: 1rem; font-weight: 600; cursor: pointer; transition: background .2s;
  }
  .btn:hover    { background: var(--blue-hover); }
  .btn:disabled { opacity: 0.6; cursor: not-allowed; }

  .msg { margin-top: 12px; padding: 10px 14px; border-radius: var(--radius); font-size: 0.9rem; display: none; }
  .msg.error   { background: var(--red-light);   color: var(--red);   display: block; }
  .msg.success { background: var(--green-light);  color: var(--green); display: block; }

  /* Step: done */
  .done-icon  { font-size: 3rem; margin-bottom: 16px; }
  .done-title { font-size: 1.5rem; font-weight: 700; margin-bottom: 8px; }
  .done-sub   { font-size: 0.95rem; color: var(--gray-600); margin-bottom: 24px; }
  .btn-go     { display: inline-block; padding: 13px 28px; background: var(--blue); color: #fff; border-radius: var(--radius); text-decoration: none; font-weight: 600; font-size: 1rem; transition: background .2s; }
  .btn-go:hover { background: var(--blue-hover); }

  .spinner-sm {
    display: inline-block; width: 16px; height: 16px;
    border: 2px solid rgba(255,255,255,.4); border-top-color: #fff;
    border-radius: 50%; animation: spin .7s linear infinite;
    vertical-align: middle; margin-right: 6px;
  }
</style>
</head>
<body>

<div class="topbar">
  <span class="topbar-flag">🇮🇸</span>
  <span class="topbar-title">Ríkisborgarapróf</span>
</div>

<div class="page-wrap">
  <div class="card">

    <!-- Step: verifying payment -->
    <div class="step active" id="stepVerifying">
      <div class="spinner-large"></div>
      <div class="loading-text">Staðfesti greiðslu…</div>
    </div>

    <!-- Step: set password -->
    <div class="step" id="stepPassword">
      <div class="step-icon">🎉</div>
      <div class="step-title">Greiðsla tókst!</div>
      <div class="step-sub">Búðu til lykilorð til að klára að setja upp aðganginn þinn.</div>
      <div class="field">
        <label for="pw1">Lykilorð</label>
        <input type="password" id="pw1" autocomplete="new-password" placeholder="Minnst 6 stafir">
      </div>
      <div class="field">
        <label for="pw2">Staðfesta lykilorð</label>
        <input type="password" id="pw2" autocomplete="new-password" placeholder="Endurtaktu lykilorðið">
      </div>
      <button class="btn" id="btnSetup" onclick="doSetup()">Klára skráningu</button>
      <div class="msg" id="setupMsg"></div>
    </div>

    <!-- Step: all done -->
    <div class="step" id="stepDone">
      <div class="done-icon">✅</div>
      <div class="done-title">Aðgangur virkur!</div>
      <div class="done-sub" id="doneEmail"></div>
      <a href="index.html" class="btn-go">Fara á mæliborðið →</a>
    </div>

    <!-- Step: error -->
    <div class="step" id="stepError">
      <div class="step-icon">❌</div>
      <div class="step-title">Eitthvað fór úrskeiðis</div>
      <div class="step-sub" id="errorDetail">Ekki tókst að staðfesta greiðsluna.</div>
      <a href="checkout.html" class="btn-go" style="background:#555">Reyna aftur</a>
    </div>

  </div>
</div>

<script>
(function () {
  'use strict';

  const SUPABASE_URL  = 'https://htgliokekeaovdiafrgs.supabase.co';
  const SUPABASE_KEY  = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imh0Z2xpb2tla2Vhb3ZkaWFmcmdzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjM1NTcxMzMsImV4cCI6MjA3OTEzMzEzM30.nGWQn8GJn7aJct3Fu36p63NQvCqnifiPYQnF8QJKLYs';
  const FN_BASE       = SUPABASE_URL + '/functions/v1';

  const params     = new URLSearchParams(window.location.search);
  const sessionId  = params.get('session_id');

  function showStep(id) {
    document.querySelectorAll('.step').forEach(el => el.classList.remove('active'));
    document.getElementById(id).classList.add('active');
  }

  if (!sessionId) {
    document.getElementById('errorDetail').textContent = 'Engin greiðsluupplýsingar fundust. Farðu á kaupasíðuna aftur.';
    showStep('stepError');
  } else {
    // Verify the session is paid via rik-setup-account's initial check
    // We skip a separate verify step and go straight to password form
    // (rik-setup-account verifies payment_status === "paid" before creating account)
    showStep('stepPassword');
  }

  window.doSetup = async function () {
    const pw1 = document.getElementById('pw1').value;
    const pw2 = document.getElementById('pw2').value;
    const btn = document.getElementById('btnSetup');
    const msg = document.getElementById('setupMsg');
    msg.className = 'msg';

    if (!pw1 || pw1.length < 6) { msg.className = 'msg error'; msg.textContent = 'Lykilorð verður að vera a.m.k. 6 stafir.'; return; }
    if (pw1 !== pw2)             { msg.className = 'msg error'; msg.textContent = 'Lykilorðin stemma ekki.'; return; }

    btn.disabled = true;
    btn.innerHTML = '<span class="spinner-sm"></span>Stilli reikning…';

    try {
      const res  = await fetch(`${FN_BASE}/rik-setup-account`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${SUPABASE_KEY}` },
        body: JSON.stringify({ session_id: sessionId, password: pw1 })
      });
      const data = await res.json();

      if (!data.success) {
        msg.className = 'msg error';
        msg.textContent = data.error || 'Villa við uppsetningu. Hafðu samband við okkur.';
        btn.disabled = false; btn.textContent = 'Klára skráningu';
        return;
      }

      // Auto-login
      const loginRes  = await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=password`, {
        method: 'POST',
        headers: { 'apikey': SUPABASE_KEY, 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: data.email, password: pw1 })
      });
      const loginData = await loginRes.json();

      if (loginData.access_token) {
        localStorage.setItem('cl_email', data.email);
        localStorage.setItem('cl_token', loginData.access_token);
      }

      document.getElementById('doneEmail').textContent = `Skráður inn sem: ${data.email}`;
      showStep('stepDone');

    } catch (e) {
      msg.className = 'msg error';
      msg.textContent = 'Tengivillar. Reyndu aftur.';
      btn.disabled = false; btn.textContent = 'Klára skráningu';
    }
  };

  document.getElementById('pw2').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') window.doSetup();
  });

})();
</script>

</body>
</html>
