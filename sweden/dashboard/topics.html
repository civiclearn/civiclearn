<script>
document.addEventListener("DOMContentLoaded", () => {
  const cfg = window.CIVICEDGE_CONFIG || {};
  const container = document.getElementById("topicContainer");
  const startBtn = document.getElementById("startBtn");
  const selected = new Set();
  const bankPath = cfg.bank && cfg.bank.path;
  const lang = window.CIVICEDGE_LANG || "en";

  function normalizeLabel(str) {
    return (str || "").normalize("NFD").replace(/\p{Diacritic}/gu, "").toLowerCase().trim().replace(/\s+/g, " ");
  }

  async function loadBankTopics() {
    if (!bankPath) return [];
    try {
      const res = await fetch(bankPath);
      const raw = await res.json();
      return Array.isArray(raw) ? raw : (raw.questions || []);
    } catch (e) { return []; }
  }

  function isMicrotopicMastered(microCanon, bankQuestions, progress) {
    const qs = bankQuestions.filter(q => q.microtopic && q.microtopic.en === microCanon);
    for (const q of qs) {
      const key = `${microCanon}:${q.id}`;
      const entry = progress[key];
      if (!(entry && entry.correct === 1)) return false;
    }
    return qs.length > 0;
  }

  async function initTopics() {
    const bankQuestions = await loadBankTopics();
    const progress = JSON.parse(localStorage.getItem("civicedge_progress") || "{}");

    const groupedTopics = {};
    bankQuestions.forEach(q => {
      if (!q.topic || !q.microtopic || typeof q.topic !== "object" || typeof q.microtopic !== "object") return;
      const realCanon = q.topic.en;
      if (!realCanon) return;
      const realLabel = q.topic[lang] || realCanon;
      const microCanon = q.microtopic.en;
      const microLabel = q.microtopic[lang] || microCanon;
      if (!microCanon) return;

      if (!groupedTopics[realCanon]) groupedTopics[realCanon] = { label: realLabel, total: 0, micros: {} };
      groupedTopics[realCanon].total++;
      if (!groupedTopics[realCanon].micros[microCanon]) groupedTopics[realCanon].micros[microCanon] = { label: microLabel, count: 0 };
      groupedTopics[realCanon].micros[microCanon].count++;
    });

    container.innerHTML = "";
    Object.values(groupedTopics).forEach(group => {
      const groupWrap = document.createElement("div");
      groupWrap.className = "topic-group";

      const header = document.createElement("div");
      header.className = "topic-group-title";
      header.innerHTML = `<span>${group.label}</span><span class="topic-group-badge">${group.total}</span>`;

      const chipsWrap = document.createElement("div");
      chipsWrap.className = "topic-chips";

      Object.entries(group.micros).forEach(([microCanon, mt]) => {
        const chip = document.createElement("button");
        chip.className = "topic-chip";
        if (isMicrotopicMastered(microCanon, bankQuestions, progress)) chip.classList.add("mastered");
        chip.dataset.topic = mt.label;
        chip.innerHTML = `${mt.label}<span class="chip-count">${mt.count}</span>`;
        chip.addEventListener("click", () => {
          chip.classList.toggle("active");
          chip.classList.contains("active") ? selected.add(microCanon) : selected.delete(microCanon);
          startBtn.style.display = selected.size > 0 ? "inline-block" : "none";
        });
        chipsWrap.appendChild(chip);
      });

      groupWrap.appendChild(header);
      groupWrap.appendChild(chipsWrap);
      container.appendChild(groupWrap);
    });

    startBtn.addEventListener("click", () => {
      const pick = Array.from(selected);
      const limit = (cfg.topics && cfg.topics.questionCount) || 10;
      document.getElementById("quizArea").style.display = "block";
      document.querySelector("section").style.display = "none";
      CivicEdgeEngine.start("topics", { topics: pick, limit: limit });
      window.scrollTo({ top: 0, behavior: "smooth" });
    });
  }

  initTopics();
});
</script>
<script>
document.addEventListener("DOMContentLoaded", () => {
  const toggle = document.querySelector(".menu-toggle");
  const overlay = document.getElementById("menuOverlay");
  if (toggle) toggle.addEventListener("click", () => document.body.classList.toggle("menu-open"));
  if (overlay) overlay.addEventListener("click", () => document.body.classList.remove("menu-open"));
  const current = window.CIVICEDGE_LANG;
  document.querySelectorAll(".lang-switch button").forEach(btn => {
    if (btn.dataset.lang === current) btn.classList.add("active");
    btn.addEventListener("click", () => {
      if (btn.dataset.lang === current) return;
      localStorage.setItem("civicedge_lang", btn.dataset.lang);
      location.reload();
    });
  });
});
</script>
