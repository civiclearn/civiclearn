<script>
document.addEventListener("DOMContentLoaded", () => {
  CivicLearnI18n.onReady(async () => {
    const bankPath = window.CIVICEDGE_CONFIG?.bank?.path;
    if (!bankPath) return;
    let fullBank = [];
    try { const res = await fetch(bankPath); const raw = await res.json(); fullBank = Array.isArray(raw) ? raw : (raw.questions || []); } catch { return; }

    let progress = {};
    try { progress = JSON.parse(localStorage.getItem("civicedge_progress") || "{}"); } catch {}

    const trickyKeys = Object.keys(progress).filter(id => (progress[id].wrongs || 0) >= 3 && (progress[id].rights || 0) < 2);
    const normalizedSet = new Set(trickyKeys);
    const trickySet = fullBank.filter(q => {
      const qKey = `${q.microtopic?.en || q.topic?.en || ""}:${q.id}`;
      return normalizedSet.has(qKey);
    });

    const quizArea = document.getElementById("quizArea");
    if (trickySet.length === 0) {
      quizArea.innerHTML = `<div class="ce-card"><h2 data-i18n="traps_none_title"></h2><p data-i18n="traps_none_body"></p></div>`;
      CivicLearnI18n.apply();
      return;
    }

    CivicEdgeEngine.start("traps", { bank: trickySet, limit: 20, timed: false, simulation: false, recursive: false, showFeedback: true });
  });
});
</script>
<script>
document.addEventListener("DOMContentLoaded", () => {
  const toggle = document.querySelector(".menu-toggle");
  const overlay = document.getElementById("menuOverlay");
  if (toggle) toggle.addEventListener("click", () => document.body.classList.toggle("menu-open"));
  if (overlay) overlay.addEventListener("click", () => document.body.classList.remove("menu-open"));
  const current = window.CIVICEDGE_LANG;
  document.querySelectorAll(".lang-switch button").forEach(btn => {
    if (btn.dataset.lang === current) btn.classList.add("active");
    btn.addEventListener("click", () => {
      if (btn.dataset.lang === current) return;
      localStorage.setItem("civicedge_lang", btn.dataset.lang);
      location.reload();
    });
  });
});
</script>
