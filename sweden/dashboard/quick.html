<body>

<div class="wrap">
  <aside class="sidebar">
    <div class="brand">
      CivicLearn®
      <svg class="flag-icon" viewBox="0 0 640 400" aria-label="Sweden">
        <rect width="640" height="400" fill="#006AA7"/>
        <rect x="176" y="0" width="64" height="400" fill="#FECC02"/>
        <rect x="0" y="168" width="640" height="64" fill="#FECC02"/>
      </svg>
    </div>
    <nav class="nav">
      <a href="index.html" data-i18n="nav_dashboard">Dashboard</a>
      <a href="simulation.html" data-i18n="nav_simulation">Test Simulation</a>
      <a href="quick.html" class="active" data-i18n="nav_quick">Quick Test</a>
      <a href="topics.html" data-i18n="nav_topics">Tests by Topic</a>
      <a href="traps.html" data-i18n="nav_traps">Frequent Traps</a>
      <a href="flashcards.html" data-i18n="nav_flashcards">Flashcards</a>
      <div class="nav-sep"></div>
      <a href="history.html" data-i18n="nav_history">History</a>
      <a href="my-list.html" data-i18n="nav_my_list">My List</a>
      <a href="help.html" data-i18n="nav_help">Help & Contact</a>
      <a href="#" data-i18n="nav_logout" id="logoutLink">Log out</a>
    </nav>
    <div class="spacer"></div>
    <div class="global-controls">
      <div class="lang-switch">
        <button data-lang="sv">SV</button>
        <button data-lang="en">EN</button>
      </div>
      <button id="readingToggle" class="reading-btn" aria-label="Reading assist">🔇</button>
    </div>
  </aside>

  <div class="overlay" id="menuOverlay"></div>

  <main>
    <!-- Gauge bar -->
    <div class="cl-gauge"><div class="cl-gauge-inner"><span class="cl-gauge-label" data-i18n="dashboard_estimated_score">Estimated Score</span><div class="cl-gauge-track"><div class="cl-gauge-fill" id="clGaugeFill"></div><div class="cl-gauge-pass" id="clGaugePass"></div></div><span class="cl-gauge-score" id="clGaugeScore">–</span><span class="cl-gauge-badge" id="clGaugeBadge"></span></div></div>

    <div class="quiz-container">
      <header class="ce-header">
        <h1 data-i18n="title_quick">Quick Test</h1>
      </header>

      <div class="ce-progress-global">
        <div class="ce-progress-global-bar" id="quickProgress"></div>
      </div>

      <div id="quizArea">
        <div id="quiz"></div>
      </div>
    </div>
  </main>
</div>

<script src="/sweden/assets/js/lang-bootstrap-se.js"></script>
<script src="/sweden/assets/js/config-se.js"></script>
<script src="/assets/js/i18n.js"></script>
<script>CivicLearnI18n.init();</script>
<script src="/assets/js/reading.js"></script>
<script src="/assets/js/engine-lu.js"></script>
<script src="/assets/js/sync.js"></script>

<script>
document.addEventListener("DOMContentLoaded", () => {
  const toggle = document.querySelector(".menu-toggle");
  const overlay = document.getElementById("menuOverlay");
  if (toggle) toggle.addEventListener("click", () => document.body.classList.toggle("menu-open"));
  if (overlay) overlay.addEventListener("click", () => document.body.classList.remove("menu-open"));

  const current = window.CIVICEDGE_LANG;
  document.querySelectorAll(".lang-switch button").forEach(btn => {
    if (btn.dataset.lang === current) btn.classList.add("active");
    btn.addEventListener("click", () => {
      if (btn.dataset.lang === current) return;
      localStorage.setItem("civicedge_lang", btn.dataset.lang);
      location.reload();
    });
  });

  setTimeout(() => CivicEdgeEngine.start("quick"), 300);

  document.addEventListener("click", e => {
    if (["changeTheme","returnBtn","restartBtn","ce-return"].includes(e.target?.id)) {
      e.preventDefault();
      location.reload();
    }
  });
});
</script>
<script src="/sweden/assets/js/gauge-bar.js"></script>
<script src="/sweden/assets/js/study-timer.js"></script>
<script src="/assets/js/maintenance-bar.js"></script>
<script src="/assets/js/signout.js"></script>
</body>
</html>
