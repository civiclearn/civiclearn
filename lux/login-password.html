<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Set your password</title>

  <script>
    window.SUPABASE_URL = "https://htgliokekeaovdiafrgs.supabase.co";
    window.SUPABASE_KEY = "sb_publishable_QWvR124i4h0hvQumyjBgDw_018SlMbp";
  </script>

  <style>
    * { box-sizing: border-box; }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      background: #f7f7f9;
      color: #333;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 16px;
    }

    .box {
      background: #fff;
      padding: 28px 30px;
      border-radius: 14px;
      box-shadow: 0 10px 30px rgba(0,0,0,.08);
      max-width: 420px;
      width: 100%;
      text-align: center;
    }

    h2 { margin-top: 0; }

    .form-group { margin-bottom: 18px; }

    /* ===== HARDENED PASSWORD FIELD ===== */
    .form-group.pwd-wrap {
      position: relative;
      overflow: visible !important;
    }

    .form-group.pwd-wrap input {
      width: 100%;
      padding: 12px 96px 12px 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    .pwd-toggle {
      position: absolute;
      right: 16px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: #6b4eff;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      padding: 0;
      white-space: nowrap;
      display: inline-block !important;
      visibility: visible !important;
      pointer-events: auto !important;
      z-index: 10;
    }

    button.primary {
      background-color: #6b4eff;
      color: #fff;
      padding: 12px 16px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      width: 100%;
    }

    #status {
      margin-top: 14px;
      font-weight: 500;
    }

    .error { color: #c0392b; }
    .success { color: #1e8449; }
  </style>
</head>

<body>

  <!-- LOADING -->
  <div class="box" id="loading">
    <strong>Preparing password setup…</strong>
  </div>

  <!-- FORM -->
  <div class="box" id="form" style="display:none;">
    <h2>Password</h2>
    <p>Choose a password to access your CivicLearn account.</p>

    <div class="form-group pwd-wrap">
      <input
        type="password"
        id="password"
        placeholder="Password"
        minlength="6"
        autocomplete="new-password"
        required
      >
      <button type="button" class="pwd-toggle"
              onclick="togglePwd('password', this)">
        Show
      </button>
    </div>

    <div class="form-group pwd-wrap">
      <input
        type="password"
        id="confirm"
        placeholder="Confirm password"
        minlength="6"
        autocomplete="new-password"
        required
      >
      <button type="button" class="pwd-toggle"
              onclick="togglePwd('confirm', this)">
        Show
      </button>
    </div>

    <button class="primary" onclick="updatePassword()">
      Save password
    </button>

    <div id="status"></div>
  </div>

<script>
/* Load Supabase */
(function () {
  const s = document.createElement("script");
  s.src = "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.7.1/dist/umd/supabase.js";
  s.onload = () => {
    window.supabase = window.supabase.createClient(
      window.SUPABASE_URL,
      window.SUPABASE_KEY
    );

    supabase.auth.onAuthStateChange((_event, session) => {
      if (!session?.user) return;
      document.getElementById("loading").style.display = "none";
      document.getElementById("form").style.display = "block";
    });
  };
  document.head.appendChild(s);
})();
</script>

<script>
async function updatePassword() {
  const pwd = password.value;
  const conf = confirm.value;
  const status = document.getElementById("status");

  status.textContent = "";
  status.className = "";

  if (pwd.length < 6) {
    status.textContent = "Password must be at least 6 characters.";
    status.className = "error";
    return;
  }

  if (pwd !== conf) {
    status.textContent = "Passwords do not match.";
    status.className = "error";
    return;
  }

  status.textContent = "Saving password…";

  const { error } = await supabase.auth.updateUser({ password: pwd });

  if (error) {
    status.textContent = "An error occurred. Please try again.";
    status.className = "error";
    return;
  }

  status.textContent = "Password saved. Redirecting…";
  status.className = "success";

  /* AUTH-GUARD CONTRACT */
  localStorage.setItem("cl_auth", "ok");

  location.replace("/lux/dashboard/");
}
</script>

<script>
function togglePwd(id, btn) {
  const input = document.getElementById(id);
  if (input.type === "password") {
    input.type = "text";
    btn.textContent = "Hide";
  } else {
    input.type = "password";
    btn.textContent = "Show";
  }
}
</script>

</body>
</html>
