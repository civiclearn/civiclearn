<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CivicLearn – Set Password</title>

  <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <script>
    window.SUPABASE_URL = "https://htgliokekeaovdiafrgs.supabase.co";
    window.SUPABASE_KEY = "sb_publishable_QWvR124i4h0hvQumyjBgDw_018SlMbp";
  </script>

  <style>
    :root {
      --purple: #7c3aed;
      --bg: #fdfaf5;
      --card: #ffffff;
      --text: #111;
      --border: rgba(0,0,0,.08);
    }

    body {
      margin: 0;
      font-family: 'Lexend', sans-serif;
      background-color: var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }

    .box {
      background: var(--card);
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 15px 40px rgba(0,0,0,0.06);
      max-width: 400px;
      width: 90%;
      text-align: center;
      border: 1px solid var(--border);
    }

    h2 { font-size: 24px; margin-bottom: 10px; color: var(--text); }
    p { font-size: 14px; color: #666; margin-bottom: 25px; line-height: 1.5; }

    .btn-save, .btn-back {
      width: 100%;
      padding: 14px;
      border-radius: 10px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 10px;
      font-family: 'Lexend', sans-serif;
      border: none;
      text-decoration: none;
      display: inline-block;
    }

    .btn-save { background: var(--purple); color: white; }
    .btn-back { background: #eee; color: #333; margin-top: 20px; }

    .form-group { text-align: left; margin-bottom: 15px; }
    label { display: block; font-size: 12px; font-weight: 600; margin-bottom: 5px; color: #444; }
    input { width: 100%; padding: 12px; border: 2px solid #e5dfd2; border-radius: 10px; box-sizing: border-box; font-family: 'Lexend', sans-serif; }
    #status { margin-top: 15px; font-size: 13px; font-weight: 500; }
    .error { color: #dc2626; }
    .success { color: #166534; }
	
	.pwd-wrap {
  position: relative;
}

.pwd-wrap input {
  padding-right: 70px;
}

.pwd-toggle {
  position: absolute;
  right: 12px;
  top: 50%;
  transform: translateY(-50%);
  background: none;
  border: none;
  color: var(--purple);
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
}
.form-group.pwd-wrap input {
  padding-right: 96px !important;
}

  </style>
</head>
<body>

  <div class="box" id="statusView">
    <h2 id="statusTitle" data-t="loading_title">Preparing...</h2>
    <p id="statusDesc"></p>
    <a href="/lux/login.html" id="backBtn" class="btn-back" style="display:none;" data-t="btn_back">Back to Login</a>
  </div>

  <div class="box" id="formView" style="display:none;">
    <h2 data-t="title">Set Password</h2>
    <p data-t="subtitle">Choose a password for your account.</p>

<div class="form-group pwd-wrap">
  <label data-t="pwd_label">New Password</label>
  <input type="password" id="password" placeholder="••••••••">
  <button type="button"
          class="pwd-toggle"
          onclick="togglePwd('password', this)">
    <span data-t="show">Show</span>
  </button>
</div>

<div class="form-group pwd-wrap">
  <label data-t="confirm_label">Confirm Password</label>
  <input type="password" id="confirm" placeholder="••••••••">
  <button type="button"
          class="pwd-toggle"
          onclick="togglePwd('confirm', this)">
    <span data-t="show">Show</span>
  </button>
</div>


    <button class="btn-save" onclick="updatePassword()" data-t="btn_save">Save password</button>
    <div id="statusMsg"></div>
  </div>

<script>
const I18N = {
  en: {
    loading_title: "Verifying link...",
    err_title: "Invalid or Expired Link",
    err_desc: "This link is no longer valid. Please go back to the login page and request a new setup link.",
    btn_back: "Go to Login",
    title: "Create Password",
    subtitle: "Set your password to access Vivre-Ensemble.lu",
    pwd_label: "New Password",
    confirm_label: "Confirm Password",
    btn_save: "Save password",
    err_short: "Password must be at least 6 characters.",
    err_match: "Passwords do not match.",
    msg_success: "Success! Redirecting..."
  },
  fr: {
    loading_title: "Vérification...",
    err_title: "Lien invalide ou expiré",
    err_desc: "Ce lien n'est plus valide. Veuillez retourner à la page de connexion et demander un nouveau lien.",
    btn_back: "Retour à la connexion",
    title: "Créer un mot de passe",
    subtitle: "Définissez votre mot de passe pour Vivre-Ensemble.lu",
    pwd_label: "Nouveau mot de passe",
    confirm_label: "Confirmer le mot de passe",
    btn_save: "Enregistrer",
    err_short: "Au moins 6 caractères.",
    err_match: "Les mots de passe ne correspondent pas.",
    msg_success: "Succès ! Redirection..."
  },
  de: {
    loading_title: "Link wird geprüft...",
    err_title: "Ungültiger Link",
    err_desc: "Dieser Link ist abgelaufen oder ungültig. Bitte fordern Sie einen neuen Link auf der Login-Seite an.",
    btn_back: "Zum Login",
    title: "Passwort erstellen",
    subtitle: "Legen Sie Ihr Passwort für Vivre-Ensemble.lu fest",
    pwd_label: "Neues Passwort",
    confirm_label: "Bestätigen",
    btn_save: "Speichern",
    err_short: "Mindestens 6 Zeichen.",
    err_match: "Passwörter stimmen ikke überein.",
    msg_success: "Erfolg! Weiterleitung..."
  }
};

// Simple language detection for this page
const userLang = navigator.language.startsWith('fr') ? 'fr' : navigator.language.startsWith('de') ? 'de' : 'en';

function t(key) { return I18N[userLang][key]; }

// Apply initial translations
document.querySelectorAll("[data-t]").forEach(el => {
  const key = el.getAttribute("data-t");
  el.textContent = t(key);
});

(function init() {
  const s = document.createElement("script");
  s.src = "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.7.1/dist/umd/supabase.js";
  s.onload = async () => {
    window.supabase = window.supabase.createClient(window.SUPABASE_URL, window.SUPABASE_KEY);

    try {
      // Try immediately
      const { data } = await supabase.auth.getSession();
      if (data?.session) {
        document.getElementById("statusView").style.display = "none";
        document.getElementById("formView").style.display = "block";
        return;
      }

      // Wait briefly for hydration (email-app browsers etc.)
      for (let i = 0; i < 20; i++) {
        await new Promise(r => setTimeout(r, 100));
        const { data } = await supabase.auth.getSession();
        if (data?.session) {
          document.getElementById("statusView").style.display = "none";
          document.getElementById("formView").style.display = "block";
          return;
        }
      }
    } catch (_) {}

    // If still no session → show error
    document.getElementById("statusTitle").textContent = t('err_title');
    document.getElementById("statusDesc").textContent = t('err_desc');
    document.getElementById("backBtn").style.display = "block";
  };

  document.head.appendChild(s);
})();

async function updatePassword() {
  const password = document.getElementById("password").value;
  const confirm = document.getElementById("confirm").value;
  const status = document.getElementById("statusMsg");

  if (password.length < 6) { status.textContent = t('err_short'); status.className = "error"; return; }
  if (password !== confirm) { status.textContent = t('err_match'); status.className = "error"; return; }

  const { error } = await supabase.auth.updateUser({ password });

  if (error) {
    status.textContent = error.message;
    status.className = "error";
    } else {
    try {
      const { data } = await supabase.auth.getUser();
      const email = data?.user?.email;
      localStorage.setItem("cl_auth", "ok");
      if (email) localStorage.setItem("cl_email", email);
    } catch (_) {}

    status.textContent = t('msg_success');
    status.className = "success";
    setTimeout(() => { window.location.href = "/lux/dashboard/"; }, 1500);
  }

}
</script>
<script>
function togglePwd(id, btn) {
  const input = document.getElementById(id);
  const label = btn.querySelector("span");

  if (input.type === "password") {
    input.type = "text";
    label.textContent = userLang === "fr" ? "Masquer" :
                        userLang === "de" ? "Verbergen" : "Hide";
  } else {
    input.type = "password";
    label.textContent = userLang === "fr" ? "Afficher" :
                        userLang === "de" ? "Anzeigen" : "Show";
  }
}
</script>

</body>
</html>
