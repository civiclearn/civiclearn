<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login – Vivre-Ensemble.lu</title>

  <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <script>
    window.SUPABASE_URL = "https://htgliokekeaovdiafrgs.supabase.co";
    window.SUPABASE_KEY = "sb_publishable_QWvR124i4h0hvQumyjBgDw_018SlMbp";
  </script>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.7.1/dist/umd/supabase.js"></script>
<link rel="stylesheet" href="/assets/css/newlogin.css">
  
</head>
<body>

<header class="site-header">
  <div class="header-inner">

    <!-- LEFT -->
    <div class="header-left">
      <a href="/" class="brand-link">
        <img src="/assets/images/lu.svg" alt="LU">
        <div class="brand-title">Vivre-Ensemble.lu</div>
      </a>
    </div>

    <!-- CENTER -->
    <div class="header-center">
      <div class="lang-switch">
        <button onclick="applyLang('en')" id="btn-en">EN</button>
        <button onclick="applyLang('fr')" id="btn-fr">FR</button>
        <button onclick="applyLang('de')" id="btn-de">DE</button>
      </div>

      <nav class="header-nav">
        <a href="https://vivre-ensemble.lu/contact/">Contact</a>
      </nav>
    </div>

    <!-- RIGHT -->
    <div class="header-right">
      <div class="brand-powered">powered by <span>CivicLearn</span></div>
      <a href="/lux/checkout.html" class="btn-small-purple">Sign up</a>
    </div>

  </div>
</header>

<div id="status" class="status-msg"></div>

<div class="login-grid">
  <div class="auth-card card-left">
    <h2 style="color: var(--purple);" data-t="left_title"></h2>
    <p data-t="left_desc"></p>
    <input type="email" id="setupEmail" placeholder="name@example.lu">
    <button onclick="handleSetup()" class="btn-action btn-purple" data-t="left_btn"></button>
    <div style="font-size: 10px; color: var(--purple); font-weight: 600; margin-top: 15px; text-align: center; line-height: 1.4;" data-t="spam_note"></div>
  </div>

  <div class="auth-card card-center">
    <h2 style="font-size: 28px; text-align: center;" data-t="center_title"></h2>
    <div style="margin-top: 20px;">
      <label data-t="email_label"></label>
      <input type="email" id="loginEmail" placeholder="Email">
      <label data-t="pwd_label"></label>
      <div class="pwd-container">
        <input type="password" id="loginPwd" placeholder="••••••••">
        <button type="button" class="toggle-pwd" onclick="toggleMainPwd()" data-t="show_pwd"></button>
      </div>
      <button onclick="handleLogin()" class="btn-action btn-black" style="margin-top: 10px;" data-t="center_btn"></button>
    </div>
  </div>

  <div class="auth-card card-right">
    <h2 style="color: #856404;" data-t="right_title"></h2>
    <p data-t="right_desc"></p>
    <div id="otpInputRow">
      <input type="email" id="otpEmail" placeholder="name@example.lu">
      <button onclick="handleSendOTP()" class="btn-action btn-yellow" data-t="right_btn"></button>
    </div>
    <div id="otpVerifyRow" style="display:none;">
      <input type="text" id="otpToken" placeholder="000000" maxlength="6" style="text-align:center; letter-spacing: 2px;">
      <button onclick="handleVerifyOTP()" class="btn-action btn-black" data-t="verify_btn"></button>
    </div>
  </div>
</div>

<div class="info-section">
  <div class="info-card">
    <h3 style="margin-top: 0; font-size: 16px; color: #333;" data-t="info1_title"></h3>
    <p style="font-size: 13px; line-height: 1.6; color: #444; margin-bottom: 0;" data-t="info1_body"></p>
  </div>
  <div class="info-card">
    <h3 style="margin-top: 0; font-size: 16px; color: #333;" data-t="info2_title"></h3>
    <p style="font-size: 13px; line-height: 1.6; color: #444; margin-bottom: 0;" data-t="info2_body"></p>
  </div>
</div>

<script>
  const I18N = {
    en: {
      nav_signup: "Sign up",
      left_title: "First time or Migrated?",
      left_desc: "Did you just buy access, or are you moving from the old platform? Enter your email to set your password.",
      left_btn: "Send setup link",
      spam_note: "ℹ️ Please check your spam folder if you don't receive the email within 2 minutes.",
      center_title: "Login",
      email_label: "Email Address",
      pwd_label: "Password",
      show_pwd: "Show",
      hide_pwd: "Hide",
      center_btn: "Login with password",
      right_title: "Problems?",
      right_desc: "Receive a one-time code (6 digits) directly in your inbox instead.",
      right_btn: "Send code",
      verify_btn: "Verify & Login",
      info1_title: "ℹ️ Information for existing users",
      info1_body: "Most existing users have been automatically transferred. In rare cases—especially for older purchases—it may be necessary to add your account manually. If your email is not recognized, please contact support.",
      info2_title: "📊 About training progress",
      info2_body: "Due to the move to a new platform, previous progress and statistics have not been transferred. All users start with a reset progression to ensure future data is accurate.",
      err_no_email: "Please enter an email.",
      err_not_found: "Email not found in our system.",
      err_login: "Invalid email or password.",
      msg_sent: "If your email is in our system, a link has been sent.",
      msg_otp_sent: "Code sent!",
      err_otp: "Invalid code."
    },
    fr: {
      nav_signup: "Je m'inscris",
      left_title: "Nouveau ou transféré ?",
      left_desc: "Vous venez d'acheter un accès ou vous migrez de l'ancienne plateforme ? Entrez votre e-mail pour créer votre mot de passe.",
      left_btn: "Envoyer le lien",
      spam_note: "ℹ️ Veuillez vérifier vos spams si vous ne recevez pas l'e-mail d'ici 2 minutes.",
      center_title: "Connexion",
      email_label: "Adresse e-mail",
      pwd_label: "Mot de passe",
      show_pwd: "Voir",
      hide_pwd: "Cacher",
      center_btn: "Se connecter",
      right_title: "Problèmes ?",
      right_desc: "Recevez un code unique (6 chiffres) directement dans votre boîte de réception.",
      right_btn: "Envoyer le code",
      verify_btn: "Vérifier & Connexion",
      info1_title: "ℹ️ Information aux utilisateurs",
      info1_body: "La plupart des comptes ont été transférés. Dans certains cas, un ajout manuel est nécessaire. Si votre e-mail n'est pas reconnu, contactez le support.",
      info2_title: "📊 Progression d'entraînement",
      info2_body: "Suite au changement de plateforme, les anciennes statistiques n'ont pas été transférées. Tous les utilisateurs repartent de zéro pour garantir la précision des données.",
      err_no_email: "Veuillez entrer un e-mail.",
      err_not_found: "E-mail non trouvé dans notre système.",
      err_login: "E-mail ou mot de passe invalide.",
      msg_sent: "Si votre e-mail existe, un lien a été envoyé.",
      msg_otp_sent: "Code envoyé !",
      err_otp: "Code invalide."
    },
    de: {
      nav_signup: "Registrieren",
      left_title: "Neu oder migriert?",
      left_desc: "Haben Sie gerade Zugang gekauft oder ziehen Sie von der alten Plattform um? E-Mail eingeben, um Passwort zu erstellen.",
      left_btn: "Link senden",
      spam_note: "ℹ️ Bitte prüfen Sie Ihren Spam-Ordner, falls Sie keine E-Mail erhalten.",
      center_title: "Anmelden",
      email_label: "E-Mail-Adresse",
      pwd_label: "Passwort",
      show_pwd: "Anzeigen",
      hide_pwd: "Verbergen",
      center_btn: "Mit Passwort anmelden",
      right_title: "Probleme?",
      right_desc: "Erhalten Sie stattdessen einen Einmalcode (6-stellig) direkt in Ihren Posteingang.",
      right_btn: "Code senden",
      verify_btn: "Bestätigen & Login",
      info1_title: "ℹ️ Info für bestehende Nutzer",
      info1_body: "Die meisten Nutzer wurden automatisch übertragen. In Einzelfällen ist eine manuelle Aktivierung nötig. Wenn Ihre E-Mail nicht erkannt wird, kontaktieren Sie den Support.",
      info2_title: "📊 Trainingsfortschritt",
      info2_body: "Aufgrund der neuen Plattform wurde der bisherige Fortschritt nicht übernommen. Alle Nutzer starten bei Null, um korrekte Statistiken zu gewährleisten.",
      err_no_email: "E-Mail eingeben.",
      err_not_found: "E-Mail nicht im System gefunden.",
      err_login: "E-Mail oder Passwort ungültig.",
      msg_sent: "Falls Ihre E-Mail registriert ist, wurde ein Link gesendet.",
      msg_otp_sent: "Code gesendet!",
      err_otp: "Ungültiger Code."
    }
  };

  let currentLang = 'en';
  const supabase = window.supabase.createClient(window.SUPABASE_URL, window.SUPABASE_KEY);

  function applyLang(lang) {
    currentLang = lang;
    document.querySelectorAll("[data-t]").forEach(el => {
      const key = el.getAttribute("data-t");
      if (I18N[lang][key]) el.innerHTML = I18N[lang][key];
    });
    document.querySelectorAll(".lang-switch button").forEach(btn => {
      btn.classList.toggle("active", btn.id === `btn-${lang}`);
    });
  }

  function notify(type, text) {
    const el = document.getElementById("status");
    el.textContent = text;
    el.className = "status-msg " + type;
    el.style.display = "block";
    setTimeout(() => { el.style.display = "none"; }, 6000);
  }

  async function handleSetup() {
    const email = document.getElementById("setupEmail").value.trim();
    if(!email) return notify("error", I18N[currentLang].err_no_email);
    const { error } = await supabase.auth.resetPasswordForEmail(email, {
      redirectTo: window.location.origin + "/lux/login-password.html"
    });
    notify("success", I18N[currentLang].msg_sent);
  }

  async function handleLogin() {
    const email = document.getElementById("loginEmail").value.trim();
    const password = document.getElementById("loginPwd").value.trim();
    const { error } = await supabase.auth.signInWithPassword({ email, password });
    if (error) notify("error", I18N[currentLang].err_login);
    else window.location.href = "/lux/dashboard/index.html";
  }

  async function handleSendOTP() {
    const email = document.getElementById("otpEmail").value.trim();
    if(!email) return notify("error", I18N[currentLang].err_no_email);
    const { error } = await supabase.auth.signInWithOtp({
      email, options: { shouldCreateUser: false }
    });
    if (error) notify("error", I18N[currentLang].err_not_found);
    else {
      document.getElementById("otpInputRow").style.display = "none";
      document.getElementById("otpVerifyRow").style.display = "block";
      notify("success", I18N[currentLang].msg_otp_sent);
    }
  }

  async function handleVerifyOTP() {
    const email = document.getElementById("otpEmail").value.trim();
    const token = document.getElementById("otpToken").value.trim();
    const { error } = await supabase.auth.verifyOtp({ email, token, type: 'magiclink' });
    if (error) notify("error", I18N[currentLang].err_otp);
    else window.location.href = "/lux/dashboard/index.html";
  }

  function toggleMainPwd() {
    const pwdInput = document.getElementById("loginPwd");
    const btn = document.querySelector(".toggle-pwd");
    if (pwdInput.type === "password") {
      pwdInput.type = "text";
      btn.textContent = I18N[currentLang].hide_pwd;
    } else {
      pwdInput.type = "password";
      btn.textContent = I18N[currentLang].show_pwd;
    }
  }

  // Init
  applyLang('en');
</script>
</body>
</html>
