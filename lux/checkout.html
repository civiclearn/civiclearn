  <style>
   /* ── Language switch ── */
    .lang-switch { display:flex; gap:.35rem; }
    .lang-switch button {
      font-family:"Lexend",sans-serif; font-size:.78rem; font-weight:500;
      padding:.3rem .55rem; border:1.5px solid rgba(0,0,0,.12); border-radius:.45rem;
      background:transparent; color:#555; cursor:pointer; transition:all .15s;
    }
    .lang-switch button:hover { border-color:#7c3aed; color:#7c3aed; }
    .lang-switch button.active { background:#7c3aed; border-color:#7c3aed; color:#fff; }

    /* ── Plan toggle ── */
    .plan-toggle { display:flex; gap:.75rem; margin-bottom:1.5rem; }
    .plan-card {
      flex:1; padding:1.1rem 1rem; border:2px solid #e5e7eb; border-radius:1rem;
      cursor:pointer; background:#fff; transition:border-color .15s, box-shadow .15s;
      position:relative; text-align:center;
    }
    .plan-card:hover { border-color:#c4b5fd; }
    .plan-card.selected { border-color:#7c3aed; box-shadow:0 0 0 3px rgba(124,58,237,.15); }
    .plan-card-badge {
      position:absolute; top:-.65rem; left:50%; transform:translateX(-50%);
      background:#7c3aed; color:#fff; font-size:.68rem; font-weight:600;
      padding:.15rem .65rem; border-radius:1rem; white-space:nowrap;
    }
    .plan-card-name { font-weight:600; font-size:.92rem; color:#1a1a1a; margin-bottom:.25rem; }
    .plan-card-price { font-size:1.3rem; font-weight:700; color:#7c3aed; }
    .plan-card-price .was { font-size:.82rem; color:#9ca3af; text-decoration:line-through; font-weight:400; margin-right:.3rem; }
    .plan-card-save {
      display:inline-block; margin-top:.35rem; font-size:.72rem; font-weight:600;
      color:#059669; background:#ecfdf5; padding:.15rem .5rem; border-radius:.5rem;
    }
    .plan-card-sub { font-size:.75rem; color:#6b7280; margin-top:.3rem; }

    /* ── Sidebar dynamic updates ── */
    .bundle-extras { display:none; }
    .bundle-extras.show { display:block; }
    .bundle-extras li { color:#7c3aed; }
    .price-update { transition:opacity .15s; }

    @media(max-width:600px){
      .plan-toggle { flex-direction:column; }
    }
  </style>
</head>

<main>

        <li data-t="bundle_2"></li>
        <li data-t="bundle_3"></li>
        <li data-t="bundle_4"></li>
      </ul>

      <p class="recommend" data-t="social_proof"></p>
    </aside>

    <!-- RIGHT CHECKOUT -->
    <section class="right">
      <div class="checkout-card">

        <h1 data-t="checkout_title"></h1>
        <div class="secure-line" data-t="secure_line"></div>

        <!-- ── Plan toggle ── -->
        <div class="plan-toggle" id="planToggle">
          <div class="plan-card" data-plan="solo" id="planSolo">
            <div class="plan-card-name" data-t="toggle_solo_name"></div>
            <div class="plan-card-price">69 €</div>
            <div class="plan-card-sub" data-t="toggle_solo_sub"></div>
          </div>
          <div class="plan-card" data-plan="bundle" id="planBundle">
            <div class="plan-card-badge" data-t="toggle_bundle_badge"></div>
            <div class="plan-card-name" data-t="toggle_bundle_name"></div>
            <div class="plan-card-price"><span class="was">138 €</span> 99 €</div>
            <div class="plan-card-save" data-t="toggle_bundle_save"></div>
            <div class="plan-card-sub" data-t="toggle_bundle_sub"></div>
          </div>
        </div>

        <div class="checkout-flow">

          <div class="checkout-step" id="stepInitial">
            <button class="pay-btn" id="startCheckout" data-t="cta_start"></button>
            <p class="small-note" data-t="note_redirect"></p>
          </div>

          <div class="checkout-step" id="stepEmail" hidden>
            <p data-t="email_instruction"></p>

            <div class="email-field-group">
              <label for="checkoutEmail" data-t="email_label"></label>
              <input id="checkoutEmail" type="email" autocomplete="email"/>
            </div>

            <button class="pay-btn" id="continueWithEmail" data-t="cta_continue"></button>
          </div>

          <div class="checkout-step" id="stepConfirm" hidden>
            <p data-t="confirm_text"></p>
            <p class="email-display" id="emailDisplay"></p>

            <div class="confirm-actions">
              <button class="pay-btn" id="confirmEmail" data-t="cta_confirm"></button>
              <button class="link-btn" id="editEmail" data-t="cta_edit"></button>
            </div>
          </div>

          <div id="checkoutMessage" class="checkout-message"></div>
        </div>

      </div>
    </section>

  </div>
</main>

<!-- =========================
     I18N ENGINE
========================= -->
<script>
let currentLang = "fr";
function applyLang(lang){
  currentLang = lang;
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-t]").forEach(el=>{
    const key = el.dataset.t;
    if(I18N[lang][key]) el.textContent = I18N[lang][key];
  });
  document.querySelectorAll(".lang-switch button").forEach(b=>{
    b.classList.toggle("active", b.dataset.lang===lang);
  });
}
document.querySelectorAll(".lang-switch button").forEach(b=>{
  b.onclick=()=>applyLang(b.dataset.lang);
});
applyLang("fr");
</script>

<!-- =========================
     CHECKOUT LOGIC
========================= -->
<script>
(function(){

/* ── Plan state ── */
const PLANS = {
  solo:   { product: "lux-vivre-ensemble-premium",  price: "69 €" },
  bundle: { product: "vivre-sproochentest-bundle",   price: "99 €" }
};

let selectedPlan = "solo";

/* Read ?plan=bundle from URL */
const urlPlan = new URLSearchParams(window.location.search).get("plan");
if (urlPlan === "bundle") selectedPlan = "bundle";

/* DOM refs */
const cardSolo   = document.getElementById("planSolo");
const cardBundle = document.getElementById("planBundle");
const sidebar    = document.getElementById("sidebarPrice");
const extras     = document.getElementById("bundleExtras");

function selectPlan(plan) {
  selectedPlan = plan;
  cardSolo.classList.toggle("selected", plan === "solo");
  cardBundle.classList.toggle("selected", plan === "bundle");
  sidebar.textContent = PLANS[plan].price;
  extras.classList.toggle("show", plan === "bundle");
}

cardSolo.onclick   = () => selectPlan("solo");
cardBundle.onclick  = () => selectPlan("bundle");

/* Init */
selectPlan(selectedPlan);

/* ── Checkout flow (email double-check) ── */
const s1=stepInitial, s2=stepEmail, s3=stepConfirm;

startCheckout.onclick = () => { s1.hidden=true; s2.hidden=false; };

continueWithEmail.onclick = () => {
  const v = checkoutEmail.value.trim();
  if (!v) return alert(I18N[currentLang].msg_enter_email);
  if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v))
    return alert(I18N[currentLang].msg_invalid_email);
  emailDisplay.textContent = v;
  s2.hidden=true; s3.hidden=false;
};

editEmail.onclick = () => { s3.hidden=true; s2.hidden=false; };

confirmEmail.onclick = async () => {
  const v = checkoutEmail.value.trim();
  const msg = document.getElementById("checkoutMessage");
  msg.textContent = I18N[currentLang].msg_connecting;

  try {
    const r = await fetch("https://payments.civiclearn.com/create-checkout-session", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ email: v, product: PLANS[selectedPlan].product })
    });
    const d = await r.json();
    if (d.url) {
      window.location.href = d.url;
    } else {
      msg.textContent = d.error || I18N[currentLang].msg_error;
    }
  } catch (e) {
    msg.textContent = I18N[currentLang].msg_error;
  }
};

})();
</script>
