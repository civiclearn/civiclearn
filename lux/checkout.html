<!DOCTYPE html>
<html lang="fr-LU">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CivicLearn – Paiement sécurisé</title>

  <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/checkout.css">

  <style>
    /* ── Language switch ── */
    .lang-switch { display:flex; gap:.35rem; }
    .lang-switch button {
      font-family:"Lexend",sans-serif; font-size:.78rem; font-weight:500;
      padding:.3rem .55rem; border:1.5px solid rgba(0,0,0,.12); border-radius:.45rem;
      background:transparent; color:#555; cursor:pointer; transition:all .15s;
    }
    .lang-switch button:hover { border-color:#7c3aed; color:#7c3aed; }
    .lang-switch button.active { background:#7c3aed; border-color:#7c3aed; color:#fff; }

    /* ── Plan toggle ── */
    .plan-toggle { display:flex; gap:.75rem; margin-bottom:1.5rem; }
    .plan-card {
      flex:1; padding:1.1rem 1rem; border:2px solid #e5e7eb; border-radius:1rem;
      cursor:pointer; background:#fff; transition:border-color .15s, box-shadow .15s;
      position:relative; text-align:center;
    }
    .plan-card:hover { border-color:#c4b5fd; }
    .plan-card.selected { border-color:#7c3aed; box-shadow:0 0 0 3px rgba(124,58,237,.15); }
    .plan-card-badge {
      position:absolute; top:-.65rem; left:50%; transform:translateX(-50%);
      background:#7c3aed; color:#fff; font-size:.68rem; font-weight:600;
      padding:.15rem .65rem; border-radius:1rem; white-space:nowrap;
    }
    .plan-card-name { font-weight:600; font-size:.92rem; color:#1a1a1a; margin-bottom:.25rem; }
    .plan-card-price { font-size:1.3rem; font-weight:700; color:#7c3aed; }
    .plan-card-price .was { font-size:.82rem; color:#9ca3af; text-decoration:line-through; font-weight:400; margin-right:.3rem; }
    .plan-card-save {
      display:inline-block; margin-top:.35rem; font-size:.72rem; font-weight:600;
      color:#059669; background:#ecfdf5; padding:.15rem .5rem; border-radius:.5rem;
    }
    .plan-card-sub { font-size:.75rem; color:#6b7280; margin-top:.3rem; }

    /* ── Sidebar dynamic updates ── */
    .bundle-extras { display:none; }
    .bundle-extras.show { display:block; }
    .bundle-extras li { color:#7c3aed; }
    .price-update { transition:opacity .15s; }

    /* ── Stripe Elements + password steps ── */
    #payment-element { margin-bottom: 1.2rem; min-height: 80px; }
    .payment-loading { text-align: center; color: var(--muted); font-size: 0.9rem; padding: 2rem 0; }
    .field { margin-bottom: 1rem; }
    .field label { display: block; font-size: 0.9rem; font-weight: 500; margin-bottom: 0.3rem; }
    .field input {
      width: 100%; padding: 0.75rem 0.9rem; border-radius: 0.9rem;
      border: 1px solid rgba(0,0,0,0.12); font-size: 0.95rem;
      font-family: "Lexend", sans-serif; outline: none;
    }
    .field input:focus { outline: 2px solid var(--brand); border-color: transparent; }
    .done-icon { font-size: 3rem; text-align: center; margin-bottom: 0.8rem; }
    .done-title { font-size: 1.3rem; font-weight: 700; text-align: center; margin-bottom: 0.5rem; }
    .done-sub { font-size: 0.95rem; color: var(--muted); text-align: center; margin-bottom: 1.5rem; }
    .step-badge {
      display: inline-block; padding: 3px 10px; border-radius: 20px;
      font-size: 0.72rem; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.05em; margin-bottom: 1rem; background: #eef2ff; color: #3730a3;
    }

    @media(max-width:600px){
      .plan-toggle { flex-direction:column; }
    }
  </style>

            </div>
            <button class="pay-btn" id="continueWithEmail" data-t="cta_continue"></button>

          <!-- STEP 3: CONFIRM EMAIL -->

            <p data-t="confirm_text"></p>

            </div>

          <!-- STEP 4: STRIPE ELEMENTS PAYMENT -->

            <span class="step-badge" data-t="step_3_of_3"></span>
            <p data-t="payment_instruction" style="margin-bottom:1rem;"></p>
            <div id="payment-element"><div class="payment-loading" data-t="payment_loading"></div></div>
            <button class="pay-btn" id="payBtn" disabled data-t="cta_pay"></button>
            <button class="link-btn" id="backToConfirm" style="margin-top:0.5rem;" data-t="cta_back"></button>
          </div>

          <!-- STEP 5: SET PASSWORD -->
          <div class="checkout-step" id="stepPassword" hidden>
            <div style="text-align:center;font-size:2rem;margin-bottom:0.5rem;">🎉</div>
            <div style="text-align:center;font-size:1.2rem;font-weight:700;margin-bottom:0.3rem;" data-t="payment_confirmed"></div>
            <p class="email-instructions" style="text-align:center;" data-t="password_instruction"></p>
            <div class="field">
              <label for="pw1" data-t="pwd_label"></label>
              <input type="password" id="pw1" autocomplete="new-password">
            </div>
            <div class="field">
              <label for="pw2" data-t="pwd_confirm_label"></label>
              <input type="password" id="pw2" autocomplete="new-password">
            </div>
            <button class="pay-btn" id="setupBtn" data-t="cta_create_account"></button>
          </div>

          <!-- STEP 6: DONE -->
          <div class="checkout-step" id="stepDone" hidden>
            <div class="done-icon">✅</div>
            <div class="done-title" data-t="done_title"></div>
            <div class="done-sub" id="doneEmail"></div>
            <a href="/lux/dashboard/index.html" class="pay-btn" id="doneCta" style="text-align:center;text-decoration:none;display:block;" data-t="cta_start_training"></a>

<!-- =========================
     I18N ENGINE

<script>
let currentLang = "fr";
function t(key) { return (I18N[currentLang] && I18N[currentLang][key]) || key; }

function applyLang(lang) {
  currentLang = lang;
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-t]").forEach(el => {
    const key = el.dataset.t;
    if (I18N[lang][key]) el.textContent = I18N[lang][key];
  });
  document.querySelectorAll(".lang-switch button").forEach(b => {
    b.classList.toggle("active", b.dataset.lang === lang);
  });
  // Update dynamic pay button text
  if (typeof updatePayBtnText === 'function') updatePayBtnText();
  // Update placeholders
  const pw1 = document.getElementById('pw1');
  const pw2 = document.getElementById('pw2');
  if (pw1) pw1.placeholder = t('pwd_placeholder');
  if (pw2) pw2.placeholder = t('pwd_confirm_placeholder');
}

document.querySelectorAll(".lang-switch button").forEach(b => {
  b.onclick = () => applyLang(b.dataset.lang);
});
applyLang("fr");
</script>

  const PLANS = {
    solo:   { price: '69 €', payKey: 'cta_pay_solo' },
    bundle: { price: '99 €', payKey: 'cta_pay_bundle' }
  };
  let selectedPlan = 'solo';

  // Read ?plan=bundle from URL
  const urlPlan = new URLSearchParams(window.location.search).get('plan');
  if (urlPlan === 'bundle') selectedPlan = 'bundle';

  const cardSolo   = document.getElementById('planSolo');
  const cardBundle = document.getElementById('planBundle');
  const sidebar    = document.getElementById('sidebarPrice');
  const extras     = document.getElementById('bundleExtras');

  function selectPlan(plan) {
    selectedPlan = plan;
    cardSolo.classList.toggle('selected', plan === 'solo');
    cardBundle.classList.toggle('selected', plan === 'bundle');
    sidebar.textContent = PLANS[plan].price;
    extras.classList.toggle('show', plan === 'bundle');
    updatePayBtnText();
  }

  // Expose for i18n engine
  window.updatePayBtnText = function() {
    const payBtn = document.getElementById('payBtn');
    if (payBtn && !payBtn.disabled) {
      payBtn.textContent = t(PLANS[selectedPlan].payKey);
    }
  };

  cardSolo.onclick = () => { selectPlan('solo'); };
  cardBundle.onclick = () => { selectPlan('bundle'); };
  selectPlan(selectedPlan);

  /* ── DOM refs ── */
  const stepInitial  = document.getElementById('stepInitial');
  const stepEmail    = document.getElementById('stepEmail');
  const stepConfirm  = document.getElementById('stepConfirm');
  const stepPayment  = document.getElementById('stepPayment');
  const stepPassword = document.getElementById('stepPassword');
  const stepDone     = document.getElementById('stepDone');

  const startBtn         = document.getElementById('startCheckout');
  const continueBtn      = document.getElementById('continueWithEmail');
  const confirmBtn       = document.getElementById('confirmEmail');
  const editEmailBtn     = document.getElementById('editEmail');
  const payBtn           = document.getElementById('payBtn');
  const backToConfirmBtn = document.getElementById('backToConfirm');
  const setupBtn         = document.getElementById('setupBtn');

  const emailInput   = document.getElementById('checkoutEmail');
  const emailDisplay = document.getElementById('emailDisplay');
  const messageBox   = document.getElementById('checkoutMessage');

  let currentEmail = '';
  let paymentIntentId = '';
  let stripeElements = null;
  let isSubmitting = false;

  function showStep(id) {
    [stepInitial, stepEmail, stepConfirm, stepPayment, stepPassword, stepDone]
      .forEach(el => el.hidden = true);
    document.getElementById(id).hidden = false;
    // Hide plan toggle after email step
    document.getElementById('planToggle').style.display =
      (id === 'stepInitial' || id === 'stepEmail') ? 'flex' : 'none';
    clearMessage();
  }

  function clearMessage() { messageBox.textContent = ''; messageBox.className = 'checkout-message'; messageBox.style.display = 'none'; }
  function showMessage(type, text) { messageBox.textContent = text; messageBox.className = 'checkout-message ' + type; messageBox.style.display = 'block'; }

  function validateEmail(value) {
    const email = value.trim();
    if (!email) return { ok: false, msg: t('msg_enter_email') };
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) return { ok: false, msg: t('msg_invalid_email') };
    return { ok: true, email };
  }

  /* ── 3DS return handling ── */
  const urlParams = new URLSearchParams(window.location.search);
  const returnedPI = urlParams.get('payment_intent');
  const returnedSecret = urlParams.get('payment_intent_client_secret');
  const returnedStatus = urlParams.get('redirect_status');

  if (returnedPI && returnedSecret) {
    currentEmail = localStorage.getItem('lux_checkout_email') || '';
    paymentIntentId = returnedPI;
    if (returnedStatus === 'succeeded') { showStep('stepPassword'); }
    else {
      stripe.retrievePaymentIntent(returnedSecret).then(({ paymentIntent }) => {
        if (paymentIntent && paymentIntent.status === 'succeeded') showStep('stepPassword');
        else { showMessage('error', t('msg_payment_incomplete')); showStep('stepInitial'); }
      });
    }
    window.history.replaceState({}, '', window.location.pathname);
  }

  /* ── Step navigation ── */
  startBtn.addEventListener('click', () => { showStep('stepEmail'); emailInput.focus(); });

  continueBtn.addEventListener('click', () => {
    const { ok, msg, email } = validateEmail(emailInput.value);
    if (!ok) { showMessage('error', msg); emailInput.focus(); return; }
    currentEmail = email; emailDisplay.textContent = currentEmail; showStep('stepConfirm');
  });
  emailInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); continueBtn.click(); } });
  editEmailBtn.addEventListener('click', () => { showStep('stepEmail'); emailInput.focus(); });

  /* ── Create PaymentIntent + mount Stripe Elements ── */
  confirmBtn.addEventListener('click', async () => {
    if (isSubmitting) return;
    isSubmitting = true; confirmBtn.disabled = true;
    confirmBtn.textContent = '…';
    showMessage('info', t('msg_preparing'));

    try {
      const res = await fetch(FUNCTIONS_URL + '/lux-create-payment-intent', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: currentEmail, plan: selectedPlan }),
      });
      const data = await res.json();
      if (!res.ok || data.error) throw new Error(data.error || t('msg_error'));

      paymentIntentId = data.payment_intent_id;
      localStorage.setItem('lux_checkout_email', currentEmail);

      stripeElements = stripe.elements({
        clientSecret: data.client_secret,
        appearance: { theme: 'stripe', variables: { fontFamily: '"Lexend", system-ui, sans-serif', borderRadius: '0.9rem', colorPrimary: '#7c3aed' } },
      });
      const paymentElement = stripeElements.create('payment');
      document.getElementById('payment-element').innerHTML = '';
      paymentElement.mount('#payment-element');
      paymentElement.on('ready', () => { payBtn.disabled = false; payBtn.textContent = t(PLANS[selectedPlan].payKey); });
      paymentElement.on('change', (event) => { if (event.complete) { payBtn.disabled = false; payBtn.textContent = t(PLANS[selectedPlan].payKey); } });
      showStep('stepPayment');
    } catch (err) {
      showMessage('error', err.message || t('msg_error'));
    } finally {
      isSubmitting = false; confirmBtn.disabled = false; confirmBtn.textContent = t('cta_confirm');
    }
  });

  backToConfirmBtn.addEventListener('click', () => showStep('stepConfirm'));

  /* ── Confirm payment ── */
  payBtn.addEventListener('click', async () => {
    if (isSubmitting) return;
    isSubmitting = true; payBtn.disabled = true;
    payBtn.innerHTML = '<span style="display:inline-block;width:16px;height:16px;border:2px solid rgba(255,255,255,0.4);border-top-color:#fff;border-radius:50%;animation:spin 0.7s linear infinite;vertical-align:middle;margin-right:8px;"></span>' + t('msg_processing');
    clearMessage();

    const { error, paymentIntent } = await stripe.confirmPayment({
      elements: stripeElements,
      confirmParams: { return_url: RETURN_URL, receipt_email: currentEmail },
      redirect: 'if_required',
    });

    if (error) {
      showMessage('error', error.message || t('msg_payment_failed'));
      payBtn.disabled = false; payBtn.textContent = t(PLANS[selectedPlan].payKey); isSubmitting = false; return;
    }
    if (paymentIntent && paymentIntent.status === 'succeeded') {
      paymentIntentId = paymentIntent.id; showStep('stepPassword');
    }
    isSubmitting = false;
  });

  /* ── Set password + create account ── */
  setupBtn.addEventListener('click', async () => {
    const pw1 = document.getElementById('pw1').value;
    const pw2 = document.getElementById('pw2').value;
    if (!pw1 || pw1.length < 6) { showMessage('error', t('msg_pwd_short')); return; }
    if (pw1 !== pw2) { showMessage('error', t('msg_pwd_mismatch')); return; }

    setupBtn.disabled = true; setupBtn.textContent = t('msg_creating'); clearMessage();

    try {
      const res = await fetch(FUNCTIONS_URL + '/lux-setup-account', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ payment_intent_id: paymentIntentId, password: pw1 }),
      });
      const data = await res.json();
      if (!data.success) {
        showMessage('error', data.error || t('msg_account_failed'));
        setupBtn.disabled = false; setupBtn.textContent = t('cta_create_account'); return;
      }

      const { error: signInError } = await sb.auth.signInWithPassword({ email: data.email, password: pw1 });
      if (signInError) console.error('Auto-login failed:', signInError);

      localStorage.removeItem('lux_checkout_email');
      document.getElementById('doneEmail').textContent = t('msg_logged_in_as') + data.email;

      // If bundle, update the CTA to show Sproochentest is also accessible
      if (data.plan === 'bundle') {
        const doneCta = document.getElementById('doneCta');
        doneCta.textContent = t('cta_start_training');
      }

      showStep('stepDone');
    } catch (err) {
      showMessage('error', t('msg_connection_error'));
      setupBtn.disabled = false; setupBtn.textContent = t('cta_create_account');
    }
  });

  document.getElementById('pw2').addEventListener('keydown', (e) => { if (e.key === 'Enter') setupBtn.click(); });
})();
</script>

</body>
</html>
