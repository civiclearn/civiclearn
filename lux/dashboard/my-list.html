<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="title_my_list">Ma liste</title>
  <link rel="manifest" href="/lux/manifest.json">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="CivicLearn">
  <meta name="mobile-web-app-capable" content="yes">

  <link rel="stylesheet" href="/lux/assets/css/civic-v2.css">
  <link rel="stylesheet" href="/lux/assets/css/history-v2.css">
  <style>
    .mylist-wrapper { max-width: 780px; margin-left:0; margin-right:auto; }
    .mylist-card { padding:14px; border:1px solid var(--border); border-radius:var(--radius-sm); margin-bottom:10px; background:var(--surface); }
    .mylist-question-row { display:flex; align-items:flex-start; gap:10px; }
    .mylist-question { font-size:14px; font-weight:500; line-height:1.4; flex:1; }
    .mylist-badge { font-size:11px; padding:3px 8px; border-radius:20px; background:var(--accent-soft); color:var(--accent); white-space:nowrap; font-weight:600; }
    .mylist-actions { display:flex; align-items:center; }
    .mylist-remove { font-size:0; color:var(--text-muted); background:transparent; border:none; cursor:pointer; padding:4px; line-height:1; }
    .mylist-remove::before { content:'✕'; font-size:13px; }
    .mylist-remove:hover { color:var(--wrong); }
    .mylist-options { display:flex; flex-direction:column; gap:5px; margin-top:8px; }
    .mylist-option { font-size:13px; text-align:left; padding:6px 12px; border-radius:8px; border:1px solid var(--border); background:var(--surface); cursor:pointer; transition:all 0.15s; font-family:var(--font); }
    .mylist-option:hover:not(:disabled) { background:var(--accent-soft); }
    .mylist-option.correct { background:var(--correct-bg); border-color:var(--correct); }
    .mylist-option.wrong { background:var(--wrong-bg); border-color:var(--wrong); }
    .mylist-option:disabled { cursor:default; opacity:0.95; }
    .mylist-header { display:flex; align-items:flex-start; justify-content:space-between; }
    .mylist-count { font-size:13px; color:var(--text-muted); margin-top:6px; }
    .mylist-footer { display:flex; justify-content:space-between; align-items:center; margin-top:14px; gap:12px; }
    .mylist-status { font-size:12px; color:var(--text-muted); }
    .mylist-controls { display:flex; gap:6px; }
    .mylist-page-btn, .mylist-load-more { font-family:var(--font); font-size:12px; padding:5px 12px; border-radius:8px; border:1px solid var(--border); background:var(--surface); cursor:pointer; }
    .mylist-page-btn:hover:not(:disabled), .mylist-load-more:hover { background:var(--accent-soft); border-color:var(--accent); }
    .mylist-page-btn:disabled { opacity:0.4; cursor:default; }
    .mylist-list { padding-bottom: 24px; }
  </style>

  <script>document.documentElement.classList.add("i18n-hidden");</script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="/assets/js/cl-auth-storage.js"></script>
  <script src="/lux/assets/js/lux-auth.js?v=2"></script>
</head>

<body>

<button class="menu-toggle" aria-label="Menu">☰</button>

    <nav class="nav">

      <a href="simulation.html" data-i18n="nav_simulation">Simulation du test</a>

      <a href="traps.html" data-i18n="nav_traps">Pièges fréquents</a>

      <a href="reference.html" data-i18n="nav_reference_texts">Textes de référence</a>

          <path d="M3 9v6h4l5 5V4L7 9H3z"/>

        </svg>

  <div class="overlay" id="menuOverlay"></div>

  <main>
    <!-- REQUIRED by engine (do not remove) -->
    <div id="quiz" style="display:none"></div>
    <div class="dashboard-container">
      <div class="mylist-wrapper">
        <header class="ce-header mylist-header">
          <div>
            <h1 data-i18n="title_my_list">Ma liste</h1>

          <div id="myListCount" class="mylist-count"></div>

      </div>
    </div>

<!-- Config + i18n (Lux files live at the CivicLearn root) -->
<script src="/assets/js/lang-bootstrap-lu.js"></script>
<script src="/assets/js/config-lu.js?v=2"></script>
<script src="/assets/js/i18n.js"></script>
<script>CivicLearnI18n.init();</script>
<script src="/assets/js/reading.js"></script>
<script src="/assets/js/engine-lu.js"></script>
<script src="/assets/js/sync.js"></script>
<script>
CivicLearnI18n.onReady(() => {
  const s = document.createElement("script");
  s.src = "/assets/js/my-list.js";
  document.body.appendChild(s);
});
</script>

<!-- Mobile menu + lang switch -->
<script>
document.addEventListener("DOMContentLoaded", () => {
  const toggle = document.querySelector(".menu-toggle");
  const overlay = document.getElementById("menuOverlay");
  if (toggle) toggle.addEventListener("click", () => document.body.classList.toggle("menu-open"));
  if (overlay) overlay.addEventListener("click", () => document.body.classList.remove("menu-open"));

  const current = window.CIVICEDGE_LANG;
  document.querySelectorAll(".lang-switch button").forEach(btn => {
    if (btn.dataset.lang === current) btn.classList.add("active");
    btn.addEventListener("click", () => {
      if (btn.dataset.lang === current) return;
      localStorage.setItem("civicedge_lang", btn.dataset.lang);
      location.reload();
    });
  });
});
</script>
<script src="/lux/assets/js/gauge-bar.js"></script>
<script src="/lux/assets/js/study-timer.js"></script>
<script src="/assets/js/maintenance-bar.js"></script>
