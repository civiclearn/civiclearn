<script>
document.addEventListener("DOMContentLoaded", () => {
  const cfg = window.CIVICEDGE_CONFIG || {};
  const container = document.getElementById("topicContainer");
  const startBtn = document.getElementById("startBtn");
  const selected = new Set();           // microtopic.en keys
  const bankPath = cfg.bank && cfg.bank.path;
  const lang = window.CIVICEDGE_LANG || "fr";
  const Q_FALLBACK = { fr: "questions", de: "Fragen", en: "questions" }[lang] || "questions";
  const Q_WORD = (window.CivicLearnI18n && typeof CivicLearnI18n.t === "function" && CivicLearnI18n.t("topics_q_word") !== "topics_q_word" && CivicLearnI18n.t("topics_q_word")) || Q_FALLBACK;

  async function loadBankTopics() {
    if (!bankPath) return [];
    try {
      const res = await fetch(bankPath);
      const raw = await res.json();
      return Array.isArray(raw) ? raw : (raw.questions || []);
    } catch (e) { console.warn("Failed to load bank for topics", e); return []; }
  }

  function progKey(q) {
    const microKey = q.microtopic && typeof q.microtopic === "object" ? q.microtopic.en : "";
    return `${microKey}:${q.id}`;
  }

  async function initTopics() {
    const bank = await loadBankTopics();
    let progress = {};
    try { progress = JSON.parse(localStorage.getItem("civicedge_progress") || "{}"); } catch {}

    // topic.en → { label, total, mastered, micros: { microtopic.en → { label, total, mastered } } }
    const groups = {};
    bank.forEach(q => {
      if (!q.topic || typeof q.topic !== "object" || !q.microtopic || typeof q.microtopic !== "object") return;
      const tc = q.topic.en, mc = q.microtopic.en;
      if (!tc || !mc) return;
      if (!groups[tc]) groups[tc] = { label: q.topic[lang] || tc, total: 0, mastered: 0, micros: {} };
      const g = groups[tc];
      if (!g.micros[mc]) g.micros[mc] = { label: q.microtopic[lang] || mc, total: 0, mastered: 0 };
      const entry = progress[progKey(q)];
      const ok = !!(entry && entry.correct === 1);
      g.total++; g.micros[mc].total++;
      if (ok) { g.mastered++; g.micros[mc].mastered++; }
    });

    container.innerHTML = "";

    Object.values(groups).forEach(group => {
      const wrap = document.createElement("div");
      wrap.className = "topic-group";

      const gpct = group.total ? Math.round((group.mastered / group.total) * 100) : 0;
      const header = document.createElement("div");
      header.className = "topic-group-title";
      header.innerHTML = `<span>${group.label}</span><span class="topic-group-badge">${group.total}</span><span class="topic-group-pct">${gpct}%</span>`;

      const grid = document.createElement("div");
      grid.className = "topic-cards";

      Object.entries(group.micros).forEach(([mc, mt]) => {
        const pct = mt.total ? Math.round((mt.mastered / mt.total) * 100) : 0;
        const card = document.createElement("button");
        card.className = "topic-card";
        if (mt.total > 0 && mt.mastered >= mt.total) card.classList.add("mastered");
        card.innerHTML = `
          <div class="topic-card-name">${mt.label}</div>
          <div class="topic-card-meta">
            <span class="topic-card-count">${mt.total} ${Q_WORD}</span>
            <span class="topic-card-pct">${pct}%</span>
          </div>
          <div class="topic-card-bar"><div class="topic-card-bar-fill" style="width:${pct}%"></div></div>
        `;
        card.addEventListener("click", () => {
          card.classList.toggle("active");
          if (card.classList.contains("active")) selected.add(mc); else selected.delete(mc);
          startBtn.style.display = selected.size > 0 ? "inline-block" : "none";
          if (selected.size > 0 && window.innerWidth < 768) {
            setTimeout(() => startBtn.scrollIntoView({ behavior: "smooth", block: "center" }), 150);
          }
        });
        grid.appendChild(card);
      });

      wrap.appendChild(header);
      wrap.appendChild(grid);
      container.appendChild(wrap);
    });

    startBtn.addEventListener("click", () => {
      const pick = Array.from(selected);
      const limit = (cfg.topics && cfg.topics.questionCount) || 10;
      document.getElementById("quizArea").style.display = "block";
      document.querySelector("section").style.display = "none";
      CivicEdgeEngine.start("topics", { topics: pick, limit: limit });
      window.scrollTo({ top: 0, behavior: "smooth" });
    });
  }

  initTopics();
});
</script>

<!-- Mobile menu + lang switch -->
<script>
document.addEventListener("DOMContentLoaded", () => {
  const toggle = document.querySelector(".menu-toggle");
  const overlay = document.getElementById("menuOverlay");
  if (toggle) toggle.addEventListener("click", () => document.body.classList.toggle("menu-open"));
  if (overlay) overlay.addEventListener("click", () => document.body.classList.remove("menu-open"));

  const current = window.CIVICEDGE_LANG;
  document.querySelectorAll(".lang-switch button").forEach(btn => {
    if (btn.dataset.lang === current) btn.classList.add("active");
    btn.addEventListener("click", () => {
      if (btn.dataset.lang === current) return;
      localStorage.setItem("civicedge_lang", btn.dataset.lang);
      location.reload();
    });
  });
});
</script>
