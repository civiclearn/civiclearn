<button class="menu-toggle" aria-label="Menu">☰</button>

<div class="wrap">

    </div>
    <!-- Sidebar gauge -->
    <div class="sidebar-gauge">

        <span class="sidebar-gauge-score" id="clGaugeScore">–</span>
      </div>
      <div class="sidebar-gauge-track">
        <div class="sidebar-gauge-fill" id="clGaugeFill"></div>
        <div class="sidebar-gauge-pass" id="clGaugePass"></div>

    </div>
    <nav class="nav">
      <a href="index.html" data-i18n="nav_dashboard">Tableau de bord</a>
      <a href="simulation.html" class="active" data-i18n="nav_simulation">Simulation du test</a>
      <a href="quick.html" data-i18n="nav_quick">Test rapide</a>
      <a href="topics.html" data-i18n="nav_topics">Tests par thème</a>

      <a href="#" data-i18n="nav_logout" id="logoutLink">Se déconnecter</a>
    </nav>
    <div class="spacer"></div>
    <div class="global-controls">
      <div class="lang-switch">
        <button data-lang="fr">FR</button>
        <button data-lang="de">DE</button>
        <button data-lang="en">EN</button>
      </div>
      <button id="readingToggle" class="reading-btn tool" data-i18n="reading_tooltip" data-i18n-attr="title" aria-label="Reading assist">
        <svg class="reading-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M3 9v6h4l5 5V4L7 9H3z"/>

        </svg>
      </button>

  <div class="overlay" id="menuOverlay"></div>

  <main>
    <header class="ce-header">

    </header>

    <div class="ce-progress-global">
      <div class="ce-progress-global-bar" id="simProgress"></div>
    </div>

      <div id="quiz"></div>

<!-- Config + i18n (Lux files live at the CivicLearn root) -->
<script src="/assets/js/lang-bootstrap-lu.js"></script>
<script src="/assets/js/config-lu.js?v=2"></script>
<script src="/assets/js/i18n.js"></script>
<script>CivicLearnI18n.init();</script>
<!-- Reading assist must load BEFORE the engine -->
<script src="/assets/js/reading.js"></script>
<script src="/assets/js/engine-lu.js"></script>
<script src="/assets/js/sync.js"></script>

<script>
document.addEventListener("DOMContentLoaded", () => {
  setTimeout(() => CivicEdgeEngine.start("simulation"), 600);

  document.addEventListener("click", e => {
    if (["changeTheme","returnBtn","restartBtn","ce-return"].includes(e.target?.id)) {
      e.preventDefault();
      window.scrollTo({ top: 0, behavior: "smooth" });
      location.reload();
    }
  });
});
</script>

<!-- Mobile menu + lang switch -->
<script>
document.addEventListener("DOMContentLoaded", () => {
  const toggle = document.querySelector(".menu-toggle");
  const overlay = document.getElementById("menuOverlay");
  if (toggle) toggle.addEventListener("click", () => document.body.classList.toggle("menu-open"));
  if (overlay) overlay.addEventListener("click", () => document.body.classList.remove("menu-open"));

  const current = window.CIVICEDGE_LANG;
  document.querySelectorAll(".lang-switch button").forEach(btn => {
    if (btn.dataset.lang === current) btn.classList.add("active");
    btn.addEventListener("click", () => {
      if (btn.dataset.lang === current) return;
      localStorage.setItem("civicedge_lang", btn.dataset.lang);
      location.reload();
    });
  });
});
</script>
<script src="/lux/assets/js/gauge-bar.js"></script>
<script src="/lux/assets/js/study-timer.js"></script>
<script src="/assets/js/maintenance-bar.js"></script>
<script src="/assets/js/signout.js"></script>
<script src="/lux/assets/js/quiz-progress-lu.js"></script>
</body>
</html>
