  <style>
    .reference-toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 22px; }
    .reference-filters { display: flex; flex-wrap: wrap; gap: 6px; }
    .ref-filter { font-family: var(--font); font-size: 12.5px; font-weight: 600; padding: 6px 13px; border-radius: 20px; border: 1px solid var(--border); background: var(--surface); color: var(--text-mid); cursor: pointer; transition: all 0.15s; }
    .ref-filter:hover { border-color: var(--accent); color: var(--accent); }
    .ref-filter.active { background: var(--accent); border-color: var(--accent); color: #fff; }
    #referenceSearch { margin-left: auto; min-width: 220px; padding: 8px 14px; border: 1.5px solid var(--border); border-radius: var(--radius-sm); font-family: var(--font); font-size: 13.5px; background: var(--surface); color: var(--text); }
    #referenceSearch:focus { outline: none; border-color: var(--accent); }
    .reference-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; max-width: 1100px; }
    .reference-card { background: var(--surface); border-radius: var(--radius); padding: 20px; box-shadow: var(--shadow); border: 1.5px solid transparent; display: flex; flex-direction: column; transition: all 0.2s ease; }
    .reference-card:hover { border-color: var(--accent); transform: translateY(-1px); box-shadow: var(--shadow-md); }
    .ref-badge { align-self: flex-start; font-size: 10.5px; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; padding: 3px 8px; border-radius: 6px; background: var(--accent-soft); color: var(--accent); margin-bottom: 12px; }
    .reference-card h3 { font-size: 14px; font-weight: 700; letter-spacing: -0.02em; margin-bottom: 6px; line-height: 1.35; }
    .reference-card p { font-size: 12.5px; color: var(--text-mid); line-height: 1.5; flex: 1; }
    .reference-card a { margin-top: 14px; font-size: 12.5px; font-weight: 600; color: var(--accent); text-decoration: none; }
    .reference-card a:hover { text-decoration: underline; }
    @media (max-width: 640px) { #referenceSearch { margin-left: 0; width: 100%; } }
  </style>

  <script>document.documentElement.classList.add("i18n-hidden");</script>

</head>

<script>
const REFERENCE_TEXTS_EN = [
  { title: "About the History of Luxembourg", description: "An essential overview of Luxembourg's history, its key events, and its development.", file: "about-the-history-of-luxembourg-en-1.pdf", category: "history", badge: "Official" },
  { title: "About Political Institutions in Luxembourg", description: "A guide to Luxembourg's political institutions and how they function.", file: "A_propos_Institutions_politiques-EN-1.pdf", category: "institutions", badge: "Official" },
  { title: "About Luxembourg and the European Union", description: "An introduction to the relations between Luxembourg and the European Union.", file: "about-luxembourg-and-the-european-union-en.pdf", category: "institutions", badge: "Official" },
  { title: "Everything You Need to Know About the Grand Duchy of Luxembourg", description: "A comprehensive presentation of the Grand Duchy of Luxembourg, its identity, and its unique characteristics.", file: "tout-savoir-sur-le-grand-duche-de-luxembourg-en.pdf", category: "history", badge: "Official" },
  { title: "10 Fact Sheets About the Grand Duchy of Luxembourg", description: "A brochure in 10 chapters offering a visual and engaging presentation of Luxembourg: history, culture, population, politics, economy, and more.", file: "10-fact-sheets-grand-duchy-luxembourg-en.pdf", category: "history", badge: "Official" },
  { title: "Constitution of the Grand Duchy of Luxembourg", description: "The fundamental text establishing the organization and functioning of the Grand Duchy of Luxembourg.", file: "constitution.pdf", category: "institutions", badge: "Official" },
  { title: "The Universal Declaration of Human Rights", description: "The key text proclaiming the fundamental rights and freedoms of every human being.", file: "universal-declaration-of-human-rights-en.pdf", category: "rights", badge: "Official" },
  { title: "About Languages in Luxembourg", description: "An introduction to multilingualism and the use of languages in Luxembourg.", file: "a-propos-des-langues-en.pdf", category: "culture", badge: "Official" },
  { title: "Symbols of the State and of the Nation", description: "A presentation of the official symbols of the State and the Luxembourgish nation.", file: "symbols-of-the-state-and-of-the-nation-en.pdf", category: "culture", badge: "Official" },
  { title: "About Festivals and Traditions in Luxembourg", description: "An exploration of the festivals and traditions that enrich Luxembourgish culture.", file: "a-propos-des-fetes-et-traditions-au-luxembourg-en.pdf", category: "culture", badge: "Official" },
  { title: "About Theatre in Luxembourg", description: "A look at the history and significance of theatre in Luxembourg’s cultural life.", file: "a-propos-du-theatre-au-luxembourg-en.pdf", category: "culture", badge: "Official" },
  { title: "About Literature in Luxembourg", description: "An introduction to the richness and diversity of Luxembourgish literature.", file: "a-propos-de-la-litterature-au-luxembourg-en.pdf", category: "culture", badge: "Official" }
];

const grid = document.getElementById("referenceGrid");
REFERENCE_TEXTS_EN.forEach(f => {
  const card = document.createElement("div");
  card.className = "reference-card";
  card.dataset.category = f.category || "other";
  card.innerHTML = `
    <div class="ref-badge">PDF · ${f.badge}</div>
    <h3>${f.title}</h3>
    <p>${f.description}</p>
    <a href="https://media.civiclearn.com/lux/en/${f.file}" target="_blank" rel="noopener">Download →</a>
  `;
  grid.appendChild(card);
});

const filterButtons = document.querySelectorAll(".ref-filter");
const searchInput = document.getElementById("referenceSearch");
const cards = Array.from(document.querySelectorAll(".reference-card"));
function applyFilters() {
  const activeFilter = document.querySelector(".ref-filter.active")?.dataset.filter || "all";
  const query = searchInput.value.toLowerCase();
  cards.forEach(card => {
    const matchesFilter = activeFilter === "all" || card.dataset.category === activeFilter;
    const matchesSearch = card.innerText.toLowerCase().includes(query);
    card.style.display = matchesFilter && matchesSearch ? "" : "none";
  });
}
filterButtons.forEach(btn => btn.addEventListener("click", () => {
  filterButtons.forEach(b => b.classList.remove("active"));
  btn.classList.add("active");
  applyFilters();
}));
searchInput.addEventListener("input", applyFilters);
</script>

<!-- Mobile menu + lang switch -->
<script>
document.addEventListener("DOMContentLoaded", () => {
  const toggle = document.querySelector(".menu-toggle");
  const overlay = document.getElementById("menuOverlay");
  if (toggle) toggle.addEventListener("click", () => document.body.classList.toggle("menu-open"));
  if (overlay) overlay.addEventListener("click", () => document.body.classList.remove("menu-open"));

  const current = window.CIVICEDGE_LANG;
  document.querySelectorAll(".lang-switch button").forEach(btn => {
    if (btn.dataset.lang === current) btn.classList.add("active");
    btn.addEventListener("click", () => {
      if (btn.dataset.lang === current) return;
      localStorage.setItem("civicedge_lang", btn.dataset.lang);
      // help-xx.html / reference-xx.html are per-language files
      // Cloudflare Pages serves these with or without ".html" (/lux/dashboard/help-en)
      const m = location.pathname.match(/\/(help|reference)(-[a-z]{2})?(\.html)?\/?$/);
      if (m) { location.href = `${m[1]}-${btn.dataset.lang}.html`; return; }
      location.reload();
    });
  });
});
</script>
