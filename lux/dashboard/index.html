<script>
  document.addEventListener("DOMContentLoaded", () => {
    const toggle = document.querySelector(".menu-toggle");
    const overlay = document.querySelector(".overlay");
    if (toggle && overlay) {
      toggle.addEventListener("click", () => {
        document.body.classList.toggle("menu-open");
      });
      overlay.addEventListener("click", () => {
        document.body.classList.remove("menu-open");
      });
    }
  });
</script>

<script>
function loadDashboardSequential() {
  const s2 = document.createElement("script");
  s2.src = "/assets/js/dashboard-sequential-lu.js";
  document.body.appendChild(s2);
}

CivicLearnI18n.onReady(() => {
  const s1 = document.createElement("script");
  s1.src = "/assets/js/dashboard-v2-lu.js";
  document.body.appendChild(s1);

  if (document.readyState === "complete" || document.readyState === "interactive") {
    loadDashboardSequential();
  } else {
    document.addEventListener("DOMContentLoaded", loadDashboardSequential);
  }
});
</script>

<script>
  // Plan B: Force Chrome to flush any delayed textContent DOM updates
  CivicLearnI18n.onReady(() => {
    setTimeout(() => {
      // touch one translated node, causing forced reflow
      const test = document.querySelector('[data-i18n]');
      if (test) {
        const tmp = test.textContent;
        test.textContent = tmp; // write same value
      }
    }, 50);
  });
</script>
<script>
  document.getElementById("year").textContent = new Date().getFullYear();
</script>
<script>
  (function () {
    const current = window.CIVICEDGE_LANG;

    document.querySelectorAll(".lang-switch button").forEach(btn => {
      const lang = btn.dataset.lang;

      // Highlight active language
      if (lang === current) {
        btn.classList.add("active");
      }

      btn.addEventListener("click", () => {
        if (lang === current) return;
        localStorage.setItem("civicedge_lang", lang);
        location.reload();
      });
    });
  })();
</script>

<script>

  const lang = window.CIVICEDGE_LANG || 'fr';

  const texts = {

      text: '<strong>Votre offre pack est active !</strong> Vous avez également accès au <strong>Sproochentest Training</strong> — même e-mail et mot de passe.',

    },
    de: {

      btn: 'Sproochentest öffnen →'
    },
    en: {
      text: '<strong>Your bundle offer is active!</strong> You also have access to <strong>Sproochentest Training</strong> — same email and password.',
      btn: 'Open Sproochentest →'
    }
