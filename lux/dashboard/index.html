    /* ─── BUNDLE BANNER ─── */
    .bundle-banner {
      display: none;
      align-items: center;
      gap: 14px;
      background: linear-gradient(135deg, #f3f0ff 0%, #ede9fe 100%);
      border: 1px solid #ddd6fe;
      border-radius: 10px;
      padding: 14px 20px;
      margin-bottom: 16px;
      font-size: 0.88rem;
      color: #1e1b4b;
      line-height: 1.5;
    }
    .bundle-banner.show { display: flex; }
    .bundle-banner-icon { font-size: 1.5rem; flex-shrink: 0; }
    .bundle-banner-text { flex: 1; }
    .bundle-banner-text strong { font-weight: 600; }
    .bundle-banner-btn {
      display: inline-block;
      background: #6b4eff;
      color: #fff;
      text-decoration: none;
      font-family: inherit;
      font-size: 0.82rem;
      font-weight: 600;
      padding: 8px 16px;
      border-radius: 8px;
      white-space: nowrap;
      flex-shrink: 0;
      transition: background 0.15s;
    }
    .bundle-banner-btn:hover { background: #5a3de6; }
    @media (max-width: 640px) {
      .bundle-banner { flex-direction: column; text-align: center; }
    }

    /* ─── SPROOCHENTEST ADDON BANNER ─── */
    .st-addon-banner{display:none;background:linear-gradient(135deg,#eef2ff 0%,#e0e7ff 100%);border:1px solid #c7d2fe;border-radius:12px;padding:14px 20px;margin:0 0 20px 0;align-items:center;gap:14px;flex-wrap:wrap;position:relative;}
    .st-addon-banner.show{display:flex;}
    .st-addon-icon{font-size:1.3rem;flex-shrink:0;}
    .st-addon-text{flex:1;min-width:200px;}
    .st-addon-text strong{color:#3730a3;font-size:.92rem;}
    .st-addon-text span{display:block;color:#4338ca;font-size:.82rem;margin-top:2px;}
    .st-addon-btn{background:#6b4eff;color:#fff;border:none;cursor:pointer;padding:8px 18px;border-radius:8px;font-size:.85rem;font-weight:600;white-space:nowrap;transition:background .15s;font-family:inherit;}
    .st-addon-btn:hover{background:#5a3de6;}
    .st-addon-dismiss{position:absolute;top:8px;right:10px;background:none;border:none;cursor:pointer;color:#6366f1;font-size:.8rem;opacity:.5;transition:opacity .15s;font-family:inherit;}
    .st-addon-dismiss:hover{opacity:1;}
    @media(max-width:600px){.st-addon-banner{flex-direction:column;text-align:center;padding-right:20px;}.st-addon-btn{width:100%;text-align:center;}.st-addon-dismiss{top:6px;right:8px;}}

    /* ─── SPROOCHENTEST ADDON PAYMENT MODAL ─── */
    .st-modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:9999;justify-content:center;align-items:center;padding:20px;}
    .st-modal-overlay.open{display:flex;}
    .st-modal{background:#fff;border-radius:16px;padding:32px;max-width:440px;width:100%;position:relative;box-shadow:0 20px 60px rgba(0,0,0,.2);max-height:90vh;overflow-y:auto;font-family:'Space Grotesk',sans-serif;}
    .st-modal-close{position:absolute;top:12px;right:16px;background:none;border:none;cursor:pointer;font-size:1.2rem;color:#94a3b8;transition:color .15s;}
    .st-modal-close:hover{color:#475569;}
    .st-modal-title{margin:0 0 20px;font-size:1.2rem;color:#1e293b;font-weight:700;}
    .st-modal-features{margin-bottom:16px;}
    .st-feature{font-size:.85rem;color:#334155;padding:4px 0;}
    .st-modal-price{background:#f8fafc;border:1px solid #e2e8f0;border-radius:10px;padding:14px 16px;margin-bottom:16px;}
    .st-price-row{display:flex;justify-content:space-between;align-items:center;font-size:.9rem;color:#334155;}
    .st-price{font-weight:700;color:#6b4eff;font-size:1.05rem;}
    .st-price-note{font-size:.75rem;color:#64748b;margin-top:6px;}
    .st-modal-email{font-size:.82rem;color:#64748b;margin-bottom:16px;padding:0 2px;}
    .st-payment-element{min-height:80px;margin-bottom:16px;}
    .st-error{color:#dc2626;font-size:.82rem;margin-bottom:12px;}
    .st-pay-btn{width:100%;padding:14px;border:none;border-radius:10px;background:#6b4eff;color:#fff;font-size:.95rem;font-weight:600;cursor:pointer;transition:background .15s;display:flex;justify-content:center;align-items:center;gap:8px;font-family:'Space Grotesk',sans-serif;}
    .st-pay-btn:hover:not(:disabled){background:#5a3de6;}
    .st-pay-btn:disabled{opacity:.55;cursor:not-allowed;}
    .st-spinner{width:18px;height:18px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:stspin .6s linear infinite;display:inline-block;}
    @keyframes stspin{to{transform:rotate(360deg);}}
    .st-success{text-align:center;padding:20px 0;}
    .st-success-icon{font-size:2.5rem;margin-bottom:12px;}
    .st-success h3{margin:0 0 12px;color:#1e293b;font-size:1.15rem;}

<script>
  (function () {
    const current = window.CIVICEDGE_LANG;

    document.querySelectorAll(".lang-switch button").forEach(btn => {
      const lang = btn.dataset.lang;

      // Highlight active language
      if (lang === current) {
        btn.classList.add("active");
      }

      btn.addEventListener("click", () => {
        if (lang === current) return;
        localStorage.setItem("civicedge_lang", lang);
        location.reload();
      });
    });
  })();
</script>

<!-- Bundle banner -->
<script>
(async function () {
  let hasBundle = localStorage.getItem('cl_bundle') === 'lu';

  // Fallback: check Supabase if localStorage doesn't have the flag
  if (!hasBundle) {
    try {
      if (window.luxAuth && window.luxAuth.ready) await window.luxAuth.ready;
      const sb = window.luxAuth && window.luxAuth.supabase;
      const userId = window.luxAuth && window.luxAuth.userId;
      if (!sb || !userId) return;
      const { data } = await sb
        .from('users').select('bundle').eq('id', userId).maybeSingle();
      if (data && data.bundle === 'lux') {
        localStorage.setItem('cl_bundle', 'lu');
        hasBundle = true;
      }
    } catch(e) { /* silent */ }
  }

  if (!hasBundle) return;

  const lang = window.CIVICEDGE_LANG || 'fr';

  const texts = {
    fr: {
      text: '<strong>Votre offre pack est active !</strong> Vous avez également accès au <strong>Sproochentest Training</strong> — même e-mail et mot de passe.',
      btn: 'Ouvrir Sproochentest →'
    },
    de: {

<script>
(function() {

    },
    de: {

      banner_btn: "Jetzt hinzufügen →",

  document.getElementById("stModalTitle").textContent = t.modal_title;
  var featuresHtml = t.features.map(function(f) { return '<div class="st-feature">✓ ' + f + '</div>'; }).join('');
  document.getElementById("stModalFeatures").innerHTML = featuresHtml;
  document.getElementById("stPriceLabel").textContent = t.price_label;
  document.getElementById("stPriceNote").textContent = t.price_note;
  payText.textContent = t.pay_btn;
  document.getElementById("stSuccessTitle").textContent = t.success_title;
  document.getElementById("stSuccessText").textContent = t.success_text;
  document.getElementById("stSuccessBtn").textContent = t.success_btn;

  // 1. Show banner if eligible (non-bundle VE user)
  async function initBanner() {
    if (sessionStorage.getItem("st_addon_dismissed")) return;
    if (localStorage.getItem("cl_bundle") === "lu") return;

    try {
      if (window.luxAuth && window.luxAuth.ready) await window.luxAuth.ready;
      var sb = window.luxAuth && window.luxAuth.supabase;
      var userId = window.luxAuth && window.luxAuth.userId;
      if (!sb || !userId) return;

      var sess = await sb.auth.getSession();
      if (!sess.data.session) return;
      accessToken = sess.data.session.access_token;
      userEmail = sess.data.session.user.email;

      var result = await sb.from("users").select("bundle").eq("id", userId).maybeSingle();
      if (result.data && result.data.bundle === "lux") {
        localStorage.setItem("cl_bundle", "lu");
        return;
      }
      banner.classList.add("show");
    } catch(e) { /* silent */ }
  }

  // 2. Load Stripe.js on demand
  function loadStripe() {
    return new Promise(function(resolve) {
      if (window.Stripe) { resolve(window.Stripe(STRIPE_PK)); return; }
      var s = document.createElement("script");
      s.src = "https://js.stripe.com/v3/";
      s.onload = function() { resolve(window.Stripe(STRIPE_PK)); };
      document.head.appendChild(s);
    });
  }

  // 3. Open modal
  async function openModal() {
    overlay.classList.add("open");
    document.body.style.overflow = "hidden";
    errorEl.textContent = "";
    emailEl.textContent = t.account_prefix + (userEmail || "");

    if (!stripe) stripe = await loadStripe();

    try {
      payBtn.disabled = true;
      payText.textContent = t.preparing;

      var res = await fetch(EDGE_FN_BASE + "/sproochentest-addon-create-payment-intent", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "Authorization": "Bearer " + accessToken,
          "apikey": window.SUPABASE_KEY
        },
        body: JSON.stringify({})
      });
      var data = await res.json();
      if (!res.ok) throw new Error(data.error || "Payment setup failed");

      clientSecret = data.client_secret;
      paymentIntentId = data.payment_intent_id;

      elements = stripe.elements({
        clientSecret: clientSecret,
        appearance: {
          theme: "stripe",
          variables: { colorPrimary: "#6b4eff", fontFamily: "'Space Grotesk', sans-serif", borderRadius: "8px" }
        }
      });
      paymentElement = elements.create("payment");
      paymentElement.mount("#stPaymentElement");

      paymentElement.on("ready", function() {
        payBtn.disabled = false;
        payText.textContent = t.pay_btn;
      });
      paymentElement.on("change", function(e) {
        errorEl.textContent = e.error ? e.error.message : "";
      });
    } catch(err) {
      errorEl.textContent = err.message;
      payText.textContent = t.pay_btn;
    }
  }

  // 4. Close modal
  function closeModal() {
    overlay.classList.remove("open");
    document.body.style.overflow = "";
    if (paymentElement) { try { paymentElement.unmount(); } catch(e) {} paymentElement = null; }
    elements = null; clientSecret = null;
  }

  // 5. Submit payment
  async function submitPayment() {
    if (!stripe || !elements || !clientSecret) return;
    payBtn.disabled = true;
    payText.textContent = t.processing;
    paySpinner.style.display = "inline-block";
    errorEl.textContent = "";

    try {
      var result = await stripe.confirmPayment({
        elements: elements,
        confirmParams: { receipt_email: userEmail, return_url: window.location.href },
        redirect: "if_required"
      });
      if (result.error) throw new Error(result.error.message);

      payText.textContent = t.activating;
      var setupRes = await fetch(EDGE_FN_BASE + "/sproochentest-addon-setup-account", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "Authorization": "Bearer " + accessToken,
          "apikey": window.SUPABASE_KEY
        },
        body: JSON.stringify({ payment_intent_id: paymentIntentId })
      });
      var setupData = await setupRes.json();
      if (!setupRes.ok) throw new Error(setupData.error || "Access activation failed");

      localStorage.setItem("cl_bundle", "lu");
      step1.style.display = "none";
      step2.style.display = "block";
      banner.classList.remove("show");

      // Show the existing bundle banner
      var bundleBanner = document.getElementById("bundleBanner");
      if (bundleBanner) {
        var bt = (i18n[lang] || i18n.fr);
        var bundleTexts = {
          fr: { text: '<strong>Votre offre pack est active !</strong> Vous avez également accès au <strong>Sproochentest Training</strong> — même e-mail et mot de passe.', btn: 'Ouvrir Sproochentest →' },

          en: { text: '<strong>Your bundle offer is active!</strong> You also have access to <strong>Sproochentest Training</strong> — same email and password.', btn: 'Open Sproochentest →' }
        };
        var btt = bundleTexts[lang] || bundleTexts.fr;
        document.getElementById('bundleBannerText').innerHTML = btt.text;
        document.getElementById('bundleBannerBtn').textContent = btt.btn;
        bundleBanner.classList.add("show");
      }
    } catch(err) {
      errorEl.textContent = err.message;
      payBtn.disabled = false;
      payText.textContent = t.pay_btn;
      paySpinner.style.display = "none";
    }
  }

  // 6. Dismiss
  function dismissBanner() {
    banner.classList.remove("show");
    sessionStorage.setItem("st_addon_dismissed", "1");
  }

  addonBtn.addEventListener("click", openModal);
  dismissBtn.addEventListener("click", dismissBanner);
  closeBtn.addEventListener("click", closeModal);
  overlay.addEventListener("click", function(e) { if (e.target === overlay) closeModal(); });
  payBtn.addEventListener("click", submitPayment);

  initBanner();
})();
</script>
