  function applyLang(l) {
    lang = l;
    document.documentElement.lang = l;
    const dict = T[l];
    document.querySelectorAll('[data-i18n]').forEach(function(el) {
      const k = el.getAttribute('data-i18n');
      if (dict[k] != null) el.textContent = dict[k];
    });
    document.querySelectorAll('[data-i18n-ph]').forEach(function(el) {
      const k = el.getAttribute('data-i18n-ph');
      if (dict[k] != null) el.setAttribute('placeholder', dict[k]);
    });
    document.querySelectorAll('.lang-switch button').forEach(function(b) {
      b.classList.toggle('active', b.getAttribute('data-lang') === l);
    });
    [].forEach.call(document.querySelectorAll('.training-link'), function(a) { a.href = DASH; });
  }

  function show(id) {
    document.querySelectorAll('.screen').forEach(function(s) { s.classList.remove('active'); });
    document.getElementById(id).classList.add('active');
  }

  // ── flow ────────────────────────────────────────────────────────────────
  function disable(sel) {
    document.querySelectorAll(sel).forEach(function(b) { b.disabled = true; b.style.opacity = '0.5'; });
  }
  function enable(sel) {
    document.querySelectorAll(sel).forEach(function(b) { b.disabled = false; b.style.opacity = '1'; });
  }

  async function post(payload) {
    const res = await fetch(API, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(Object.assign({ email: email, token: token, exam_cycle: cycle, language: lang }, payload))
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'error');
    return data;
  }

  async function vote(result) {
    disable('#voteScreen .opt-btn');
    document.getElementById('errorMsg').style.display = 'none';
    try {
      const data = await post({ action: 'vote', result: result });

      if (data.status === 'already_voted') {
        if (data.next === 'helpfulness') { show('helpfulnessScreen'); return; }
        return showAlready(data);
      }
      if (data.next === 'helpfulness') { show('helpfulnessScreen'); return; }

      if (result === 'failed')         show('failedScreen');
      else if (result === 'not_taken') show('notTakenScreen');
      else if (result === 'not_yet')   show('notYetScreen');
    } catch (e) {
      enable('#voteScreen .opt-btn');
      const err = document.getElementById('errorMsg');
      err.textContent = T[lang].err_generic;
      err.style.display = 'block';
    }
  }

  async function rate(helpfulness) {
    disable('#helpfulnessScreen .opt-btn');
    document.getElementById('errorMsg2').style.display = 'none';
    try {
      const data = await post({ action: 'helpfulness', helpfulness: helpfulness });

      if (helpfulness === 'essential') {
        if (data.review_action === 'invite' && typeof tp === 'function') {
          tp('createInvitation', {
            recipientEmail: email,
            recipientName: data.user_name || 'Customer',
            referenceId: cycle || 'lux-ve',
            source: 'InvitationScript'
          });
          document.getElementById('tpNote').textContent = T[lang].tp_note_invite;
        } else {
          document.getElementById('tpNote').textContent = T[lang].tp_note_organic;
        }
        if (data.trustpilot_url) document.getElementById('tpLink').href = data.trustpilot_url;
        show('tpScreen');
      } else if (helpfulness === 'somewhat') {
        show('somewhatScreen');
      } else {
        show('notMuchScreen');
      }
    } catch (e) {
      enable('#helpfulnessScreen .opt-btn');
      const err = document.getElementById('errorMsg2');
      err.textContent = T[lang].err_generic;
      err.style.display = 'block';
    }
  }

  async function sendFeedback(boxId, isFailed) {
    const txt = (document.getElementById(boxId).value || '').trim();
    if (txt) { try { await post({ action: 'feedback', free_text: txt }); } catch (e) { /* keep UX smooth */ } }
    showThanks(isFailed);
  }

  function showThanks(isFailed) {
    // For failed, keep the reassurance screen feel by reusing the generic thanks.
    show('thanksScreen');
  }

  function showAlready(data) {
    const msg = document.getElementById('alreadyMsg');
    if (data.result === 'passed' && data.review_action === 'organic' && data.trustpilot_url) {
      msg.innerHTML = T[lang].already_passed +
        '<br><br><a href="' + data.trustpilot_url + '" target="_blank" class="tp-btn">' + T[lang].tp_btn + '</a>';
    } else {
      msg.textContent = T[lang].already_body;
    }
    show('alreadyScreen');
  }

  // ── init ──────────────────────────────────────────────────────────────────
  applyLang(lang);
  if (!email || !token || !cycle) {
    show('invalidScreen');
  } else {
    show('voteScreen');
  }
</script>
</body>
</html>
