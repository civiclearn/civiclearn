<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Access ended</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      background: #f6f7fb;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #111827;
    }

    .card {
      background: #ffffff;
      border-radius: 14px;
      max-width: 420px;
      width: 100%;
      padding: 32px 28px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
      text-align: center;
    }

    h1 {
      margin: 0 0 12px;
      font-size: 22px;
      font-weight: 600;
    }

    p {
      margin: 0 0 18px;
      font-size: 15px;
      line-height: 1.5;
      color: #374151;
    }

    .muted {
      font-size: 14px;
      color: #6b7280;
    }

    a {
      color: #6d28d9;
      text-decoration: none;
      font-weight: 500;
    }

    a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Access ended</h1>

    <p>
      Your access to the CivicLearn training platform has ended.
    </p>

    <p class="muted">
      If you believe this is a mistake, please contact support.
    </p>

    <p class="muted">
      <a href="https://civiclearn.com">Return to homepage</a>
    </p>
  </div>
</body>
</html>
