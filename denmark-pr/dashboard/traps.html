<script>
document.addEventListener("DOMContentLoaded", () => {

  // MOBILE MENU
  const toggle = document.querySelector(".menu-toggle");
  const overlay = document.getElementById("menuOverlay");
  if (toggle && overlay) {
    toggle.addEventListener("click", () => document.body.classList.toggle("menu-open"));
    overlay.addEventListener("click", () => document.body.classList.remove("menu-open"));
  }

  CivicLearnI18n.onReady(async () => {

    /* THEME */
    try {
      const s = JSON.parse(localStorage.getItem("civicedge_settings") || "{}");
      if (s.theme) document.documentElement.dataset.theme = s.theme;
    } catch {}

    /* LOAD BANK */
    const bankPath = window.CIVICEDGE_CONFIG?.bank?.path;
    if (!bankPath) { console.error("Config error: missing bank path"); return; }

    let fullBank = [];
    try {
      const res = await fetch(bankPath);
      const raw = await res.json();
      fullBank = Array.isArray(raw) ? raw : (raw.questions || []);
    } catch (err) { console.error("Bank load error", err); return; }

    /* NORMALIZE HELPER */
    function normalizeLabel(str) {
      return (str || "")
        .normalize("NFD")
        .replace(/\p{Diacritic}/gu, "")
        .replace(/^l['']\s*/i, "")
        .replace(/^(le|la|les)\s+/i, "")
        .toLowerCase()
        .trim()
        .replace(/\s+/g, " ");
    }

    /* ============================================
       TAB A: PERSONAL TRAPS (existing logic)
       ============================================ */
    let progress = {};
    try {
      progress = JSON.parse(localStorage.getItem("civicedge_progress") || "{}");
    } catch {}

    const trickyKeys = Object.keys(progress)
      .filter(id => (progress[id].wrongs || 0) >= 3 && (progress[id].rights || 0) < 2);

    const normalizedTrickySet = new Set(
      trickyKeys.map(k => {
        const [topic, ...rest] = k.split(":");
        return `${normalizeLabel(topic)}:${rest.join(":").trim()}`;
      })
    );

    const personalTraps = fullBank.filter(q => {
      const topicRaw = q.topic || q.topicLabel || "";
      const qKey = `${normalizeLabel(topicRaw)}:${q.q.trim()}`;
      return normalizedTrickySet.has(qKey);
    });

    /* ============================================
       TAB B: COMMONLY MISSED (from tricky-dk-pr.json)
       ============================================ */
    let commonTraps = [];
    try {
      const res = await fetch("/denmark-pr/banks/tricky-dk-pr.json");
      if (res.ok) {
        const data = await res.json();
        const commonSet = new Set(data.questions || []);
        commonTraps = fullBank.filter(q => commonSet.has(q.q));
      }
    } catch (e) {
      console.warn("[Traps] Could not load tricky-dk-pr.json:", e.message);
    }

    /* UPDATE COUNTS */
    document.getElementById("mineCount").textContent = personalTraps.length;
    document.getElementById("commonCount").textContent = commonTraps.length;

    /* ============================================
       TAB SWITCHING + ENGINE START
       ============================================ */
    const quizArea = document.getElementById("quizArea");
    let activeTab = "mine";

    function startTab(tab) {
      activeTab = tab;

      // Update tab styling
      document.querySelectorAll(".traps-tab").forEach(btn => {
        btn.classList.toggle("active", btn.dataset.tab === tab);
      });

      const bank = tab === "mine" ? personalTraps : commonTraps;

      if (bank.length === 0) {
        const emptyTitle = tab === "mine"
          ? (CivicLearnI18n.t("traps_none_title") || "Ingen f\u00e6lder endnu")
          : "Ingen hyppigt forkerte sp\u00f8rgsm\u00e5l endnu";
        const emptyBody = tab === "mine"
          ? (CivicLearnI18n.t("traps_none_body") || "Du har ikke nok fejl endnu. Bliv ved med at \u00f8ve!")
          : "Ingen data tilg\u00e6ngelig endnu.";

        quizArea.innerHTML = `
          <div class="ce-card">
            <h2>${emptyTitle}</h2>
            <p>${emptyBody}</p>
          </div>`;
        return;
      }

      // Restore quiz container
      quizArea.innerHTML = '<div id="quiz"></div>';

      CivicEdgeEngine.start("traps", {
        bank: bank,
        limit: 20,
        timed: false,
        simulation: false,
        recursive: false,
        showFeedback: true
      });
    }

    // Tab click handlers
    document.getElementById("trapsTabs").addEventListener("click", (e) => {
      const tab = e.target.closest(".traps-tab");
      if (!tab || tab.dataset.tab === activeTab) return;
      startTab(tab.dataset.tab);
    });

    // Start with personal traps
    startTab("mine");
  });
});
