<svg xmlns="http://www.w3.org/2000/svg" width="740" height="520" font-family="Arial, sans-serif">

  <!-- Background -->
  <rect width="740" height="520" fill="#ffffff"/>

  <!-- Title -->
  <text x="370" y="36" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a1a1a">Gennemsnitligt sygefravær pr. ansat pr. år</text>
  <text x="370" y="56" text-anchor="middle" font-size="12" fill="#555555">Fordelt på branche, Danmark 2023 (antal dage)</text>

  <!-- Y axis label -->
  <text x="18" y="230" text-anchor="middle" font-size="12" fill="#333" transform="rotate(-90,18,230)">Dage pr. år</text>

  <!-- Y gridlines -->
  <!-- 0 days y=380 -->
  <line x1="80" y1="380" x2="700" y2="380" stroke="#cccccc" stroke-width="1"/>
  <text x="68" y="384" text-anchor="end" font-size="11" fill="#555">0</text>
  <!-- 4 days y=305 -->
  <line x1="80" y1="305" x2="700" y2="305" stroke="#e0e0e0" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="68" y="309" text-anchor="end" font-size="11" fill="#555">4</text>
  <!-- 8 days y=230 -->
  <line x1="80" y1="230" x2="700" y2="230" stroke="#e0e0e0" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="68" y="234" text-anchor="end" font-size="11" fill="#555">8</text>
  <!-- 12 days y=155 -->
  <line x1="80" y1="155" x2="700" y2="155" stroke="#e0e0e0" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="68" y="159" text-anchor="end" font-size="11" fill="#555">12</text>
  <!-- 16 days y=80 -->
  <line x1="80" y1="80" x2="700" y2="80" stroke="#e0e0e0" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="68" y="84" text-anchor="end" font-size="11" fill="#555">16</text>

  <!-- Axes -->
  <line x1="80" y1="80" x2="80" y2="380" stroke="#333" stroke-width="1.5"/>
  <line x1="80" y1="380" x2="700" y2="380" stroke="#333" stroke-width="1.5"/>

  <!--
    Colors:
    High sygefravær (public/physical): #c0392b (red tones)
    Medium: #e67e22 (orange)
    Low (knowledge work): #2a6496 (blue)
  -->

  <!-- Sundhed og social: bar_x=93.5, bar_y=113.8, h=266.2, cx=117.5 -->
  <rect x="93.5" y="113.8" width="48" height="266.2" fill="#c0392b" rx="2"/>
  <text x="117.5" y="108.8" text-anchor="middle" font-size="10" fill="#c0392b" font-weight="bold">14,2</text>

  <!-- Undervisning: bar_x=168.5, bar_y=196.2, h=183.8, cx=192.5 -->
  <rect x="168.5" y="196.2" width="48" height="183.8" fill="#e67e22" rx="2"/>
  <text x="192.5" y="191.2" text-anchor="middle" font-size="10" fill="#e67e22" font-weight="bold">9,8</text>

  <!-- Offentlig administration: bar_x=243.5, bar_y=168.1, h=211.9, cx=267.5 -->
  <rect x="243.5" y="168.1" width="48" height="211.9" fill="#e67e22" rx="2"/>
  <text x="267.5" y="163.1" text-anchor="middle" font-size="10" fill="#e67e22" font-weight="bold">11,3</text>

  <!-- Transport og logistik: bar_x=318.5, bar_y=181.2, h=198.8, cx=342.5 -->
  <rect x="318.5" y="181.2" width="48" height="198.8" fill="#e67e22" rx="2"/>
  <text x="342.5" y="176.2" text-anchor="middle" font-size="10" fill="#e67e22" font-weight="bold">10,6</text>

  <!-- Industri og produktion: bar_x=393.5, bar_y=209.4, h=170.6, cx=417.5 -->
  <rect x="393.5" y="209.4" width="48" height="170.6" fill="#e67e22" rx="2"/>
  <text x="417.5" y="204.4" text-anchor="middle" font-size="10" fill="#e67e22" font-weight="bold">9,1</text>

  <!-- Handel og detail: bar_x=468.5, bar_y=222.5, h=157.5, cx=492.5 -->
  <rect x="468.5" y="222.5" width="48" height="157.5" fill="#e67e22" rx="2"/>
  <text x="492.5" y="217.5" text-anchor="middle" font-size="10" fill="#e67e22" font-weight="bold">8,4</text>

  <!-- IT og telekommunikation: bar_x=543.5, bar_y=282.5, h=97.5, cx=567.5 -->
  <rect x="543.5" y="282.5" width="48" height="97.5" fill="#2a6496" rx="2"/>
  <text x="567.5" y="277.5" text-anchor="middle" font-size="10" fill="#2a6496" font-weight="bold">5,2</text>

  <!-- Finans og forsikring: bar_x=618.5, bar_y=290.0, h=90.0, cx=642.5 -->
  <rect x="618.5" y="290.0" width="48" height="90.0" fill="#2a6496" rx="2"/>
  <text x="642.5" y="285.0" text-anchor="middle" font-size="10" fill="#2a6496" font-weight="bold">4,8</text>

  <!-- X axis labels (two lines for long names) -->
  <!-- Sundhed og social -->
  <text x="117.5" y="398" text-anchor="middle" font-size="9.5" fill="#222">Sundhed og</text>
  <text x="117.5" y="410" text-anchor="middle" font-size="9.5" fill="#222">social</text>

  <!-- Undervisning -->
  <text x="192.5" y="398" text-anchor="middle" font-size="9.5" fill="#222">Undervisning</text>

  <!-- Offentlig administration -->
  <text x="267.5" y="398" text-anchor="middle" font-size="9.5" fill="#222">Offentlig</text>
  <text x="267.5" y="410" text-anchor="middle" font-size="9.5" fill="#222">administration</text>

  <!-- Transport og logistik -->
  <text x="342.5" y="398" text-anchor="middle" font-size="9.5" fill="#222">Transport og</text>
  <text x="342.5" y="410" text-anchor="middle" font-size="9.5" fill="#222">logistik</text>

  <!-- Industri og produktion -->
  <text x="417.5" y="398" text-anchor="middle" font-size="9.5" fill="#222">Industri og</text>
  <text x="417.5" y="410" text-anchor="middle" font-size="9.5" fill="#222">produktion</text>

  <!-- Handel og detail -->
  <text x="492.5" y="398" text-anchor="middle" font-size="9.5" fill="#222">Handel og</text>
  <text x="492.5" y="410" text-anchor="middle" font-size="9.5" fill="#222">detail</text>

  <!-- IT og telekommunikation -->
  <text x="567.5" y="398" text-anchor="middle" font-size="9.5" fill="#222">IT og</text>
  <text x="567.5" y="410" text-anchor="middle" font-size="9.5" fill="#222">telekommunikation</text>

  <!-- Finans og forsikring -->
  <text x="642.5" y="398" text-anchor="middle" font-size="9.5" fill="#222">Finans og</text>
  <text x="642.5" y="410" text-anchor="middle" font-size="9.5" fill="#222">forsikring</text>

  <!-- Legend -->
  <rect x="90"  y="438" width="14" height="14" fill="#c0392b" rx="2"/>
  <text x="108" y="450" font-size="11" fill="#333">Højt sygefravær</text>
  <rect x="230" y="438" width="14" height="14" fill="#e67e22" rx="2"/>
  <text x="248" y="450" font-size="11" fill="#333">Middel sygefravær</text>
  <rect x="390" y="438" width="14" height="14" fill="#2a6496" rx="2"/>
  <text x="408" y="450" font-size="11" fill="#333">Lavt sygefravær</text>

  <!-- Source -->
  <text x="80" y="500" font-size="10" fill="#888888">Kilde: Danmarks Statistik (fiktive eksempeldata til sproglig øvelse)</text>

</svg>
