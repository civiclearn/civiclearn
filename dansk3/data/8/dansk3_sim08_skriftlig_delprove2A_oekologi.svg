<svg xmlns="http://www.w3.org/2000/svg" width="720" height="470" font-family="Arial, sans-serif">

  <!-- Background -->
  <rect width="720" height="470" fill="#ffffff"/>

  <!-- Title -->
  <text x="360" y="36" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a1a1a">Økologisk markedsandel af det samlede fødevaresalg</text>
  <text x="360" y="56" text-anchor="middle" font-size="12" fill="#555555">Danmark, 2010-2023 (procent)</text>

  <!-- Y axis label -->
  <text x="18" y="230" text-anchor="middle" font-size="12" fill="#333" transform="rotate(-90,18,230)">Markedsandel (%)</text>

  <!-- Gridlines and Y labels -->
  <!-- 0% y=380 -->
  <line x1="80" y1="380" x2="660" y2="380" stroke="#cccccc" stroke-width="1"/>
  <text x="68" y="384" text-anchor="end" font-size="11" fill="#555">0</text>
  <!-- 4% y=305 -->
  <line x1="80" y1="305" x2="660" y2="305" stroke="#e0e0e0" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="68" y="309" text-anchor="end" font-size="11" fill="#555">4</text>
  <!-- 8% y=230 -->
  <line x1="80" y1="230" x2="660" y2="230" stroke="#e0e0e0" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="68" y="234" text-anchor="end" font-size="11" fill="#555">8</text>
  <!-- 12% y=155 -->
  <line x1="80" y1="155" x2="660" y2="155" stroke="#e0e0e0" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="68" y="159" text-anchor="end" font-size="11" fill="#555">12</text>
  <!-- 16% y=80 -->
  <line x1="80" y1="80" x2="660" y2="80" stroke="#e0e0e0" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="68" y="84" text-anchor="end" font-size="11" fill="#555">16</text>

  <!-- Axes -->
  <line x1="80" y1="80" x2="80" y2="380" stroke="#333" stroke-width="1.5"/>
  <line x1="80" y1="380" x2="660" y2="380" stroke="#333" stroke-width="1.5"/>

  <!-- Shaded area under line -->
  <polygon
    points="80,263.8 124.6,252.5 169.2,246.9 213.8,237.5 258.5,222.5 303.1,207.5 347.7,190.6 392.3,164.4 436.9,153.1 481.5,136.2 526.2,111.9 570.8,121.2 615.4,143.8 660.0,134.4 660,380 80,380"
    fill="#2e7d32" opacity="0.12"/>

  <!-- Main line -->
  <polyline
    points="80.0,263.8 124.6,252.5 169.2,246.9 213.8,237.5 258.5,222.5 303.1,207.5 347.7,190.6 392.3,164.4 436.9,153.1 481.5,136.2 526.2,111.9 570.8,121.2 615.4,143.8 660.0,134.4"
    fill="none" stroke="#2e7d32" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- Data point dots -->
  <circle cx="80.0"  cy="263.8" r="3.5" fill="#2e7d32"/>
  <circle cx="124.6" cy="252.5" r="3.5" fill="#2e7d32"/>
  <circle cx="169.2" cy="246.9" r="3.5" fill="#2e7d32"/>
  <circle cx="213.8" cy="237.5" r="3.5" fill="#2e7d32"/>
  <circle cx="258.5" cy="222.5" r="3.5" fill="#2e7d32"/>
  <circle cx="303.1" cy="207.5" r="3.5" fill="#2e7d32"/>
  <circle cx="347.7" cy="190.6" r="3.5" fill="#2e7d32"/>
  <circle cx="392.3" cy="164.4" r="3.5" fill="#2e7d32"/>
  <circle cx="436.9" cy="153.1" r="3.5" fill="#2e7d32"/>
  <circle cx="481.5" cy="136.2" r="3.5" fill="#2e7d32"/>
  <!-- 2020 COVID peak - red highlight -->
  <circle cx="526.2" cy="111.9" r="6" fill="#c0392b"/>
  <circle cx="570.8" cy="121.2" r="3.5" fill="#2e7d32"/>
  <!-- 2022 inflation dip - orange highlight -->
  <circle cx="615.4" cy="143.8" r="6" fill="#e67e22"/>
  <circle cx="660.0" cy="134.4" r="3.5" fill="#2e7d32"/>

  <!-- X-axis labels (every 2 years) -->
  <text x="80.0"  y="398" text-anchor="middle" font-size="10" fill="#555">2010</text>
  <text x="169.2" y="398" text-anchor="middle" font-size="10" fill="#555">2012</text>
  <text x="258.5" y="398" text-anchor="middle" font-size="10" fill="#555">2014</text>
  <text x="347.7" y="398" text-anchor="middle" font-size="10" fill="#555">2016</text>
  <text x="436.9" y="398" text-anchor="middle" font-size="10" fill="#555">2018</text>
  <text x="526.2" y="398" text-anchor="middle" font-size="10" fill="#555">2020</text>
  <text x="615.4" y="398" text-anchor="middle" font-size="10" fill="#555">2022</text>
  <text x="660.0" y="398" text-anchor="middle" font-size="10" fill="#555">2023</text>

  <!-- X axis label -->
  <text x="370" y="418" text-anchor="middle" font-size="12" fill="#333">År</text>

  <!-- Value labels: first and last -->
  <text x="80"  y="257" text-anchor="middle" font-size="10" fill="#2e7d32" font-weight="bold">6,2%</text>
  <text x="660" y="128" text-anchor="middle" font-size="10" fill="#2e7d32" font-weight="bold">13,1%</text>

  <!-- COVID annotation -->
  <line x1="526.2" y1="111.9" x2="548" y2="88" stroke="#c0392b" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="550" y="84" font-size="10" fill="#c0392b" font-weight="bold">COVID-19 (14,3%)</text>

  <!-- Inflation annotation -->
  <line x1="615.4" y1="143.8" x2="624" y2="118" stroke="#e67e22" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="626" y="114" font-size="10" fill="#e67e22" font-weight="bold">Inflation (12,6%)</text>

  <!-- Source -->
  <text x="80" y="450" font-size="10" fill="#888888">Kilde: Danmarks Statistik (fiktive eksempeldata til sproglig øvelse)</text>

</svg>
