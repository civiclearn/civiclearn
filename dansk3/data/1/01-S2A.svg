<svg xmlns="http://www.w3.org/2000/svg" width="720" height="480" font-family="Arial, sans-serif">

  <!-- Background -->
  <rect width="720" height="480" fill="#ffffff"/>

  <!-- Title -->
  <text x="360" y="36" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a1a1a">Andel af danskere der dyrker motion mindst én gang om ugen</text>
  <text x="360" y="56" text-anchor="middle" font-size="12" fill="#555555">Fordelt på aldersgrupper, 2023</text>

  <!-- Y-axis label -->
  <text x="30" y="260" text-anchor="middle" font-size="12" fill="#333" transform="rotate(-90,30,260)">Aldersgruppe</text>

  <!-- X-axis label -->
  <text x="430" y="462" text-anchor="middle" font-size="12" fill="#333">Andel (%)</text>

  <!-- Grid lines and X-axis ticks -->
  <!-- 0% -->
  <line x1="160" y1="80" x2="160" y2="420" stroke="#cccccc" stroke-width="1"/>
  <text x="160" y="438" text-anchor="middle" font-size="11" fill="#555">0</text>
  <!-- 20% -->
  <line x1="248" y1="80" x2="248" y2="420" stroke="#e0e0e0" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="248" y="438" text-anchor="middle" font-size="11" fill="#555">20</text>
  <!-- 40% -->
  <line x1="336" y1="80" x2="336" y2="420" stroke="#e0e0e0" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="336" y="438" text-anchor="middle" font-size="11" fill="#555">40</text>
  <!-- 60% -->
  <line x1="424" y1="80" x2="424" y2="420" stroke="#e0e0e0" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="424" y="438" text-anchor="middle" font-size="11" fill="#555">60</text>
  <!-- 80% -->
  <line x1="512" y1="80" x2="512" y2="420" stroke="#e0e0e0" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="512" y="438" text-anchor="middle" font-size="11" fill="#555">80</text>
  <!-- 100% -->
  <line x1="600" y1="80" x2="600" y2="420" stroke="#e0e0e0" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="600" y="438" text-anchor="middle" font-size="11" fill="#555">100</text>

  <!-- Axis baseline -->
  <line x1="160" y1="420" x2="610" y2="420" stroke="#333333" stroke-width="1.5"/>
  <line x1="160" y1="80" x2="160" y2="420" stroke="#333333" stroke-width="1.5"/>

  <!-- Data:
       16-24: 72%  → width = 72 * 4.4 = 316.8
       25-34: 68%  → 299.2
       35-44: 63%  → 277.2
       45-54: 58%  → 255.2
       55-64: 54%  → 237.6
       65-74: 61%  → 268.4
       75+:   42%  → 184.8
       Scale: 1% = 4.4px, origin x=160
  -->

  <!-- Row height: 46px, first bar top at y=88 -->

  <!-- 16-24 -->
  <text x="152" y="116" text-anchor="end" font-size="12" fill="#222">16-24 år</text>
  <rect x="160" y="95" width="317" height="28" fill="#2a6496" rx="3"/>
  <text x="483" y="114" font-size="11" fill="#2a6496" font-weight="bold">72 %</text>

  <!-- 25-34 -->
  <text x="152" y="162" text-anchor="end" font-size="12" fill="#222">25-34 år</text>
  <rect x="160" y="141" width="299" height="28" fill="#2a6496" rx="3"/>
  <text x="465" y="160" font-size="11" fill="#2a6496" font-weight="bold">68 %</text>

  <!-- 35-44 -->
  <text x="152" y="208" text-anchor="end" font-size="12" fill="#222">35-44 år</text>
  <rect x="160" y="187" width="277" height="28" fill="#2a6496" rx="3"/>
  <text x="443" y="206" font-size="11" fill="#2a6496" font-weight="bold">63 %</text>

  <!-- 45-54 -->
  <text x="152" y="254" text-anchor="end" font-size="12" fill="#222">45-54 år</text>
  <rect x="160" y="233" width="255" height="28" fill="#2a6496" rx="3"/>
  <text x="421" y="252" font-size="11" fill="#2a6496" font-weight="bold">58 %</text>

  <!-- 55-64 -->
  <text x="152" y="300" text-anchor="end" font-size="12" fill="#222">55-64 år</text>
  <rect x="160" y="279" width="238" height="28" fill="#3a7abf" rx="3"/>
  <text x="404" y="298" font-size="11" fill="#3a7abf" font-weight="bold">54 %</text>

  <!-- 65-74 -->
  <text x="152" y="346" text-anchor="end" font-size="12" fill="#222">65-74 år</text>
  <rect x="160" y="325" width="268" height="28" fill="#3a7abf" rx="3"/>
  <text x="434" y="344" font-size="11" fill="#3a7abf" font-weight="bold">61 %</text>

  <!-- 75+ -->
  <text x="152" y="392" text-anchor="end" font-size="12" fill="#222">75+ år</text>
  <rect x="160" y="371" width="185" height="28" fill="#5a9fd4" rx="3"/>
  <text x="351" y="390" font-size="11" fill="#5a9fd4" font-weight="bold">42 %</text>

  <!-- Source -->
  <text x="160" y="472" font-size="10" fill="#888888">Kilde: Danmarks Statistik (fiktive eksempeldata til sproglig øvelse)</text>

</svg>
