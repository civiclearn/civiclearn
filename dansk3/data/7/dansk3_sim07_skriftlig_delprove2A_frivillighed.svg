<svg xmlns="http://www.w3.org/2000/svg" width="720" height="490" font-family="Arial, sans-serif">

  <!-- Background -->
  <rect width="720" height="490" fill="#ffffff"/>

  <!-- Title -->
  <text x="360" y="36" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a1a1a">Andel der udfører frivilligt arbejde mindst én gang om måneden</text>
  <text x="360" y="56" text-anchor="middle" font-size="12" fill="#555555">Fordelt på aldersgrupper, Danmark 2023</text>

  <!-- Y axis label -->
  <text x="22" y="260" text-anchor="middle" font-size="12" fill="#333" transform="rotate(-90,22,260)">Aldersgruppe</text>

  <!-- X axis gridlines and labels -->
  <!-- 0% x=160 -->
  <line x1="160" y1="90" x2="160" y2="430" stroke="#cccccc" stroke-width="1.5"/>
  <text x="160" y="448" text-anchor="middle" font-size="11" fill="#555">0</text>
  <!-- 10% x=240 -->
  <line x1="240" y1="90" x2="240" y2="430" stroke="#e0e0e0" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="240" y="448" text-anchor="middle" font-size="11" fill="#555">10</text>
  <!-- 20% x=320 -->
  <line x1="320" y1="90" x2="320" y2="430" stroke="#e0e0e0" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="320" y="448" text-anchor="middle" font-size="11" fill="#555">20</text>
  <!-- 30% x=400 -->
  <line x1="400" y1="90" x2="400" y2="430" stroke="#e0e0e0" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="400" y="448" text-anchor="middle" font-size="11" fill="#555">30</text>
  <!-- 40% x=480 -->
  <line x1="480" y1="90" x2="480" y2="430" stroke="#e0e0e0" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="480" y="448" text-anchor="middle" font-size="11" fill="#555">40</text>
  <!-- 50% x=560 -->
  <line x1="560" y1="90" x2="560" y2="430" stroke="#e0e0e0" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="560" y="448" text-anchor="middle" font-size="11" fill="#555">50</text>
  <!-- 60% x=640 -->
  <line x1="640" y1="90" x2="640" y2="430" stroke="#e0e0e0" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="640" y="448" text-anchor="middle" font-size="11" fill="#555">60</text>

  <!-- X axis baseline -->
  <line x1="160" y1="430" x2="660" y2="430" stroke="#333" stroke-width="1.5"/>

  <!-- X axis label -->
  <text x="400" y="465" text-anchor="middle" font-size="12" fill="#333">Andel (%)</text>

  <!--
    Colors: two-tone to highlight the interesting dip
    Young dip (16-34): lighter blue #5b9bd5
    Peak (35-74): dark blue #2a6496
    Old dip (75+): lighter blue #5b9bd5
  -->

  <!-- 16-24 år: bar_y=100, w=224, x2=384 -->
  <rect x="160" y="100" width="224" height="28" fill="#5b9bd5" rx="3"/>
  <text x="152" y="120" text-anchor="end" font-size="12" fill="#222">16-24 år</text>
  <text x="390" y="120" font-size="11" fill="#5b9bd5" font-weight="bold">28 %</text>

  <!-- 25-34 år: bar_y=148, w=176, x2=336 -->
  <rect x="160" y="148" width="176" height="28" fill="#5b9bd5" rx="3"/>
  <text x="152" y="168" text-anchor="end" font-size="12" fill="#222">25-34 år</text>
  <text x="342" y="168" font-size="11" fill="#5b9bd5" font-weight="bold">22 %</text>

  <!-- 35-44 år: bar_y=196, w=304, x2=464 -->
  <rect x="160" y="196" width="304" height="28" fill="#2a6496" rx="3"/>
  <text x="152" y="216" text-anchor="end" font-size="12" fill="#222">35-44 år</text>
  <text x="470" y="216" font-size="11" fill="#2a6496" font-weight="bold">38 %</text>

  <!-- 45-54 år: bar_y=244, w=336, x2=496 -->
  <rect x="160" y="244" width="336" height="28" fill="#2a6496" rx="3"/>
  <text x="152" y="264" text-anchor="end" font-size="12" fill="#222">45-54 år</text>
  <text x="502" y="264" font-size="11" fill="#2a6496" font-weight="bold">42 %</text>

  <!-- 55-64 år: bar_y=292, w=360, x2=520 -->
  <rect x="160" y="292" width="360" height="28" fill="#2a6496" rx="3"/>
  <text x="152" y="312" text-anchor="end" font-size="12" fill="#222">55-64 år</text>
  <text x="526" y="312" font-size="11" fill="#2a6496" font-weight="bold">45 %</text>

  <!-- 65-74 år: bar_y=340, w=384, x2=544 -->
  <rect x="160" y="340" width="384" height="28" fill="#2a6496" rx="3"/>
  <text x="152" y="360" text-anchor="end" font-size="12" fill="#222">65-74 år</text>
  <text x="550" y="360" font-size="11" fill="#2a6496" font-weight="bold">48 %</text>

  <!-- 75+ år: bar_y=388, w=248, x2=408 -->
  <rect x="160" y="388" width="248" height="28" fill="#5b9bd5" rx="3"/>
  <text x="152" y="408" text-anchor="end" font-size="12" fill="#222">75+ år</text>
  <text x="414" y="408" font-size="11" fill="#5b9bd5" font-weight="bold">31 %</text>

  <!-- Source -->
  <text x="160" y="478" font-size="10" fill="#888888">Kilde: Danmarks Statistik (fiktive eksempeldata til sproglig øvelse)</text>

</svg>
