<svg xmlns="http://www.w3.org/2000/svg" width="720" height="530" font-family="Arial, sans-serif">

  <!-- Background -->
  <rect width="720" height="530" fill="#ffffff"/>

  <!-- Title -->
  <text x="360" y="36" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a1a1a">Andel der bruger internettet dagligt</text>
  <text x="360" y="56" text-anchor="middle" font-size="12" fill="#555555">Fordelt på aldersgrupper, Danmark 2023</text>

  <!-- Y axis label -->
  <text x="22" y="280" text-anchor="middle" font-size="12" fill="#333" transform="rotate(-90,22,280)">Aldersgruppe</text>

  <!-- X gridlines and labels -->
  <!-- 0% x=160 -->
  <line x1="160" y1="90" x2="160" y2="470" stroke="#cccccc" stroke-width="1.5"/>
  <text x="160" y="488" text-anchor="middle" font-size="11" fill="#555">0</text>
  <!-- 20% x=260 -->
  <line x1="260" y1="90" x2="260" y2="470" stroke="#e0e0e0" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="260" y="488" text-anchor="middle" font-size="11" fill="#555">20</text>
  <!-- 40% x=360 -->
  <line x1="360" y1="90" x2="360" y2="470" stroke="#e0e0e0" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="360" y="488" text-anchor="middle" font-size="11" fill="#555">40</text>
  <!-- 60% x=460 -->
  <line x1="460" y1="90" x2="460" y2="470" stroke="#e0e0e0" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="460" y="488" text-anchor="middle" font-size="11" fill="#555">60</text>
  <!-- 80% x=560 -->
  <line x1="560" y1="90" x2="560" y2="470" stroke="#e0e0e0" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="560" y="488" text-anchor="middle" font-size="11" fill="#555">80</text>
  <!-- 100% x=660 -->
  <line x1="660" y1="90" x2="660" y2="470" stroke="#e0e0e0" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="660" y="488" text-anchor="middle" font-size="11" fill="#555">100</text>

  <!-- Axes -->
  <line x1="160" y1="470" x2="670" y2="470" stroke="#333" stroke-width="1.5"/>
  <line x1="160" y1="90"  x2="160" y2="470" stroke="#333" stroke-width="1.5"/>

  <!-- X axis label -->
  <text x="410" y="505" text-anchor="middle" font-size="12" fill="#333">Andel (%)</text>

  <!--
    Colors: gradient from vibrant blue (young, high) to pale blue-grey (old, low)
    16-24: #1a5276
    25-34: #1f618d
    35-44: #2471a3
    45-54: #2e86c1
    55-64: #5dade2
    65-74: #85c1e9
    75-84: #aed6f1
    85+:   #d6eaf8
  -->

  <!-- 16-24 år: bar_y=99, w=495, label_y=119 -->
  <rect x="160" y="99"  width="495" height="28" fill="#1a5276" rx="3"/>
  <text x="152" y="119" text-anchor="end" font-size="12" fill="#222">16-24 år</text>
  <text x="662" y="119" font-size="11" fill="#1a5276" font-weight="bold">99 %</text>

  <!-- 25-34 år: bar_y=146, w=490 -->
  <rect x="160" y="146" width="490" height="28" fill="#1f618d" rx="3"/>
  <text x="152" y="166" text-anchor="end" font-size="12" fill="#222">25-34 år</text>
  <text x="657" y="166" font-size="11" fill="#1f618d" font-weight="bold">98 %</text>

  <!-- 35-44 år: bar_y=193, w=485 -->
  <rect x="160" y="193" width="485" height="28" fill="#2471a3" rx="3"/>
  <text x="152" y="213" text-anchor="end" font-size="12" fill="#222">35-44 år</text>
  <text x="652" y="213" font-size="11" fill="#2471a3" font-weight="bold">97 %</text>

  <!-- 45-54 år: bar_y=240, w=470 -->
  <rect x="160" y="240" width="470" height="28" fill="#2e86c1" rx="3"/>
  <text x="152" y="260" text-anchor="end" font-size="12" fill="#222">45-54 år</text>
  <text x="637" y="260" font-size="11" fill="#2e86c1" font-weight="bold">94 %</text>

  <!-- 55-64 år: bar_y=287, w=440 -->
  <rect x="160" y="287" width="440" height="28" fill="#5dade2" rx="3"/>
  <text x="152" y="307" text-anchor="end" font-size="12" fill="#222">55-64 år</text>
  <text x="607" y="307" font-size="11" fill="#5dade2" font-weight="bold">88 %</text>

  <!-- 65-74 år: bar_y=334, w=370 -->
  <rect x="160" y="334" width="370" height="28" fill="#85c1e9" rx="3"/>
  <text x="152" y="354" text-anchor="end" font-size="12" fill="#222">65-74 år</text>
  <text x="537" y="354" font-size="11" fill="#555" font-weight="bold">74 %</text>

  <!-- 75-84 år: bar_y=381, w=260 -->
  <rect x="160" y="381" width="260" height="28" fill="#aed6f1" rx="3"/>
  <text x="152" y="401" text-anchor="end" font-size="12" fill="#222">75-84 år</text>
  <text x="427" y="401" font-size="11" fill="#555" font-weight="bold">52 %</text>

  <!-- 85+ år: bar_y=428, w=120 -->
  <rect x="160" y="428" width="120" height="28" fill="#d6eaf8" rx="3"/>
  <text x="152" y="448" text-anchor="end" font-size="12" fill="#222">85+ år</text>
  <text x="287" y="448" font-size="11" fill="#555" font-weight="bold">24 %</text>

  <!-- Annotation: the 65-74 threshold -->
  <line x1="530" y1="334" x2="530" y2="360" stroke="#c0392b" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="534" y="330" font-size="9.5" fill="#c0392b">Under 3 ud af 4</text>

  <!-- Annotation: 85+ stark drop -->
  <text x="290" y="446" font-size="0" fill="none"/>

  <!-- Source -->
  <text x="160" y="518" font-size="10" fill="#888888">Kilde: Danmarks Statistik (fiktive eksempeldata til sproglig øvelse)</text>

</svg>
