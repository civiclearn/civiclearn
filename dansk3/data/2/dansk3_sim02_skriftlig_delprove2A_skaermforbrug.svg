<svg xmlns="http://www.w3.org/2000/svg" width="720" height="480" font-family="Arial, sans-serif">

  <!-- Background -->
  <rect width="720" height="480" fill="#ffffff"/>

  <!-- Title -->
  <text x="360" y="36" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a1a1a">Unges daglige skærmforbrug (ekskl. arbejde/skole)</text>
  <text x="360" y="56" text-anchor="middle" font-size="12" fill="#555555">Gennemsnitligt antal timer pr. dag, 15-29-årige, 2010-2023</text>

  <!-- Margins: left=80, right=40, top=80, bottom=80 -->
  <!-- X range: 2010-2023 = 14 years, width=600, step=600/13=46.15px per year -->
  <!-- Y range: 0-8 hours, height=300 (y=80 to y=380), step=300/8=37.5px per hour -->

  <!-- Grid lines horizontal -->
  <!-- y=8: y=80 -->
  <line x1="80" y1="80"  x2="680" y2="80"  stroke="#e0e0e0" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="68" y="84"  text-anchor="end" font-size="11" fill="#555">8</text>
  <!-- y=6: y=155 -->
  <line x1="80" y1="155" x2="680" y2="155" stroke="#e0e0e0" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="68" y="159" text-anchor="end" font-size="11" fill="#555">6</text>
  <!-- y=4: y=230 -->
  <line x1="80" y1="230" x2="680" y2="230" stroke="#e0e0e0" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="68" y="234" text-anchor="end" font-size="11" fill="#555">4</text>
  <!-- y=2: y=305 -->
  <line x1="80" y1="305" x2="680" y2="305" stroke="#e0e0e0" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="68" y="309" text-anchor="end" font-size="11" fill="#555">2</text>
  <!-- y=0: y=380 -->
  <line x1="80" y1="380" x2="680" y2="380" stroke="#cccccc" stroke-width="1"/>
  <text x="68" y="384" text-anchor="end" font-size="11" fill="#555">0</text>

  <!-- Y axis label -->
  <text x="20" y="230" text-anchor="middle" font-size="12" fill="#333" transform="rotate(-90,20,230)">Timer pr. dag</text>

  <!-- Axes -->
  <line x1="80" y1="80" x2="80" y2="380" stroke="#333333" stroke-width="1.5"/>
  <line x1="80" y1="380" x2="680" y2="380" stroke="#333333" stroke-width="1.5"/>

  <!--
    Data points (year, hours):
    2010: 2.1  → x=80,            y=380-(2.1/8*300)=380-78.75=301
    2011: 2.4  → x=80+46=126,     y=380-90=290
    2012: 2.8  → x=80+92=172,     y=380-105=275
    2013: 3.2  → x=80+138=218,    y=380-120=260
    2014: 3.6  → x=80+184=264,    y=380-135=245
    2015: 4.1  → x=80+230=310,    y=380-153.75=226
    2016: 4.5  → x=80+276=356,    y=380-168.75=211
    2017: 4.9  → x=80+323=403,    y=380-183.75=196
    2018: 5.4  → x=80+369=449,    y=380-202.5=178
    2019: 5.8  → x=80+415=495,    y=380-217.5=163
    2020: 7.1  → x=80+461=541,    y=380-266.25=114  (COVID spike)
    2021: 6.8  → x=80+507=587,    y=380-255=125
    2022: 6.3  → x=80+553=633,    y=380-236.25=144
    2023: 6.6  → x=80+600=680,    y=380-247.5=133
    Step per year = 600/13 ≈ 46.15
  -->

  <!-- Line path -->
  <polyline
    points="80,301 126,290 172,275 218,260 264,245 310,226 356,211 403,196 449,178 495,163 541,114 587,125 633,144 680,133"
    fill="none" stroke="#2a6496" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- Data point dots -->
  <circle cx="80"  cy="301" r="4" fill="#2a6496"/>
  <circle cx="126" cy="290" r="4" fill="#2a6496"/>
  <circle cx="172" cy="275" r="4" fill="#2a6496"/>
  <circle cx="218" cy="260" r="4" fill="#2a6496"/>
  <circle cx="264" cy="245" r="4" fill="#2a6496"/>
  <circle cx="310" cy="226" r="4" fill="#2a6496"/>
  <circle cx="356" cy="211" r="4" fill="#2a6496"/>
  <circle cx="403" cy="196" r="4" fill="#2a6496"/>
  <circle cx="449" cy="178" r="4" fill="#2a6496"/>
  <circle cx="495" cy="163" r="4" fill="#2a6496"/>
  <!-- COVID spike 2020 - highlighted -->
  <circle cx="541" cy="114" r="6" fill="#c0392b"/>
  <circle cx="587" cy="125" r="4" fill="#2a6496"/>
  <circle cx="633" cy="144" r="4" fill="#2a6496"/>
  <circle cx="680" cy="133" r="4" fill="#2a6496"/>

  <!-- X axis labels -->
  <text x="80"  y="398" text-anchor="middle" font-size="10" fill="#555">2010</text>
  <text x="172" y="398" text-anchor="middle" font-size="10" fill="#555">2012</text>
  <text x="264" y="398" text-anchor="middle" font-size="10" fill="#555">2014</text>
  <text x="356" y="398" text-anchor="middle" font-size="10" fill="#555">2016</text>
  <text x="449" y="398" text-anchor="middle" font-size="10" fill="#555">2018</text>
  <text x="541" y="398" text-anchor="middle" font-size="10" fill="#555">2020</text>
  <text x="633" y="398" text-anchor="middle" font-size="10" fill="#555">2022</text>
  <text x="680" y="398" text-anchor="middle" font-size="10" fill="#555">2023</text>

  <!-- X axis label -->
  <text x="380" y="425" text-anchor="middle" font-size="12" fill="#333">År</text>

  <!-- COVID annotation -->
  <line x1="541" y1="114" x2="570" y2="90" stroke="#c0392b" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="572" y="86" font-size="10" fill="#c0392b" font-weight="bold">COVID-19</text>
  <text x="572" y="98" font-size="10" fill="#c0392b">(7,1 t/dag)</text>

  <!-- Value labels for first and last -->
  <text x="80"  cy="301" font-size="10" fill="#2a6496" dy="-8" dx="-4" text-anchor="middle">2,1</text>
  <text x="680" cy="133" font-size="10" fill="#2a6496" dy="-8" dx="4"  text-anchor="middle">6,6</text>

  <!-- Source -->
  <text x="80" y="460" font-size="10" fill="#888888">Kilde: Danmarks Statistik (fiktive eksempeldata til sproglig øvelse)</text>

</svg>
