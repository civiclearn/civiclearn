<svg xmlns="http://www.w3.org/2000/svg" width="720" height="480" font-family="Arial, sans-serif">

  <!-- Background -->
  <rect width="720" height="480" fill="#ffffff"/>

  <!-- Title -->
  <text x="360" y="36" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a1a1a">Arbejdsløshed fordelt på køn og aldersgruppe</text>
  <text x="360" y="56" text-anchor="middle" font-size="12" fill="#555555">Andel af arbejdsstyrken i procent, Danmark 2023</text>

  <!-- Y axis label -->
  <text x="18" y="230" text-anchor="middle" font-size="12" fill="#333" transform="rotate(-90,18,230)">Andel (%)</text>

  <!-- Gridlines and Y-axis labels -->
  <!-- 0% y=380 -->
  <line x1="80" y1="380" x2="680" y2="380" stroke="#cccccc" stroke-width="1"/>
  <text x="68" y="384" text-anchor="end" font-size="11" fill="#555">0</text>
  <!-- 2% y=337.1 -->
  <line x1="80" y1="337" x2="680" y2="337" stroke="#e0e0e0" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="68" y="341" text-anchor="end" font-size="11" fill="#555">2</text>
  <!-- 4% y=294.3 -->
  <line x1="80" y1="294" x2="680" y2="294" stroke="#e0e0e0" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="68" y="298" text-anchor="end" font-size="11" fill="#555">4</text>
  <!-- 6% y=251.4 -->
  <line x1="80" y1="251" x2="680" y2="251" stroke="#e0e0e0" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="68" y="255" text-anchor="end" font-size="11" fill="#555">6</text>
  <!-- 8% y=208.6 -->
  <line x1="80" y1="209" x2="680" y2="209" stroke="#e0e0e0" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="68" y="213" text-anchor="end" font-size="11" fill="#555">8</text>
  <!-- 10% y=165.7 -->
  <line x1="80" y1="166" x2="680" y2="166" stroke="#e0e0e0" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="68" y="170" text-anchor="end" font-size="11" fill="#555">10</text>
  <!-- 12% y=122.9 -->
  <line x1="80" y1="123" x2="680" y2="123" stroke="#e0e0e0" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="68" y="127" text-anchor="end" font-size="11" fill="#555">12</text>
  <!-- 14% y=80 -->
  <line x1="80" y1="80" x2="680" y2="80" stroke="#e0e0e0" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="68" y="84" text-anchor="end" font-size="11" fill="#555">14</text>

  <!-- Axes -->
  <line x1="80" y1="80" x2="80" y2="380" stroke="#333" stroke-width="1.5"/>
  <line x1="80" y1="380" x2="680" y2="380" stroke="#333" stroke-width="1.5"/>

  <!-- Colors: Mænd=#2a6496 (blue), Kvinder=#c0392b (red) -->

  <!-- GROUP 16-24 (group start x=80) -->
  <!-- Mænd 11.2%: x=96, y=140, h=240, w=40 -->
  <rect x="96"  y="140" width="40" height="240" fill="#2a6496" rx="2"/>
  <text x="116" y="136" text-anchor="middle" font-size="10" fill="#2a6496" font-weight="bold">11,2</text>
  <!-- Kvinder 9.8%: x=144, y=170, h=210, w=40 -->
  <rect x="144" y="170" width="40" height="210" fill="#c0392b" rx="2"/>
  <text x="164" y="166" text-anchor="middle" font-size="10" fill="#c0392b" font-weight="bold">9,8</text>
  <!-- Group label -->
  <text x="140" y="400" text-anchor="middle" font-size="11" fill="#222">16-24 år</text>

  <!-- GROUP 25-34 (group start x=200) -->
  <!-- Mænd 5.4%: x=216, y=264, h=116 -->
  <rect x="216" y="264" width="40" height="116" fill="#2a6496" rx="2"/>
  <text x="236" y="260" text-anchor="middle" font-size="10" fill="#2a6496" font-weight="bold">5,4</text>
  <!-- Kvinder 5.9%: x=264, y=254, h=126 -->
  <rect x="264" y="254" width="40" height="126" fill="#c0392b" rx="2"/>
  <text x="284" y="250" text-anchor="middle" font-size="10" fill="#c0392b" font-weight="bold">5,9</text>
  <text x="260" y="400" text-anchor="middle" font-size="11" fill="#222">25-34 år</text>

  <!-- GROUP 35-44 (group start x=320) -->
  <!-- Mænd 3.8%: x=336, y=299, h=81 -->
  <rect x="336" y="299" width="40" height="81" fill="#2a6496" rx="2"/>
  <text x="356" y="295" text-anchor="middle" font-size="10" fill="#2a6496" font-weight="bold">3,8</text>
  <!-- Kvinder 4.2%: x=384, y=290, h=90 -->
  <rect x="384" y="290" width="40" height="90" fill="#c0392b" rx="2"/>
  <text x="404" y="286" text-anchor="middle" font-size="10" fill="#c0392b" font-weight="bold">4,2</text>
  <text x="380" y="400" text-anchor="middle" font-size="11" fill="#222">35-44 år</text>

  <!-- GROUP 45-54 (group start x=440) -->
  <!-- Mænd 3.1%: x=456, y=314, h=66 -->
  <rect x="456" y="314" width="40" height="66" fill="#2a6496" rx="2"/>
  <text x="476" y="310" text-anchor="middle" font-size="10" fill="#2a6496" font-weight="bold">3,1</text>
  <!-- Kvinder 3.6%: x=504, y=303, h=77 -->
  <rect x="504" y="303" width="40" height="77" fill="#c0392b" rx="2"/>
  <text x="524" y="299" text-anchor="middle" font-size="10" fill="#c0392b" font-weight="bold">3,6</text>
  <text x="500" y="400" text-anchor="middle" font-size="11" fill="#222">45-54 år</text>

  <!-- GROUP 55-64 (group start x=560) -->
  <!-- Mænd 4.2%: x=576, y=290, h=90 -->
  <rect x="576" y="290" width="40" height="90" fill="#2a6496" rx="2"/>
  <text x="596" y="286" text-anchor="middle" font-size="10" fill="#2a6496" font-weight="bold">4,2</text>
  <!-- Kvinder 3.9%: x=624, y=296, h=84 -->
  <rect x="624" y="296" width="40" height="84" fill="#c0392b" rx="2"/>
  <text x="644" y="292" text-anchor="middle" font-size="10" fill="#c0392b" font-weight="bold">3,9</text>
  <text x="620" y="400" text-anchor="middle" font-size="11" fill="#222">55-64 år</text>

  <!-- X axis label -->
  <text x="380" y="420" text-anchor="middle" font-size="12" fill="#333">Aldersgruppe</text>

  <!-- Legend -->
  <rect x="200" y="442" width="16" height="14" fill="#2a6496" rx="2"/>
  <text x="220" y="454" font-size="12" fill="#333">Mænd</text>
  <rect x="300" y="442" width="16" height="14" fill="#c0392b" rx="2"/>
  <text x="320" y="454" font-size="12" fill="#333">Kvinder</text>

  <!-- Source -->
  <text x="80" y="472" font-size="10" fill="#888888">Kilde: Danmarks Statistik (fiktive eksempeldata til sproglig øvelse)</text>

</svg>
