<svg xmlns="http://www.w3.org/2000/svg" width="720" height="500" font-family="Arial, sans-serif">

  <!-- Background -->
  <rect width="720" height="500" fill="#ffffff"/>

  <!-- Title -->
  <text x="360" y="36" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a1a1a">Håndtering af husholdningsaffald i udvalgte kommuner</text>
  <text x="360" y="56" text-anchor="middle" font-size="12" fill="#555555">Fordeling i procent, 2023</text>

  <!--
    Chart area: left=180, right=660, top=80, bottom=400
    Width=480, Height=320
    5 kommuner, bar width=60, gap=36
    Stacked: Genanvendt / Forbrændt / Deponeret / Andet

    Data (all sum to 100):
    København:   Genanvendt=42, Forbrændt=48, Deponeret=6,  Andet=4
    Aarhus:      Genanvendt=38, Forbrændt=50, Deponeret=8,  Andet=4
    Odense:      Genanvendt=35, Forbrændt=52, Deponeret=9,  Andet=4
    Aalborg:     Genanvendt=33, Forbrændt=54, Deponeret=9,  Andet=4
    Esbjerg:     Genanvendt=29, Forbrændt=55, Deponeret=11, Andet=5

    Scale: 1% = 3.2px (320px / 100%)
    Bar x positions (center): 216, 312, 408, 504, 600
    Bar width: 64px, so left edge = center - 32
  -->

  <!-- Grid lines -->
  <line x1="180" y1="80"  x2="660" y2="80"  stroke="#e0e0e0" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="168" y="84"  text-anchor="end" font-size="11" fill="#555">100</text>
  <line x1="180" y1="160" x2="660" y2="160" stroke="#e0e0e0" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="168" y="164" text-anchor="end" font-size="11" fill="#555">75</text>
  <line x1="180" y1="240" x2="660" y2="240" stroke="#e0e0e0" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="168" y="244" text-anchor="end" font-size="11" fill="#555">50</text>
  <line x1="180" y1="320" x2="660" y2="320" stroke="#e0e0e0" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="168" y="324" text-anchor="end" font-size="11" fill="#555">25</text>
  <line x1="180" y1="400" x2="660" y2="400" stroke="#cccccc" stroke-width="1"/>
  <text x="168" y="404" text-anchor="end" font-size="11" fill="#555">0</text>

  <!-- Y axis label -->
  <text x="20" y="240" text-anchor="middle" font-size="12" fill="#333" transform="rotate(-90,20,240)">Andel (%)</text>

  <!-- Axes -->
  <line x1="180" y1="80"  x2="180" y2="400" stroke="#333" stroke-width="1.5"/>
  <line x1="180" y1="400" x2="660" y2="400" stroke="#333" stroke-width="1.5"/>

  <!-- Colors:
       Genanvendt: #2e7d32 (dark green)
       Forbrændt:  #e65100 (orange)
       Deponeret:  #5c6bc0 (blue-purple)
       Andet:      #90a4ae (grey)
  -->

  <!-- KØBENHAVN (center x=216, left=184) -->
  <!-- Genanvendt 42% → height=134.4, bottom y=400, top y=265.6 -->
  <rect x="184" y="265" width="64" height="135" fill="#2e7d32"/>
  <!-- Forbrændt 48% → height=153.6, top y=265-154=111 -->
  <rect x="184" y="111" width="64" height="154" fill="#e65100"/>
  <!-- Deponeret 6% → height=19.2, top y=111-19=92 -->
  <rect x="184" y="92" width="64" height="19" fill="#5c6bc0"/>
  <!-- Andet 4% → height=12.8, top y=92-13=79 -->
  <rect x="184" y="80" width="64" height="12" fill="#90a4ae"/>
  <!-- Label -->
  <text x="216" y="418" text-anchor="middle" font-size="11" fill="#222">København</text>
  <!-- Value label genanvendt -->
  <text x="216" y="336" text-anchor="middle" font-size="10" fill="white" font-weight="bold">42%</text>
  <text x="216" y="192" text-anchor="middle" font-size="10" fill="white" font-weight="bold">48%</text>

  <!-- AARHUS (center x=312, left=280) -->
  <!-- Genanvendt 38% → height=121.6 → top=278.4 -->
  <rect x="280" y="278" width="64" height="122" fill="#2e7d32"/>
  <!-- Forbrændt 50% → height=160 → top=278-160=118 -->
  <rect x="280" y="118" width="64" height="160" fill="#e65100"/>
  <!-- Deponeret 8% → height=25.6 → top=118-26=92 -->
  <rect x="280" y="92" width="64" height="26" fill="#5c6bc0"/>
  <!-- Andet 4% → height=12.8 → top=92-13=79 -->
  <rect x="280" y="80" width="64" height="12" fill="#90a4ae"/>
  <text x="312" y="418" text-anchor="middle" font-size="11" fill="#222">Aarhus</text>
  <text x="312" y="342" text-anchor="middle" font-size="10" fill="white" font-weight="bold">38%</text>
  <text x="312" y="200" text-anchor="middle" font-size="10" fill="white" font-weight="bold">50%</text>

  <!-- ODENSE (center x=408, left=376) -->
  <!-- Genanvendt 35% → height=112 → top=288 -->
  <rect x="376" y="288" width="64" height="112" fill="#2e7d32"/>
  <!-- Forbrændt 52% → height=166.4 → top=288-166=122 -->
  <rect x="376" y="122" width="64" height="166" fill="#e65100"/>
  <!-- Deponeret 9% → height=28.8 → top=122-29=93 -->
  <rect x="376" y="93" width="64" height="29" fill="#5c6bc0"/>
  <!-- Andet 4% → height=12.8 → top=93-13=80 -->
  <rect x="376" y="80" width="64" height="13" fill="#90a4ae"/>
  <text x="408" y="418" text-anchor="middle" font-size="11" fill="#222">Odense</text>
  <text x="408" y="348" text-anchor="middle" font-size="10" fill="white" font-weight="bold">35%</text>
  <text x="408" y="208" text-anchor="middle" font-size="10" fill="white" font-weight="bold">52%</text>

  <!-- AALBORG (center x=504, left=472) -->
  <!-- Genanvendt 33% → height=105.6 → top=294.4 -->
  <rect x="472" y="294" width="64" height="106" fill="#2e7d32"/>
  <!-- Forbrændt 54% → height=172.8 → top=294-173=121 -->
  <rect x="472" y="121" width="64" height="173" fill="#e65100"/>
  <!-- Deponeret 9% → height=28.8 → top=121-29=92 -->
  <rect x="472" y="92" width="64" height="29" fill="#5c6bc0"/>
  <!-- Andet 4% → height=12.8 → top=92-13=79 -->
  <rect x="472" y="80" width="64" height="12" fill="#90a4ae"/>
  <text x="504" y="418" text-anchor="middle" font-size="11" fill="#222">Aalborg</text>
  <text x="504" y="350" text-anchor="middle" font-size="10" fill="white" font-weight="bold">33%</text>
  <text x="504" y="210" text-anchor="middle" font-size="10" fill="white" font-weight="bold">54%</text>

  <!-- ESBJERG (center x=600, left=568) -->
  <!-- Genanvendt 29% → height=92.8 → top=307.2 -->
  <rect x="568" y="307" width="64" height="93" fill="#2e7d32"/>
  <!-- Forbrændt 55% → height=176 → top=307-176=131 -->
  <rect x="568" y="131" width="64" height="176" fill="#e65100"/>
  <!-- Deponeret 11% → height=35.2 → top=131-35=96 -->
  <rect x="568" y="96" width="64" height="35" fill="#5c6bc0"/>
  <!-- Andet 5% → height=16 → top=96-16=80 -->
  <rect x="568" y="80" width="64" height="16" fill="#90a4ae"/>
  <text x="600" y="418" text-anchor="middle" font-size="11" fill="#222">Esbjerg</text>
  <text x="600" y="357" text-anchor="middle" font-size="10" fill="white" font-weight="bold">29%</text>
  <text x="600" y="222" text-anchor="middle" font-size="10" fill="white" font-weight="bold">55%</text>

  <!-- Legend -->
  <rect x="185" y="435" width="14" height="14" fill="#2e7d32"/>
  <text x="203" y="447" font-size="11" fill="#333">Genanvendt</text>
  <rect x="295" y="435" width="14" height="14" fill="#e65100"/>
  <text x="313" y="447" font-size="11" fill="#333">Forbrændt</text>
  <rect x="393" y="435" width="14" height="14" fill="#5c6bc0"/>
  <text x="411" y="447" font-size="11" fill="#333">Deponeret</text>
  <rect x="487" y="435" width="14" height="14" fill="#90a4ae"/>
  <text x="505" y="447" font-size="11" fill="#333">Andet</text>

  <!-- Source -->
  <text x="180" y="478" font-size="10" fill="#888888">Kilde: Danmarks Statistik (fiktive eksempeldata til sproglig øvelse)</text>

</svg>
