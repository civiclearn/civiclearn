<svg xmlns="http://www.w3.org/2000/svg" width="720" height="500" font-family="Arial, sans-serif">

  <!-- Background -->
  <rect width="720" height="500" fill="#ffffff"/>

  <!-- Title -->
  <text x="360" y="36" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a1a1a">Danskernes primære transportmiddel på hverdage</text>
  <text x="360" y="56" text-anchor="middle" font-size="12" fill="#555555">Andel af alle rejser, Danmark 2023</text>

  <!--
    cx=230, cy=270, r=165
    All large-arc-flag=0, sweep=1

    Bil 42%:               (230,105)   -> (309.5,414.6)  label=(333.9,243.3)
    Cykel 26%:             (309.5,414.6) -> (80.7,340.3) label=(196.9,372.0)
    Gang 15%:              (80.7,340.3)  -> (85.4,190.5) label=(122.8,266.6)
    Offentlig transport 13%:(85.4,190.5) -> (189.0,110.2)label=(164.3,185.3)
    Andet 4%:              (189.0,110.2) -> (230.0,105.0) label=(216.6,163.6)
  -->

  <!-- Segment 1: Bil 42% -->
  <path d="M230,270 L230,105 A165,165 0 0,1 309.5,414.6 Z" fill="#e65100"/>
  <!-- Segment 2: Cykel 26% -->
  <path d="M230,270 L309.5,414.6 A165,165 0 0,1 80.7,340.3 Z" fill="#2e7d32"/>
  <!-- Segment 3: Gang 15% -->
  <path d="M230,270 L80.7,340.3 A165,165 0 0,1 85.4,190.5 Z" fill="#fdd835"/>
  <!-- Segment 4: Offentlig transport 13% -->
  <path d="M230,270 L85.4,190.5 A165,165 0 0,1 189.0,110.2 Z" fill="#1e88e5"/>
  <!-- Segment 5: Andet 4% -->
  <path d="M230,270 L189.0,110.2 A165,165 0 0,1 230.0,105.0 Z" fill="#90a4ae"/>

  <!-- White borders -->
  <path d="M230,270 L230,105 A165,165 0 0,1 309.5,414.6 Z" fill="none" stroke="white" stroke-width="2"/>
  <path d="M230,270 L309.5,414.6 A165,165 0 0,1 80.7,340.3 Z" fill="none" stroke="white" stroke-width="2"/>
  <path d="M230,270 L80.7,340.3 A165,165 0 0,1 85.4,190.5 Z" fill="none" stroke="white" stroke-width="2"/>
  <path d="M230,270 L85.4,190.5 A165,165 0 0,1 189.0,110.2 Z" fill="none" stroke="white" stroke-width="2"/>
  <path d="M230,270 L189.0,110.2 A165,165 0 0,1 230.0,105.0 Z" fill="none" stroke="white" stroke-width="2"/>

  <!-- Percentage labels -->
  <!-- Bil: (333.9, 243.3) -->
  <text x="334" y="247" text-anchor="middle" font-size="13" font-weight="bold" fill="white">42%</text>
  <!-- Cykel: (196.9, 372.0) -->
  <text x="197" y="376" text-anchor="middle" font-size="12" font-weight="bold" fill="white">26%</text>
  <!-- Gang: (122.8, 266.6) -->
  <text x="123" y="271" text-anchor="middle" font-size="11" font-weight="bold" fill="#555">15%</text>
  <!-- Offentlig transport: (164.3, 185.3) -->
  <text x="164" y="189" text-anchor="middle" font-size="11" font-weight="bold" fill="white">13%</text>
  <!-- Andet: (216.6, 163.6) -->
  <text x="217" y="158" text-anchor="middle" font-size="10" font-weight="bold" fill="#555">4%</text>

  <!-- Legend -->
  <text x="445" y="115" font-size="13" font-weight="bold" fill="#333">Transportmiddel</text>

  <rect x="445" y="130" width="16" height="16" fill="#e65100" rx="2"/>
  <text x="467" y="144" font-size="12" fill="#333">Bil – fører eller passager (42%)</text>

  <rect x="445" y="158" width="16" height="16" fill="#2e7d32" rx="2"/>
  <text x="467" y="172" font-size="12" fill="#333">Cykel (26%)</text>

  <rect x="445" y="186" width="16" height="16" fill="#fdd835" rx="2"/>
  <text x="467" y="200" font-size="12" fill="#333">Gang (15%)</text>

  <rect x="445" y="214" width="16" height="16" fill="#1e88e5" rx="2"/>
  <text x="467" y="228" font-size="12" fill="#333">Offentlig transport (13%)</text>

  <rect x="445" y="242" width="16" height="16" fill="#90a4ae" rx="2"/>
  <text x="467" y="256" font-size="12" fill="#333">Andet (4%)</text>

  <!-- Callout note -->
  <text x="445" y="300" font-size="11" fill="#555" font-style="italic">Danmark har en af verdens højeste</text>
  <text x="445" y="316" font-size="11" fill="#555" font-style="italic">cykelrater sammenlignet med</text>
  <text x="445" y="332" font-size="11" fill="#555" font-style="italic">andre europæiske lande.</text>

  <!-- Source -->
  <text x="40" y="478" font-size="10" fill="#888888">Kilde: Danmarks Statistik (fiktive eksempeldata til sproglig øvelse)</text>

