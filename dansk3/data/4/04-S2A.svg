<svg xmlns="http://www.w3.org/2000/svg" width="720" height="500" font-family="Arial, sans-serif">

  <!-- Background -->
  <rect width="720" height="500" fill="#ffffff"/>

  <!-- Title -->
  <text x="360" y="36" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a1a1a">Befolkningens højest fuldførte uddannelse</text>
  <text x="360" y="56" text-anchor="middle" font-size="12" fill="#555555">25-64-årige i Danmark, 2023</text>

  <!--
    cx=240, cy=270, r=170
    All large-arc-flag=0 (no segment exceeds 180°), sweep-flag=1

    Grundskole 18%:              (240,100)   -> (393.8,197.6)
    Erhvervsuddannelse 34%:      (393.8,197.6) -> (218.7,438.7)
    Gymnasial 10%:               (218.7,438.7) -> (123.6,393.9)
    Kort videregående 8%:        (123.6,393.9) -> (78.3,322.5)
    Mellemlang videregående 19%: (78.3,322.5)  -> (131.6,139.0)
    Lang videregående 11%:       (131.6,139.0) -> (240.0,100.0)
  -->

  <!-- Segment 1: Grundskole 18% -->
  <path d="M240,270 L240,100 A170,170 0 0,1 393.8,197.6 Z" fill="#90a4ae"/>
  <!-- Segment 2: Erhvervsuddannelse 34% -->
  <path d="M240,270 L393.8,197.6 A170,170 0 0,1 218.7,438.7 Z" fill="#e65100"/>
  <!-- Segment 3: Gymnasial uddannelse 10% -->
  <path d="M240,270 L218.7,438.7 A170,170 0 0,1 123.6,393.9 Z" fill="#fdd835"/>
  <!-- Segment 4: Kort videregående 8% -->
  <path d="M240,270 L123.6,393.9 A170,170 0 0,1 78.3,322.5 Z" fill="#43a047"/>
  <!-- Segment 5: Mellemlang videregående 19% -->
  <path d="M240,270 L78.3,322.5 A170,170 0 0,1 131.6,139.0 Z" fill="#1e88e5"/>
  <!-- Segment 6: Lang videregående 11% -->
  <path d="M240,270 L131.6,139.0 A170,170 0 0,1 240.0,100.0 Z" fill="#6a1b9a"/>

  <!-- White borders -->
  <path d="M240,270 L240,100 A170,170 0 0,1 393.8,197.6 Z" fill="none" stroke="white" stroke-width="2"/>
  <path d="M240,270 L393.8,197.6 A170,170 0 0,1 218.7,438.7 Z" fill="none" stroke="white" stroke-width="2"/>
  <path d="M240,270 L218.7,438.7 A170,170 0 0,1 123.6,393.9 Z" fill="none" stroke="white" stroke-width="2"/>
  <path d="M240,270 L123.6,393.9 A170,170 0 0,1 78.3,322.5 Z" fill="none" stroke="white" stroke-width="2"/>
  <path d="M240,270 L78.3,322.5 A170,170 0 0,1 131.6,139.0 Z" fill="none" stroke="white" stroke-width="2"/>
  <path d="M240,270 L131.6,139.0 A170,170 0 0,1 240.0,100.0 Z" fill="none" stroke="white" stroke-width="2"/>

  <!-- Labels at r*0.65 from center -->
  <text x="299" y="181" text-anchor="middle" font-size="12" font-weight="bold" fill="white">18%</text>
  <text x="329" y="339" text-anchor="middle" font-size="13" font-weight="bold" fill="white">34%</text>
  <text x="181" y="426" text-anchor="middle" font-size="11" font-weight="bold" fill="#555">10%</text>
  <text x="108" y="360" text-anchor="middle" font-size="11" font-weight="bold" fill="white">8%</text>
  <text x="134" y="243" text-anchor="middle" font-size="12" font-weight="bold" fill="white">19%</text>
  <text x="185" y="162" text-anchor="middle" font-size="11" font-weight="bold" fill="white">11%</text>

  <!-- Legend -->
  <text x="450" y="115" font-size="13" font-weight="bold" fill="#333">Uddannelseskategori</text>
  <rect x="450" y="130" width="16" height="16" fill="#90a4ae" rx="2"/>
  <text x="472" y="144" font-size="12" fill="#333">Grundskole (18%)</text>
  <rect x="450" y="158" width="16" height="16" fill="#e65100" rx="2"/>
  <text x="472" y="172" font-size="12" fill="#333">Erhvervsuddannelse (34%)</text>
  <rect x="450" y="186" width="16" height="16" fill="#fdd835" rx="2"/>
  <text x="472" y="200" font-size="12" fill="#333">Gymnasial uddannelse (10%)</text>
  <rect x="450" y="214" width="16" height="16" fill="#43a047" rx="2"/>
  <text x="472" y="228" font-size="12" fill="#333">Kort videregående (8%)</text>
  <rect x="450" y="242" width="16" height="16" fill="#1e88e5" rx="2"/>
  <text x="472" y="256" font-size="12" fill="#333">Mellemlang videregående (19%)</text>
  <rect x="450" y="270" width="16" height="16" fill="#6a1b9a" rx="2"/>
  <text x="472" y="284" font-size="12" fill="#333">Lang videregående (11%)</text>

  <text x="450" y="320" font-size="10" fill="#777" font-style="italic">KVU = under 3 år</text>
  <text x="450" y="334" font-size="10" fill="#777" font-style="italic">MVU = 3-4 år (fx lærer, sygeplejerske)</text>
  <text x="450" y="348" font-size="10" fill="#777" font-style="italic">LVU = 5+ år (fx kandidat, ph.d.)</text>

  <!-- Source -->
  <text x="40" y="482" font-size="10" fill="#888888">Kilde: Danmarks Statistik (fiktive eksempeldata til sproglig øvelse)</text>

</svg>
