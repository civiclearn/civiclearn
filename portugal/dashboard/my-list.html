<!doctype html>
<html lang="pt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="title_my_list">My List</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="stylesheet" href="/portugal/assets/css/civic-v2.css">
  <link rel="stylesheet" href="/portugal/assets/css/history-v2.css">
  <style>
    .mylist-wrapper { max-width: 780px; margin-left:0; margin-right:auto; }
    .mylist-card { padding:14px; border:1px solid var(--border); border-radius:var(--radius-sm); margin-bottom:10px; background:var(--surface); }
    .mylist-question-row { display:flex; align-items:flex-start; gap:10px; }
    .mylist-question { font-size:14px; font-weight:500; line-height:1.4; flex:1; }
    .mylist-badge { font-size:11px; padding:3px 8px; border-radius:20px; background:var(--accent-soft); color:var(--accent); white-space:nowrap; font-weight:600; }
    .mylist-remove { font-size:0; color:var(--text-muted); background:transparent; border:none; cursor:pointer; padding:4px; line-height:1; }
    .mylist-remove::before { content:'✕'; font-size:13px; }
    .mylist-remove:hover { color:var(--wrong); }
    .mylist-options { display:flex; flex-direction:column; gap:5px; margin-top:8px; }
    .mylist-option { font-size:13px; text-align:left; padding:6px 12px; border-radius:8px; border:1px solid var(--border); background:var(--surface); cursor:pointer; transition:all 0.15s; font-family:var(--font); }
    .mylist-option:hover:not(:disabled) { background:var(--accent-soft); }
    .mylist-option.correct { background:var(--correct-bg); border-color:var(--correct); }
    .mylist-option.wrong { background:var(--wrong-bg); border-color:var(--wrong); }
    .mylist-option:disabled { cursor:default; opacity:0.95; }
    .mylist-header { display:flex; align-items:flex-start; justify-content:space-between; }
    .mylist-count { font-size:13px; color:var(--text-muted); margin-top:6px; }
    .mylist-footer { display:flex; justify-content:space-between; align-items:center; margin-top:14px; gap:12px; }
    .mylist-status { font-size:12px; color:var(--text-muted); }
    .mylist-controls { display:flex; gap:6px; }
    .mylist-page-btn { font-family:var(--font); font-size:12px; padding:5px 12px; border-radius:8px; border:1px solid var(--border); background:var(--surface); cursor:pointer; }
    .mylist-page-btn:hover:not(:disabled) { background:var(--accent-soft); border-color:var(--accent); }
    .mylist-page-btn:disabled { opacity:0.4; cursor:default; }
  </style>
  <script>document.documentElement.classList.add("i18n-hidden");</script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="/portugal/assets/js/pt-auth.js"></script>
</head>
<body>
<button class="menu-toggle" aria-label="Menu">☰</button>
<div class="wrap">
  <aside class="sidebar">
    <div class="brand">
      CivicLearn®
      <svg class="flag-icon" viewBox="0 0 640 400" aria-label="Portugal">
        <rect x="0" y="0" width="246" height="400" fill="#006600"/>
        <rect x="246" y="0" width="394" height="400" fill="#FF0000"/>
        <circle cx="246" cy="200" r="64" fill="#FFCC00" stroke="#006600" stroke-width="2"/>
      </svg>
    </div>
    <!-- Sidebar gauge -->
    <div class="sidebar-gauge">
      <div class="sidebar-gauge-header">
        <span class="sidebar-gauge-label" data-i18n="dashboard_estimated_score">Est. score</span>
        <span class="sidebar-gauge-score" id="clGaugeScore">–</span>
      </div>
      <div class="sidebar-gauge-track">
        <div class="sidebar-gauge-fill" id="clGaugeFill"></div>
        <div class="sidebar-gauge-pass" id="clGaugePass"></div>
      </div>
      <div class="sidebar-gauge-badge" id="clGaugeBadge"></div>
    </div>
    <nav class="nav">
      <a href="index.html" data-i18n="nav_dashboard">Dashboard</a>
      <a href="simulation.html" data-i18n="nav_simulation">Test Simulation</a>
      <a href="quick.html" data-i18n="nav_quick">Quick Test</a>
      <a href="topics.html" data-i18n="nav_topics">Tests by Topic</a>
      <a href="traps.html" data-i18n="nav_traps">Frequent Traps</a>
      <a href="flashcards.html" data-i18n="nav_flashcards">Flashcards</a>
      <div class="nav-sep"></div>
      <a href="history.html" data-i18n="nav_history">History</a>
      <a href="my-list.html" class="active" data-i18n="nav_my_list">My List</a>
      <a href="help.html" data-i18n="nav_help">Help & Contact</a>
      <a href="#" data-i18n="nav_logout" id="logoutLink">Log out</a>
    </nav>
    <div class="spacer"></div>
  </aside>
  <div class="overlay" id="menuOverlay"></div>
  <main>
    <div id="quiz" style="display:none"></div>
    <div class="dashboard-container">
      <div class="mylist-wrapper">
        <header class="ce-header mylist-header">
          <div>
            <h1 data-i18n="title_my_list">My List</h1>
            <div class="muted" data-i18n="my_list_subtitle"></div>
          </div>
          <div id="myListCount" class="mylist-count"></div>
        </header>
        <div id="myList" class="mylist-list"></div>
      </div>
    </div>
  </main>
</div>
<script src="/portugal/assets/js/lang-bootstrap-pt.js"></script>
<script src="/portugal/assets/js/config-pt.js"></script>
<script src="/assets/js/i18n.js"></script>
<script>CivicLearnI18n.init();</script>
<script src="/assets/js/engine-pt.js"></script>
<script src="/assets/js/sync.js"></script>
<script>
CivicLearnI18n.onReady(() => {
  const s = document.createElement("script");
  s.src = "/assets/js/my-list.js";
  document.body.appendChild(s);
});
</script>
<script>
document.addEventListener("DOMContentLoaded", () => {
  const toggle = document.querySelector(".menu-toggle");
  const overlay = document.getElementById("menuOverlay");
  if (toggle) toggle.addEventListener("click", () => document.body.classList.toggle("menu-open"));
  if (overlay) overlay.addEventListener("click", () => document.body.classList.remove("menu-open"));
});
</script>
<script src="/portugal/assets/js/gauge-bar.js"></script>
<script src="/portugal/assets/js/study-timer.js"></script>
<script src="/assets/js/maintenance-bar.js"></script>
<script src="/assets/js/signout.js"></script>
</body></html>
