<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login – Indfodsretsprove.dk</title>

  <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <script>
    window.SUPABASE_URL = "https://htgliokekeaovdiafrgs.supabase.co";
    window.SUPABASE_KEY = "sb_publishable_QWvR124i4h0hvQumyjBgDw_018SlMbp";
  </script>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.7.1/dist/umd/supabase.js"></script>
  <link rel="stylesheet" href="/assets/css/newlogin.css">

  <style>
    /* === MOBILE LOGIN TABS === */
    .login-tabs {
      display: none;
    }

    @media (max-width: 768px) {

      /* Fix header overflow */
      .header-inner {
        padding: 10px 12px;
        gap: 8px;
      }
      .header-nav { display: none; }
      .brand-powered { display: none; }
      .btn-small-purple {
        font-size: 12px;
        padding: 6px 12px;
        white-space: nowrap;
        flex-shrink: 0;
      }
      .brand-title {
        font-size: 15px;
      }

      /* Tab bar */
      .login-tabs {
        display: flex;
        justify-content: center;
        gap: 0;
        margin: 16px auto 0;
        max-width: 400px;
        padding: 0 16px;
      }

      .login-tab {
        flex: 1;
        padding: 10px 6px;
        font-family: 'Lexend', sans-serif;
        font-size: 13px;
        font-weight: 500;
        text-align: center;
        border: none;
        background: #f0eef5;
        color: #777;
        cursor: pointer;
        transition: all 0.2s;
      }

      .login-tab:first-child {
        border-radius: 10px 0 0 10px;
      }
      .login-tab:last-child {
        border-radius: 0 10px 10px 0;
      }

      .login-tab.active {
        background: #6c5ce7;
        color: #fff;
        font-weight: 600;
      }

      /* Hide inactive cards */
      .login-grid {
        display: block !important;
        padding: 0 16px;
      }

      .auth-card {
        display: none;
        max-width: 400px;
        margin: 16px auto 0;
      }

      .auth-card.tab-active {
        display: block;
      }
    }
  </style>
</head>

<body>

<header class="site-header">
  <div class="header-inner">

    <div class="header-left">
      <a href="https://indfodsretsprove.dk/" class="brand-link">
        <img src="/assets/images/dk.svg" alt="DK">
        <div class="brand-title">Indfodsretsprove.dk</div>
      </a>
    </div>

    <div class="header-center">
      <nav class="header-nav">
        <a href="https://indfodsretsprove.dk/kontakt/">Contact</a>
      </nav>
    </div>

    <div class="header-right">
      <div class="brand-powered">powered by <span>CivicLearn</span></div>
      <a href="/denmark/checkout.html" class="btn-small-purple">Opret adgang</a>
    </div>

  </div>
</header>

<div id="status" class="status-msg"></div>

<div class="login-tabs">
  <button class="login-tab" data-tab="setup">Første gang?</button>
  <button class="login-tab active" data-tab="login">Login</button>
  <button class="login-tab" data-tab="pin">PIN-adgang</button>
</div>

<div class="login-grid">

  <!-- LEFT CARD -->
  <div class="auth-card card-left" data-card="setup">
    <h2 style="color: var(--purple);">Første gang her?</h2>
    <p>
      Har du netop købt adgang? Opret din adgangskode her.
    </p>

    <input type="email" id="setupEmail" placeholder="navn@eksempel.dk">
    <button
  type="button"
  id="setupBtn"
  onclick="handleSetup()"
  class="btn-action btn-purple">
  Send opsætningslink
</button>

    <div style="font-size:10px;color:var(--purple);font-weight:600;margin-top:15px;text-align:center;line-height:1.4;">
      ℹ️ Husk at tjekke spam-mappen.
    </div>
  </div>

  <!-- CENTER CARD -->
  <div class="auth-card card-center tab-active" data-card="login">
    <h2 style="font-size:28px;text-align:center;">Login</h2>

    <div style="margin-top:20px;">
      <label>E-mailadresse</label>
      <input type="email" id="loginEmail">

      <label>Adgangskode</label>
      <div class="pwd-container">
        <input type="password" id="loginPwd">
        <button type="button" class="toggle-pwd" onclick="toggleMainPwd()">Vis</button>
      </div>

      <button onclick="handleLogin()" class="btn-action btn-black" style="margin-top:10px;">
        Log ind med adgangskode
      </button>
    </div>
  </div>

  <!-- RIGHT CARD — PIN -->
  <div class="auth-card card-right" data-card="pin">
    <h2 style="color:#856404;">Problemer?</h2>
    <p>
      Brug en midlertidig adgangs-PIN, hvis login med adgangskode ikke virker.
      PIN’en sendes ikke på e-mail.
    </p>

    <label>E-mailadresse</label>
    <input type="email" id="pinEmail" placeholder="navn@eksempel.dk">

    <button class="btn-action btn-yellow" onclick="showPin()">
      Vis adgangs-PIN
    </button>

    <div id="pinArea" style="display:none;margin-top:15px;">
      <div style="text-align:center;font-size:28px;letter-spacing:6px;font-weight:700;color:var(--purple);margin-bottom:10px;"
           id="pinShown">0000</div>

      <label>Indtast PIN</label>
      <input type="text" id="pinEnter" maxlength="4" inputmode="numeric"
             style="text-align:center;letter-spacing:2px;">

      <button class="btn-action btn-black" onclick="pinLogin()">
        Fortsæt
      </button>
    </div>
  </div>

</div>


<script>
const supabase = window.supabase.createClient(
  window.SUPABASE_URL,
  window.SUPABASE_KEY
);

function notify(type, text) {
  const el = document.getElementById("status");
  el.textContent = text;
  el.className = "status-msg " + type;
  el.style.display = "block";
  setTimeout(() => el.style.display = "none", 6000);
}

/* ---------- PASSWORD SETUP ---------- */
async function handleSetup() {
  const btn = document.getElementById("setupBtn");
  const email = setupEmail.value.trim().toLowerCase();

  if (!email) {
    notify("error","Indtast din e-mail.");
    return;
  }

  if (btn.disabled) return;

  btn.disabled = true;
  btn.textContent = "Vent…";

  const { error } = await supabase.auth.resetPasswordForEmail(email, {
    redirectTo: window.location.origin + "/denmark/login-password.html"
  });

  if (error) {
    btn.disabled = false;
    btn.textContent = "Send opsætningslink";
    notify("error","Linket kunne ikke sendes.");
    return;
  }

  btn.textContent = "Tjek din e-mail";
  setTimeout(() => btn.remove(), 2500);

  notify("success","Hvis e-mailen findes, er et link sendt.");
}


/* ---------- PASSWORD LOGIN ---------- */
async function handleLogin() {
  const email = loginEmail.value.trim().toLowerCase();
  const password = loginPwd.value;

  const { error } = await supabase.auth.signInWithPassword({ email, password });

  if (error) {
    return notify("error", "Forkert e-mail eller adgangskode.");
  }

  // ✅ Log successful password login
  await supabase.from("login_history").insert({
    email,
    status: "success",
    method: "password"
  });

  localStorage.setItem("cl_auth", "ok");
  localStorage.setItem("cl_email", email);
  localStorage.setItem("cl_login_at", Date.now().toString());
  
  // Redirect to dashboard
  location.href = "/denmark/dashboard/";
}


/* ---------- PIN LOGIC (FROM AU) ---------- */
function utcDayOfYear(d){
  const s = new Date(Date.UTC(d.getUTCFullYear(),0,0));
  return Math.floor((d - s) / 86400000);
}

function computePin(email){
  const n = new Date();
  const v =
    (utcDayOfYear(n) * 37) +
    (n.getUTCHours() * 91) +
    (email.length * 17);
  return String(v % 10000).padStart(4,"0");
}

async function showPin(){
  const email = pinEmail.value.trim().toLowerCase();
  if (!email) return notify("error","Indtast din e-mail.");

  // 🔐 SERVER CHECK: does this email exist?
  let exists = false;

  try {
    const res = await fetch("https://htgliokekeaovdiafrgs.supabase.co/functions/v1/check-user-exists", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ email })
    });

    const data = await res.json();
    exists = data.exists === true;
  } catch (e) {
    return notify("error","Kunne ikke validere e-mailen. Prøv igen.");
  }

  if (!exists) {
    return notify("error","Denne e-mail findes ikke i systemet.");
  }

  // ✅ EXACT SAME PIN LOGIC AS AU
  const pin = computePin(email);
  pinShown.textContent = pin;
  pinArea.style.display = "block";

  localStorage.setItem("cl_email", email);
}

async function pinLogin() {
  const email = localStorage.getItem("cl_email");
  const enteredPin = pinEnter.value.trim();

  const res = await fetch(
    "https://htgliokekeaovdiafrgs.supabase.co/functions/v1/verify-pin-and-log",
    {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "apikey": window.SUPABASE_KEY
      },
      body: JSON.stringify({ email, enteredPin })
    }
  );

  const data = await res.json();

  if (!data.success) {
    return notify("error", "Forkert PIN.");
  }

  localStorage.setItem("cl_auth","ok");
  localStorage.setItem("cl_email", email);
  localStorage.setItem("cl_login_at", Date.now().toString());
  location.href="/denmark/dashboard/";
}




function toggleMainPwd(){
  const pwd = loginPwd;
  const btn = document.querySelector(".toggle-pwd");
  if (pwd.type === "password") {
    pwd.type = "text";
    btn.textContent = "Skjul";
  } else {
    pwd.type = "password";
    btn.textContent = "Vis";
  }
}
</script>

<script>
/* === MOBILE LOGIN TABS === */
document.querySelectorAll(".login-tab").forEach(tab => {
  tab.addEventListener("click", () => {
    const target = tab.dataset.tab;

    // Update tab bar
    document.querySelectorAll(".login-tab").forEach(t => t.classList.remove("active"));
    tab.classList.add("active");

    // Show matching card, hide others
    document.querySelectorAll(".auth-card").forEach(card => {
      card.classList.toggle("tab-active", card.dataset.card === target);
    });
  });
});
</script>

</body>
</html>
