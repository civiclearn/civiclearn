<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CILS B1 — Ascolto</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="/cilsb1/assets/js/cils-auth.js"></script>
  <script src="/cilsb1/assets/js/cils-engine.js?v=2"></script>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{--blue:#009246;--blue-dim:#e6f4ec;--yellow:#CE2B37;--navy:#0f172a;--muted:#64748b;--border:#e2e8f0;--surface:#fff;--bg:#f8f7f4;--pass:#166534;--pass-bg:#dcfce7;--fail:#991b1b;--fail-bg:#fee2e2}
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:"DM Sans",system-ui,sans-serif;background:var(--bg);color:var(--navy);min-height:100vh}

    .topbar{background:var(--navy);border-bottom:3px solid var(--blue);padding:0 28px;height:52px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:200}
    .topbar-left{display:flex;align-items:center;gap:12px}
    .back-link{color:#64748b;text-decoration:none;font-size:0.8rem;display:flex;align-items:center;gap:5px}
    .back-link:hover{color:#fff}
    .topbar-divider{width:1px;height:20px;background:#1e293b}
    .topbar-title{font-size:0.9rem;font-weight:700;color:#fff}
    .topbar-flag{width:22px;height:16px;background:linear-gradient(90deg,#009246 0 33.34%,#ffffff 33.34% 66.67%,#CE2B37 66.67% 100%);border-radius:2px;flex-shrink:0;box-shadow:0 0 0 1px rgba(255,255,255,.25)}

    #loading-overlay{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;z-index:9999;transition:opacity 0.35s}
    #loading-overlay.hidden{opacity:0;pointer-events:none}
    .loading-spinner{width:32px;height:32px;border-radius:50%;border:3px solid var(--border);border-top-color:var(--blue);animation:spin 0.8s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}

    .exam-wrap{max-width:820px;margin:0 auto;padding:28px 24px 80px}

    .task-card{background:var(--surface);border:1.5px solid var(--border);border-radius:14px;padding:24px;margin-bottom:28px}
    .task-header{display:flex;align-items:center;gap:10px;margin-bottom:16px}
    .task-num{width:32px;height:32px;border-radius:8px;background:var(--blue-dim);color:var(--blue);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:0.85rem;flex-shrink:0}
    .task-title{font-weight:700;font-size:1rem}

    .audio-player{background:var(--navy);border-radius:10px;padding:14px 18px;margin-bottom:20px;display:flex;align-items:center;gap:12px}
    .play-btn{width:38px;height:38px;border-radius:50%;background:var(--blue);color:#fff;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:1rem;transition:opacity 0.15s}
    .play-btn:hover{opacity:0.85}
    .audio-info{flex:1;min-width:0}
    .audio-label{font-size:0.78rem;color:#94a3b8}
    .audio-progress{height:4px;background:#1e293b;border-radius:2px;margin-top:6px;overflow:hidden;cursor:pointer}
    .audio-progress-fill{height:100%;background:var(--blue);border-radius:2px;width:0;transition:width 0.1s linear}
    .audio-time{font-size:0.72rem;color:#64748b;font-variant-numeric:tabular-nums;flex-shrink:0}

    .question{margin-bottom:20px;padding-bottom:16px;border-bottom:1px solid #f1f5f9}
    .question:last-child{border-bottom:none;margin-bottom:0;padding-bottom:0}
    .q-prompt{font-weight:600;font-size:0.88rem;margin-bottom:10px;line-height:1.5}
    .q-options{display:flex;flex-direction:column;gap:6px}
    .q-option{display:flex;align-items:flex-start;gap:10px;padding:10px 14px;border:1.5px solid var(--border);border-radius:10px;cursor:pointer;transition:all 0.15s;font-size:0.85rem;line-height:1.4}
    .q-option:hover{border-color:#94a3b8;background:#fafaf8}
    .q-option.selected{border-color:var(--blue);background:var(--blue-dim)}
    .q-option.correct{border-color:var(--pass);background:var(--pass-bg)}
    .q-option.wrong{border-color:var(--fail);background:var(--fail-bg)}
    .q-radio{width:18px;height:18px;border-radius:50%;border:2px solid var(--border);flex-shrink:0;margin-top:1px;display:flex;align-items:center;justify-content:center;transition:all 0.15s}
    .q-option.selected .q-radio{border-color:var(--blue);background:var(--blue)}
    .q-option.selected .q-radio::after{content:'';width:6px;height:6px;border-radius:50%;background:#fff}

    .bottom-bar{position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--border);padding:12px 24px;display:flex;justify-content:space-between;align-items:center;z-index:100}
    .progress-text{font-size:0.82rem;color:var(--muted);font-weight:500}
    .btn-row{display:flex;gap:10px}
    .btn{padding:10px 24px;border-radius:8px;font-size:0.88rem;font-weight:600;border:none;cursor:pointer;font-family:inherit;transition:opacity 0.15s}
    .btn:hover{opacity:0.85}
    .btn-skip{background:#f1f5f9;color:var(--navy)}
    .btn-submit{background:var(--blue);color:#fff}
    .btn-submit:disabled{opacity:0.4;cursor:not-allowed}
    .btn-back{background:var(--navy);color:#fff}

    .result-banner{background:var(--surface);border:2px solid var(--border);border-radius:14px;padding:24px;text-align:center;margin-bottom:24px}
    .result-score{font-size:2rem;font-weight:700}
    .result-score.high{color:var(--pass)}.result-score.mid{color:#92400e}.result-score.low{color:var(--fail)}

    @media(max-width:600px){.exam-wrap{padding:20px 14px 80px}.task-card{padding:18px 16px}.audio-player{padding:10px 14px}}
    .q-expl{margin-top:10px;padding:10px 14px;border-radius:8px;background:#f1f5f9;border-left:3px solid var(--blue);font-size:0.84rem;line-height:1.55;color:#334155}
  </style>
</head>
<body>

<div id="loading-overlay">
  <div class="loading-spinner"></div>
  <div style="font-size:0.9rem;color:var(--muted)">Caricamento comprensione dell’ascolto…</div>
</div>

<div class="topbar">
  <div class="topbar-left">
    <a class="back-link" id="backLink" href="#">← Indietro</a>
    <div class="topbar-divider"></div>
    <div class="topbar-flag"></div>
    <span class="topbar-title">Comprensione dell’ascolto</span>
  </div>
</div>

<div class="exam-wrap" id="examContent"></div>

<div class="bottom-bar" id="bottomBar">
  <div class="progress-text" id="progressText">0 di 0 risposte</div>
  <div class="btn-row">
    <button class="btn btn-skip" onclick="handleSkip()">Salta</button>
    <button class="btn btn-submit" id="submitBtn" onclick="handleSubmit()" disabled>Invia</button>
  </div>
</div>

<script>
let simId, attemptId, user, examData;
let userAnswers = {};
let submitted = false;
let audioElements = [];

document.addEventListener('DOMContentLoaded', async () => {
  const ctx = await SP.init('listening');
  user = ctx.user; simId = ctx.simId; attemptId = ctx.attemptId;
  document.getElementById('backLink').href = `/cilsb1/dashboard/exam.html?sim=${simId}&attempt=${attemptId}`;

  const alreadyDone = await SP.isSubmitted(user.id, attemptId, 'listening');
  if (alreadyDone) {
    document.getElementById('examContent').innerHTML = `
      <div style="text-align:center;padding:60px 20px;">
        <div style="font-size:2rem;">✅</div>
        <h2 style="margin:12px 0;">Comprensione dell’ascolto già inviata</h2>
        <p style="color:var(--muted);">Hai già risposto a questa parte.</p>
        <a href="/cilsb1/dashboard/exam.html?sim=${simId}&attempt=${attemptId}" style="display:inline-block;margin-top:16px;color:var(--blue);font-weight:600;">← Torna all’esame</a>
      </div>`;
    document.getElementById('bottomBar').style.display = 'none';
    SP.hideLoading(); return;
  }

  const simNum = ctx.simNum;
  const jsonPath = `/cilsb1/data/cils-${String(simNum).padStart(2,'0')}-listening.json`;
  try {
    const res = await fetch(jsonPath);
    if (!res.ok) throw new Error('JSON not found');
    examData = await res.json();
  } catch (err) {
    SP.showError(`Impossibile caricare i dati dell’esame: ${err.message}`, simId, attemptId);
    return;
  }

  renderExam();
  SP.hideLoading();
});

function renderExam() {
  const wrap = document.getElementById('examContent');
  let html = '';
  let globalQNum = 0;

  examData.tasks.forEach((task, ti) => {
    const audioUrl = task.content?.audio || '';
    html += `<div class="task-card">
      <div class="task-header">
        <div class="task-num">${ti + 1}</div>
        <div class="task-title">${SP.escapeHtml(task.title)}</div>
      </div>

      <div class="audio-player">
        <button class="play-btn" id="playBtn${ti}" onclick="toggleAudio(${ti})">▶</button>
        <div class="audio-info">
          <div class="audio-label">Ascolta la registrazione</div>
          <div class="audio-progress" onclick="seekAudio(event, ${ti})">
            <div class="audio-progress-fill" id="progressFill${ti}"></div>
          </div>
        </div>
        <div class="audio-time" id="audioTime${ti}">0:00</div>
        <audio id="audio${ti}" src="${audioUrl}" preload="metadata"></audio>
      </div>`;

    task.questions.forEach((q, qi) => {
      html += `<div class="question" data-qid="${q.id}">
        <div class="q-prompt">${++globalQNum}. ${SP.escapeHtml(q.prompt)}</div>
        <div class="q-options">`;
      q.options.forEach((opt, oi) => {
        html += `<div class="q-option" data-qid="${q.id}" data-opt="${oi}" onclick="selectOption('${q.id}', ${oi})">
          <div class="q-radio"></div>
          <div>${SP.escapeHtml(opt)}</div>
        </div>`;
      });
      html += `</div></div>`;
    });

    html += `</div>`;
  });

  wrap.innerHTML = html;

  // Wire up audio elements
  examData.tasks.forEach((task, ti) => {
    const audio = document.getElementById(`audio${ti}`);
    audio.addEventListener('timeupdate', () => {
      const pct = audio.duration ? (audio.currentTime / audio.duration) * 100 : 0;
      document.getElementById(`progressFill${ti}`).style.width = pct + '%';
      const m = Math.floor(audio.currentTime / 60);
      const s = Math.floor(audio.currentTime % 60);
      document.getElementById(`audioTime${ti}`).textContent = `${m}:${String(s).padStart(2,'0')}`;
    });
    audio.addEventListener('ended', () => {
      document.getElementById(`playBtn${ti}`).textContent = '▶';
    });
  });

  updateProgress();
}

function toggleAudio(idx) {
  const audio = document.getElementById(`audio${idx}`);
  const btn = document.getElementById(`playBtn${idx}`);
  if (audio.paused) {
    // Pause all others
    examData.tasks.forEach((_, i) => {
      if (i !== idx) {
        const other = document.getElementById(`audio${i}`);
        other.pause();
        document.getElementById(`playBtn${i}`).textContent = '▶';
      }
    });
    audio.play();
    btn.textContent = '⏸';
  } else {
    audio.pause();
    btn.textContent = '▶';
  }
}

function seekAudio(event, idx) {
  const audio = document.getElementById(`audio${idx}`);
  const bar = event.currentTarget;
  const rect = bar.getBoundingClientRect();
  const pct = (event.clientX - rect.left) / rect.width;
  if (audio.duration) audio.currentTime = pct * audio.duration;
}

function selectOption(qId, optIdx) {
  if (submitted) return;
  const task = examData.tasks.flatMap(t => t.questions).find(q => q.id === qId);
  if (!task) return;
  userAnswers[qId] = task.options[optIdx];
  document.querySelectorAll(`.q-option[data-qid="${qId}"]`).forEach(el => el.classList.remove('selected'));
  document.querySelector(`.q-option[data-qid="${qId}"][data-opt="${optIdx}"]`).classList.add('selected');
  updateProgress();
}

function updateProgress() {
  const totalQ = examData.tasks.reduce((sum, t) => sum + t.questions.length, 0);
  const answered = Object.keys(userAnswers).length;
  document.getElementById('progressText').textContent = `${answered} di ${totalQ} risposte`;
  document.getElementById('submitBtn').disabled = answered === 0;
}

function gradeExam() {
  let correct = 0, total = 0;
  examData.tasks.flatMap(t => t.questions).forEach(q => {
    total++;
    if (userAnswers[q.id] === q.correct_option) correct++;
  });
  return { correct, total, percentage: total > 0 ? Math.round((correct / total) * 100) : 0 };
}

async function handleSubmit() {
  if (submitted) return;
  const result = gradeExam();
  if (!confirm(`Hai risposto a ${Object.keys(userAnswers).length} domande su ${result.total}.\n\nVuoi inviare?`)) return;

  submitted = true;
  document.getElementById('submitBtn').disabled = true;
  document.getElementById('submitBtn').textContent = 'Invio…';

  examData.tasks.flatMap(t => t.questions).forEach(q => {
    const opts = document.querySelectorAll(`.q-option[data-qid="${q.id}"]`);
    opts.forEach((el, i) => {
      el.style.cursor = 'default';
      if (q.options[i] === q.correct_option) el.classList.add('correct');
      else if (userAnswers[q.id] === q.options[i]) el.classList.add('wrong');
    });
    const chosen = userAnswers[q.id];
    const idx = q.options.indexOf(chosen !== undefined ? chosen : q.correct_option);
    if (q.explanations && idx >= 0 && q.explanations[idx]) {
      let txt = q.explanations[idx];
      if (chosen === undefined) txt = txt.replace(/^(Bravo|Ottimo lavoro|Esatto|Corretto)[!.]\s*/i, '');
      const box = document.createElement('div');
      box.className = 'q-expl';
      box.textContent = txt;
      const qEl = document.querySelector(`.question[data-qid="${q.id}"]`);
      if (qEl) qEl.appendChild(box);
    }
  });

  const banner = document.createElement('div');
  banner.className = 'result-banner';
  const pctClass = result.percentage >= 60 ? 'high' : result.percentage >= 40 ? 'mid' : 'low';
  banner.innerHTML = `
    <div style="font-size:1.5rem;">🎧</div>
    <div class="result-score ${pctClass}">${result.correct}/${result.total}</div>
    <div style="font-size:0.88rem;color:var(--muted);margin-top:4px;">${result.percentage}% corrette</div>`;
  document.getElementById('examContent').prepend(banner);
  window.scrollTo({ top: 0, behavior: 'smooth' });

  try {
    await SP.submit({
      attemptId, elemKey: 'listening',
      score: result.percentage,
      total_questions: result.total,
      correct_answers: result.correct,
      json: { answers: userAnswers, result }
    });
  } catch (err) {
    console.error('Submit error:', err);
    SP.toast('Errore durante l’invio. Riprova più tardi.');
  }

  document.getElementById('bottomBar').innerHTML = `
    <div class="progress-text">${result.percentage}% corrette (${result.correct}/${result.total})</div>
    <div class="btn-row">
      <a class="btn btn-back" href="/cilsb1/dashboard/exam.html?sim=${simId}&attempt=${attemptId}">← Torna all’esame</a>
    </div>`;
}

async function handleSkip() {
  if (submitted) return;
  if (!confirm('Vuoi saltare la comprensione dell’ascolto? Otterrai 0 punti.')) return;
  try { await SP.skip({ attemptId, elemKey: 'listening' }); } catch (e) {}
  window.location.href = `/cilsb1/dashboard/exam.html?sim=${simId}&attempt=${attemptId}`;
}
</script>
</body>
</html>
