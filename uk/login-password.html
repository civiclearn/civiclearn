<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Password – CivicLearn</title>

  <!-- Font -->
  <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <!-- Supabase config -->
  <script>
    window.SUPABASE_URL = "https://htgliokekeaovdiafrgs.supabase.co";
    window.SUPABASE_KEY = "sb_publishable_QWvR124i4h0hvQumyjBgDw_018SlMbp";
  </script>

  <style>
    :root {
      --brand: #7c3aed;
      --brand-dark: #5b21b6;
      --bg: #f7f2e8;
      --card: #ffffff;
      --text: #111;
      --muted: #666;
      --border: rgba(0,0,0,.08);
      --radius: 18px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Lexend", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      width: 100%;
      max-width: 420px;
      background: var(--card);
      border-radius: var(--radius);
      padding: 32px 28px 30px;
      box-shadow: 0 12px 32px rgba(0,0,0,.12);
      border: 1px solid var(--border);
      text-align: center;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 26px;
      font-weight: 600;
    }

    .subtitle {
      font-size: 15px;
      color: var(--muted);
      margin-bottom: 18px;
    }

    .note {
      font-size: 14px;
      color: var(--muted);
      background: rgba(124,58,237,.06);
      border: 1px solid rgba(124,58,237,.25);
      border-radius: 12px;
      padding: 12px 14px;
      margin-bottom: 18px;
      text-align: left;
    }

    label {
      display: block;
      font-size: 14px;
      font-weight: 500;
      text-align: left;
      margin: 14px 0 6px;
    }

    .pwd-wrap {
      position: relative;
    }

    .pwd-wrap input {
      width: 100%;
      padding: 12px 70px 12px 14px; /* locked height – no shrink */
      border-radius: 12px;
      border: 1px solid rgba(0,0,0,.15);
      font-size: 15px;
    }

    .pwd-wrap input:focus {
      outline: none;
      border-color: var(--brand);
      box-shadow: 0 0 0 2px rgba(124,58,237,.15);
    }

    .pwd-toggle {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--brand);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      padding: 0;
    }

    .rules {
      margin-top: 8px;
      font-size: 13px;
      color: var(--muted);
      text-align: left;
    }

    .btn {
      margin-top: 20px;
      width: 100%;
      padding: 13px;
      border-radius: 14px;
      border: none;
      background: var(--brand);
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }

    .btn:hover {
      background: var(--brand-dark);
    }

    .msg {
      margin-top: 14px;
      font-size: 14px;
    }

    .msg.error { color: #b91c1c; }
    .msg.success { color: #15803d; }

    .loading-note {
      margin-top: 12px;
      font-size: 14px;
      color: #666;
    }
  </style>
</head>

<body>

<!-- LOADING -->
<div class="card" id="loading">
  <strong>Preparing secure setup…</strong>
  <div id="loadingNote" class="loading-note">
    Please wait while we verify your access.
  </div>
</div>

<!-- FORM -->
<div class="card" id="form" style="display:none;">
  <h1>Set your password</h1>
  <div class="subtitle">Access your CivicLearn account</div>

  <div class="note">
    If you already had a password, you can safely set a new one here.
    This will not affect your access.
  </div>

  <label for="password">Password</label>
  <div class="pwd-wrap">
    <input
      type="password"
      id="password"
      placeholder="New password"
      autocomplete="new-password"
      minlength="6"
      required
    >
    <button type="button" class="pwd-toggle" onclick="togglePwd('password', this)">
      Show
    </button>
  </div>

  <label for="confirmPwd">Confirm password</label>
  <div class="pwd-wrap">
    <input
      type="password"
      id="confirmPwd"
      placeholder="Repeat password"
      autocomplete="new-password"
      minlength="6"
      required
    >
    <button type="button" class="pwd-toggle" onclick="togglePwd('confirmPwd', this)">
      Show
    </button>
  </div>

  <div class="rules">
    • At least 6 characters<br>
    • Both fields must match
  </div>

  <button class="btn" onclick="updatePassword()">
    Save password
  </button>

  <div id="status" class="msg"></div>
</div>

<script>
/* Load Supabase (standalone) */
(function () {
  const s = document.createElement("script");
  s.src = "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.7.1/dist/umd/supabase.js";
  s.onload = async () => {
    window.sb = supabase.createClient(
      window.SUPABASE_URL,
      window.SUPABASE_KEY
    );

    sb.auth.onAuthStateChange((_e, session) => {
      if (!session?.user) return;
      document.getElementById("loading").style.display = "none";
      document.getElementById("form").style.display = "block";
    });

    try {
      const { data } = await sb.auth.getSession();
      if (!data?.session?.user) {
        document.getElementById("loadingNote").textContent =
          "Please open the secure link from your email to set your password.";
      }
    } catch (_) {}
  };
  document.head.appendChild(s);
})();
</script>

<script>
async function updatePassword() {
  const pwd = document.getElementById("password").value;
  const conf = document.getElementById("confirmPwd").value;
  const msg = document.getElementById("status");

  msg.textContent = "";
  msg.className = "msg";

  if (!pwd || pwd.length < 6) {
    msg.textContent = "Password must be at least 6 characters.";
    msg.classList.add("error");
    return;
  }

  if (pwd !== conf) {
    msg.textContent = "Passwords do not match.";
    msg.classList.add("error");
    return;
  }

  msg.textContent = "Saving…";

  const { error } = await window.sb.auth.updateUser({ password: pwd });

  if (error) {
    msg.textContent = "This link has expired. Please request a new password link.";
    msg.classList.add("error");
    return;
  }

  localStorage.setItem("cl_auth", "ok");
  msg.textContent = "Password saved. Redirecting…";
  msg.classList.add("success");

  setTimeout(() => {
    const parts = location.pathname.split("/").filter(Boolean);
    location.replace("/" + parts[0] + "/dashboard/");
  }, 900);
}
</script>

<script>
function togglePwd(id, btn) {
  const input = document.getElementById(id);
  if (!input) return;
  if (input.type === "password") {
    input.type = "text";
    btn.textContent = "Hide";
  } else {
    input.type = "password";
    btn.textContent = "Show";
  }
}
</script>

</body>
</html>
