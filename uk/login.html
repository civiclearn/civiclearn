<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>Login – CivicLearn UK</title>
  <meta name="apple-mobile-web-app-title" content="CivicLearn">

  <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <script>
    window.SUPABASE_URL = "https://htgliokekeaovdiafrgs.supabase.co";
    window.SUPABASE_KEY = "sb_publishable_QWvR124i4h0hvQumyjBgDw_018SlMbp";
  </script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.7.1/dist/umd/supabase.js"></script>

  <style>
    :root {
      --purple:#7c3aed;
      --yellow:#f1c40f;
      --black:#333;
      --bg:#fdfaf5;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:'Lexend',sans-serif;
      background:var(--bg);
      color:#111;
    }

    /* HEADER — DANISH WIDTH */
    .site-header{
      background:#fff;
      padding:15px 0;
      border-bottom:1px solid rgba(0,0,0,.04);
    }
    .header-inner{
      max-width:1100px;
      margin:0 auto;
      padding:0 20px;
      display:flex;
      align-items:center;
      justify-content:space-between;
    }
    .brand-main{
      display:flex;
      align-items:center;
      gap:10px;
      font-weight:700;
    }
    .btn-small-purple{
      background:var(--purple);
      color:#fff;
      padding:8px 20px;
      border-radius:20px;
      font-size:14px;
      font-weight:600;
      text-decoration:none;
      white-space:nowrap;
    }

    /* GRID */
    .login-grid{
      display:flex;
      justify-content:center;
      align-items:stretch;
      max-width:1100px;
      margin:80px auto 40px;
      padding:20px;
    }
    .auth-card{
      width:320px;
      background:#fff;
      padding:40px 30px;
      display:flex;
      flex-direction:column;
    }
    .card-left{
      background:#f3ebff;
      border:1px solid #e0d0f9;
      border-radius:20px 0 0 20px;
    }
    .card-center{
      border-radius:20px;
      margin:-20px 0;
      padding:60px 40px;
      border:1px solid #eee;
      box-shadow:0 15px 40px rgba(0,0,0,.08);
      z-index:10;
    }
    .card-right{
      background:#fffdf0;
      border:1px solid #f9edbc;
      border-radius:0 20px 20px 0;
    }

    h2{font-size:20px;margin:0 0 15px}
    p{font-size:14px;color:#555;line-height:1.5;margin:0 0 20px}
    label{font-size:13px;font-weight:600;margin-bottom:8px;display:block}
    input{
      width:100%;
      padding:12px;
      border:2px solid #e5dfd2;
      border-radius:10px;
      margin-bottom:15px;
      font-family:'Lexend',sans-serif;
    }

    .btn-action{
      width:100%;
      padding:14px;
      border-radius:10px;
      border:none;
      font-weight:700;
      cursor:pointer;
      margin-top:auto;
      font-family:'Lexend',sans-serif;
    }
    .btn-purple{background:var(--purple);color:#fff}
    .btn-black{background:var(--black);color:#fff}
    .btn-yellow{background:var(--yellow);color:#111}

    .pwd-container{position:relative}
    .pwd-container input{padding-right:72px}
    .toggle-pwd{
      position:absolute;
      right:14px;
      top:50%;
      transform:translateY(-50%);
      background:none;
      border:none;
      color:var(--purple);
      font-size:12px;
      font-weight:700;
      cursor:pointer;
    }

    .status-msg{
      position:fixed;
      top:100px;
      left:50%;
      transform:translateX(-50%);
      padding:12px 24px;
      border-radius:30px;
      font-size:14px;
      display:none;
      z-index:100;
    }
    .success{background:#dcfce7;color:#166534;display:block}
    .error{background:#fee2e2;color:#dc2626;display:block}

    @media(max-width:900px){
      .login-grid{flex-direction:column;gap:20px}
      .auth-card{width:100%;max-width:420px;border-radius:20px}
      .card-center{margin:0;padding:50px 30px}
    }
  </style>
</head>

<body>

<header class="site-header">
  <div class="header-inner">
    <div class="brand-main">
      <img src="/assets/images/uk.svg" width="24" alt="">
      CivicLearn UK
    </div>
    <a href="/uk/checkout.html" class="btn-small-purple">Create access</a>
  </div>
</header>

<div id="status" class="status-msg"></div>

<div class="login-grid">

  <!-- FIRST TIME -->
  <div class="auth-card card-left">
    <h2 style="color:var(--purple);">First time here?</h2>
    <p>
      Just purchased access? Set your password here.
    </p>

    <input type="email" id="setupEmail" placeholder="you@example.com">
    <button class="btn-action btn-purple" onclick="handleSetup()">
      Send setup link
    </button>

    <div style="font-size:10px;color:var(--purple);font-weight:600;margin-top:15px;text-align:center;">
      ℹ️ Check your spam folder if needed.
    </div>
  </div>

  <!-- PASSWORD LOGIN -->
  <div class="auth-card card-center">
    <h2 style="font-size:28px;text-align:center;">Login</h2>

    <label>Email address</label>
    <input type="email" id="loginEmail" placeholder="you@example.com">

    <label>Password</label>
    <div class="pwd-container">
      <input type="password" id="loginPwd">
      <button type="button" class="toggle-pwd" onclick="togglePwd()">Show</button>
    </div>

    <button class="btn-action btn-black" onclick="handleLogin()">
      Login
    </button>
  </div>

  <!-- PIN -->
  <div class="auth-card card-right">
    <h2 style="color:#856404;">Problems?</h2>
    <p>
      Use a temporary PIN if password login does not work.
      The PIN is not sent by email.
    </p>

    <label>Email address</label>
    <input type="email" id="pinEmail" placeholder="you@example.com">

    <button class="btn-action btn-yellow" onclick="showPin()">
      Show PIN
    </button>

    <div id="pinArea" style="display:none;margin-top:15px;">
      <div id="pinShown"
           style="text-align:center;font-size:28px;letter-spacing:6px;font-weight:700;color:var(--purple);margin-bottom:10px;">
        0000
      </div>

      <label>Enter PIN</label>
      <input type="text" id="pinEnter" maxlength="4" inputmode="numeric"
             style="text-align:center;letter-spacing:2px;">

      <button class="btn-action btn-black" onclick="pinLogin()">
        Continue
      </button>
    </div>
  </div>

</div>

<script>
const supabase = window.supabase.createClient(
  window.SUPABASE_URL,
  window.SUPABASE_KEY
);

function notify(type,text){
  const el=document.getElementById("status");
  el.textContent=text;
  el.className="status-msg "+type;
  el.style.display="block";
  setTimeout(()=>el.style.display="none",6000);
}

function togglePwd(){
  loginPwd.type = loginPwd.type === "password" ? "text" : "password";
}

async function handleSetup(){
  const email=setupEmail.value.trim().toLowerCase();
  if(!email) return notify("error","Please enter your email address.");

  await supabase.auth.resetPasswordForEmail(email,{
    redirectTo:location.origin+"/uk/login-password.html"
  });

  notify("success","If the email exists, the setup link has been sent.");
}

async function handleLogin(){
  const email=loginEmail.value.trim().toLowerCase();
  const password=loginPwd.value;

  const { error }=await supabase.auth.signInWithPassword({ email,password });
  if(error) return notify("error","Invalid email or password.");

  location.href="/uk/dashboard/";
}

function utcDayOfYear(d){
  const s=new Date(Date.UTC(d.getUTCFullYear(),0,0));
  return Math.floor((d-s)/86400000);
}

function computePin(email){
  const n=new Date();
  const v=(utcDayOfYear(n)*37)+(n.getUTCHours()*91)+(email.length*17);
  return String(v%10000).padStart(4,"0");
}

async function showPin(){
  pinShown.textContent=computePin(pinEmail.value.trim().toLowerCase());
  pinArea.style.display="block";
}

async function pinLogin(){
  location.href="/uk/dashboard/";
}
</script>

</body>
</html>
