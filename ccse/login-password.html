<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Definir contraseña de acceso</title>

  <script>
    window.SUPABASE_URL = "https://htgliokekeaovdiafrgs.supabase.co";
    window.SUPABASE_KEY = "sb_publishable_QWvR124i4h0hvQumyjBgDw_018SlMbp";
  </script>

  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      background: #f7f7f9;
      color: #333;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }

    .box {
      background: #fff;
      padding: 26px 30px;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,.08);
      max-width: 420px;
      width: 100%;
      text-align: center;
    }

    .form-group {
      margin-bottom: 18px;
    }

    input[type="password"] {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 16px;
      box-sizing: border-box;
    }

    button {
      background-color: #6b4eff;
      color: #fff;
      padding: 10px 16px;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
      width: 100%;
    }

    #status {
      margin-top: 14px;
      font-weight: 500;
    }

    .error { color: #c0392b; }
    .success { color: #1e8449; }
  </style>
</head>

<body>

  <!-- LOADING -->
  <div class="box" id="loading">
    <strong>Preparando la configuración de tu contraseña…</strong>
  </div>

  <!-- EXPIRED / INVALID -->
  <div class="box error" id="expired" style="display:none;">
    <strong>El enlace no es válido o ha expirado.</strong><br>
    Solicita uno nuevo desde la página de acceso.
  </div>

  <!-- PASSWORD FORM -->
  <div class="box" id="form" style="display:none;">
    <h2>Contraseña</h2>
    <p>
      Define una contraseña para acceder a tu cuenta de CivicLearn.
    </p>

    <div class="form-group">
      <div style="position:relative;">
  <input
    type="password"
    id="password"
    placeholder="Contraseña"
    minlength="6"
    required
    style="padding-right:70px;"
  >
  <button
    type="button"
    onclick="togglePwd('password', this)"
    style="
      position:absolute;
      right:10px;
      top:50%;
      transform:translateY(-50%);
      background:none;
      border:none;
      color:#6b4eff;
      font-weight:600;
      cursor:pointer;
    ">
    Mostrar
  </button>
</div>

    </div>

    <div class="form-group">
      <div style="position:relative;">
  <input
    type="password"
    id="confirm"
    placeholder="Confirmar contraseña"
    minlength="6"
    required
    style="padding-right:70px;"
  >
  <button
    type="button"
    onclick="togglePwd('confirm', this)"
    style="
      position:absolute;
      right:10px;
      top:50%;
      transform:translateY(-50%);
      background:none;
      border:none;
      color:#6b4eff;
      font-weight:600;
      cursor:pointer;
    ">
    Mostrar
  </button>
</div>

    </div>

    <button type="button" onclick="updatePassword()">Guardar contraseña</button>
    <div id="status"></div>
  </div>

<script>
(function () {
  const s = document.createElement("script");
  s.src = "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.7.1/dist/umd/supabase.js";

  s.onload = () => {
    window.supabase = window.supabase.createClient(
      window.SUPABASE_URL,
      window.SUPABASE_KEY
    );

    let resolved = false;

    supabase.auth.onAuthStateChange((event, session) => {
      if (session?.user) {
        resolved = true;
        document.getElementById("loading").style.display = "none";
        document.getElementById("form").style.display = "block";
      }
    });

    setTimeout(() => {
      if (!resolved) {
        document.getElementById("loading").style.display = "none";
        document.getElementById("expired").style.display = "block";
      }
    }, 4000);
  };

  document.head.appendChild(s);
})();
</script>

<script>
async function updatePassword() {
  const password = document.getElementById("password").value;
  const confirm  = document.getElementById("confirm").value;
  const status   = document.getElementById("status");

  status.textContent = "";
  status.className = "";

  if (password.length < 6) {
    status.textContent = "La contraseña debe tener al menos 6 caracteres.";
    status.className = "error";
    return;
  }

  if (password !== confirm) {
    status.textContent = "Las contraseñas no coinciden.";
    status.className = "error";
    return;
  }

  status.textContent = "Guardando contraseña…";

  const { error } = await supabase.auth.updateUser({
    password,
    data: { has_password: true }
  });

  if (error) {
    status.textContent = "Ha ocurrido un error. Inténtalo de nuevo.";
    status.className = "error";
    return;
  }

  status.textContent = "Contraseña guardada. Redirigiendo…";
  status.className = "success";

  const pathParts = window.location.pathname.split("/").filter(Boolean);
  const basePath = "/" + pathParts.slice(0, -1).join("/");
  const dashboard = `${basePath}/dashboard/`;

  setTimeout(() => {
    window.location.replace(dashboard);
  }, 900);
}

function togglePwd(id, btn) {
  const input = document.getElementById(id);
  if (input.type === "password") {
    input.type = "text";
    btn.textContent = "Ocultar";
  } else {
    input.type = "password";
    btn.textContent = "Mostrar";
  }
}

</script>

</body>
</html>
