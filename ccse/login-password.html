<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Definir contraseña de acceso</title>

  <script>
    window.SUPABASE_URL = "https://htgliokekeaovdiafrgs.supabase.co";
    window.SUPABASE_KEY = "sb_publishable_QWvR124i4h0hvQumyjBgDw_018SlMbp";
  </script>

  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      background: #f7f7f9;
      color: #333;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }

    .box {
      background: #fff;
      padding: 28px 32px;
      border-radius: 14px;
      box-shadow: 0 10px 30px rgba(0,0,0,.08);
      max-width: 420px;
      width: 100%;
      text-align: center;
    }

    h2 {
      margin-top: 0;
    }

    .form-group {
      margin-bottom: 18px;
      text-align: left;
    }

    .pwd-wrap {
      position: relative;
    }

    input[type="password"],
    input[type="text"] {
      width: 100%;
      padding: 12px 90px 12px 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
      box-sizing: border-box;
    }

    .toggle {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: #6b4eff;
      font-weight: 600;
      cursor: pointer;
      user-select: none;
      font-size: 14px;
    }

    button.main {
      background-color: #6b4eff;
      color: #fff;
      padding: 12px 16px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
    }

    #status {
      margin-top: 14px;
      font-weight: 500;
    }

    .error { color: #c0392b; }
    .success { color: #1e8449; }
  </style>
</head>

<body>

  <!-- LOADING -->
  <div class="box" id="loading">
    <strong>Preparando la configuración de tu contraseña…</strong>
  </div>

  <!-- EXPIRED -->
  <div class="box error" id="expired" style="display:none;">
    <strong>El enlace no es válido o ha expirado.</strong><br><br>
    Solicita uno nuevo desde la página de acceso.
  </div>

  <!-- FORM -->
  <div class="box" id="form" style="display:none;">
    <h2>Contraseña</h2>
    <p>Define una contraseña para acceder a tu cuenta de CivicLearn.</p>

    <div class="form-group">
      <div class="pwd-wrap">
        <input
          type="password"
          id="password"
          placeholder="Contraseña"
          minlength="6"
          required
        >
        <span class="toggle" onclick="togglePwd('password', this)">Mostrar</span>
      </div>
    </div>

    <div class="form-group">
      <div class="pwd-wrap">
        <input
          type="password"
          id="confirm"
          placeholder="Confirmar contraseña"
          minlength="6"
          required
        >
        <span class="toggle" onclick="togglePwd('confirm', this)">Mostrar</span>
      </div>
    </div>

    <button type="button" class="main" onclick="updatePassword()">
      Guardar contraseña
    </button>

    <div id="status"></div>
  </div>

<script>
(function () {
  const s = document.createElement("script");
  s.src = "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.7.1/dist/umd/supabase.js";

  s.onload = () => {
    window.supabase = window.supabase.createClient(
      window.SUPABASE_URL,
      window.SUPABASE_KEY
    );

    let resolved = false;

    supabase.auth.onAuthStateChange((event, session) => {
      if (session?.user) {
        resolved = true;
        loading.style.display = "none";
        form.style.display = "block";
      }
    });

    setTimeout(() => {
      if (!resolved) {
        loading.style.display = "none";
        expired.style.display = "block";
      }
    }, 4000);
  };

  document.head.appendChild(s);
})();
</script>

<script>
async function updatePassword() {
  const password = passwordInput.value;
  const confirm  = confirmInput.value;
  const status   = document.getElementById("status");

  status.textContent = "";
  status.className = "";

  if (password.length < 6) {
    status.textContent = "La contraseña debe tener al menos 6 caracteres.";
    status.className = "error";
    return;
  }

  if (password !== confirm) {
    status.textContent = "Las contraseñas no coinciden.";
    status.className = "error";
    return;
  }

  status.textContent = "Guardando contraseña…";

  const { error } = await supabase.auth.updateUser({
    password,
    data: { has_password: true }
  });

  if (error) {
    status.textContent = "Ha ocurrido un error. Inténtalo de nuevo.";
    status.className = "error";
    return;
  }

  status.textContent = "Contraseña guardada. Redirigiendo…";
  status.className = "success";

  const parts = location.pathname.split("/").filter(Boolean);
  const base = "/" + parts.slice(0, -1).join("/");
  setTimeout(() => location.replace(base + "/dashboard/"), 900);
}

function togglePwd(id, el) {
  const input = document.getElementById(id);
  if (input.type === "password") {
    input.type = "text";
    el.textContent = "Ocultar";
  } else {
    input.type = "password";
    el.textContent = "Mostrar";
  }
}

const passwordInput = document.getElementById("password");
const confirmInput  = document.getElementById("confirm");
</script>

</body>
</html>
