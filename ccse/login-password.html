<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Definir contraseña – CivicLearn CCSE</title>

  <script>
    window.SUPABASE_URL = "https://htgliokekeaovdiafrgs.supabase.co";
    window.SUPABASE_KEY = "sb_publishable_QWvR124i4h0hvQumyjBgDw_018SlMbp";
  </script>

  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      background:#f7f7f9;
      color:#333;
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      margin:0;
      padding:24px;
    }

    .box {
      background:#fff;
      padding:30px 32px;
      border-radius:14px;
      box-shadow:0 10px 30px rgba(0,0,0,.08);
      max-width:420px;
      width:100%;
      text-align:center;
    }

    h2 { margin-top:0; }

    .note {
      margin-top:14px;
      font-size:14px;
      color:#666;
      text-align:left;
      background:#f3f0ff;
      border:1px solid #dcd5ff;
      border-radius:10px;
      padding:12px 14px;
    }

    .form-group {
      margin:18px 0;
      text-align:left;
    }

    .pwd-wrap {
      position:relative;
    }

    input {
      width:100%;
      padding:12px 90px 12px 12px;
      border:1px solid #ccc;
      border-radius:8px;
      font-size:16px;
      box-sizing:border-box;
    }

    .toggle {
      position:absolute;
      right:14px;
      top:50%;
      transform:translateY(-50%);
      color:#6b4eff;
      font-weight:600;
      cursor:pointer;
      user-select:none;
      font-size:14px;
    }

    button.main {
      background:#6b4eff;
      color:#fff;
      padding:12px 16px;
      border:none;
      border-radius:8px;
      font-size:16px;
      font-weight:600;
      cursor:pointer;
      width:100%;
    }

    #status {
      margin-top:14px;
      font-weight:500;
      font-size:14px;
    }

    .error { color:#c0392b; }
    .success { color:#1e8449; }

    a.link {
      color:#6b4eff;
      font-weight:600;
      text-decoration:none;
    }
  </style>
</head>

<body>

<!-- LOADING -->
<div class="box" id="loading">
  <strong>Preparando la configuración de tu contraseña…</strong>

  <div class="note">
    Si esta página no avanza tras unos instantes, vuelve a solicitar el enlace:
    <br><br>
    <a class="link" href="https://civiclearn.com/ccse/login">
      Volver a la página de acceso
    </a>
  </div>
</div>

<!-- FORM -->
<div class="box" id="form" style="display:none;">
  <h2>Contraseña</h2>
  <p>Define una contraseña para acceder a tu cuenta de CivicLearn.</p>

  <div class="form-group">
    <div class="pwd-wrap">
      <input
        type="password"
        id="password"
        placeholder="Contraseña"
        minlength="6"
        autocomplete="new-password"
        required
      >
      <span class="toggle" onclick="togglePwd('password', this)">Mostrar</span>
    </div>
  </div>

  <div class="form-group">
    <div class="pwd-wrap">
      <input
        type="password"
        id="confirm"
        placeholder="Confirmar contraseña"
        minlength="6"
        autocomplete="new-password"
        required
      >
      <span class="toggle" onclick="togglePwd('confirm', this)">Mostrar</span>
    </div>
  </div>

  <button type="button" class="main" onclick="updatePassword()">
    Guardar contraseña
  </button>

  <div id="status"></div>
</div>

<script>
(function () {
  const s = document.createElement("script");
  s.src = "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.7.1/dist/umd/supabase.js";

  s.onload = async () => {
    window.supabase = supabase.createClient(
      window.SUPABASE_URL,
      window.SUPABASE_KEY
    );

    // Immediate check (no race, no timeout)
    try {
      const { data } = await supabase.auth.getSession();
      if (data?.session?.user) showForm();
    } catch (_) {}

    // Backup listener
    supabase.auth.onAuthStateChange((_e, session) => {
      if (session?.user) showForm();
    });
  };

  document.head.appendChild(s);
})();

function showForm(){
  document.getElementById("loading").style.display = "none";
  document.getElementById("form").style.display = "block";
}

async function updatePassword() {
  const pwd = passwordInput.value;
  const conf = confirmInput.value;
  const status = document.getElementById("status");

  status.textContent = "";
  status.className = "";

  if (pwd.length < 6) {
    status.textContent = "La contraseña debe tener al menos 6 caracteres.";
    status.className = "error";
    return;
  }

  if (pwd !== conf) {
    status.textContent = "Las contraseñas no coinciden.";
    status.className = "error";
    return;
  }

  status.textContent = "Guardando contraseña…";

  const { error } = await supabase.auth.updateUser({
    password: pwd,
    data: { has_password: true }
  });

  if (error) {
    status.innerHTML = `
      Ha ocurrido un error.<br><br>
      Si el enlace ha caducado, solicita uno nuevo aquí:
      <br><br>
      <a class="link" href="https://civiclearn.com/ccse/login">
        Volver a la página de acceso
      </a>
    `;
    status.className = "error";
    return;
  }

  status.textContent = "Contraseña guardada. Redirigiendo…";
  status.className = "success";

  const parts = location.pathname.split("/").filter(Boolean);
  const base = "/" + parts.slice(0, -1).join("/");
  setTimeout(() => location.replace(base + "/dashboard/"), 900);
}

function togglePwd(id, el) {
  const input = document.getElementById(id);
  if (input.type === "password") {
    input.type = "text";
    el.textContent = "Ocultar";
  } else {
    input.type = "password";
    el.textContent = "Mostrar";
  }
}

const passwordInput = document.getElementById("password");
const confirmInput  = document.getElementById("confirm");
</script>

</body>
</html>
